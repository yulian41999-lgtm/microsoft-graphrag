completion_models:
  default_completion_model:
    model_provider: openai
    model: qwen3.8-27B-raw
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry:
      type: exponential_backoff
      max_retries: 3
      base_delay: 2.0
      max_delay: 30
    api_base: http://10.253.170.81:8006/v1
    call_args:
      temperature: 0
      max_tokens: 4096
      timeout: 180
embedding_models:
  default_embedding_model:
    model_provider: openai
    model: bge-m3
    auth_method: api_key
    api_key: local-bge-m3
    retry:
      type: exponential_backoff
      max_retries: 3
      base_delay: 2.0
      max_delay: 30
    api_base: http://127.0.0.1:18086/v1
    call_args:
      timeout: 180
input:
  type: jsonl
  file_pattern: banking[.]jsonl
  text_column: text
  title_column: title
  id_column: id
chunking:
  type: tokens
  size: 800
  overlap: 120
  encoding_model: o200k_base
  prepend_metadata:
  - title
  - source_id
  - document_number
  - publication_date
  - effective_date
  - validity
  - agency
input_storage:
  type: file
  base_dir: input
output_storage:
  type: file
  base_dir: output
reporting:
  type: file
  base_dir: logs
cache:
  type: json
  storage:
    type: file
    base_dir: cache
vector_store:
  type: lancedb
  db_uri: /home/ailab/data/HippoRAG/Microsoft_GraphRAG/output/lancedb
  vector_size: 1024
embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 4
  batch_max_tokens: 8191
extract_graph:
  completion_model_id: default_completion_model
  prompt: prompts/extract_graph.txt
  entity_types:
  - ORGANIZATION
  - PERSON
  - GEO
  - REGULATION
  - BUSINESS
  - REGULATORY_ACTION
  max_gleanings: 1
summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: prompts/summarize_descriptions.txt
  max_length: 600
extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
cluster_graph:
  max_cluster_size: 10
  use_lcc: false
extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: prompts/extract_claims.txt
  description: Any claims or facts that could be relevant to information discovery.
  max_gleanings: 1
community_reports:
  completion_model_id: default_completion_model
  graph_prompt: prompts/community_report_graph.txt
  text_prompt: prompts/community_report_text.txt
  max_length: 1500
  max_input_length: 6000
snapshots:
  graphml: false
  embeddings: false
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/local_search_system_prompt.txt
  text_unit_prop: 0.65
  community_prop: 0.1
  top_k_entities: 15
  top_k_relationships: 20
  max_context_tokens: 10000
global_search:
  completion_model_id: default_completion_model
  map_prompt: prompts/global_search_map_system_prompt.txt
  reduce_prompt: prompts/global_search_reduce_system_prompt.txt
  knowledge_prompt: prompts/global_search_knowledge_system_prompt.txt
  max_context_tokens: 10000
  data_max_tokens: 6000
  map_max_length: 800
  reduce_max_length: 1500
drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/drift_search_system_prompt.txt
  reduce_prompt: prompts/drift_search_reduce_prompt.txt
basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/basic_search_system_prompt.txt
  k: 10
  max_context_tokens: 10000
concurrent_requests: 6
