用区域、意见适用区域及通知适用区域的多重身份。所有信息均基于输入描述，未对同名不同机构或不同处罚案进行强行合并，冲突或差异信息已按来源并列说明。"}, {"id": "股份制商业银行风险评级体系（暂行）", "label": "股份制商业银行风险评级体系（暂行）", "group": "REGULATION", "value": 78, "title": "《股份制商业银行风险评级体系（暂行）》是中国银行业监督管理委员会发布的规范性文件，文号为银监发〔2004〕3号。该文件于2004年2月5日发布并生效，当前状态为失效/废止。\n\n该文件旨在规范股份制商业银行的风险评级工作，适用于股份制商业银行。其核心内容规定了风险评级的具体指标体系、评分原则、权重及操作流程。评级维度涵盖公司治理、内部控制状况、盈利状况、流动性状况、风险监控、信息交流、监督纠正及损失界定标准等方面。文件明确了各维度的评价标准与评分细则，用于对股份制商业银行的整体风险水平进行量化评估。\n\n所有输入描述均确认该文件由同一发文机关（中国银行业监督管理委员会）在同一时间（2004年2月5日）发布，文号一致，且当前状态均为失效/废止，不存在同名不同机构或时间冲突的情况。"}, {"id": "《中华人民共和国商业银行法》", "label": "《中华人民共和国商业银行法》", "group": "REGULATION", "value": 77, "title": "《中华人民共和国商业银行法》是银行业监管的核心法律依据，广泛适用于中资商业银行、城市信用社、城市商业银行及外商独资银行、中外合资银行等机构。\n\n在机构设立与变更方面，该法是中资商业银行法人机构设立、城市信用社股份有限公司及城市商业银行设立时章程合规性的法定依据。对于外商独资银行、中外合资银行，其变更组织形式、合并、分立需符合该法规定，且拟设立机构的章程须符合该法要求。此外，该法也是批准法国兴业银行(中国)有限公司及其他支行开业所依据的法规之一，并作为修订《境外金融机构管理办法》及制定相关行政许可事项实施办法、细则的法律基础。\n\n在业务运营与资产负债管理方面，该法规定了商业银行及信用社从事信托投资业务的禁止性条款（如第四十三条、第八十九条），并确立了资产负债比例管理的规定。其第四十一条为特定贷款免予分类提供了依据。\n\n在法律责任与行政处罚方面，该法是查处违反规定对外营业行为及实施行政处罚的主要依据。不同监管文件及处罚案例中，具体引用的条款存在差异，反映了不同违规行为对应的法律责任：\n1. **民事责任与禁止行为**：第七十三条规定了无故拖延、拒绝支付存款本金和利息的民事责任；第四十三条、第八十九条禁止从事信托投资业务。\n2. **常见处罚条款**：多个行政处罚依据引用了第八十九条（涉及违规经营、未经批准设立分支机构等）、第七十三条、第五十二条、第四十七条、第五十条、第三十五条、第六十一条、第七十四条、第二十四条第一款第三项、第二十九条、第四十条、第五十五条、第六十一条、第七十七条第二项等。\n3. **条款引用差异说明**：不同来源文件对具体违规行为的定性不同，导致引用条款各异。例如，部分处罚依据引用第五十二条第一项，部分引用第五十二条；部分引用第四十七条与第八十九条组合，部分引用第五十条与第七十三条组合。这些差异源于具体案件事实及监管文件发布时间不同，需依据具体案情及对应文件时间确定适用条款，不可简单合并或视为同一处罚标准。\n\n该法还作为指导意见未尽事宜的遵循依据，确保银行监管体系在法律框架内运行。"}, {"id": "省联社", "label": "省联社", "group": "ORGANIZATION", "value": 77, "title": "“省联社”是农村信用社省（自治区、直辖市）联合社的简称，指由农村信用社市（地）联合社等机构发起设立、具有法人资格的省级联合组织。其注册资本金不低于500万元人民币，是相关监管文档规范的主要对象及行业管理体制的核心机构。\n\n在职能方面，省联社负责全省农村信用社、农村合作银行及农村商业银行的管理、指导、协调和服务。具体职责包括：建立行业审计制度，向银监会报送报表；负责辖内农村信用社银行卡业务管理，包括设计银行卡、采用技术标准、制作空白卡、申请BIN号及开发信息系统，相关材料需提交银监局审查；负责统一管理使用农村信用社发展扶持资金；接收营业税拨付建立风险补偿专项基金及省财政风险补偿金；在改革深入阶段承担行业管理和深化改革的具体组织实施职责；负责建立职工养老保险档案、个人帐户及办理养老保险关系转移手续；加强审计稽核、IT系统等建设，并督导各县（市）联社完善产品创新、加快信息科技建设。此外，省联社可接受地、市、县联社的外包委托，并作为上级机构授权特定部门或银行（如丽江市相关部门、十堰农村合作银行）行使行业管理和服务职责。\n\n在财务与设立方面，省联社获得省政府一次性开办费补助，具体金额因地区而异：云南省农村信用社联合社获得500万元补助，拟筹建的省级联合社由省财政安排400万元开办费。省联社享受注册登记费减免，并统一存储管理省级风险基金。设立程序上，需向银监会申请筹建，部分省份（如甘肃省）计划于2005年4月1日至6月30日期间正式挂牌运行，或需于2005年3月底前完成组建和开业工作。\n\n文中提及的具体实例包括：云南省农村信用社联合社、山东省农村信用社联合社、甘肃省农村信用社联合社、青海省农村信用社联合社、河北省农村信用社改革中正式开业的机构，以及江苏淮安农村商业银行股份有限公司筹建工作小组成员所在的省级农村信用合作联社。部分描述指出，在省级经办机构直接经办前或尚未正式成立期间，由各级监管部门履行管理职责。"}, {"id": "《中国人民银行基本建设管理办法》", "label": "《中国人民银行基本建设管理办法》", "group": "REGULATION", "value": 77, "title": "《中国人民银行基本建设管理办法》是由中国人民银行于2011年9月2日印发并生效的规章，文号为银发〔2011〕217号，目前现行有效。该办法由中国人民银行总行负责解释和修改，旨在规范中国人民银行系统的基本建设管理。\n\n在管理职责与流程方面，该办法规定了人民银行系统基本建设项目的管理职责、权限及流程，涵盖项目的审批、设计、施工、验收及建设标准。具体内容包括基本建设的设计、招投标及合同管理要求，以及材料采购等规范。针对特定项目，如地市中心支行发行库、营业办公用房等，办法明确了设计资质、竞标流程、设计方案报审资料、初步设计及施工图设计要求，并规定了总体设计和发行库、钞票处理中心的具体设计标准。\n\n在标准与指标方面，该办法规定了办公用房及特殊业务用房的建筑面积标准，以及基本建设项目的面积标准和技术经济指标。同时，对基本建设的设计管理提出了具体要求。\n\n在财务与审计方面，办法规范了概算编制、审计、竣工结算等规定，并明确了基本建设项目的质量、安全、财务及预算管理要求。\n\n此外，该办法还涉及廉政责任、监督奖惩等内容，以确保基本建设管理的合规性与廉洁性。所有描述均基于2011年9月2日发布的银发〔2011〕217号文件，无冲突信息，各描述在发文机关、时间、文号及核心管理内容上保持一致。"}, {"id": "衍生产品交易业务", "label": "衍生产品交易业务", "group": "BUSINESS", "value": 76, "title": "衍生产品交易业务是银行业金融机构及外资银行营业性机构从事的特定金融业务，受《金融机构衍生产品交易业务管理暂行办法》及其修改决定等法规监管。该业务分为套期保值类和非套期保值类，涵盖场内及场外衍生产品交易。\n\n在准入与审批方面，中资商业银行、农村合作银行、农村商业银行及外资银行营业性机构申请开办该业务，需经中国银监会或所在地银监局审批。外资银行分行在满足特定审慎监管条件并经管理行授权后可开办，分为普通类和其他类别。申请机构需报送可行性研究报告、内部规章制度、风险管理制度等资料，并满足特定准入条件。\n\n在风险管理要求上，该业务涉及前台、中台与后台分离原则，需建立风险模型量化管理机制，实施总行统一平盘和敞口管理。监管要求涵盖交易品种控制、风险敞口限额、止损限额、授权管理及人员隔离。具体风险维度包括市场风险、信用风险、流动性风险、操作风险及法律合规风险。机构需进行风险敞口测算、市值重估、交易对手审查及客户适合度评估。\n\n在运营与合规方面，业务涉及交易条款确认、合约签订、交易员资格管理、内审监督、报表报送及信息披露。监管强调客户风险揭示、利润目标设定及考核激励的合规性。对于外资银行，需满足特定条件并向监管报告。\n\n该业务领域受市场准入、风险管理及罚则约束，金融机构需具备相应资格，确保交易行为符合法规规范的核心业务领域要求，包括交易审批、人员资格、风险揭示及资本计提等管理要求。"}, {"id": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "label": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "group": "REGULATION", "value": 75, "title": "该文件为《中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见》，由中国人民银行太原中心支行于2011年4月20日发布并生效，目前状态为现行有效。\n\n该指导意见旨在深化山西\"138金融工程”，支持资源型经济转型及民生金融发展，指导金融机构抢抓山西综改试验区机遇，推动金融创新。其内容涵盖多个领域的金融支持政策与创新措施，具体包括：\n1. 中小企业金融支持；\n2. 对外经济金融创新；\n3. 农村金融创新及农业金融支持；\n4. 循环经济、接替产业及生态环保领域的金融支持；\n5. 民生及文旅产业的金融支持；\n6. 完善信贷评估正向激励引导机制；\n7. 提高金融服务水平及建立协作机制。\n\n该文件适用于省内相关金融机构，旨在通过上述措施支持省内项目、中小企业及特定行业发展。"}, {"id": "中国银监会中资商业银行行政许可事项实施办法（2006）", "label": "中国银监会中资商业银行行政许可事项实施办法（2006）", "group": "REGULATION", "value": 74, "title": "《中国银监会中资商业银行行政许可事项实施办法（2006）》是由中国银行业监督管理委员会发布的规章，文件文号为中国银行业监督管理委员会令〔2006〕第2号。该法规于2006年1月12日发布，自2006年2月1日起施行。根据所有输入描述，该法规当前的效力状态均为失效或废止。\n\n该办法主要规定了中资商业银行行政许可事项的具体实施办法。其适用对象涵盖中资商业银行，包括股份制商业银行和城市商业银行。在具体内容上，该办法详细规定了中资商业银行的设立条件、筹建及开业程序，以及变更股东、注册资本、住所、组织形式等行政许可事项。\n\n所有输入来源在发文机关、文件文号、发布日期（2006年1月12日）、生效日期（2006年2月1日）及当前状态（失效/废止）上信息一致，无冲突。部分描述进一步细化了该办法涵盖的具体行政许可范围，包括设立、变更等核心事项，这些内容互为补充，共同构成了对该法规适用范围和内容的完整描述。"}, {"id": "银监分局", "label": "银监分局", "group": "ORGANIZATION", "value": 74, "title": "银监分局是中国银行业监督管理委员会（中国银监会）的派出机构，属于地市级银行业监督管理机构，也是丹东市投融资领导小组成员单位。作为属地监管机构，其核心职能涵盖行政许可、日常监管及报告接收。\n\n在行政许可方面，银监分局负责受理、审查并决定中资商业银行境内支行及以下分支机构（含自助银行设施）的设立、变更（如变更名称、营业场所、支行以下机构升格）及终止营业申请；负责受理中资商业银行支行筹建申请，并核准已批准筹建机构的开业申请。对于城市商业银行、城市信用社股份有限公司，负责受理其申请开办现行法规明确规定的其他业务和品种，以及外汇业务申请；负责受理并初步审查城市信用社股份有限公司分社筹建。在高管任职资格方面，负责受理、审查并决定国有商业银行二级分行及以下、股份制商业银行支行、城市商业银行支行等高级管理人员的任职资格申请，或进行初审；负责受理并初审城市商业银行法人机构、分行及分行级专营机构高管的任职资格申请；负责审核任职资格申请表并加盖公章。此外，还负责初审地、市、县联社发卡申请材料，以及审批社区支行、小微支行终止营业或转为自助银行的申请。\n\n在日常监管与报告接收方面，银监分局负责受理、审查并决定分支机构临时停业申请，接收临时停业报告、修改章程报告及高管备案；负责异地任职监管评价意见征求及报告接收；接收各银监局转发通知、业务准入事前报告及个人理财产品发售报告；负责出具对筹建工作验收报告，参与资产评估报告审核及清产核资工作验收，并审核同意清产核资结果。\n\n在特定职责与协作方面，银监分局负责督促县域银行业金融机构制定并落实具体规划，协助组织辖区内企业对接项目申报工作，配合土地储备融资管理工作。作为银监局征求监管意见的对象，接收开业核准决定的抄送。部分描述指出其要求具有专职的外资银行监管人员。\n\n注：文中提及“吉林银监局下属”及“河北银监局下属”的分支机构，均指代银监分局这一层级机构在不同地域的具体实例，其职能描述与上述通用职责一致。所有职责均基于输入文件，未包含外部法律结论。"}, {"id": "上海市信贷投向指引(2008年修订)", "label": "上海市信贷投向指引(2008年修订)", "group": "REGULATION", "value": 73, "title": "《上海市信贷投向指引(2008年修订)》是由中国人民银行上海分行于2008年5月5日印发的信贷政策指引文件，文号为上海银发〔2008〕126号。该文件旨在推动信贷资金向经济社会薄弱环节和新型产业倾斜。根据现有描述，该指引目前处于现行有效状态。"}, {"id": "建设单位", "label": "建设单位", "group": "ORGANIZATION", "value": 73, "title": "“建设单位”指建设项目批准后具体实施项目建设的各单位，包括人民银行各级行和总行直属事业单位。作为项目法人或在其尚未明确时暂时代替项目法人填列项目名称的主体，其核心职责涵盖基本建设管理、财务控制、安全环保及贷款合规等多个维度。\n\n在基本建设与投资管理方面，建设单位负责建立健全安全管理和文明施工规章制度，督促施工、监理单位做好安全管理；负责审查设计、签订设计合同、委托审图及实施建设项目；负责施工图设计阶段投资监测、编制施工图预算、统筹竣工结算申报及编报竣工财务决算；同时负责编制预算、建立财务制度、管理建设资金及投资控制，并负责实施项目建设、编报计划报表、执行基本建设程序。\n\n在资金与贷款合规方面，建设单位是贷款项目的实施主体。对于使用国家开发银行1994年硬贷款的项目单位，需负责填写贴息情况表并提出贴息申请；对于使用特种拨改贷资金的项目实施主体，需与建设银行签订贷款合同，按期归还本息，并实行单独核算。此外，建设单位需申请办理新建项目贷款并依法取得土地使用权。\n\n在环境保护与公众参与方面，作为贷款项目实施主体，建设单位负责向贷款组织提供环保文件，向环保部门申报、修改补充报告书；负责编制《评价大纲》、《报告书》，向环保部门报审，向国际金融组织提交文件，并听取公众意见。\n\n上述描述综合了不同来源对建设单位在项目管理、财务核算、安全环保及贷款申请等方面的职责界定，保留了各特定资金渠道（如国开行硬贷款、建行特种拨改贷）及特定监管要求（如环保报审、国际组织文件提交）的具体条件与义务。"}, {"id": "银办发〔1998〕26号", "label": "银办发〔1998〕26号", "group": "REGULATION", "value": 73, "title": "银办发〔1998〕26号是中国人民银行办公厅于1998年3月25日发布的文件文号。该文件全称为《中国人民银行办公厅关于印发〈经济金融术语汉英对照表〉的通知》。根据输入信息，该文件目前处于现行有效状态。所有描述均指向同一发文机关、同一发布日期及同一文件主题，内容一致，无冲突信息。"}, {"id": "中小企业", "label": "中小企业", "group": "ORGANIZATION", "value": 72, "title": "中小企业是多项银行监管文件及政策中明确的重点支持与服务对象，其界定标准主要依据国家统计局规定，通常指年销售额在30000万元以下（批发零售、住宿餐饮领域为15000万元以下）的企业，暂不包括个体工商户。部分文件将其界定为已取得企业法人营业执照但尚未与银行发生贷款关系，或符合特定销售额标准的非个体工商户企业。\n\n在信用体系建设方面，中小企业是核心对象。其公共信息可共享，其他信息查询需授权；经营和财务信息被征集并纳入企业信用信息基础数据库管理，包括担保信用记录。企业需建立信用档案，配发标识符，接受培训，并主动报送信用信息。部分试点对象包括增长潜力大、可持续发展性强、向银行借款意愿强的企业，以及逐步扩展到的所有有征信意愿的企业。\n\n在融资与信贷支持方面，中小企业是债务融资工具发行主体、信贷资产证券化试点支持对象，以及再贷款支持中小金融机构后间接支持的经济主体。它们是农村信用社、城市商业银行、城市信用社单一法人社及长安银行等机构的主要服务对象或基本客户。政策导向包括：\n1. **信贷与担保**：作为信用担保业务主要服务对象，具有规模小、有效抵（质）押资产少等特点。担保机构服务包括获得担保、贷款及扶持的成长性或首次贷款企业。文件要求建立贷款担保体系，完善信贷政策，解决其获取贷款瓶颈制约。\n2. **创新业务**：是应收账款质押融资业务的客户对象，需提高信用意识、规范提供资料、规范财务管理并配合贷后管理。\n3. **其他支持**：涉及评级、授信及融资渠道拓展；支持使用共享科研设施、申请专利及进行技术创新；是民生领域融资服务对象及上市推动对象。\n\n在风险监测与管理方面，部分通知要求重点监测其流动性、经营状况、到期应偿债务数额、实际偿付能力及偿债风险。\n\n此外，中小企业被要求提升管理能力、规范内部管理制度。在宜春等地，其被视为经济超常规发展的主要动力，包括民营企业。文件还提及引导其到农村信用社开户存款，以及作为愿意入社和承认信用社章程的潜在社员群体之一。不同文件对具体适用范围（如创业期、成长期）及特定推荐单位类型有所侧重，但均强调通过信用体系建设和金融创新解决其融资难问题。"}, {"id": "中共甘肃省委、甘肃省人民政府关于加快个体私营企业技术升级实现跨越式发展的指导意见", "label": "中共甘肃省委、甘肃省人民政府关于加快个体私营企业技术升级实现跨越式发展的指导意见", "group": "REGULATION", "value": 71, "title": "该实体为《中共甘肃省委、甘肃省人民政府关于加快个体私营企业技术升级实现跨越式发展的指导意见》。这是一份由中共甘肃省委和甘肃省人民政府联合发布的政策文件，其性质被描述为指导性文件。该文件旨在指导个体私营企业进行技术升级，以实现跨越式发展。适用对象明确为个体私营企业。输入信息中未提供具体的文件文号、发布时间、具体金额、比例或详细条件。"}, {"id": "金融资产管理公司", "label": "金融资产管理公司", "group": "ORGANIZATION", "value": 71, "title": "金融资产管理公司是依法设立、经中国银监会批准设立的其他银行业金融机构之一，也是本次银行及其他金融业普查的法人单位对象。其核心业务包括按国务院规定从国有独资商业银行购入不良贷款并进行处置、债转股及资产回收等。\n\n在监管与统计方面，该机构是《金融资产管理公司统计制度》的适用主体，需向人民银行报送资产负债主要项目表、季度损益表（含地市级及以上人民币、外汇、本外币汇总数据）及“实收资本”等特定指标。其法人机构、分支机构变更及高级管理人员任职资格许可参照国有商业银行相关程序执行；高管平级调岗转任适用备案制度。在内部控制与案防方面，该机构参照执行《商业银行内部控制指引(征求意见稿)》及《银行业金融机构案防工作评估办法》。鉴于其作为非银类机构样本有限且组织架构不同，建议由非银部具体规定其案防监管评价评分标准。\n\n在资金与政策执行上，该机构涉及专项政策性再贷款，其再贷款以2003年12月31日余额为限执行原政策，超额部分按新规则计息；2005年仍执行原再贷款利率。该机构负责处置、回收不良资产并支付债券和再贷款利息。此外，文中提及允许外商投资企业依法购买其不良债权和股权。\n\n相关监管文件包括银办发〔2001〕53号通知（涉及高管任职资格审核）、银发〔2008〕321号通知（普查接收对象）等。需注意，《中国人民银行办公厅关于审核金融资产管理公司高级管理人员任职资格的补充通知》已被清理。该机构既是指导意见的适用对象及被监管主体，也是各类通知的受文单位。"}, {"id": "城市信用合作社", "label": "城市信用合作社", "group": "ORGANIZATION", "value": 71, "title": "城市信用合作社是依法设立的吸收公众存款的金融机构，属于中资商业银行的一种类型，亦被界定为银行业金融机构范畴。在监管与业务规范方面，该机构受《中华人民共和国商业银行法》约束，被禁止从事信托投资业务。其财务收支、资本金构成等需遵循《城市商业银行、城市信用合作社财务管理实施办法》的规定。在统计与报表报送上，城市信用合作社是1995年统计制度中涉及长期借款、财政性存款、中长期贷款、委托投资等项目的机构，其现金收支统计制度在1995年仍执行1994年制度；同时，它是银行及其他金融业普查对象之一，省、地、县级作为法人单位参与；需按属地管理原则向中国人民银行当地分支行报送报表，包括资产负债表，并需据实填报超范围经营业务；此外，它也是吉国税发〔2004〕360号文件适用的被监管主体类型之一，以及银发〔2008〕321号通知要求转发至的辖区内金融机构类别。\n\n在行政许可与变更事项上，城市信用合作社的法人机构变更名称、变更住所由所在地银监局受理、审查并决定；若变更为城市信用社股份有限公司，则需符合公司法等规定，由所在地银监局初步审查、银监会决定。其解散由银监局初步审查、银监会决定，破产需向银监会申请，由银监局受理并初步审查，银监会审查并决定。在人员任职资格方面，其理事长、副理事长、主任、副主任需满足特定学历和年限要求，并需进行任职资格许可。\n\n在资本运作与风险处置方面，城市信用合作社可作为参与设立城市信用社股份有限公司的主体或股东，需按合并财务报表测算，符合银监会规定的资本充足率、不良贷款比例等审慎性条件。它也是被中资商业银行收购的对象，涉及收购资金用途限制，其债务清偿需由收购资金覆盖，且需实现完全市场退出。此外，它是本次特种存款的缴存对象之一，缴存数额按7月末存款余额4%执行。关于产权归属，原城市信用社的公共积累产权需依据国办文件界定。在业务开办上，它是通知中明确列出的需向中国人民银行上报监管报表资料的机构类型，也是开办银行承兑汇票业务的主体之一，以法人为单位开办，并包括通过电子汇划系统办理汇兑业务的银行。"}, {"id": "各分行", "label": "各分行", "group": "ORGANIZATION", "value": 70, "title": "“各分行”在输入描述中主要指代中国人民银行的省级分支机构，同时也涵盖中国农业发展银行、建设银行等商业银行的分支机构。\n\n作为中国人民银行下属机构，各分行负责所在省（自治区、直辖市）调查行的管理工作，承担调查数据的审核、管理、收集、整理、汇总和分析职责，并配备专职人员。在应急管理中，负责制定侧重省级层面应对行动的专项及部门应急预案。在行政职能上，各分行是多项通知的受文单位或主送对象，负责转发通知、数据汇总及转发工作。根据《中国人民银行金银专项贷款管理暂行规定》第三十条，各分行需结合实际制定实施细则并报总行备案，并定期向总行上报统计报表。此外，各分行属于应成立基建项目检查辅导小组的管辖行以上机构，并参与自查及设立金融统计执法检查领导小组。\n\n在业务操作层面，部分描述指向负责具体信贷及代理业务的银行分支机构。这些机构负责对申请信息进行复核审批、完成贷款发放、登记确认发放信息、核对还款金额及录入风险补偿金和财政贴息结果。同时，负责提取贷款呆账准备金、核销呆账损失及办理展期审批。对于建设银行下属分支机构，其经办代理业务的业务量及管理和考核情况影响补助费分配。\n\n针对中国农业发展银行下属分行，其作为被监管主体，需执行月报制度并向总行报送数据，且需于每年1月份向总行上报《粮棉油加工企业固定资产贷款期限管理报告表》。\n\n需注意，输入描述中“各分行”一词在不同语境下指向不同机构：既包括中国人民银行的地方分行，也包括农发行、建行等商业银行的分支机构。不同来源对职责的描述存在差异，如人行分行侧重监管、数据汇总及预案制定，而商业银行分行侧重具体贷款业务执行、报表上报及考核。所有描述均基于输入文本，未对同名不同机构进行强行合并，冲突信息已按机构属性并列说明。"}, {"id": "专业银行", "label": "专业银行", "group": "ORGANIZATION", "value": 70, "title": "“专业银行”在相关监管文件中指代经中国人民银行批准、持有经营金融业务许可证并在人民银行单独开立账户的金融机构群体。该群体包括工商银行、农业银行、建设银行等全民所有制金融机构，涵盖总行、省（自治区、直辖市）、计划单列城市分行、地区（市、州）分行及县（市、旗）支行等各级分支机构。\n\n在业务职能与资金关系方面，专业银行是人民银行的贷款对象，接受人民银行的信贷计划管理、资金调剂及监管。其需编制和管理自身信贷计划、外汇信贷计划及现金收支计划，并办理还款手续。专业银行负责审查企业外汇、发放贷款、组织落实信贷规模及安排银行信贷资金。在资金运作上，专业银行可跨专业、跨地区发放固定资产贷款，组织银团贷款，办理商业票据贴现，提供临时贷款，代理企业发行债券股票，经批准可开办转让业务。其分支行是短期融通资金的主要使用对象，需满足合理的短期资金需要。专业银行与农村信用社存在资金横向融通、拆借关系，信用社可代理其业务；同时，专业银行与信托机构存在资金拆借、同城票据交换及异地结算联行往来关系，并与邮电部门及邮政储蓄业务存在协调关系。\n\n在独立性与风险管理方面，专业银行被视为相对独立的经济实体，需自行筹集信贷资金。作为受委托进行审查定项的机构，其造成的风险贷款按特定办法处理。\n\n在账户与监管执行方面，专业银行在人民银行存有存款，涉及冻结、扣划其存款时按特定执行方式处理。此外，专业银行是规定中报送会计报表的主体，需按规定报送相关财务数据。\n\n注：上述描述基于输入列表合并，保留了各文件中关于机构层级、业务范围、资金关系及监管要求的具体表述。不同文件对“专业银行”的具体侧重点（如侧重信贷计划、侧重外汇管理或侧重账户执行）存在差异，此处并列呈现以反映其作为受监管金融机构群体的多重属性。"}, {"id": "中国人民银行上海总部", "label": "中国人民银行上海总部", "group": "ORGANIZATION", "value": 70, "title": "中国人民银行上海总部是中国人民银行分支机构，在多项监管文件及协议中承担特定职能。作为发文机关，该机构负责发布通知并实施监管，具体包括在试验区放开小额外币存款利率上限，并建立相应的动态监测和检查机制。同时，该机构也是众多监管文件的受文单位或接收对象，涉及的文件文号包括国土资发[2007]277号、环发〔2007〕108号、财库〔2012〕132号及银发〔2008〕321号等。在这些文件中，其身份涵盖通知的主送机关、受文单位之一，负责辖区内政策的执行与转发，或作为联合转发通知的机构之一。\n\n在业务操作层面，该机构在相关协议中作为甲方组成部分，负责提供逐笔贷款清单及利息计算明细清单。此外，它也是原风险处置再贷款的发放机构之一，属于协议中甲方的相关分支机构。在资金划付与托管方面，该机构接收保护基金公司划付款项，代为偿还托管清算机构再贷款，并负责保管相关材料。在市场监管方面，该机构作为监管机构，接收交易中心提供的辖区内市场参与者利率互换交易信息。\n\n上述描述基于不同来源文件，反映了该机构在不同时间点和不同业务场景下的角色差异：既包括作为发文机关制定政策（如利率管理），也包括作为受文单位接收上级指令（如2007年及2012年的相关通知），以及作为具体业务执行方参与贷款发放、资金划付和信息接收。各描述均保留原始文件中的名称、文号及职能界定，未对冲突信息进行合并裁决，而是并列呈现其在监管、执行及协议各方中的多重身份。"}, {"id": "审慎经营规则", "label": "审慎经营规则", "group": "BUSINESS", "value": 70, "title": "“审慎经营规则”是银行业金融机构应当遵守的经营管理原则和标准，属于监管制度或监管规则类别。在相关行政处罚案例中，该规则常被作为认定当事人违规及实施处罚的依据之一。\n\n根据输入信息，多名被处罚当事人及机构被认定“严重违反”了审慎经营规则。具体涉及对象包括：国开行云南省分行、江镇华、喻琼以及其他未具名的被处罚机构或当事人。其中，江镇华的违规行为具体发生在经营性物业贷款授信管理环节；喻琼的违规行为涉及严重违反该规则；国开行云南省分行被指出存在严重违规行为。部分描述进一步指出，该规则具体指贷款业务中需遵守的审慎经营要求。\n\n上述描述均源自原文提及的监管制度或行政处罚依据，强调当事人行为与规则之间的“严重违反”关系。不同来源对违规主体的具体身份（如特定分行、特定个人）及具体业务场景（如经营性物业贷款授信管理）有所侧重，但核心均指向对审慎经营规则的严重违背。原文未提供具体的文件文号、发文机关、确切时间范围、适用对象的详细界定、涉及金额、比例或具体条件细节，仅确认其为被违反的监管规则类别及处罚依据。各描述在表述上存在细微差异，如有的强调其为“监管制度”，有的强调其为“监管规则类别”，有的则具体化为“贷款业务中的审慎经营要求”，但均指向同一监管概念。"}, {"id": "中华人民共和国商业银行法", "label": "中华人民共和国商业银行法", "group": "REGULATION", "value": 69, "title": "《中华人民共和国商业银行法》是由全国人民代表大会通过颁布的国家法律，其法律效力高于行政法规。该法规定了商业银行业务范围（文中指出其未包含“同业借款”业务品种）、资产负债比例管理（如第三十九条规定）、章程制定要求及协助执行义务，是金融机构必须严格执行的法律。\n\n在监管与立法层面，该法作为上位法或制定依据，被广泛引用以支持多项规章、指引及办法的制定。具体包括：《上海商业银行客户投诉处理指导意见》、《个人住房担保贷款管理试行办法》、《中国人民银行、教育部、财政部关于助学贷款管理的若干意见》、《中国人民银行关于商业银行设立同城营业网点管理办法》、《农村信用社省(自治区、直辖市)联合社管理暂行规定》、《农村合作金融机构社团贷款指引》、《外资银行法人机构公司治理指引》、《外资银行行政许可事项实施办法（征求意见稿）》、《江西集中代收付业务管理办法（试行）》、《股份制商业银行董事会尽职指引(试行)》、《股份制商业银行非现场监管规程（试行）》、《金融机构衍生产品交易业务管理暂行办法（2004）》及其2007修正版、《银行业金融机构衍生产品交易业务管理办法》、《银行业金融机构重要信息系统投产及变更管理办法》、《中华人民共和国外资银行管理条例实施细则》及其2015修订版、《中国银行业监督管理委员会中资商业银行行政许可事项实施办法》、《商业银行市场风险资本计量内部模型法监管指引》、《商业银行资本充足率监督检查指引》、《外国银行撤销在华营业性分支机构操作指引》、《潜江市专利权质押贷款管理办法（试行）》、《银行业金融机构案防工作评估办法》、《农村信用社小企业信用贷款和联保贷款指引》等。此外，该法也是制定考核办法、本指引、本规定、本通知及清理工作的法律依据之一，并用于支持对商业银行住房金融业务的监管及落实监管要求。\n\n在行政处罚与合规监督方面，该法（特别是第四十条等条款）被中国银行业监督管理委员会及相关部门引用，作为对金融机构违法行为进行处罚的依据。处罚情形包括：未按要求报送报表、资料及披露情况（含衍生产品交易情况）、不按要求报送报告或隐瞒重大问题、省联社违反国家法律法规规章、强行扣款行为严重违反该法规定等。该法还适用于省联社解散、被接管、被撤销和被宣告破产的情形，并作为中资商业银行分立和合并、城市信用合作社变更为城市信用社股份有限公司需符合的规定之一。\n\n针对特定机构，外商独资银行、中外合资银行及外资金融机构办理人民币业务时必须遵守该法关于资产负债比例管理的规定。该法亦被提及为金融法律宣传的主要内容之一，并在“金龙工程”企业信贷管理及金融统计执法检查中作为法律依据。"}, {"id": "商业银行内部控制指引(征求意见稿)", "label": "商业银行内部控制指引(征求意见稿)", "group": "REGULATION", "value": 69, "title": "《商业银行内部控制指引(征求意见稿)》是由中国人民银行于2002年4月4日发布的草案/征求意见稿。该文件旨在促进商业银行健全内部控制，防范金融风险，保障银行体系安全稳健运行，并规范商业银行的内部控制行为。\n\n在适用对象方面，该指引适用于在中华人民共和国境内依法设立的商业银行和城乡信用社。\n\n文件内容涵盖广泛的业务领域及管理要求，具体包括：\n1. **核心业务领域**：涉及授信管理、资金业务、存款及柜台业务、票据结算、外汇业务、代理业务、银行卡业务、基金托管、咨询顾问、保管箱业务等。\n2. **管理与风险控制**：包含风险监测、授权管理、交易及结算要求、会计内部控制、计算机信息系统安全等内容。\n3. **监督与纠正**：涉及监督纠正机制及相关规定。\n\n关于效力与施行，该文件自发布之日起施行，同时废止《加强金融机构内部控制的指导原则》。\n\n注：所有描述均基于2002年4月4日发布的同一草案/征求意见稿，各条目在涵盖的具体业务细节（如是否强调基金托管、计算机安全或特定结算业务）上存在侧重差异，但均指向同一发文机关、同一时间及同一文件性质，故合并为上述统一描述。"}, {"id": "贷款管理", "label": "贷款管理", "group": "BUSINESS", "value": 69, "title": "“贷款管理”指金融机构对贷款业务全流程的管理活动，涵盖贷前调查、贷中检查、贷后检查、抵押担保措施落实、贷款发放、支付、监督使用及各方责任义务。该领域要求建立健全内部控制制度，规范贷款投向、贷后跟踪检查及贷款责任制，旨在防范风险、保证信贷资产质量及贷款质量。\n\n在监管认定中，该领域常被指出存在“不到位”、“不审慎”、“不尽职”或“不规范”等问题，导致严重违反审慎经营规则、信贷资金被挪用、部分贷款损失或贷款形成不良。具体违规表现包括客户经理与中介合作、未识别造假、流动资金贷款用途违规及对公信贷资金挪用等。\n\n涉及该领域的处罚或责任认定案例包括：\n1. **机构层面**：华夏银行股份有限公司临沂罗庄支行、山东高唐农村商业银行股份有限公司、湖北银行股份有限公司恩施分行、富滇银行股份有限公司昭通镇雄支行、若羌县农村信用合作联社、原海口市农村信用合作联社、原文昌农村商业银行股份有限公司、原海口农村商业银行股份有限公司等被认定存在贷款管理不到位、严重不审慎或违反审慎经营规则等问题。\n2. **个人责任层面**：冯贵海、刘涛、周小斌、徐振德、郑棉俊、孙家利及相关责任人员被认定对贷款管理不到位、不审慎或管理不规范负有责任。\n\n此外，各商业银行及政策性银行在加大信贷支持的同时，需加强贷款管理环节，以确保信贷资产质量。上述描述基于不同监管文件及处罚决定，反映了不同时间、不同机构在贷款管理合规性上的具体违规事实及责任归属。"}, {"id": "清产核资", "label": "清产核资", "group": "BUSINESS", "value": 68, "title": "“清产核资”指对资产、负债、所有者权益及债权债务进行全面清查、核实、评估与产权界定的监管或财务管理工作。其核心任务包括清理财产、损益、权益，登记产权，建章建制，旨在摸清家底、确定资产风险状况，实现产权清晰、权责明确，并核定国家资本金。\n\n在时间范围与适用对象上，该工作涵盖1995年全行范围内的国有资产产权关系确定；1997年依据财政部和中国人民银行［１９９７］３号通知，在决算前以核实资金为主要内容的补课工作；2004年至2005年农村信用社深化改革及试点期间，以县市联社为单位进行的资产核查、价值重估及账务处理，要求2005年12月底完成；以及上市前、战略入股合作、统一法人组建、机构设立或合并、城市信用社更名为农村信用社等特定场景下的资产清理与核实。\n\n具体业务环节包括：对固定资产进行价值重估、土地估价、核实国有资产价值总额；处理资产价值增减变动的账务；清理信贷资产、固定资产及资金损失。对于清理出的特定资产损失，通常暂不进行账务或财务处理，需上报省办汇总至中国人民银行总行或相关监管部门批准后方可处理。在统一法人组建或机构合并中，需制定方案、进行验收整改，并经多方签字盖章及监管部门审核，提交清产核资报告及验收报告。\n\n该工作也是固定资产重估、归口管理和处置的前提条件。例如，陕西长安商业银行筹备组曾对5家并入机构执行此工作；针对农村合作基金会亦有全面清查要求。不同时期和场景下，其侧重点从单纯的资产核实延伸至产权界定、风险锁定及资本金核定，是农村信用社改革深化阶段及机构变更过程中的关键监管措施。"}, {"id": "担保机构", "label": "担保机构", "group": "BUSINESS", "value": 68, "title": "“担保机构”在输入描述中涉及两个不同维度的定义，需并列说明，不强行合并为单一实体。\n\n第一，作为规划中的市场主体，指鼓励民营企业设立的商业性、互助性机构。该描述侧重于机构性质与设立背景，未提供具体名称、文号、发文机关、时间范围、适用对象、金额、比例或具体条件。\n\n第二，作为金融服务模块下的栏目，指涉及中小企业担保机构名单、担保条款及链接发布的平台或信息板块。该描述侧重于信息展示与功能定位，未提供具体名称、文号、发文机关、时间范围、适用对象、金额、比例或具体条件。\n\n上述两项描述分别指向机构实体本身及其在金融服务系统中的信息呈现方式，来源与语境存在差异，故保持并列陈述，不擅自裁决其是否为同一具体机构或分支行，亦不将历史规划要求视为当前执行标准。"}, {"id": "四川省农村信用社一九九八年度会计决算工作意见", "label": "四川省农村信用社一九九八年度会计决算工作意见", "group": "REGULATION", "value": 68, "title": "该实体为《四川省农村信用社一九九八年度会计决算工作意见》，是由四川省农村金融体制改革领导小组办公室与四川省国家税务局联合印发的规范性文件。文件文号为川农金改办〔1998〕181号，发布日期为1998年12月17日，根据输入信息，该文件目前状态为现行有效。\n\n该文件主要规定了1998年度四川省农村信用社会计决算工作的具体意见，涵盖指导思想、组织要求及具体核算原则。在具体内容上，文件对会计科目名称的更改、账户的增设与取消，以及管理费及工会经费的上缴等事宜作出了明确要求。适用对象为四川省农村信用社。\n\n各来源描述在发文机关、文号、时间及核心内容上保持一致，均确认该文件由上述两机关联合发布，旨在规范1998年度会计决算工作。"}, {"id": "城市信用社股份有限公司", "label": "城市信用社股份有限公司", "group": "ORGANIZATION", "value": 66, "title": "城市信用社股份有限公司是中资商业银行的一种类型，属于地方性银行业金融机构。其设立主体为经整顿后同一城市内多家或一家城市信用合作社合并重组而成的企业法人。设立过程需满足特定资本充足率、资产质量等条件，并经过筹建和开业两个阶段，需在规定期限内开业并办理相关许可手续。\n\n在机构变更与治理方面，其法人机构变更名称、解散、破产申请、变更组织形式、分立、合并等事项，由所在地银监局初步审查，银监会决定；变更股东、注册资本、住所、修改章程等事项由所在地银监局受理，部分由银监会决定。其可在所在城市范围内设立分社。\n\n在人员任职资格方面，拟任董事长、副董事长、总经理、副总经理、董事会秘书及分社经理需满足特定的学历及工作年限要求。其法人机构、分社的董事和高级管理人员任职资格申请，需按特定程序向银监局或银监分局提交。\n\n在业务许可方面，申请开办外汇业务或增加外汇业务品种，由机构所在地银监分局或所在城市银监局受理，银监局审查并决定；申请开办电子银行业务、发行银行卡、个人理财业务及其他业务，由所在地银监局受理并初步审查，银监会审查并决定。\n\n上述描述基于原文提及的监管规定，涉及设立、变更、任职资格及业务许可等行政许可事项，明确了银监局与银监会在不同事项中的初审与决定权限。"}, {"id": "《外资银行行政许可事项实施办法（征求意见稿）》", "label": "《外资银行行政许可事项实施办法（征求意见稿）》", "group": "REGULATION", "value": 66, "title": "《外资银行行政许可事项实施办法（征求意见稿）》是中国银行业监督管理委员会（中国银监会）于2015年4月10日公开征求意见的草案文件。该草案旨在规范外资银行行政许可事项，拟废止2014年第6号令。\n\n该文件规定了外资银行机构设立、变更、终止及业务范围等行政许可的具体条件、程序和资料要求。在机构设立方面，涉及外资银行设立、筹建、开业、改制及设立代表处等事项。在机构变更方面，涵盖变更注册资本、营运资金、股东、组织形式、名称、修改章程，以及合并、分立等行政许可事项。在机构终止方面，规定了外资银行分行关闭、提取生息资产等行政许可程序。\n\n在业务范围方面，草案规定了外资银行经营人民币业务、发行债务及资本补充工具、开办代客境外理财业务及托管业务、开办信用卡业务、从事衍生产品交易业务等各类业务的行政许可程序、条件及资料要求。\n\n此外，该草案还规定了外资银行董事、高级管理人员和首席代表的任职资格条件、禁止情形及履职要求。适用对象包括外商独资银行、中外合资银行及其他外资银行机构。"}, {"id": "镇江市第八次哲学社会科学优秀成果评奖结果", "label": "镇江市第八次哲学社会科学优秀成果评奖结果", "group": "REGULATORY_ACTION", "value": 66, "title": "镇江市发布的关于第八次哲学社会科学优秀成果评奖结果的公布行为。该行为旨在具体公布镇江市第八次哲学社会科学优秀成果评奖的最终结果。"}, {"id": "外国银行代表处", "label": "外国银行代表处", "group": "ORGANIZATION", "value": 64, "title": "外国银行代表处是外国银行在中华人民共和国境内设立的非营业性常驻代表机构，属于外资银行的一种组织形式。该机构主要从事联络、市场调查、咨询等非经营性活动，严禁从事任何形式的经营性活动。其民事责任由所代表的外国银行承担。\n\n在设立与登记方面，代表处需经银行业监督管理机构（文中提及银监会或银保监会）批准，并凭批准文件办理工商登记。其设立、增设、变更名称、变更办公场所等事项涉及行政许可，其中变更名称申请由所在地银监局受理、审查和决定。增设代表处时，需无重大违法违规记录。代表处的中文名称需标明外国银行国籍及责任形式。\n\n在运营与合规要求上，代表处需具备独立办公场所、设施及专职人员，建立会计账簿。其首席代表需具备特定金融工作年限（如3年以上金融工作或6年以上相关经济工作经历），任职资格由所在地银监局或银监会核准。首席代表离岗或更换时，需向所在地银保监会或银监局派出机构报告，并涉及代为履职规定。\n\n在监管报告与义务方面，代表处需向所在地中国银监会或银保监会派出机构报告其所代表外国银行的重大事项及相关事项。发生更名、变更办公场所等变更事项后，需在指定报纸上公告，并履行迁入办公场所及报送资料的义务。此外，代表处需按规定报送工作报告、计划及总行年报。\n\n在终止与注销方面，代表处终止活动需经批准，并办理注销登记。文中提及该机构为关闭申请的标的机构。\n\n注：不同来源文件中对监管主体的表述存在“中国银监会”、“银监局”与“银保监会”、“银保监会派出机构”的差异，且部分描述基于《外资银行行政许可事项实施办法（征求意见稿）》或特定条例条款（如第四十六条、第七十条），具体适用以相应文件发布时的监管架构为准。"}, {"id": "金融统计制度", "label": "金融统计制度", "group": "BUSINESS", "value": 64, "title": "“金融统计制度”是金融机构向中国人民银行报送金融统计数据的监管规范，旨在收集、反映金融信息并规范统计业务。该制度涵盖2009年及2014年两个主要时间阶段，适用对象主要为中资金融机构及一般金融机构。\n\n在2009年阶段，制度要求中资金融机构执行周报、旬报、月报、季报、年报及结转数的报送。统计指标广泛，包括存款、贷款、垫款、存放款项、实收资本、利润、现金、存放中央银行存款等。具体科目涉及农户贷款、个人消费贷款、信用卡及账户透支、单位贷款、手续费及佣金支出、租赁收益、投资收益、债券投资收益、利息收支及营业收入等。该阶段还规定了A3601表单及相关存款指标，明确了周报与月报指标的对应及映射关系，并建立了包含现金、贷款等指标的校验关系。\n\n在2014年阶段，依据银发〔2014〕1号通知，金融机构需执行调整后的统计报告与报送制度。该制度涉及资产、负债、表外项目等数据的统计与校验，具体指标包括买入返售债券、买入返售资产、卖出回购资产、证券资产、票据、债券投资等。2014年的规范重点在于统计口径与代码的调整，例如对债券投资等指标的代码与名称进行变更，并规定了具体的校验规则。此外，该阶段还涉及信贷收支表编制、租赁保证金统计归属等监管统计业务。\n\n在报送要求方面，制度规定了季度报送频度，要求区分本外币业务类，并包含人民币、美元合计等币种要求。整体而言，该制度通过具体的统计科目代码、校验逻辑及指标定义，规范了金融机构在存款分类映射、财务数据（如利息支出、手续费及佣金）统计等方面的业务操作，确保金融数据报送的准确性与规范性。不同年份的制度在指标代码、名称及具体校验规则上存在差异，需依据相应时间点的文件要求执行。"}, {"id": "不良贷款清收", "label": "不良贷款清收", "group": "BUSINESS", "value": 64, "title": "“不良贷款清收”是农村信用社及合作金融机构在深化改革、专项票据兑付及资产质量提升背景下开展的核心信贷风险管理业务。该业务旨在通过集中清理历年积压的诉讼执行案件、处置损失类贷款及盘活存量资产，实现不良贷款比例与余额的“双下降”，并降低整体不良贷款比例。\n\n在适用对象与成因方面，清收工作涵盖乡镇政府、行政事业单位、公职人员、乡村集体、企业（含中小企业）及个人（含内部员工自借、担保）等主体。针对企业改制、行政干预、故意拖欠及逃废债等不同成因，采取分类施策。具体包括：对公职人员及行政事业单位拖欠贷款进行专项清收；对内部员工不良贷款设定限期收回目标（如2010年底全部收回）；对已胜诉案件及故意拖欠企业债务进行依法追偿。\n\n在实施措施与阶段上，业务活动通常包括摸查汇总、任务分解、动员访谈、诫勉治理、核实界定、限期还款、依法诉讼、强制还款、资产抵押保全、减免罚息及呆账核销等环节。各地政府及联社需制定计划与支持措施，如以优良资产置换不良贷款、打击逃废债行为，并落实责任主体与进度跟踪。\n\n在目标与指标方面，不同地区与时期设定了具体量化目标：如全年清收盘活3亿元或4亿元不良贷款；要求不良贷款比2002年下降50%；或针对2006年12月31日前形成的不良贷款进行专项清理；亦有要求2014年底前清收保全全部不良贷款的目标。部分业务为符合央行专项票据兑付条件而开展，需提交清收进度报告。\n\n该业务涉及多个监管与执行主体，包括县联社、市县政府、金融机构及各级监管部门。具体案例包括岳阳市、通化市、邢台市、荔城区等地农村信用社开展的专项清收行动，以及针对接收归并的合作基金会和城市信用社不良资产的处置工作。文件要求加大力度、创新清收方式，并通过总结评比、验收总结等手段确保业务落地，旨在全面盘活旧贷，优化资产质量。"}, {"id": "货币信贷政策导向效果评估", "label": "货币信贷政策导向效果评估", "group": "BUSINESS", "value": 64, "title": "“货币信贷政策导向效果评估”是一项旨在引导金融机构改善信贷结构、合理安排信贷投放的核心监管业务，并作为确定法人金融机构稳健性调整参数的主要依据。该业务主要适用于上海市银行业金融机构，同时也涉及一般金融机构。\n\n在实施机制上，各金融机构需建立工作协调机制，明确数据来源并建立数据核对制度，将自评数据收集和整理工作耗时降至2个工作日以内。评估流程包含自评、复评、现场评估、集体评分及结果运用等环节，原则上每半年开展一次非现场评估。\n\n评估内容涵盖多个导向效果模块。不同来源对具体模块的描述存在差异，需并列说明：\n1. 部分描述指出包含宏观审慎货币政策、利率政策、中小企业信贷政策等7个导向效果评估模块，实行分类别评估和分模块评分。\n2. 另有描述指出包含利率、中小企业信贷、房地产信贷、可持续发展信贷、消费信贷及传导机制等模块。\n3. 还有描述指出包含宏观审慎货币政策、利率政策、中小企业信贷、房地产信贷、可持续发展信贷、消费信贷、信贷政策传导与反馈机制建设及自选特色优势项目等八个模块。\n4. 亦有描述提及包含宏观审慎货币政策导向效果、利率政策导向效果等模块。\n\n在结果运用方面，该评估涉及报送评估工作小组名单、试评报告及半年度评估报告。评估结果与金融机构的特定资格和荣誉挂钩，包括利率市场化试点资格评定、存贷款金融工具创新准入及企融服务先进机构评选等。"}, {"id": "山西省人民政府办公厅转发人民银行太原中心支行关于加大信贷投入优化信贷结构促进山西新型能源和工业基地建设的指导意见", "label": "山西省人民政府办公厅转发人民银行太原中心支行关于加大信贷投入优化信贷结构促进山西新型能源和工业基地建设的指导意见", "group": "REGULATION", "value": 64, "title": "该实体为山西省人民政府办公厅转发人民银行太原中心支行发布的政策文件，旨在加大信贷投入、优化信贷结构，以促进山西新型能源和工业基地建设。文件由山西省人民政府办公厅作为发文机关，转发了人民银行太原中心支行的指导意见。其核心内容聚焦于通过信贷手段支持山西新型能源和工业基地的发展，涉及信贷投入力度的增加及信贷结构的优化调整。"}, {"id": "各银监局", "label": "各银监局", "group": "ORGANIZATION", "value": 63, "title": "“各银监局”指中国银行业监督管理委员会（银监会）在地方的派出机构，即各地银行业监督管理机构。在多数监管通知中，其作为主送机关或受文对象，负责接收、转发文件至辖内各银监分局、法人银行业金融机构及农村信用社各级联社，并参与数据信息共享。\n\n具体职责与适用情形包括：\n1. **监管执行**：负责辖区内银行业监管工作，执行现场检查、告知检查人员要求、决定表外业务检查范围；负责属地监管及初审、审批外资银行支行设立事项；对四家银行分支机构进行监管，执行不良资产分析和考核报告制度。\n2. **专项工作**：负责会同人民银行分支机构做好农村信用社统计信息管理系统在本省推广工作；在非现场监管工作中组织试用并上报情况；负责组织培训及推广系统；确定各银监分局内设工作岗位。\n3. **文件流转**：被要求将通知转发至辖内相关机构、各银监分局及指定法人机构。\n\n涉及的具体文件文号及发文机关包括：\n- **发改企业〔2007〕2797号**：受文对象。\n- **建住房[2006]8号**：受文对象之一。\n- **环发〔2007〕108号**：受文单位。\n- **银监办发[2009]437号**：接收对象，负责转发至辖内各银行业金融机构。\n- **银监发〔2004〕21号**：受文对象，负责非现场监管试用。\n- **银监发〔2006〕7号**：接收对象，特指除西藏以外的各省级银监局。\n- **银监发〔2009〕109号**：接收对象，负责将指引转发至辖内特定类型银行。\n- **银监发〔2010〕13号**：接收对象之一，负责将指引转发至辖内相关银行。\n- **辽宁省物价局通知**：接收对象。\n\n关于适用范围，部分通知明确“各银监局”指除西藏以外的各省级银监局，或作为通知接收对象时注明“西藏除外”。不同文件中对其具体职责描述存在差异，如有的侧重数据共享，有的侧重现场检查或系统推广，均依据具体发文背景而定。"}, {"id": "中国人民银行徐州市中心支行", "label": "中国人民银行徐州市中心支行", "group": "ORGANIZATION", "value": 63, "title": "中国人民银行徐州市中心支行是中国人民银行在徐州市设立的分支机构。该机构作为发文机关及制定主体，负责制定并印发多项内部管理制度，主要包括《中国人民银行徐州市中心支行政务主动公开制度（试行）》、《中国人民银行徐州市中心支行新闻宣传管理制度》以及《中国人民银行徐州市中心支行采购管理操作规程》。\n\n在政务公开方面，该支行是《中国人民银行徐州市中心支行政务主动公开制度（试行）》的制定机关及执行主体。其职责涵盖政务信息的主动公开、澄清及内部监督，同时作为政务依申请公开的受理主体，负责政务公开申请的受理、答复、费用收取及解释工作。此外，该支行也是政务公开考核的责任主体、被评议对象，以及政务公开责任追究办法的适用主体和解释主体。\n\n在新闻宣传管理方面，该支行是《中国人民银行徐州市中心支行新闻宣传管理制度》的印发机关、被规范的管理主体及制度适用主体，负责相关宣传工作的规范与管理。\n\n在采购管理方面，该支行是《中国人民银行徐州市中心支行采购管理操作规程》的发文机关及被监管/规范主体。作为该操作规程的适用主体，其负责制定并执行中心支行机关的采购管理工作，确保采购流程符合规定。\n\n综上，中国人民银行徐州市中心支行既是上述各项制度的制定与印发机关，也是具体的执行主体、管理主体及责任主体，全面负责辖区内政务信息公开、新闻宣传及采购管理等工作的实施与监督。"}, {"id": "关于进一步加快遵义农村商业银行股份有限公司组建工作的通知", "label": "关于进一步加快遵义农村商业银行股份有限公司组建工作的通知", "group": "REGULATION", "value": 63, "title": "《关于进一步加快遵义农村商业银行股份有限公司组建工作的通知》由遵义市人民政府办公室于2013年9月16日发布。该文件旨在加快遵义农村商业银行（简称“遵义农商银行”）的组建工作，并涉及处理抵债资产等相关事宜。\n\n根据描述列表，该通知要求相关部门支持遵义农商银行扩大资金来源及处置不良贷款。关于文件的现行效力，其中一条描述指出其“现行有效”，但鉴于该文件发布于2013年，且未提供后续废止或修订的具体文号及时间，此处仅依据输入信息并列说明其发布时的状态描述，不擅自裁决其当前法律状态。\n\n该文件的核心内容聚焦于推动遵义农村商业银行股份有限公司的组建进程，并明确了在组建过程中对资金来源扩大及不良贷款处置的支持要求。所有描述均指向同一发文机关（遵义市人民政府办公室）和同一发布时间（2013年9月16日），且针对同一主体（遵义农村商业银行股份有限公司/遵义农商银行）。\n\n需注意，输入描述中提及的“处理抵债资产”与“处置不良贷款”可能为同一事项的不同表述或并列事项，此处依据输入原文保留相关表述，不合并为单一概念。文件适用对象为遵义农村商业银行股份有限公司及其组建相关方，以及负责支持其组建工作的相关部门。\n\n综上，该通知是遵义市人民政府办公室于2013年9月16日发布的行政文件，主要目的是加快遵义农村商业银行股份有限公司的组建，并要求相关部门在扩大资金来源和处置不良贷款（或抵债资产）方面提供支持。"}, {"id": "信用社", "label": "信用社", "group": "ORGANIZATION", "value": 62, "title": "“信用社”在相关监管文件中指代多种类型的信用合作金融机构，包括农村牧区信用合作社、城市信用合作社、独立核算信用社、二级联社、市联社及辖属营业部等。作为贷款呆帐处理的核心主体，信用社是呆帐认定的执行者，需逐笔查实并填制审批表或报告表，实施账务处理及“帐销案存”管理，并补报证明材料。在财务管理方面，城市信用合作社等机构适用《城市商业银行、城市信用合作社财务管理实施办法》及相关规定，作为抵债资产的取得与管理主体。\n\n在经营与监管合规层面，信用社被明确禁止搞以贷收息等虚假行为。四川省农村信用社的具体经营单位需执行试算、资产清理、贷款清收等决算任务。甘肃省农村信用社体系中的基层信用社与联社共同承担贷款责任。此外，信用社涉及国家公职人员拖欠贷款清理工作，并被要求打破所有制界限，为个体私营企业技术升级提供信贷支持与服务。\n\n在制度适用与机构管理上，信用社（含信用联社）是呆帐处理实施办法的适用金融机构类型。独立核算信用社、二级联社、市联社及辖属营业部是工效挂钩办法的适用主体。在机构升格审批中，信用社亦被提及为目标机构类型之一。上述描述涵盖了不同地区（如内蒙古、四川、甘肃）及不同层级（基层、市级）信用社在贷款核销、财务规范、经营行为及机构管理中的具体职责与适用情形。"}, {"id": "农业银行", "label": "农业银行", "group": "ORGANIZATION", "value": 62, "title": "农业银行（文中亦称“农行”）是大型商业银行，曾为专业银行，需推进股份制改革并上市。作为被监管和指导对象，其业务活动受人民银行各级机构稽核。\n\n在历史沿革与机构关系方面，农业银行曾与农村信用社存在行政隶属关系，1997年已脱离该隶属关系，但涉及产权界定不清的资产纠纷。在会计处理上，涉及“存放农业银行约期存款”科目取消及余额划转至“存放农业银行款项”科目，并作为资金头寸计算中存放与轧差款项的对象。\n\n在信贷与业务职能上，农业银行是信贷计划管理等规定自1984年4月1日起实行的机构之一。1984年起，其负责现金收支统计，粮食贷款由人民银行补息，并负责保证农副产品收购资金供应，当年暂被核给一部分周转指标。作为国家助学贷款经办银行之一，负责办理贷款及代偿结算。此外，其提供基建、技改贷款，发放民族贸易贷款，自1991年9月21日起享受人民银行按年利率2.88%给予的利差补贴。\n\n在支农与战略定位上，农业银行被要求切实担负起支持“三农”重任，从战略和全局角度支持“三秋”生产。需拓宽支农信贷资金渠道，增加农田水利建设信贷资金，支持特色农业发展。文中要求坚持“三性”原则，将贷款主要用于支持种养业等领域。在区域战略上，需继续大力实施县域“蓝海”战略，以县域经济为信贷支撑点，发挥支农辐射作用，拓展涉农客户。具体任务包括围绕农业产业化经营提供配套服务，依托自身优势加强对涉农龙头企业和农村基础设施建设的资金支持。\n\n在特定监管任务中，2010年增贷指导任务中，农业银行作为市级银行业金融机构之一，确保增量65亿元，争取增量78亿元。此外，文中提及农业银行参与通过光大资产托管有限公司进行的债权债务对冲。"}, {"id": "贷后管理", "label": "贷后管理", "group": "BUSINESS", "value": 62, "title": "“贷后管理”指贷款发放后，银行及相关机构对借款人、贷款项目、担保人及资金用途进行的持续监控、检查、联系与风险处置活动。该环节涵盖定期联系、信息变更更新、还款计划调整、逾期收缴、财务报告索取、现场监管及风险监测等具体操作。\n\n在监管要求方面，国家开发银行助学贷款系统操作规程及市合作办相关规定明确，需对贷款项目及借款人进行现场监管，频度不低于1次/月，并涉及工程量与财务支出核对、技术工艺变化关注及投资概算控制。高校及经办银行需对贷款学生进行后续信息提供、催收及违约处理。\n\n在违规认定方面，多家银行及分支机构被指出在该环节存在“不到位”、“不尽职”或“有效性不足”的问题。具体案例包括：东营农村商业银行股份有限公司、恒丰银行股份有限公司洛阳分行、江苏银行股份有限公司镇江分行、浙商银行股份有限公司凉山分行等被认定贷后管理不到位或未尽职。相关责任人员如严子俊、李伟林、贾世豪等被认定负有责任，表现为走访不到位、资金用途监控缺失、对借款人违反合同约定行为未及时采取针对性措施等。\n\n上述管理缺失导致了多种不良后果，包括信贷资金被挪用、违规流入房地产市场或房地产领域。此外，该环节也是抵债资产处置责任认定中需分清责任的业务阶段之一。文件要求加强此信贷管理环节，以规范业务流程，确保资金安全与合规使用。"}, {"id": "中国人民银行总行", "label": "中国人民银行总行", "group": "ORGANIZATION", "value": 61, "title": "中国人民银行总行是中国人民银行的最高层级机构及总部，拥有货币政策决策权，负责制定货币政策。作为《中国人民银行政务依申请公开制度》的发布机关，其政务公开有关规定是制定相关责任追究办法的依据之一。在金银专项贷款管理方面，总行负责下达年度计划、组织大型项目评估，并指定为《中国人民银行金银专项贷款管理暂行规定》的解释、修改机构及各分行报送备案对象。\n\n在信贷与统计监管方面，总行负责确定计划配购总量、规定利率、批准贴现及统一印制融资券，并拥有细则解释修改权。其接收各金融机构、省级分行及计划单列市分行报送的统计报表、贷款分类结果、决算汇总报表及清查结果（如1998年7月30日前报送的清查结果）。总行有权对资料报送方式作出统一规定，并接收非上海本地法人金融机构评估结果，直接调控部分本地银行信贷投放。此外，总行负责核批中国农业发展银行总行上报的当月临时调剂贷款计划，制定农村信用社金融统计制度，并接收交通银行统计报表、制定现金收支统计报表、备案信贷收支统计报表。\n\n在机构审批与监管方面，总行负责批准设在北京的常驻代表机构迁移办公地址、接收其工作报告、批准撤销常驻代表机构，并对设在北京的机构直接监管，对其他地区机构授权监管。其受理管辖分行等机构统一申请的汇票专用章刻制，批准城市信用社更名，并负责外资金融机构变更机构名称、更换总经理（行长）及《条例》第三十五条第（一）、（二）款事项审批，对外资金融机构超过规定比例的资金拆借需求进行个案审批。总行还负责批准农村合作银行试点方案及城市合作银行筹建中涉及农村信用社问题，并负责审查处理中央管企业积压物资损失。\n\n在法规解释与行政事务方面，总行是《中国人民银行基本建设管理办法》及本办法的解释、修改机构，并接收管辖行备案实施细则。文中提及总行准备对《农村信用合作社财务管理实施办法》进行修改。总行是互联网站载体的所属机构，也是被转发文件的原始发文机关之一。在税务方面，总行被明确免征房产税、城镇土地使用税，该主体范围含国家外汇管理局。"}, {"id": "县联社", "label": "县联社", "group": "ORGANIZATION", "value": 61, "title": "县联社，即县级农村信用合作联社，是农村信用社体系中的县级联合组织或管理机构，具有总机构性质。其基本职能包括承担对基层信用社的管理、指导、协调与服务，负责接收通知并执行决算工作，清理核实统筹资金及固定资产，汇总上报会计报表，供应回收现金，开立活期存款户进行转汇，以及统一调配资金余缺。在业务经营方面，县联社负责审批数额较大的放款，可开办资金调剂市场，代企业发行股票、债券，并承担对信用社的行政管理职责及金融业务经营，其营业部为内设机构。\n\n在体制改革与定位上，县联社被要求由管理型机构向经营型机构转变，需尊重基层法人机构经营自主权。在过渡期内，其负责县以下农村信用社的日常管理，接受地（市）领导小组办公室的领导和管理。作为改革对象，县联社涉及人员冻结、财产完整、报表汇总等规定，需推进改革、清收不良贷款并提高资本充足率，文中提及需成立抵贷资产管理组织。其股权只能由农村信用社入股，河北省农村信用社联合社的组成单位之一，自愿入股省联社；甘肃省农村信用社体系中的县级联合社涉及拟申请专项票据的84家及不同法人形式的数量。\n\n在财务与资产管理方面，县联社允许向辖区内农村信用社提取管理费，接收信用社上缴的部分管理费，负责集中核销呆账贷款及分解呆账准备金金额。其财务管理与核算需按规定执行，作为清理收入和成本费用支出的组织单位，参与1999年度利润分配。在人事与行政事务上，县联社涉及人事调动决策及固定资产管理，接收划转的专职正、副主任及基层信用社工作人员，其财产与资金关系需处理。它是参与基层信用社规范验收工作组的人员来源机构，受限于参加研讨班、培训班及业务考察活动的规定。\n\n在具体实施与监管中，县联社是规范工作的对象之一，指农村信用合作社联合社。在太原市农村信用社体系中，作为县级分支机构，负责向市办事处申报创建成果并接受整改指令。在实施方案中，负责农村信用社资金汇划、现金供应及安全保卫工作。其领导和管理机构职能需加强以适应脱钩需要，可由人民银行或农业银行领导，也可进行其他模式试点。在“1422入股联社资金”科目中，县联社是农村信用社向其入股资金的接收方。"}, {"id": "贵银发〔2011〕50号", "label": "贵银发〔2011〕50号", "group": "REGULATION", "value": 61, "title": "贵银发〔2011〕50号是《中国人民银行贵阳中心支行、银监会贵州监管局、证监会贵州监管局、保监会贵州监管局关于印发进一步做好贵州省中小企业金融服务工作实施意见的通知》的文件文号。该文件由中国人民银行贵阳中心支行、银监会贵州监管局、证监会贵州监管局、保监会贵州监管局联合印发，发布日期为2011年3月15日。根据输入信息，该文件目前状态为现行有效。"}, {"id": "贵阳农村商业银行股份有限公司", "label": "贵阳农村商业银行股份有限公司", "group": "ORGANIZATION", "value": 61, "title": "贵阳农村商业银行股份有限公司（简称“贵阳农商银行”或“本行”）是由贵阳市南明区农村信用合作联社等四家机构新设合并发起设立的市级股份制农村商业银行。该主体是《贵阳农村商业银行股份有限公司主要职责内设机构和人员编制方案》所规定的被监管及被编制对象。\n\n在组织架构上，该银行包含总行、分支机构（文中亦提及支行）及内部部门等层级。相关方案对其主要职责、内设机构及人员编制进行了核定与规定。\n\n在监管处罚方面，贵阳农村商业银行股份有限公司总行作为被处罚机构，因相关违规行为被处以罚款60万元。该处罚涉及时任风险总监陈遵球所属机构。\n\n上述信息均源自提供的描述列表，其中关于机构性质、层级结构及处罚事实的描述相互印证，无冲突信息。"}, {"id": "中华人民共和国外资银行管理条例实施细则", "label": "中华人民共和国外资银行管理条例实施细则", "group": "REGULATION", "value": 60, "title": "《中华人民共和国外资银行管理条例实施细则》由中国银行业监督管理委员会于2006年11月24日公布，文号为中国银行业监督管理委员会令2006年第6号，自2006年12月11日起施行。该细则依据《中华人民共和国银行业监督管理法》、《中华人民共和国商业银行法》和《中华人民共和国外资银行管理条例》制定。\n\n在监管实践中，该细则曾作为多项行政许可的法规依据。具体包括：批准三菱东京日联银行(中国)有限公司等机构开业及颁发许可证；批准分行开业及颁发许可证；核准相关人员任职资格；批准筹建及后续开业申请；以及批准开业及业务范围。此外，该细则也曾作为开业验收的依据。\n\n关于其效力状态，输入信息中存在不同表述。部分记录指出其为“现行细则”，并拟在新细则施行时废止；另有记录明确其目前状态为“失效/废止”。同时，有信息提及该细则是被修改的基础法规，文中涉及原第三十二条、第三十五条、第五十五条、第五十六条等条款，但原文未提供具体修改文号及发布日期。鉴于不同来源对“现行”与“失效”状态的描述存在差异，且未提供新细则的具体施行时间以裁决冲突，此处并列说明：该细则曾长期作为外资银行监管的核心依据，但在后续监管文件中被提及为拟修改或已失效的法规。"}, {"id": "广安农村商业银行筹备工作领导小组", "label": "广安农村商业银行筹备工作领导小组", "group": "ORGANIZATION", "value": 60, "title": "由广安市人民政府决定成立的领导小组，负责统筹协调广安区信用联社改制组建广安农村商业银行股份有限公司相关工作"}, {"id": "上海", "label": "上海", "group": "GEO", "value": 59, "title": "上海是文中提及的多个金融监管、政策试点及业务发生的核心地域。在监管辖区方面，上海是国家金融监督管理总局上海监管局（原上海银监局）的监管辖区，涵盖辖内外资银行、法人金融机构、部分外资证券公司及投资银行代表机构。该区域也是渣打银行（中国）有限公司上海分行及其浦西、虹桥支行的营业地址所在地，以及中国长城资产管理股份有限公司上海市分公司的所在地。上海外资银行工作座谈会在此举办，涉及外资银行人民币业务客户对象原限定区域及主要经营地域。\n\n在政策试点与金融改革方面，上海是中小企业信用体系建设试点地区之一，也是企业信用信息基础数据库于2005年12月15日实现联网试运行并提供实时查询服务的地区之一。此外，上海被列为国家安居工程试点城市之一，已实现县域全覆盖，并作为新增的金融体制改革试点城市之一。文中提及上海作为构建国际金融中心的战略城市，是金融业发达地区，省内大企业发起设立的基金公司多设于此，并作为借鉴组建地方金融控股集团经验的省市之一。\n\n在数据报送与统计要求上，根据2013年末数据报送通知，上海作为直辖市，需按经济普查要求增加报送区、县级数据。在资金切块方面，上海的特种存款由上海市分行营业部交存至总行上海营业处。\n\n在机构设立与地理关联上，上海是东吴证券设立总部的地点。地理上，上海是苏州市东临的城市。在金融合作层面，上海被提及为全国性金融中心，用于省外开放与合作。\n\n在考核与评估适用范围内，相关考核办法及评估办法适用于上海市，涉及上海本地法人金融机构及上海本地业务。文中多次提及“上海辖内”、“在沪”等表述，明确其作为通知适用地域范围及业务发生地的地位。上述描述综合了不同时间点的监管要求、试点政策及机构分布情况，保留了各文件对上海作为特定行政辖区、监管对象所在地及政策实施区域的界定。"}, {"id": "人民币业务", "label": "人民币业务", "group": "BUSINESS", "value": 59, "title": "“人民币业务”指依据《条例》第三十一条及相关规定，由外资银行营业性机构（包括外国银行分行、外商独资银行等）经营的银行业务。该业务涵盖吸收公众存款、发放贷款、办理票据承兑与贴现、结算、担保、国债及金融债券投资等具体项目。\n\n在经营条件与监管要求方面，外国银行分行经营该业务需满足特定营运资金要求。外资银行营业性机构申请经营或扩大业务范围、服务对象范围，需满足开业1年以上等条件及审慎性条件，并经中国银监会或其派出机构审批。初次申请需具备相应资质，经总行授权，并向所在地银保监会派出机构提交说明，完成筹备、验资及监管验收合格后方可开展。\n\n在适用对象与客户范围上，该业务存在显著差异，需并列说明：\n1. **对除中国境内公民以外客户**：中信嘉华银行(中国)有限公司北京分行、新韩银行（中国）有限公司、法国兴业银行(中国)有限公司、恒生银行有限公司深圳分行、珠海分行等获准或批准经营此类业务。服务对象通常限定为外商投资企业、外国驻华机构、港澳台在内地代表机构、外国人及港澳台同胞。部分机构如珠海分行需完成增资手续后方可经营。\n2. **对中国境内公民**：指经总行授权及当地银监局验收合格后开展的业务。例如，渣打银行（中国）有限公司分行在经总行授权并经四川银监局验收合格后，可经营对境内公民的业务。文中提及青岛和济南已先后开放此类业务类型。\n3. **混合或特定非外商投资企业客户**：部分获批业务范围包括对外商投资企业、外国驻华机构、港澳台在内地代表机构、外国人及港澳台同胞以及非外商投资企业开展的存款、贷款、结算等业务。例如，香港上海汇丰银行有限公司青岛分行在增拨营运资金后，依据《实施细则》第三十五条规定，对外商投资企业、非外商投资企业等客户经营该业务范围。\n\n此外，外资金融机构在深圳经济特区试办的业务也属于此类，包括存款、贷款、结算、担保、国债和金融债券投资等，受限于特定客户群体和条件。所有业务开展均需严格遵循发文机关规定的审批流程、资金要求及客户对象限制，不同机构、不同分支行及不同处罚案或审批案的具体条件与范围存在差异，不得强行合并。"}, {"id": "农村信用社改革试点", "label": "农村信用社改革试点", "group": "BUSINESS", "value": 59, "title": "“农村信用社改革试点”指经国务院批准，在吉林、山东、广东、甘肃、云南等省（市）及广州市层面开展的深化农村信用社管理体制、产权制度、法人治理结构及经营机制转换的特定监管与业务调整项目。该试点涵盖清产核资、增资扩股、统一法人体制、专项中央银行票据发行、机构重组及风险化解等内容。\n\n具体实施情况如下：\n1. **山东省**：根据国务院批准进行试点，涉及管理体制、产权制度及内部机制改革。\n2. **广东省**：省内进行体制改革试点，包括清产核资、增资扩股、统一法人体制等；广州市政府决定加强该金融改革工作，涉及实施方案制定及风险化解。\n3. **云南省**：实施深化改革的具体监管与业务调整，涵盖政策落实、风险防范及机构重组；具体试点工作涉及清产核资、增资扩股、专项中央银行票据发行等。\n4. **甘肃省**：实施深化农村信用社改革的具体试点项目。\n5. **其他省份**：在吉林等8省（市）开展深化管理体制和产权制度改革的具体业务活动。\n\n该领域涉及省、市层面实施的改革试点方案及相关政策规定，旨在加强领导并推进全省深化农村信用社改革试点工作。各试点地区依据各自实施方案，针对适用对象执行相应的监管要求与业务调整。"}, {"id": "内府办发〔2007〕7号", "label": "内府办发〔2007〕7号", "group": "REGULATION", "value": 59, "title": "内府办发〔2007〕7号是内江市人民政府办公室于2007年1月29日发布的批转通知。该文件标题为《内江市人民政府办公室批转中国人民银行内江市中心支行〈关于金融支持社会主义新农村建设的指导意见〉的通知》。发文机关为内江市人民政府办公室，被批转文件的制定主体为中国人民银行内江市中心支行。文件内容涉及金融支持社会主义新农村建设的相关指导意见。根据输入信息，该文件目前状态为现行有效。所有描述均指向同一份文件，在发文机关、发布日期（2007年1月29日）、文件标题及效力状态上保持一致，无冲突信息。"}, {"id": "中国人民银行日常涉外交往管理规定", "label": "中国人民银行日常涉外交往管理规定", "group": "REGULATION", "value": 58, "title": "《中国人民银行日常涉外交往管理规定》（银发〔1997〕91号）由中国人民银行于1997年3月17日发布并生效，目前状态为失效/废止。该规定旨在规范中国人民银行日常涉外交往行为，具体涵盖会见、会谈、迎送礼遇、接待工作、外事宣传及财务管理等方面。根据描述，该规定由中国人民银行总行国际司负责解释。"}, {"id": "财政部门", "label": "财政部门", "group": "ORGANIZATION", "value": 57, "title": "“财政部门”在文中泛指各级财政厅（局），包括各县（市、区）财政局、市属开发区财政局及地方或中央财政管理机构。作为政府职能部门，其核心职责涵盖预算管理与资金监管：负责将贷款本息、偿债资金及政策性补贴列入财政预算，审核用款计划、项目采购清单及工程概预算决算；对贷款资金专户实施监督管理，审核资金使用申请，并负责财政评审。在资金拨付与补贴方面，该部门负责按规定及时足额拨补费用、利息补贴、政策性亏损挂账及各项补贴款，落实再就业小额贷款担保资金，通过惠农卡发放粮食直补等财政补贴，并预拨专项补贴资金用于贷款风险保证金。\n\n在金融业务配合与监管方面，财政部门与经贸主管部门共同接收担保机构报送的统计及财务报表；参与贷款会审、制定中小企业信用基本制度及增加地方财政资金投入；与农村信用社密切配合，参与其接收、处置抵债资产过程中的费用减免执行，指导信用社建立内部财务管理制度、会计核算办法，落实不良资产清收及保值储蓄贴补等优惠政策，并协调税收优惠事宜。此外，该部门负责指定商业银行、签订协议、审核代偿，对还贷风险准备金进行监查，并参与改革配合工作。\n\n针对特定领域与问题处理，财政部门负责审核确认项目采购清单，掌握贷款资金使用情况；对不积极制定偿还计划的行政事业单位采取限制费用、限制拨款等“两限一查”措施，并负责组织协调行政事业单位拖欠农村信用社贷款清收工作。在棚户区住房改造项目中，负责全过程财政评审及贷款资金专户监管。对于企业困难，文中提及可商请其解决，若出资偿还欠租需向企业收回，困难时可作为国家资本金处理。在简易建仓贷款流程中，负责提供贴息意见；在街道（乡镇）社会保障事务所接受其指导，并在借款人情况变化时通知停止贴息。\n\n此外，财政部门是联席会议成员单位之一，被督促及时拨补政策性补贴；在受灾群众身份信息采集等前期准备工作中，由中国人民银行分支机构组织并协调其启动相关工作。在通化市及下辖县（区），该部门负责承担并拨付政策性粮食财务挂帐利息。作为委托投资或贷款的信托资金提供方之一，其参与制定出让金支付标准相关规定，并负责确定申请人具体条件及督促简化贷款手续。"}, {"id": "国务院银行业监督管理机构", "label": "国务院银行业监督管理机构", "group": "ORGANIZATION", "value": 56, "title": "“国务院银行业监督管理机构”在相关条例及文件中指代中国银监会（及其派出机构）。该机构是负责外资银行及外国银行代表处全面监督管理的法定主体，其职权涵盖市场准入、日常监管及行政处罚等多个方面。\n\n在市场准入与审批方面，该机构负责审查并批准外资银行及其分支机构、代表处的设立、筹建、开业申请，以及变更、终止、改制等事项。其有权接收申请资料，作出批准或不批准决定，并颁发金融许可证。此外，该机构负责核准相关人员的任职资格，批准外资银行的业务范围及经营人民币业务的具体条件。在资本要求上，该机构有权规定外资银行及外国银行的资本充足率标准，可根据需要提高注册资本或营运资金的最低限额，并规定资产负债比例达标的期限。\n\n在日常监管与风险控制方面，该机构对外资银行及其活动实施持续监督管理，包括实行合并监管、规定报送和报告要求。当发现违规行为或风险时，该机构有权采取责令改正、要求提高资本充足率或比例、采取特别监管措施等行政手段。\n\n在行政处罚方面，该机构依法对外资银行及外国银行代表处实施监管措施，包括罚款、吊销许可证、撤销等。\n\n上述描述综合了《条例》中关于监管机构定义、外资银行监管措施、资本充足率规定、设立审批流程及行政处罚权限等多处条款内容。所有职能均基于输入文本中提及的监管职责，未添加外部法律解释或事实。"}, {"id": "中国人民银行关于开展中小企业信用体系建设试点工作的通知", "label": "中国人民银行关于开展中小企业信用体系建设试点工作的通知", "group": "REGULATION", "value": 56, "title": "《中国人民银行关于开展中小企业信用体系建设试点工作的通知》（银发〔2006〕257号）由中国人民银行于2006年7月18日发布并生效。该文件旨在指导商业银行利用企业信用信息基础数据库，开展中小企业信用信息服务及金融产品创新，以推进中小企业信用体系建设。通知具体规定了信息征集、报送及信息服务的相关要求。目前，该文件状态为失效或废止。在相关监管意见的制定依据中，该通知曾作为依据之一被引用。"}, {"id": "中国银行业监督管理委员会上海监管局", "label": "中国银行业监督管理委员会上海监管局", "group": "ORGANIZATION", "value": 55, "title": "中国银行业监督管理委员会上海监管局（简称上海银监局或银监局）是原负责上海市银行业监管的机构，原文多处标注该机构状态为“已撤销”。作为发文机关，其职责涵盖商业银行、农村信用社及在沪外资银行的监管与考核。\n\n在商业银行监管方面，该局负责印发《上海商业银行客户投诉处理指导意见》，并负责解释该意见、对商业银行进行评估检查，同时指导同业公会开展自律工作。此外，该局负责加强国有商业银行上海市分行不良资产监测和考核，并查处违规垫资验资等行为。\n\n在农村信用社监管方面，该局负责上海市农村信用社贷款五级分类试点工作的监管与考核，发布相关推进通知，并审查农信社申请开办的中间业务。\n\n在在沪外资银行监管方面，该局负责对外资银行进行监管、发布通报及开展飞行检查。具体工作包括对外资银行信贷业务进行现场检查并通报情况，开展在沪外资银行专项风险排查，以及负责在沪外资银行信贷管理现场检查并作出通报。\n\n在文件发布与行政事务方面，该局是沪银监办通〔2010〕7号文件的落款单位，负责转发银监会办公厅通知。作为多个监管文件的发文机关之一，其发布的文件涉及上述各类监管事项。所有描述均基于输入信息，未添加外部事实，且明确保留了“已撤销”的状态标注及具体职责范围。"}, {"id": "外汇业务", "label": "外汇业务", "group": "BUSINESS", "value": 54, "title": "“外汇业务”指银行及信托投资公司依据《条例》第三十一条、《实施细则》第二十五条及第三十五条等规定，在完成法定手续后，对各类客户开展的外币存款、贷款、结算、兑换、买卖外汇、同业拆借、银行卡业务、票据承兑与贴现、信用证服务、保管箱、资信调查及咨询等具体银行业务。\n\n**适用对象与业务范围**\n该业务涵盖对境外机构、外商投资企业及非外商投资企业等特定对象的经营。不同机构获批范围存在差异：\n1. **外国银行分行**：如恒生银行上海/深圳分行、泰国盘谷银行上海分行、英国苏格兰皇家银行北京分行、中信嘉华银行北京分行、新韩银行（中国）有限公司、星展银行深圳分行、新联商业银行重庆分行、香港上海汇丰银行青岛分行等，在满足营运资金要求（不少于2亿元人民币或等值自由兑换货币）并完成增资及法定手续后，获准在《实施细则》规定范围内对各类客户经营外汇业务。\n2. **中资及合作金融机构**：包括城市商业银行、城市信用社股份有限公司、县联社及部分农村信用社县(市、区)联合社。其开办或增加外汇业务品种需符合审慎性条件，涉及风险防范、成本收益预测、人员配备、支持系统及实施方案。若已开办，需在文件和章程中说明并提供批复文件复印件；经书面确认后方可正式办理。\n\n**监管要求与条件**\n1. **资本金要求**：银行及信托投资公司经营外汇业务时，其最低实收货币资本金中需包含一定比例的外汇现汇。\n2. **审批与许可**：涉及开办及增加业务品种的许可，需符合特定审慎性条件。银监函〔2004〕158号提及，在完成法定手续后根据《实施细则》第三十五条规定可经营各类客户业务。\n3. **报告义务**：有外汇业务的省、自治区、直辖市须上报相关报表。\n\n**冲突与差异说明**\n不同分行（如深圳分行、珠海分行、北京分行等）在增资完成或完成法定手续后，依据《实施细则》第三十五条规定，对各类客户经营的外汇业务范围略有不同，部分明确包括吸收公众存款、发放贷款、买卖有价证券、代理保险等，部分仅概括为“各类客户外汇业务”。上述描述基于各机构获批文件及监管规定，未强行合并不同分支行的具体业务细节，保留各来源关于营运资金、适用对象及具体业务类型的差异。"}, {"id": "信托投资公司", "label": "信托投资公司", "group": "ORGANIZATION", "value": 54, "title": "信托投资公司是指在中华人民共和国境内依法设立的非银行金融机构，属于中小金融机构序列，也是全金融机构体系的重要组成部分。作为受监管主体，其资本金、审批权限、人员比例及业务限制需符合特定验收标准，并受拆借限额、业务范围及资金信托业务的约束。\n\n在业务经营方面，该类机构可跨地区对联合组织发放委托贷款和投资，或代理发行、承购包销经济联合组织债券；经营长期信用的经批准可办理债券股票承购包销业务。文中提及需发挥其专业优势，积极了解市场和企业实际融资需求，并规范其管理行为。在防范和化解金融风险中，信托投资公司被视为重要主体，其违反国家有关规定发放的用于固定资产项目的委托贷款属于稽核内容。此外，文中提及清理整顿乱办金融机构及信托投资公司，属于被监管或整顿的机构类型，曾因发展过快被要求停止新建。规划中提及需促进其快速发展，目标为2010年业务总规模达750亿元。\n\n在监管与评估体系上，信托投资公司需由法人统一向银监会申请开办衍生产品交易业务。它是货币信贷政策导向效果评估的对象，需参加宏观审慎货币政策、利率政策、中小企业信贷政策、房地产信贷政策、可持续发展信贷政策、信贷政策传导与反馈机制建设等模块评估，至少参加25个指标。该机构参照执行《商业银行内部控制指引(征求意见稿)》。在统计与数据报送方面，它是银行及其他金融业普查对象之一，作为法人单位需报送市级及以上汇总数据及法人数据，以及地市级及以上人民币、外汇、本外币汇总数据的季度损益表。\n\n在文件适用与流转中，信托投资公司是银发[2010]195号通知中列明的检查对象类别，也是银发〔2008〕321号通知要求转发至的辖区内金融机构类别。它属于通知要求接收并执行统计制度的金融机构类型，以及通报主送及转发对象之一。需注意，信托投资公司属于非农村信用社序列金融机构，不得强行并入农村信用社报表。上述描述基于输入信息合并，未添加外部知识，冲突信息已按来源并列说明。"}, {"id": "地方政府", "label": "地方政府", "group": "ORGANIZATION", "value": 54, "title": "“地方政府”指各级省、自治区、直辖市、计划单列市及县（市）级行政主体，在金融监管与业务协作中承担多重角色。\n\n**一、 风险处置与机构改革**\n作为城市信用社市场退出工作的责任主体，负责组建部分城市信用社、同意更名方案并落实弥补损失资金；负责处置清产核资后新发现的资产负债。在农村信用社改革中，负责统一领导收购工作，帮助制定实施改革规划，通过资金扶持、土地置换等办法解决困难，支持增资扩股并影响分红比例确定，同时需维护经营自主权。在改制企业资格确认及承贷主体确定中起牵头和督促作用。\n\n**二、 政策制定与资金支持**\n负责制定差旅费标准供参照，出台奖励政策（规定亏损信用社不得享受）。作为项目筹资主体和偿债责任承担方，需与开发银行密切配合，负责支付中方配套资金和偿还外资贷款。向中央申请专项借款时，需经金融稳定局受理、货币政策司复核并报国务院批准。负责批准成立新的担保机构，并向担保机构全额支付担保费。\n\n**三、 协调配合与沟通机制**\n与人民银行及其分支机构建立沟通协调机制，配合制定节能环保领域金融服务政策，为改进金融支持工作创造良好氛围。在扶贫贷款债务转移、项目转移及收贷收息过程中提供协助和支持。接收乡镇企业及“十五小”企业贷款债权反映，需提供政策支持。协调推动增加对中小企业扶持，支持中小企业信用体系建设，参与由人民银行分支机构牵头的领导小组。在新兴农村合作医疗试点中需沟通协调。\n\n**四、 特定事项与限制**\n在突发事件（如抗洪救灾）中负责统一规划灾后恢复生产，金融机构需与其联系配合。负责组建部分城市信用社的主体需同意更名方案。在设立股份制商业银行法人机构时，不得向银行投资入股或干预日常经营。指代相关行政管理部门时，被要求不得干预法院审理。文中提及因驻地迁移导致必须异地新建相关用房的主体，以及攀枝花市商业银行异地分行所在地的政府，需给予支持。\n\n**五、 信息通报与违规干预**\n作为金融形势分析报告抄报、贷款质量通报及情况通报的接收对象。在部分案例中，其要求导致少数人民银行分支行强行扣款，属于违法干预金融工作的行为来源。在牡丹江等地，负责完善诚信体系建设，与银行业实现良性互动。"}, {"id": "农业发展银行", "label": "农业发展银行", "group": "ORGANIZATION", "value": 54, "title": "中国农业发展银行（简称“农业发展银行”）是文中提及的政策性金融机构，作为被监管及指导对象，其职能与业务要求涵盖多个方面。\n\n在粮食流通领域，该行是政策性收购资金唯一允许开立账户的银行机构，负责粮棉油收购资金的封闭运行管理、供应及管理工作。文中要求其配合粮食流通体制改革，完善管理体制，调整贷款对象，延伸粮棉油产业链信贷支持，并支持合法粮棉购销业务。在“三秋”生产及秋季收购中，该行被要求从战略和全局角度提供支持，转变经营思路，确保资金供应。\n\n在信贷业务与政策执行方面，该行需继续执行贷款上限政策，在特定条件下可停止发放贷款。其被要求扩大信贷支持面，拓宽支农信贷资金渠道，重点增加对农村基础设施等需要政策扶持项目的贷款发放，支持特色农业发展，并利用国家政策对农业产业化企业发放贷款。此外，该行需在风险可控前提下，积极开展水利建设中长期政策性贷款业务，发挥政策性金融功能并拓展开发性金融业务。规划中提及该行需调整职能，加大政策性支农力度。\n\n在机构关系与统计制度方面，该行与农业银行存在代理业务关系，作为被代理业务的委托方及政策性银行，与农业银行签署代理业务协议，并对代理业务工作进行监督、检查、指导。在人民银行信贷收支统计制度中，该行涉及存款、缴存准备金及贷款统计项目，是人民银行贷款累放、累收统计制度中新增的统计项目对象。文中提及的“当地分支机构”指代该行受理企业申请并进行共同审查的具体执行单位。\n\n在监管与考核指标方面，该行是指导意见中明确的责任主体。在2010年增贷指导任务中，作为市级银行业金融机构之一，其增量确保数为4亿元，争取数为6亿元。同时，该行在相关办法、细则及规定中，被明确排除在“其他金融机构”的定义及奖励对象范围之外。"}, {"id": "县域金融机构", "label": "县域金融机构", "group": "ORGANIZATION", "value": 54, "title": "县域金融机构是涉农贷款增量奖励政策的核心适用对象及资金申请主体。其范围涵盖县域内具有法人资格的金融机构（如农村合作金融机构、新型农村金融机构）以及其他金融机构在县域内设立的分支机构。该群体明确不包括农业发展银行。\n\n作为政策实施主体，县域金融机构需开展涉农贷款业务，并严格按照规定口径核算、统计和填报涉农贷款发放情况及季度平均余额。机构有义务如实上报相关数据，接受监督检查，并按年度向县级财政部门报送奖励资金申请及相关材料。部分描述提及该群体需提高存贷款比例，稳定存贷比在50%左右。\n\n在职责履行方面，县域金融机构需计算涉农贷款增量，依据细则规定向县级财政部门申请奖励资金。不同来源的描述在细节上略有差异：部分文件强调其作为“参与试点的金融机构群体”需报送申请；另有文件指出其包括“在县域开展业务的金融机构及其县级分支机构”。所有描述均一致确认其需履行数据报送义务，且适用对象均指向县域范围内的法人机构及分支机构，排除农业发展银行。"}, {"id": "中国人民银行太原中心支行关于积极扩大直接融资全力支持山西经济转型跨越发展的指导意见", "label": "中国人民银行太原中心支行关于积极扩大直接融资全力支持山西经济转型跨越发展的指导意见", "group": "REGULATION", "value": 54, "title": "该文件为《中国人民银行太原中心支行关于积极扩大直接融资全力支持山西经济转型跨越发展的指导意见》，由中国人民银行太原中心支行于2011年4月29日发布。文件旨在通过积极扩大直接融资规模，全力支持山西经济转型跨越发展。根据输入信息，该文件目前处于现行有效状态。"}, {"id": "长安银行", "label": "长安银行", "group": "ORGANIZATION", "value": 54, "title": "长安银行是陕西省地方股份制商业银行，总行设在西安高新区。该银行由原五家城商行、城信社基础上组建而成，定位为服务中小企业和非公有制经济。\n\n在监管与业务要求方面，长安银行被要求研究高新技术企业金融需求，加强陕北及关中-天水经济区的金融服务。同时，作为陕西省内商业银行，其被要求加强风险管控、规范管理及风险防控，提升服务效率，并加强党建工作。\n\n在会议与时间信息方面，文中提及长安银行于2010年2月1日召开年度工作会议，该会议为讨论主体。上述关于风险管控、金融服务及党建的要求均出自相关讲话或会议内容，针对该银行作为被讲话对象或会议主体的身份提出。\n\n注：输入描述中关于“由五家重组机构组建”与“由原五家城商行、城信社基础上组建”表述一致，均指其组建背景；关于“陕西省地方性商业银行”与“陕西省地方股份制商业银行”表述一致，均指其机构性质。所有要求均基于输入文本中提及的讲话或会议场景，未提供具体文件文号、发文机关及具体金额比例数据。"}, {"id": "中国人民银行上海分行", "label": "中国人民银行上海分行", "group": "ORGANIZATION", "value": 53, "title": "中国人民银行上海分行（文中亦称“人民银行上海市分行”或“中国人民银行上海市分行”，指代同一机构）是上海地区重要的金融监管机构。该机构作为发文机关，负责制定、印发并解释多项地方性金融监管文件与办法。\n\n在金融统计与考核方面，该机构是《上海市中小金融机构法人和外资银行主报告行金融统计业务考核办法》的印发机关、考核主体、数据接收方及解释部门。同时，其负责转发通知并组织本辖区（上海地区）的金融统计执法检查，承担组织领导职责。\n\n在货币信贷政策评估方面，该机构是《上海市银行业金融机构货币信贷政策导向效果评估暂行办法》的制定机关、解释机关、发布机关及发文机关，负责该办法的印发及评估工作的组织与协调。\n\n在信贷指引与系统管理方面，该机构是《上海市信贷投向指引(2008年修订)》的印发机关，负责通知各金融机构执行。此外，其作为发文机关，负责向上海市非接口金融机构下发通知，印发《非接口行报文生成子系统(MBT)升级版》和《批量删除功能使用要求》等系统升级文件。\n\n在特定业务管理与其他监管职责方面，该机构是《关于修订〈中国人民银行上海分行场外融资电子备案管理暂行办法〉及有关事宜的通知》的发文机关。作为联合发文机关之一，其参与发布了《上海市高等学校毕业生国家助学贷款代偿资助暂行办法》。该机构还负责督促银行履行反洗钱义务，并查处违反人民币银行结算账户管理规定的行为。\n\n在文件流转与行政关系中，该机构既是部分文件的发文机关，也是其他文件的接收对象或受文单位。例如，它是“银发〔2004〕4号”通知的受文单位之一，也是某复函的接收方。此外，其发布了“上海银发〔2010〕138号”通知。\n\n注：输入描述中提及的“中国人民银行上海分行”与“人民银行上海市分行”在文中被明确指代为同一机构，故予以合并。所有描述均基于输入列表，未添加外部事实。"}, {"id": "财政贴息", "label": "财政贴息", "group": "BUSINESS", "value": 53, "title": "“财政贴息”是指各级财政部门依据相关监管制度，对特定贷款利息给予补贴的财政资金支持政策。该机制主要适用于小额担保贷款、康复扶贫贷款、国家助学贷款、简易建仓贷款、农业产业化项目贷款及符合规定的小企业贷款等对象。\n\n在适用条件与补贴比例方面，政策根据借款人身份、项目性质及贷款次数实行差异化补贴。对于从事微利项目的小额担保贷款，通常实行全额贴息或据实全额贴息；非微利项目或特定情形下，可能实行50%或25%的比例贴息，部分情况下不予贴息。国家助学贷款利息补贴覆盖贷款利息的50%。补贴计算按实际借款额度和计息期限执行，贷款展期和逾期期间通常不享受贴息。\n\n在资金分担与管理流程上，涉及中央、自治区、市级及地县财政按比例分担。例如，微利项目由市财政向上级申请，非微利项目利息由市财政承担。具体执行需遵循特定文件规定，如粤财社[2003]129号文和广州银发[2004]26号文。管理流程包括“先付后贴”办法，以及经县级部门核准、省残联审核后由财政厅拨付等程序。文中规定了统计、通知及划转流程，各分行收到后需及时录入系统。\n\n该政策不包含奖补资金。天津市财政局需加强监督检查，确保政策落到实处。财政部门对小额担保贷款经营项目、康复扶贫贷款及简易建仓贷款提供利息补贴，是贷款展期及利息收回的重要条件。不同来源文件对补贴比例和承担主体有具体规定，如全额、50%或25%补贴，需依据借款人身份及项目性质确定。"}, {"id": "扶贫贷款", "label": "扶贫贷款", "group": "BUSINESS", "value": 53, "title": "扶贫贷款是一种政策性很强的特定信贷业务，旨在促进贫困地区商品经济发展、支持解决农村贫困人口温饱问题及群众脱贫致富。该业务主要由中国农业发展银行依据相关管理办法进行管理和发放，同时也涉及省农业银行等机构投放的专项贷款。扶贫贷款区别于财政扶贫，是一种有偿有息的新扶贫方式，具有特定的投向限制、担保要求和风险管理规定。\n\n在业务分类与核算方面，扶贫贷款分为扶贫贴息贷款和扶贫非贴息贷款，用于支持扶贫开发任务。它属于开发性贷款科目核算的具体贷款品种，纳入划转范围。文中提及该业务需积极支持农村信用社办理，并需加强管理、提高使用效益，解决“一化两低”问题，探索小额贷款方式。\n\n在管理方式上，扶贫贷款实行“核定额度、随用随借、专款专用、封闭运行”的原则。中国农业发展银行针对国定贫困县及贫困户、企业发放此类专项贷款，涉及受理、评估、审批、合同、登记、监督、收回及分析等全流程管理，具体涵盖限额、核算、存量、风险、档案、审批及监督等环节。\n\n关于利率与违约处理，扶贫贷款作为特定类型的农业贷款，逾期后除违约违规外不加收利息。其监管要求涉及贷款范围、用途、对象、期限、利率及监督制裁等方面，包括贷款发放、本息回收、展期及呆账核销等具体规定。\n\n在与其他贷款的关系上，扶贫贷款是小额担保贷款申请人及其家庭成员不应有的商业银行贷款类型之一（存在例外情况）。\n\n在数据方面，文中提及省农业银行投放的用于支持贫困地区发展的扶贫贷款，累计投放25.7亿元，余额24.1亿元。\n\n注：上述描述基于输入信息合并，不同来源对管理主体（如中国农业发展银行与省农业银行）及具体管理细节的描述并列呈现，未对冲突信息进行裁决。"}, {"id": "不良贷款", "label": "不良贷款", "group": "BUSINESS", "value": 53, "title": "“不良贷款”在银行监管语境中，指风险状况较高、需严密监控并重新审查借款合同执行及担保情况的信贷资产。根据贷款风险分类标准，其通常包括次级、可疑和损失三类贷款，或涵盖逾期贷款、呆滞贷款和呆账贷款。具体构成涉及企业改制形成、村集体形成、行政部门协调承贷担保形成、公职人员借款担保形成，以及2006年12月31日前形成的集体农业生产、乡镇企业、“五小”企业等各类逾期或风险贷款。\n\n在主体与适用范围上，该概念广泛适用于商业银行、农村信用社、农合行、金融资产管理公司及外资银行等金融机构。对于农村信用社和农合行，不良贷款是核心业务对象及资产质量指标，涉及清收、接收、处置及专项中央银行票据置换。部分文件指出，此类贷款需通过财政资金划拨、优质固定资产置换、盘活集体资产、承包经营权置换或委托信用公司代理处置等方式化解。在社团贷款中，代理社需根据会议决定进行管理、清收或处置。\n\n在监管要求与风险管理方面，金融机构需对不良贷款实行按月分析和监测，形成分析报告，并强化对信贷资产质量的监测，坚决防止反弹。监管要求披露风险分类方法、期初数、比例、调增调减数及期末数。针对西藏等特定地区，要求严格控制新增数量。农村合作银行需制定逐年下降计划及新增控制指标。方案设定了2006年末占比目标（15.5%以下）。此外，不良贷款也是风险评级体系定性因素的考察对象，涉及总量、比率及变动趋势对银行资产安全状况的影响。\n\n在数据与历史表现方面，文中提及多项具体指标：2000年农村信用社不良贷款率比上年下降2个百分点，2001年1-4月比年初下降3个百分点；2003年末某农村信用社不良贷款余额70.5亿元，占比21.8%；2004年末全省主要银行业机构不良贷款余额全国排名第三，当年余额减少513亿元，其中政策性剥离占比95.11%。金融资产管理公司从国有独资商业银行购入的不良贷款资产（含本金和表内利息）是统计购入贷款净额、待处置贷款等指标的基础。部分文件指出，不良贷款存在通过借新还旧掩盖的现象，且是信贷扶贫工作中占比高且难以收回的问题之一。"}, {"id": "贷款风险分类", "label": "贷款风险分类", "group": "BUSINESS", "value": 53, "title": "贷款风险分类是商业银行及农村信用社等金融机构依据《贷款风险分类指导原则》和《贷款通则》等规定，对贷款质量进行评级和划分的核心监管制度。该制度以评估借款人还款能力为核心，从还款可能性出发，综合考虑借款人财务状况、还款意愿、法律责任、银行信贷管理、贷款担保等因素，将贷款划分为正常、关注、次级、可疑、损失等不同档次。其目的是逐笔确定贷款的真实价值，准确反映贷款风险程度，是判定贷款质量的基础。\n\n在业务执行上，该分类适用于《贷款通则》确定的各类贷款及表外项目中的直接信用替代项目，其他授信项目可参照使用。商业银行需遵循内部控制原则，至少每半年进行一次风险分类。对于中资商业银行申请募集债务资本补充工具的情形，需保证分类结果真实准确。农村信用社亦逐步推行此信贷风险管理新方法。\n\n在监管合规与处罚案例方面，贷款风险分类的准确性是重要的监管指标。若存在分类不准确、不实行为或未按规定执行的情况，将被视为违反监管要求。具体案例包括：海伦市农村信用合作联社因存在分类不准确问题被处罚；西电集团财务有限责任公司及其责任人马骏、胡晓蔚因涉及业务管理环节存在分类不准确问题被处罚。这些案例表明，贷款风险分类不仅是内部风险管理工具，也是监管机构检查银行业务真实性、合规性的关键环节，金融机构必须确保分类结果的真实、准确与合规。"}], "edges": [{"source": "商业银行", "target": "银行", "description": "商业银行是文中提及的银行的具体类型"}, {"source": "各金融机构", "target": "中小企业", "description": "各金融机构被要求将信贷资金侧重投入中小企业，并建立相应的评级授信制度。同时，金融机构需根据中小企业的实际需要提供服务，以满足其合理的资金需求。上述要求旨在引导金融机构优化信贷结构，加强对中小企业的金融支持，确保信贷资源向该领域倾斜，并通过制度化的评级授信机制提升服务精准度与风险管控能力。"}, {"source": "中共甘肃省委、甘肃省人民政府关于加快个体私营企业技术升级实现跨越式发展的指导意见", "target": "信用社", "description": "要求信用社打破所有制界限，为个体私营企业技术升级提供信贷支持与服务"}, {"source": "中共甘肃省委、甘肃省人民政府关于加快个体私营企业技术升级实现跨越式发展的指导意见", "target": "商业银行", "description": "要求商业银行打破所有制界限，为个体私营企业技术升级提供信贷支持与服务"}, {"source": "《辽宁老工业基地振兴规划》", "target": "城市商业银行", "description": "规划提出加快其整顿、规范和改革步伐"}, {"source": "城市商业银行", "target": "资本充足率", "description": "城市商业银行的资本充足率相关规划要求如下：\n\n1. **总体目标**：规划明确要求提高城市商业银行的资本充足率。\n2. **具体指标**：规划设定了具体的量化标准，要求到2010年，城市商业银行的资本充足率达到8％以上。\n\n上述描述均基于提供的规划文件内容，明确了适用对象为城市商业银行，核心监管指标为资本充足率，并规定了具体的时间范围（至2010年）及最低比例要求（8％以上）。"}, {"source": "《辽宁老工业基地振兴规划》", "target": "担保机构", "description": "规划鼓励民营企业设立的机构类型"}, {"source": "《辽宁老工业基地振兴规划》", "target": "国务院", "description": "规划中设立中小企业发展专项资金需按照国务院有关规定执行"}, {"source": "中国银行业监督管理委员会", "target": "中华人民共和国外资银行管理条例实施细则", "description": "中国银行业监督管理委员会是《中华人民共和国外资银行管理条例实施细则》的制定与发布机关。该委员会依据该细则规定，负责对外资银行相关事项进行监管。在收到完整申请资料之日起3个月内，该委员会需作出批准或不批准复业、关闭的决定。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "中华人民共和国商业银行法", "description": "《中华人民共和国外资银行管理条例实施细则》与《中华人民共和国商业银行法》均为中国金融监管领域的规范性文件。《中华人民共和国商业银行法》作为上位法，是《中华人民共和国外资银行管理条例实施细则》制定的法律依据之一。在具体内容上，《中华人民共和国外资银行管理条例实施细则》引用了《中华人民共和国商业银行法》第三十九条，将其作为实施资产负债比例管理的依据。两者共同构成了外资银行及商业银行在资产负债管理方面的监管框架，其中《中华人民共和国商业银行法》提供基础法律原则，而《中华人民共和国外资银行管理条例实施细则》则在此基础上针对外资银行的具体监管要求进行了细化。"}, {"source": "中国银行业监督管理委员会", "target": "中国银监会", "description": "中国银行业监督管理委员会（简称“中国银监会”）是同一监管机构的两种不同称谓。在相关监管文件及描述中，两者指代同一主体，文中存在混用情况。该机构作为银行业监管机构，其名称在不同语境下交替出现，但实质指向一致，不存在同名不同机构或不同分支行的情形。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "资本充足率", "description": "细则第六条明确《条例》中资本充足率符合规定的具体标准为不低于8%"}, {"source": "外国银行", "target": "外国银行分行", "description": "外国银行指在中华人民共和国境外设立的银行机构。外国银行分行是外国银行在中国境内设立的分支机构，其设立形式包括直接设立分行或申请将现有分行进行改制。外国银行分行作为外国银行在中国境内的经营实体，其民事责任由总行（即外国银行）承担。\n\n在业务申请方面，外国银行分行可作为独立申请主体，或依托总行资质申请开展相关业务。外国银行在中国境内设立分行后，若涉及分行关闭或清算，将受到总行相关监管限制。外国银行在中国境内设有外国银行分行，该分行属于外国银行在中国境内设立的分支机构形式。\n\n根据输入信息，外国银行分行是外国银行设立的机构，其法律地位依附于总行，但具备独立的业务申请资格。外国银行申请将其在中国境内的分行进行改制，属于其在中国境内设立分支机构的一种变更或调整形式。外国银行在中国境内设立分行，分行关闭或清算涉及总行相关监管限制，表明总行对分行的存续及退出机制负有监管责任。\n\n外国银行分行是外国银行在中国设立的分支机构，其设立行为受中国境内监管规定约束。外国银行在中国境内设立分行，分行作为独立申请主体或依托总行资质申请业务，体现了分行在业务开展中的双重属性。外国银行在中国境内设有外国银行分行，该分行是外国银行在中国境内设立的分支机构，其运营需符合相关监管要求。\n\n外国银行分行是外国银行设立的分支机构，其民事责任由总行（外国银行）承担，这一规定明确了总行对分行债务的最终责任。外国银行在中国境内设立分行，分行关闭或清算涉及总行相关监管限制，进一步强调了总行在分行生命周期管理中的关键角色。外国银行申请将其在中国境内的分行进行改制，可能涉及组织形式或业务范围的调整，需遵循相关监管程序。\n\n外国银行分行是外国银行在中国境内设立的分支机构，其设立和运营需符合中国法律法规。外国银行在中国境内设立分行，分行作为独立申请主体或依托总行资质申请业务，表明分行在业务拓展中具有一定的自主性，但仍受总行资质约束。外国银行在中国境内设有外国银行分行，该分行是外国银行在中国境内设立的分支机构，其存在和运营受中国监管机构监督。\n\n外国银行分行是外国银行设立的机构，其民事责任由总行（外国银行）承担，这一规定确保了债权人权益的保护。外国银行在中国境内设立分行，分行关闭或清算涉及总行相关监管限制，表明总行需对分行的退出过程负责。外国银行申请将其在中国境内的分行进行改制，可能涉及从分行向其他组织形式的转变，需经监管批准。\n\n外国银行分行是外国银行在中国境内设立的分支机构，其设立和运营需符合中国法律法规。外国银行在中国境内设立分行，分行作为独立申请主体或依托总行资质申请业务，表明分行在业务拓展中具有一定的自主性，但仍受总行资质约束。外国银行在中国境内设有外国银行分行，该分行是外国银行在中国境内设立的分支机构，其存在和运营受中国监管机构监督。"}, {"source": "外国银行", "target": "外国银行代表处", "description": "外国银行代表处是外国银行在中国境内设立的机构，作为其代表机构存在。外国银行申请设立代表处，经批准后成为外国银行代表处；外国银行亦可设立代表处，并申请关闭该代表处。外国银行代表处代表外国银行，其民事责任由其所代表的外国银行承担。"}, {"source": "国务院银行业监督管理机构", "target": "资本充足率", "description": "资本充足率符合国务院银行业监督管理机构的规定是指资本充足率不低于8%"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "中国银监会", "description": "根据《中华人民共和国外资银行管理条例实施细则》，中国银监会被确立为外资银行监管的核心审批与资料接收机构。在机构设立方面，中国银监会负责外资银行设立申请的最终审批，并接收相关申请材料。在机构变更事项上，中国银监会负责审批外国银行分支机构的更名申请，以及外资银行营业性机构合并、分立后的相关事项；同时，该机构也负责核准外商独资银行及中外合资银行的更名申请。在人员管理方面，中国银监会负责核准部分任职资格，并接收相应的申请书。上述规定明确了中国银监会在外资银行市场准入、机构变更及高管任职资格等关键环节的法定职责与权限。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "中国银监会派出机构", "description": "《中华人民共和国外资银行管理条例实施细则》规定，中国银监会派出机构作为监管主体，承担多项针对外资银行及其分支机构的监管职责。\n\n在机构设立与变更方面，该细则规定中国银监会派出机构负责受理并审批外资银行营业性机构及分支机构变更营业场所、外国银行代表处变更办公地址的申请。同时，该机构负责受理开业申请，并对筹建期实施监管。\n\n在日常监管与报告接收方面，细则规定中国银监会派出机构为接收外资银行审计报告、年报及工作报告的监管对象。此外，相关申请资料需抄送至该机构，该机构亦负责接收抄送资料。\n\n在机构退出与清算方面，细则规定清算组需将公告内容书面报至所在地中国银监会派出机构，并规定该机构参与注销确认工作。\n\n上述规定明确了中国银监会派出机构在外资银行全生命周期监管中的具体职能，涵盖从筹建、开业、日常运营、变更事项审批到最终清算注销的全过程。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外资银行营业性机构", "description": "《中华人民共和国外资银行管理条例实施细则》对“外资银行营业性机构”实施全面监管，涵盖机构设立、日常运营、重大事项报告及财务合规等多个维度。\n\n在机构设立与变更方面，该细则规定了外资银行营业性机构设立、筹建、验收及开业的监管要求，包括开业、延期开业、公告及改制等具体程序。同时，针对机构变更注册资本、营运资金、股东等事项，亦设定了相应的监管要求，确保机构变更符合法定条件。\n\n在持续监管与报告义务方面，细则明确了外资银行营业性机构的监督管理要求。机构须向所在地中国银监会派出机构报告重大事项，并履行年度审计义务，以保障监管机构对机构经营状况的持续监控。\n\n在财务与会计合规方面，细则严格规范了外资银行营业性机构的财务列报行为，明确禁止在资产、负债、所有者权益的列报中虚列、多列或少列，以确保财务信息的真实性与准确性。\n\n上述规定共同构成了对外资银行营业性机构从准入到持续经营的全流程监管框架，旨在维护银行业稳健运行及金融秩序稳定。"}, {"source": "银监局", "target": "外资银行营业性机构", "description": "接收开业申请资料并在20日内报送中国银监会"}, {"source": "中国银监会派出机构", "target": "中国银监会", "description": "中国银监会及其派出机构在监管外资银行营业性机构时，承担特定的信息报送与抄报职责。根据相关规定，当涉及外资银行营业性机构临时停业情况时，所在地的中国银监会派出机构负责将相关情况逐级报送至中国银监会。此外，若涉及延长筹建期的决定，相关机构需将该决定逐级抄报中国银监会。上述职责明确了派出机构作为属地监管主体，在特定监管事项（如临时停业、筹建期调整）中向总行（中国银监会）履行信息上报和文件抄报的义务，确保监管信息的纵向传递与备案。"}, {"source": "银监局", "target": "中国银监会", "description": "银监局作为中国银监会的派出机构，在银行监管流程中承担资料报送与过程监督职责。在机构开业环节，银监局负责将开业申请资料、验收合格意见书及审核意见报送至中国银监会；部分描述中亦提及将申请资料及审核意见报送中国银监会。在机构解散与清算环节，银监局负责监督解散与清算过程，并将重大事项和清算结果逐级报至中国银监会。上述职责体现了银监局作为派出机构向中国银监会履行报告义务的监管架构。"}, {"source": "中国银监会派出机构", "target": "外资银行营业性机构", "description": "中国银监会派出机构负责受理外资银行营业性机构的开业申请、延期开业申请并作出决定。在筹建阶段，该机构负责受理筹建工作报送，并处理领取开业申请表及相关监管事项。对于需要验收的机构，中国银监会派出机构实施验收，并指定用于公告的报纸。\n\n在持续监管方面，中国银监会派出机构接收外资银行营业性机构报告的重大事项。同时，该机构负责接收外资银行营业性机构报送的公司治理、内控制度及业务凭证等材料。上述职责涵盖从筹建、开业申请、验收公告到后续重大事项报告及合规材料报送的全流程监管环节。"}, {"source": "外国银行分行", "target": "外商独资银行", "description": "外国银行分行与外商独资银行之间存在改制承继关系。外国银行可将其在中国境内的分行改制为由其总行单独出资的外商独资银行，或由其承继部分债权、债务及税务。在此过程中，原外国银行分行可改制为该外商独资银行。若外国银行同时设有外商独资银行，需明确功能定位并建立风险隔离机制。"}, {"source": "外商独资银行", "target": "外国银行分行", "description": "改制后的外商独资银行可设立分行，且需同时申请改制所有境内分行"}, {"source": "外国银行", "target": "外商独资银行", "description": "外国银行可将其在中国境内的分行改制为由其总行单独出资的外商独资银行，或通过总行单独出资直接设立外商独资银行。在此过程中，外国银行作为单独出资方，承诺对拟设外商独资银行实施有效管理。若外国银行在中国境内同时设有外商独资银行，则涉及相关机构并存的情形。上述描述基于输入信息，未包含具体文件文号、发文机关、时间范围、适用对象、金额、比例及具体条件等细节，亦未对同名不同机构或不同分支行进行强行合并。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外商独资银行", "description": "《中华人民共和国外资银行管理条例实施细则》针对外商独资银行制定了具体的监管规定。在高级管理人员管理方面，该细则明确了外商独资银行董事长、行长等高管的任职资格核准权限及任职条件。在机构设立与运营监管方面，细则规定了外商独资银行开业申请、筹建验收及资料报送的具体监管要求。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外国银行分行", "description": "《中华人民共和国外资银行管理条例实施细则》对外国银行分行相关事项作出规定。在人员管理方面，该细则明确了外国银行分行行长、副行长等高级管理人员的任职资格核准权限。在业务准入方面，细则规定了外国银行保留1家从事外汇批发业务分行的申请资料要求及审批流程。上述规定均依据该细则文本，未涉及其他外部事实或法律结论。"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外国银行代表处", "description": "《中华人民共和国外资银行管理条例实施细则》对外国银行代表处的监管要求主要涵盖任职资格、信息报告及登记管理三个方面。\n\n在任职资格方面，该细则明确了外国银行代表处首席代表的任职资格核准权限，对相关人员任职条件及审批流程作出规定。\n\n在信息报告义务方面，细则规定外国银行代表处须向所在地中国银监会派出机构报告所代表外国银行发生的重大事项，以确保监管机构及时掌握其母行动态及潜在风险。\n\n在设立登记方面，细则规定外国银行代表处在设立后需办理注册登记手续，完成法定行政程序后方可正式开展相关活动。\n\n上述规定均依据《中华人民共和国外资银行管理条例实施细则》执行，适用于在中国境内设立的外国银行代表处。文中未提供具体的文件文号、发文机关确切时间、适用金额、比例或特定处罚案例细节，故仅基于输入描述进行合并陈述。各条款之间不存在冲突，共同构成了对外国银行代表处从设立到日常运营监管的完整制度框架。"}, {"source": "中国银监会", "target": "外商独资银行", "description": "中国银监会作为监管机构，对外商独资银行的相关行政许可事项行使审批职权。根据输入信息，其职责主要涵盖开业审批与解散或关闭审批两个方面。\n\n在开业审批方面，中国银监会负责在收到完整申请资料之日起2个月内，作出批准或不批准外商独资银行开业的决定。该时限要求明确了监管机构处理开业申请的法定周期，适用对象为申请开业的外商独资银行。\n\n在解散或关闭审批方面，中国银监会负责作出批准或不批准外商独资银行自行解散或关闭的决定。此项职权涉及外商独资银行退出市场时的监管程序，适用对象为拟自行解散或关闭的外商独资银行。\n\n上述两项描述分别对应外商独资银行设立与退出的不同监管环节，均依据中国银监会的监管职能进行表述。输入信息未提供具体的文件文号、发文机关全称（除“中国银监会”外）、具体金额、比例或额外条件，故合并描述仅保留已知的审批事项、时限及适用对象。两项职责在时间范围上均指向监管决定作出的过程，其中开业审批明确提及“收到完整申请资料之日起2个月内”的时限，而解散或关闭审批未提供具体时限，仅说明由银监会作出决定。\n\n需注意的是，输入信息中未包含针对特定分支行、不同处罚案件或同名不同机构的区分信息，因此合并描述仅基于“中国银监会”与“外商独资银行”这一通用监管关系。所有描述均严格依据输入内容，未添加外部法律结论或未提供的事实。中国银监会在此语境下作为统一的监管主体，对外商独资银行的开业及退出行为实施行政许可管理，确保监管流程符合既定程序要求。"}, {"source": "中国银监会", "target": "外国银行分行", "description": "中国银监会负责在收到完整申请资料之日起2个月内作出批准或不批准保留1家从事外汇批发业务外国银行分行的决定"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外国银行", "description": "规定外国银行合并、分立及名称变更等事项的监管要求"}, {"source": "外资银行营业性机构", "target": "中国银监会派出机构", "description": "外资银行营业性机构在设立、变更及日常经营中，需向所在地中国银监会派出机构履行多项报告与报送义务。\n\n在设立与开业阶段，营业性机构需向所在地中国银监会派出机构报送验资证明，并由其进行验收；同时需在该机构指定的地方性报纸上公告。此外，还需报送重要业务凭证样张、安全防范设施证明及开业前审计报告，并申请开业前验收。\n\n在日常监管与重大事项报告方面，营业性机构需向所在地派出机构报告重大事项。具体包括：报告临时停业及复业情况；在签署业务外包协议前，报告主要风险及规避措施；在转入信贷资产后5日内进行报告。\n\n在制度与内控报送方面，营业性机构需向所在地派出机构报送内部控制制度和业务操作规程的修订内容，以及内审报告和贷款风险分类标准对应关系。\n\n在资金流动与风险监测方面，营业性机构需每季度末向所在地派出机构报送跨境大额资金流动和资产转移情况。同时，需向所在地中国银监会派出机构报送跨境大额资金流动、转入信贷资产及特定风险状况。\n\n在解散与清算阶段，所在地派出机构负责监督解散与清算过程，并将重大事项和清算结果逐级报至中国银监会。\n\n上述义务均依据相关监管规定执行，涉及向所在地中国银监会派出机构或派出机构报送文件、报告事项及接受验收监督。"}, {"source": "外国银行", "target": "中国银监会派出机构", "description": "外国银行在涉及境内分行关闭或变更事项时，需遵循中国银监会派出机构的监管要求。在关闭境内分行的情形下，由分行所在地的中国银监会派出机构负责监督其解散与清算过程。在涉及变更申请时，外国银行需将相关申请资料抄送分支机构所在地的中国银监会派出机构。上述监管职责与程序均依据输入信息明确，未提供具体文件文号、发文机关、时间范围、适用对象细节、金额、比例及特定条件，亦未涉及不同分支行或不同处罚案的区分。"}, {"source": "外国银行分行", "target": "外资银行营业性机构", "description": "外国银行分行属于外资银行营业性机构的一种具体类型。"}, {"source": "外国银行代表处", "target": "中华人民共和国外资银行管理条例实施细则", "description": "该细则规定了外国银行代表处变更事项的公告义务"}, {"source": "外国银行分行", "target": "中华人民共和国外资银行管理条例实施细则", "description": "《中华人民共和国外资银行管理条例实施细则》针对外国银行分行确立了多项监管要求。在业务运营方面，该细则规定了外国银行分行经营外汇及人民币业务所需的营运资金要求，并明确了相关业务承继规则。在特殊情形下，中国银监会及其派出机构有权要求外国银行分行提供由其总行所在国认可机构出具的公证文件，且该文件需经中国驻该国使馆认证。上述规定旨在规范外国银行分行的市场准入、持续经营及合规管理，确保其符合中国金融监管标准。"}, {"source": "外商独资银行", "target": "中华人民共和国外资银行管理条例实施细则", "description": "该细则规定了外商独资银行授权分支机构开展业务及经营对中国境内公民人民币业务的条件"}, {"source": "中外合资银行", "target": "中华人民共和国外资银行管理条例实施细则", "description": "该细则规定了中外合资银行授权分支机构开展业务及经营对中国境内公民人民币业务的条件"}, {"source": "外资银行营业性机构", "target": "中华人民共和国外资银行管理条例实施细则", "description": "《中华人民共和国外资银行管理条例实施细则》针对外资银行营业性机构作出了具体规定。在内部管理方面，该细则要求外资银行营业性机构的内部控制制度、业务操作规程等文件须附有中文译本。在业务经营方面，该细则规定了外资银行营业性机构申请经营或扩大人民币业务服务对象范围的条件，并明确了相应的资料报送要求。"}, {"source": "中国银行业监督管理委员会", "target": "外资银行营业性机构", "description": "在收到完整申请资料3个月内作出批准或不批准经营特定业务的决定"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "外资银行", "description": "该细则适用于外资银行及其分支机构和代表处"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "中外合资银行", "description": "细则明确中外合资银行董事长、行长等高管的任职资格核准权限及任职条件"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "中华人民共和国外资银行管理条例实施细则", "description": "发布该实施细则"}, {"source": "中华人民共和国外资银行管理条例实施细则", "target": "银监局", "description": "规定银监局负责核准部分任职资格及接收申请资料"}, {"source": "外商独资银行", "target": "外资银行", "description": "外商独资银行是外资银行的一种具体组织形式或类型。"}, {"source": "中外合资银行", "target": "外资银行", "description": "中外合资银行属于外资银行的一种具体形式、具体组织形式及具体类型。"}, {"source": "外国银行分行", "target": "外资银行", "description": "外国银行分行是外资银行的一种具体组织形式和类型。"}, {"source": "外国银行代表处", "target": "外资银行", "description": "外国银行代表处属于外资银行的一种具体机构形式。"}, {"source": "外商独资银行", "target": "外资银行营业性机构", "description": "外商独资银行是外资银行营业性机构的一种具体类型或形式。根据输入描述，外商独资银行属于外资银行营业性机构范畴，是其下属的一种机构形态。此外，分行改制为由总行单独出资的外商独资银行，也被明确界定为外资银行营业性机构的一种形态或变更情形。所有描述均一致确认外商独资银行归属于外资银行营业性机构这一上位概念，未出现关于名称、文件文号、发文机关、时间范围、适用对象、金额、比例与条件的冲突信息或差异。输入中未提供具体的监管文件编号、发布机构、生效时间、特定适用对象限制、涉及金额、比例阈值或具体处罚案例细节，因此合并后的描述仅基于提供的实体归属关系进行整合，不添加任何外部知识或法律结论。"}, {"source": "中外合资银行", "target": "外资银行营业性机构", "description": "中外合资银行属于外资银行营业性机构的一种具体类型或形式。"}, {"source": "外国银行分行", "target": "中资商业银行", "description": "外国银行分行以定期存款形式存在的生息资产，应当存放在中资商业银行。根据相关监管要求，此类资产存放的中资商业银行数量应不超过3家（即3家或3家以下），且该等中资商业银行需符合特定条件。\n\n上述描述综合了不同来源的表述：部分文件明确限定存放对象为“中资商业银行”，并强调数量限制为“3家或3家以下”或“不超过3家”；另有表述指出存放银行需为“符合条件的中资商业银行”。各描述在核心约束上保持一致，即外国银行分行不得将定期存款形式的生息资产分散存放于超过3家中资商业银行，且存放机构须满足监管规定的资质条件。\n\n需注意，不同文件在措辞上存在细微差异，如“应”与“应当”、“3家或3家以下”与“不超过3家”，但实质要求相同。未提供具体文件文号、发文机关、时间范围、适用对象细节、金额、比例及具体条件内容，故仅依据输入信息合并，不补充外部事实或法律结论。同名不同机构、不同分支行或不同处罚案未涉及，故不作强行合并。冲突信息在此处表现为表述差异而非实质矛盾，已并列说明其来源差异（即不同文本对数量限制和条件要求的表述方式不同），未擅自裁决或假设历史要求与当前要求的关系。"}, {"source": "外国银行分行", "target": "中国银监会派出机构", "description": "外国银行分行在生息资产管理方面，需遵循所在地中国银监会派出机构的监管要求。在报告义务方面，外国银行分行需向所在地中国银监会派出机构定期报告生息资产存在情况及变更情况，具体时间节点为每年6月末和12月末；此外，还需向该机构报送审计报告。在审批与限制方面，外国银行分行变更生息资产存在形式或定期存款存放银行，应当经所在地中国银监会派出机构批准；未经批准，不得动用生息资产。上述规定明确了外国银行分行在资产形态变更、存放银行调整及资产动用方面的合规路径，强调了事前审批与定期报告相结合的监管机制，确保生息资产管理的透明性与合规性。"}, {"source": "外国银行分行", "target": "中国人民银行", "description": "外国银行分行在中国人民银行持有的存款，计入其流动性资产。"}, {"source": "外国银行代表处", "target": "中国银监会派出机构", "description": "外国银行代表处需向所在地中国银监会派出机构履行多项报告与备案义务。在迁入后，代表处需向所在地中国银监会派出机构报送迁入后的相关资料。办理注册登记手续后，代表处需在所在地中国银监会派出机构指定的地方性报纸上进行公告。\n\n在日常监管与重大事项管理方面，外国银行代表处需向所在地中国银监会派出机构报告所代表外国银行发生的重大事项。输入描述中明确提及“向所在地派出机构报告所代表外国银行重大事项”及“外国银行代表处需向所在地中国银监会派出机构报告重大事项”，两者内容一致，均指向向所在地中国银监会派出机构报告重大事项这一义务。\n\n此外，代表处需向所在地派出机构报送年度相关文件，具体包括年报、工作报告和本年度工作计划。上述义务均针对外国银行代表处，接收机构为所在地中国银监会派出机构。所有描述均基于输入信息，未添加外部事实或法律结论，且未涉及具体金额、比例或特定时间范围，仅保留原文中关于报送对象、内容及动作的表述。"}, {"source": "外国银行代表处", "target": "外国银行", "description": "代表处所代表的机构"}, {"source": "外国银行分行", "target": "总行", "description": "分行隶属于总行，总行变更需报告"}, {"source": "中国银监会", "target": "中国银行业监督管理委员会", "description": "中国银监会是中国银行业监督管理委员会的简称"}, {"source": "中国银监会", "target": "中外合资银行", "description": "中国银监会作出批准或不批准中外合资银行自行解散或关闭的决定"}, {"source": "中国银监会", "target": "外国银行", "description": "中国银监会作出批准或不批准外国银行关闭在中国境内分行的决定"}, {"source": "中国银监会", "target": "中国银监会派出机构", "description": "中国银监会设立并领导其派出机构。派出机构隶属于中国银监会，负责执行具体监管职责。在监管职能方面，派出机构负责执行指定报纸及接收报送等具体工作。在涉及机构解散与清算的过程中，派出机构负责监督该过程，并向中国银监会汇报。"}, {"source": "中国银行业监督管理委员会", "target": "外国银行", "description": "中国银行业监督管理委员会（简称“中国银监会”）依据《条例》及其他有关规定，对违反相关细则的外资银行实施处罚。具体执行中，依据细则第一百三十三条的规定，针对违反该细则的外资银行进行相应处罚。\n\n适用对象为外资银行（即外国银行）。处罚依据包括《条例》、其他有关规定以及细则第一百三十三条。描述中未提供具体的处罚金额、比例、时间范围或发文机关的具体文件文号，仅明确了监管主体、被监管对象及处罚的法律依据条款。\n\n需注意，此处“外资银行”与“外国银行”在输入实体列表中并列出现，但在描述列表中均指向受中国银监会监管并因违反细则而受处罚的对象。根据输入信息，中国银监会作为监管实体，行使对违规外资银行的处罚权。输入描述未区分不同分支行或不同处罚案件，亦未提供冲突信息或历史与当前要求的差异，故直接合并陈述其监管职责与处罚依据。\n\n合并后的核心事实如下：\n1. **监管主体**：中国银行业监督管理委员会。\n2. **被监管对象**：外资银行（外国银行）。\n3. **行为**：对违反规定的银行进行处罚。\n4. **依据**：《条例》、其他有关规定、细则第一百三十三条。\n\n输入中未包含具体的处罚案例细节、罚款数额、整改期限或特定文件编号，因此合并描述仅保留上述结构性信息。中国银监会依照法定程序及上述法规条款，对存在违规行为的外资银行采取处罚措施。"}, {"source": "中国银监会", "target": "国务院银行业监督管理机构", "description": "《条例》所称国务院银行业监督管理机构即指中国银监会"}, {"source": "外资银行营业性机构", "target": "中国银行业监督管理委员会", "description": "营业性机构合并分立后的注册资本或营运资金、业务范围需由中国银监会重新批准"}, {"source": "外资银行", "target": "中国银行业监督管理委员会", "description": "直接监管的外资银行董事长、行长离岗需向银监会书面报告"}, {"source": "外商独资银行", "target": "中国银监会派出机构", "description": "外商独资银行在监管报送与解散清算方面需遵循中国银监会派出机构的相关规定。\n\n在定期报告与审计方面，外商独资银行需向总行或管理行所在地的中国银监会派出机构报送审计报告和年报。该要求明确了报送对象为总行或管理行所在地的派出机构，体现了属地监管原则。\n\n在解散与清算方面，外商独资银行若进入解散程序，其清算组成员的确定需报经所在地派出机构同意。此外，解散与清算的全过程由所在地派出机构进行监督。此规定强调了派出机构在银行退出机制中的审批权与监督权，确保清算过程合规有序。\n\n上述两项描述分别涉及外商独资银行日常经营中的信息报送义务以及终止经营时的清算监管要求。两者均指向“中国银监会派出机构”作为监管主体，但适用场景不同：前者针对总行或管理行所在地的常规监管报送，后者针对银行所在地（通常指拟解散机构所在地）的退出监管。文中未提供具体的文件文号、发文机关全称、确切的时间范围、适用对象的具体细分（如是否包含分行）、涉及的具体金额、比例或额外条件。所有描述均基于输入信息，未添加外部法律结论或事实。对于“所在地”的具体界定，输入中分别表述为“总行或管理行所在地”和“所在地”，合并描述中予以保留，未擅自统一或裁决其地理范围差异。"}, {"source": "中外合资银行", "target": "中国银监会派出机构", "description": "中外合资银行在监管报送及解散清算方面需遵循中国银监会派出机构的相关规定。在常规监管报送方面，中外合资银行需向总行所在地的中国银监会派出机构报送审计报告和年报。在解散与清算环节，清算组成员的确定需报经所在地派出机构同意，且解散与清算过程由所在地派出机构进行监督。上述要求明确了中外合资银行在总行所在地及所在地派出机构层面的具体合规义务，涉及报送文件类型（审计报告、年报）及清算程序中的审批与监督主体。"}, {"source": "外国银行分行", "target": "外汇业务", "description": "经营外汇业务，营运资金应当不少于2亿元人民币或者等值"}, {"source": "外国银行分行", "target": "衍生产品交易业务", "description": "外国银行分行是申请开办衍生产品交易业务的主体之一。作为申请主体，其开办该业务需满足特定条件，主要包括获得总行（或地区总部）的正式授权，且母国需具备相应的监管框架。在满足上述条件后，外国银行分行需向派出机构报送规定材料方可申请开办。\n\n对于管理行已获准开办衍生产品交易业务的情形，外国银行分行在评估满足相关条件的前提下，经管理行授权并向派出机构报告后，方可开办该业务。\n\n综上，外国银行分行在满足特定授权及母国监管条件，并按规定提交额外文件后，经授权可开办衍生产品交易业务。"}, {"source": "外资银行营业性机构", "target": "人民币业务", "description": "外资银行营业性机构经营人民币业务，需遵循特定的准入与变更程序。初次申请经营该业务，机构需具备开业1年以上等条件；申请经营或扩大服务对象范围，需具备审慎性条件。上述申请均须经审批，具体由银保监会或所在地银保监局负责。\n\n在程序方面，外资银行营业性机构经营人民币业务需完成筹备、验资及报告程序。该业务属于机构在满足筹备、授权或整改条件后可经营的业务范畴。\n\n注：输入描述中关于审批机关的表述存在细微差异，部分描述仅提及“经审批”，部分明确为“经银保监会或所在地银保监局审批”，此处并列保留以反映不同来源或时间点的表述差异，未擅自裁决具体管辖层级。所有条件（如开业年限、审慎性条件、筹备/授权/整改条件）及程序（验资、报告）均严格依据输入信息合并，未添加外部法律结论或事实。"}, {"source": "外资银行", "target": "外资银行营业性机构", "description": "外资银行包含营业性机构，营业性机构需履行特定监管义务"}, {"source": "外资银行营业性机构", "target": "总行", "description": "外资银行营业性机构可由总行转入信贷资产"}, {"source": "总行", "target": "外资银行营业性机构", "description": "总行向外资银行营业性机构转入信贷资产"}, {"source": "外商独资银行", "target": "总行", "description": "总行所在地决定年报及审计报告的报送机构"}, {"source": "中外合资银行", "target": "总行", "description": "总行所在地决定年报及审计报告的报送机构"}, {"sourc n": "中国工商银行与中国人民银行（文中亦称人民银行总行）在监管与业务关系上存在以下描述：\n\n1. **监管考核关系**：人民银行总行作为中国工商银行的考核行，负责对其执行资产负债比例管理暂行监控指标的情况进行考核。\n\n2. **文件受文关系**：中国工商银行是银发〔1987〕40号文的受文单位。\n\n3. **业务批准关系**：中国人民银行批准中国工商银行为国家助学贷款经办银行。\n\n上述描述均基于输入信息，未涉及其他机构或分支行，亦未对冲突信息进行裁决。"}, {"source": "中国人民银行", "target": "国家助学贷款", "description": "负责确定经办银行、审批有关办法及监督贷款执行情况"}, {"source": "财政部", "target": "国家助学贷款", "description": "负责筹措、拨付贴息经费并监督使用情况"}, {"source": "中国工商银行", "target": "中国人民银行", "description": "中国工商银行与中国人民银行在监管关系中涉及以下管理要求：\n\n1. **审批与执行机制**：中国工商银行制定的具体管理办法，需报中国人民银行批准后执行。\n2. **报告义务**：中国工商银行需将执行过程中出现的新情况、新问题，以书面形式报中国人民银行。\n\n上述描述基于输入信息合并，未添加外部知识或法律结论。"}, {"source": "中国人民银行", "target": "经办银行", "description": "对经办银行进行监督"}, {"source": "经办银行", "target": "国家助学贷款", "description": "经办银行作为国家助学贷款业务的执行方，承担该业务的具体审查、合同签订、资金发放、回收及债务管理职责。在资金发放环节，经办银行需按学年划入学费及住宿费贷款，并按月划入基本生活费贷款。在后续管理中，经办银行负责办理债务划转、核销及回收手续，并执行核批、发放、反馈名单等具体操作。此外，经办银行需制定相关管理办法，开展业务自查，以确保国家助学贷款业务的规范运行。"}, {"source": "财政部", "target": "财政贴息", "description": "财政部在相关贷款贴息政策中承担以下职责：\n\n1. **贴息比例承担**：财政部承担个人微利项目贷款贴息的75%以及劳动密集型小企业贷款贴息的25%。\n2. **经费拨付**：负责按期、按规定拨付贷款贴息经费。\n3. **政策落实与保障**：负责落实财政贴息政策，并给予妇联组织工作经费保障。\n\n上述描述基于输入信息合并，未添加外部事实或法律结论。"}, {"source": "财政贴息", "target": "国家助学贷款", "description": "财政贴息与国家助学贷款紧密关联。财政贴息作为国家助学贷款业务中涉及的财政补贴项目，其核心内容是对接受国家助学贷款的学生给予50%的利息补贴。该业务同时被纳入高校助学贷款考核内容。"}, {"source": "借款人", "target": "小额担保贷款", "description": "符合小额担保贷款条件的借款人，需满足信用社区推荐、创业培训合格、创业计划书论证通过等条件"}, {"source": "中国人民银行", "target": "专业银行", "description": "中国人民银行与专业银行在信贷管理、资金供应及统计监督方面存在明确的职责分工与协作关系。\n\n在资金与计划管理方面，人民银行负责向专业银行分配周转指标，核定其自有资金及贷款额度，并核定专业银行总行的贷款计划以实施宏观控制。在总行无具体规定前，两者按现行分工范围分别管理和供应流动资金。人民银行要求专业银行制定相关实施细则并抄报总行备案。针对贷款额度使用，规定专业银行年度性贷款额度有余可作为短期贷款使用，但短期贷款额度有余不得作为年度性贷款使用；同时要求专业银行短期贷款必须于年末以前收回，除非经总行批准。\n\n在监管与检查方面，人民银行对专业银行信贷现金计划执行情况进行检查监督，重点监管贷款使用是否符合规定及信贷投向是否合理。人民银行要求专业银行对贷款使用、效益及整体情况进行统计、考核和定期检查。此外，人民银行需协调邮电部门与专业银行的关系。\n\n在信息报送与统计方面，人民银行要求专业银行报送信贷、现金收支情况执行表和资金平衡表，并按旬逐级填报《人民银行贷款使用情况旬报表》。在内部流程上，要求专业银行向其上级行报送企业资金占用情况和贷款效益等统计报表时，同时送抄开户人民银行；在向辖内行处下达信贷计划时，需抄送同级人民银行。\n\n上述描述基于输入信息 ": "中国银行作为经办银行开展国家助学贷款业务。在该业务中，中国银行负责出具结算凭证并办理贷款相关事务。"}, {"source": "中国建设银行", "target": "国家助学贷款", "description": "中国建设银行作为经办银行开展国家助学贷款业务"}, {"source": "借款人", "target": "国家助学贷款", "description": "借款人作为国家助学贷款合同的主体及贷款接受方，享有贷款权利，包括提前还贷、展期等权利，同时承担还款义务。借款人需遵守贷款用途及还款规定，其还款行为直接影响违约率统计。在申请环节，借款人向学校提出贷款申请，需如实提供入学通知书、身份证等材料。"}, {"source": "国务院", "target": "中国人民银行", "description": "中国人民银行是国务院领导和管理全国金融事业的主管机关。根据国务院决定，中国人民银行不直接办理对企事业单位和居民的业务，专门行使中央银行职能。在职能行使方面，国务院领导中国人民银行制定和实施货币政策，并批准和授权中国人民银行制定各项利率。"}, {"source": "中国农业发展银行", "target": "分行", "description": "分行是中国农业发展银行的分支机构，属于其分行级下级机构。在组织架构与职能上，分行负责执行总行指令及辖区管理，并具体执行总行核批的信贷计划。在资金运作方面，分行参与系统内资金的逐级对转。"}, {"source": "中国人民银行", "target": "国有商业银行", "description": "中国人民银行作为发文机关，向国有商业银行下发通知。根据该通知要求，国有商业银行若发行磁条预付卡或电子现金，需经中国人民银行批准。此外，针对特定业务划转情形，规定在没有中国农业银行分支机构的地区，由当地中国人民银行指定一家国有商业银行接收划转业务。"}, {"source": "国有商业银行", "target": "中国人民银行总行", "description": "将汇总结果上报给中国人民银行总行"}, {"source": "交通银行", "target": "中国人民银行总行", "description": "向总行上报统计报表及备案信贷收支统计报表"}, {"source": "金融机构", "target": "借款人", "description": "金融机构以自身名义同借款人订立借款合同，负责监督借款人履行还款义务"}, {"source": "中国人民银行", "target": "金融机构", "description": "中国人民银行作为监管机构，依据《反洗钱法》等规定，对金融机构实施全面监管与监督检查。其监管职责涵盖对金融机构实施本通知情况的检查，以及对其他金融机构业务活动进行稽核。在机构准入方面，金融机构的设置和撤并必须经中国人民银行批准。\n\n在业务合规与反洗钱领域，中国人民银行要求金融机构遵守报告制度，并对违规者予以处罚。若发现金融机构为非法金融机构或非法金融业务活动开立账户、办理结算和提供贷款，中国人民银行应当责令该金融机构停止有关业务活动。此外，中国人民银行通过其分支机构指导金融机构落实相关政策。\n\n上述描述综合了中国人民银行对金融机构在准入审批、日常稽核、反洗钱监督及违规处罚等方面的监管职能与要求。"}, {"source": "地方政府", "target": "金融机构", "description": "任何地方政府均无权批准设立金融机构"}, {"source": "中国人民银行", "target": "国家开发银行", "description": "中国人民银行向国家开发银行下发通知。"}, {"source": "中国人民银行", "target": "股份制商业银行", "description": "中国人民银行向股份制商业银行下发通知，规定股份制商业银行发行磁条预付卡或电子现金需经中国人民银行批准。"}, {"source": "各分行", "target": "城市商业银行", "description": "各分行及城市商业银行作为通知的接收与转发主体，承担将相关监管通知向下级机构传达的职责。根据输入信息，各分行负责将通知转发至其管辖范围内的相关机构；城市商业银行则负责将通知转发至该机构。两者在职能上均涉及通知的传递，但适用对象的具体指向存在差异：各分行的转发对象明确为“辖区内该机构”，强调地域管辖属性；城市商业银行的转发对象表述为“该机构”，未明确限定地域范围，仅指向特定接收方。\n\n上述描述基于提供的文本片段，未包含具体的文件文号、发文机关、时间范围、适用对象细节、金额、比例或具体条件。输入中未提供关于各分行与城市商业银行之间层级关系的具体说明，亦未明确“该机构”的具体身份或名称，因此无法进一步合并或细化其内部结构。各分行与城市商业银行在此语境下为并列的监管实体或关系主体，分别执行各自的通知转发任务。由于缺乏具体的处罚案、分支行区分或历史与当前要求的对比信息，本描述仅忠实反映输入中关于通知转发职责的陈述，不推断其背后的法律后果或监管意图。各分行与城市商业银行在操作层面均执行“转发通知”这一动作，但依据其机构性质和管辖范围，转发的具体路径和对象范围有所不同。各分行侧重于辖区内的层级传递，城市商业银行侧重于对特定机构的直接传递。输入未提供两者是否属于同一系统或存在隶属关系的证据，故保持其独立描述，不强行合并为单一实体。所有信息均严格限定于输入提供的“将通知转发至该机构”及“将通知转发至辖区内该机构”两句描述，未添加任何外部监管规定或法律解释。"}, {"source": "各分行", "target": "农村商业银行", "description": "农村商业银行作为被监管实体，其各分行作为下属分支机构，均属于通知的适用对象。根据输入信息，监管机构或上级行需将相关通知转发至该机构（即农村商业银行）及其各分行。具体执行层面，通知需转发至辖区内该机构，确保信息传达至具体的分行层级。描述中未提供具体的文件文号、发文机关、时间范围、适用金额、比例或特定条件，亦未涉及同名不同机构或不同处罚案的区分。因此，合并后的描述仅基于现有输入，明确农村商业银行及其各分行在通知转发流程中的角色，即作为接收通知的实体，且转发范围涵盖辖区内相关机构。无冲突信息需并列说明，亦无历史要求与当前要求的差异需处理。"}, {"source": "各分行", "target": "农村合作银行", "description": "“各分行”与“农村合作银行”在输入描述中均涉及通知转发职责，但适用层级与范围存在差异，需分别说明，不予强行合并。\n\n针对“各分行”，其描述为“将通知转发至该机构”。该表述表明分行作为中间层级，负责将上级通知传递至特定的下级或关联机构。描述中未明确具体发文机关、文件文号、时间范围、适用对象的具体界定、金额、比例及条件，仅确立了其转发行为。\n\n针对“农村合作银行”，其描述为“将通知转发至辖区内该机构”。该表述表明农村合作银行作为基层或区域管理机构，负责将通知传递至其行政管辖范围内的特定机构。同样，描述中未提供具体的发文机关、文件文号、时间范围、适用对象细节、金额、比例及条件，仅明确了其基于辖区范围的转发职责。\n\n两者主要区别在于转发范围的界定：“各分行”侧重于向“该机构”（特定对象）转发，而“农村合作银行”侧重于向“辖区内该机构”（基于地域管辖的特定对象）转发。由于输入信息未提供具体的文件背景、时间戳或冲突细节，无法判断两者是否属于同一监管链条中的不同环节，或是否存在职责重叠。因此，保留两者独立的描述，分别体现其特定的转发对象范围（特定机构 vs. 辖区内机构），不擅自推断其层级关系或合并为单一实体描述。所有描述均严格依据输入内容，未添加外部法律结论或未提供的事实。"}, {"source": "各分行", "target": "外资银行", "description": "各分行及外资银行作为通知的接收与执行主体，需将相关通知转发至其管辖范围内的具体机构。其中，各分行负责将通知转发至辖区内该机构，外资银行则负责将通知转发至该机构。上述描述基于输入信息，未涉及具体文件文号、发文机关、时间范围、适用对象细节、金额、比例或特定条件。输入中未提供关于“各分行”与“外资银行”是否为同一机构、不同分支行或涉及不同处罚案的具体区分信息，亦未提供冲突信息或历史要求与当前要求的差异说明。因此，合并后的描述仅保留输入中明确指出的动作对象及转发范围，即“该机构”及“辖区内该机构”，未添加任何外部知识、法律结论或未提供的事实。"}, {"source": "各分行", "target": "村镇银行", "description": "将通知转发至该机构"}, {"source": "总行", "target": "中国人民银行总行", "description": "各家总行需将上季末的贷款分类结果报中国人民银行总行"}, {"source": "商业银行", "target": "不良贷款", "description": "商业银行应对不良贷款实施严密监控。在具体措施上，商业银行需重新审查借款合同的执行情况以及贷款担保情况，并依据风险状况对不良贷款进行重新分类。同时，商业银行应加大不良贷款的分析与分类频率。上述要求旨在确保商业银行能够及时识别和评估不良贷款的风险变化，通过高频次的分析与分类，结合对合同执行及担保情况的复核，实现对不良贷款的有效管控。"}, {"source": "中国人民银行", "target": "商业银行", "description": "中国人民银行作为监管机构，对商业银行实施全面的信贷与业务监管。在贷款质量监控方面，中国人民银行通过现场检查和非现场监控两种方式，对商业银行的贷款分类及资产质量进行监督、检查及评价。原则上每年进行一次现场检查，并可根据贷款质量和信贷管理水平调整抽样比例。此外，中国人民银行将商业银行内部控制作为重要监管内容，通过现场检查、审查报告、通报问题并作出总体评价，对违反规定擅自办理相关业务的商业银行，依据有关法律法规予以处罚。\n\n在业务审批与协作方面，中国人民银行批准商业银行经办政策性住房信贷委托业务。同时，中国人民银行组织商业银行参与建立企业信用信息基础数据库，并通知要求商业银行总行将相关通知转发至分支行，协助开展信息征集和宣传工作。\n\n在资金往来关系上，商业银行与承贷的中国人民银行签订借款合同，形成借贷关系。\n\n上述描述涵盖了中国人民银行对商业银行在贷款质量监控、现场检查频率、内控评价、违规处罚、业务审批、信用数据库建设及信息传达等方面的监管职责与互动关系。所有监管措施均基于现行通知及法律法规执行，旨在确保商业银行信贷业务合规及资产质量稳定。"}, {"source": "分行", "target": "总行", "description": "分行与总行之间存在多项业务往来及行政隶属关系，具体描述如下：\n\n在资金清算与划付方面，分行与总行进行汇差清算或利息划付。\n\n在资金拆借管理方面，分行需将资金拆借基本情况逐笔列出清单，并向总行进行专题报告。\n\n在代理业务汇报方面，分行需在5月上旬向总行做代理业务工作专题报告。\n\n在涉外事务管理方面，分行人员会见外宾需按总行国际司要求办理。\n\n上述描述均基于输入信息，未涉及具体文件文号、发文机关、适用对象、金额、比例或特定条件细节，亦未对同名不同机构或不同处罚案进行合并。所有时间范围（如“5月上旬”）及行为要求（如“逐笔列出”、“专题报告”）均严格保留原文表述，未添加外部知识或法律结论。"}, {"source": "各金融机构", "target": "中华人民共和国商业银行法", "description": "通知要求各金融机构严格执行该法"}, {"source": "各金融机构", "target": "不良贷款", "description": "通知要求各金融机构对不良贷款进行调查研究，采取“新老划断”办法盘活信贷资产质量"}, {"source": "金融机构", "target": "不良贷款", "description": "金融机构需对农业和农村经济中的不良贷款占用情况、形成原因进行调查研究，并实行盘活信贷资产质量的领导责任制"}, {"source": "中国农业银行", "target": "中国人民银行", "description": "中国农业银行需分3至5年归还中国人民银行的特种再贷款。在执行过程中，若出现新情况或新问题，中国农业银行须将其书面报告中国人民银行。"}, {"source": "中国银行", "target": "中国人民银行", "description": "需将执行中出现的新情况、新问题书面报中国人民银行"}, {"source": "中国建设银行", "target": "中国人民银行", "description": "中国建设银行总行与中国人民银行总行之间存在特定的资金往来及监管报告关系。在资金运作方面，建设银行总行需向中国人民银行总行申请核批具体垫款数额。在资金周转困难时，由中国人民银行总行负责解决垫款资金问题。同时，建设银行总行需按年向中国人民银行总行划交贷款本息，涉及金额为15亿元。\n\n在监管与沟通机制上，中国建设银行在执行相关事项过程中，若出现新情况或新问题，需以书面形式向中国人民银行报告。上述描述基于输入信息，明确了双方总行层面的具体职责与流程，包括垫款申请、年度本息划交（15亿元）、困难时的资金解决机制以及书面报告义务。文中未涉及其他分支行、不同处罚案或外部法律结论，仅依据提供的描述列表进行合并，保留了关键名称、金额及行为主体。"}, {"source": "交通银行", "target": "中国人民银行", "description": "需将执行中出现的新情况、新问题书面报中国人民银行"}, {"source": "中国农业银行", "target": "中国农业发展银行", "description": "中国农业银行与中国农业发展银行存在业务代理关系。根据输入信息，中国农业银行全面代理中国农业发展银行的业务，且中国农业银行分支机构亦代理中国农业发展银行的业务。上述描述均基于提供的文本，未涉及具体文件文号、发文机关、时间范围、适用对象、金额、比例或特定条件。输入中未提供关于同名不同机构、不同分支行或不同处罚案的冲突信息，亦无历史要求与当前要求的差异说明。因此，合并后的描述仅反映中国农业银行及其分支机构对中国农业发展银行业务的代理事实，不包含任何外部知识、法律结论或未提供的事实。"}, {"source": "中国农业发展银行", "target": "中国农业银行", "description": "存在资金清算关系，需按旬进行清算并报送人民银行"}, {"source": "中国人民银行", "target": "中国农业发展银行", "description": "中国人民银行对中国农业发展银行实施全面的监管与指导。在业务层面，中国人民银行负责核准中国农业发展银行的业务经营范围，并在业务上对其进行指导和监督。针对中国农业发展银行的组建方案及章程，中国人民银行领导并监督其组织实施工作。\n\n在机构管理方面，中国人民银行批准中国农业发展银行分支机构的设置。在资金监管方面，中国人民银行对中国农业发展银行的专户资金进行管理和监督，并检查其资金收支情况。上述监管职责涵盖了从机构设立、业务范围核定到日常资金运作及内部治理结构实施的全过程，体现了中国人民银行作为监管机构对中国农业发展银行在组织、业务及财务方面的法定管理权限。"}, {"source": "中国人民银行", "target": "中国农业银行", "description": "中国人民银行与中国农业银行在监管、业务及考核方面存在多重关联。在信贷支持方面，中国人民银行曾同额、同利率增加中国农业银行的特种再贷款。在文件往来中，中国农业银行是银发〔1987〕40号文的受文单位。\n\n在业务协调与实施层面，中国农业银行省级分行在人民银行的协调领导下，会同同级农业发展银行制订具体实施办法。在监管检查方面，中国人民银行对农业银行代理业务中的专户管理、资金筹措使用及清算情况进行检查。此外，涉及人员任职资格审查时，需审查中国农业银行人员担任县联社正、副主任的任职资格。\n\n在考核管理方面，人民银行总行是中国农业银行执行资产负债比例管理暂行监控指标情况的考核行。上述描述涵盖了从1987年文件发布至后续监管执行期间的多项具体监管行为与业务关系，各事项依据其特定背景独立存在，共同构成了两家机构间的监管互动图景。"}, {"source": "外国银行分行", "target": "外资金融机构", "description": "外国银行分行属于外资金融机构的一种"}, {"source": "中国人民银行", "target": "中国人民银行总行", "description": "中国人民银行总行是中国人民银行的总部及最高管理机构，处于该体系的核心决策层级。作为上级或总部机构，其职责涵盖颁布批准证书，以及负责相关办法的解释和修改。"}, {"source": "外资金融机构", "target": "中国人民银行总行", "description": "需向该机构申请变更机构名称、更换总经理（行长）等审批"}, {"source": "外资金融机构", "target": "外国银行分行", "description": "外国银行分行是外资金融机构的子类"}, {"source": "分行", "target": "金融机构", "description": "分行督促辖区内金融机构贯彻信贷政策，并协调其开展信贷业务"}, {"source": "分行", "target": "地方政府", "description": "分行协调辖区内金融机构与地方政府的关系，并将分析报告抄报有关省市政府"}, {"source": "中国人民银行", "target": "《中国人民银行基本建设管理办法》", "description": "中国人民银行是《中国人民银行基本建设管理办法》的印发机关。该办法由中国人民银行负责解释和修改。"}, {"source": "《中国人民银行基本建设管理办法》", "target": "建设单位", "description": "规定建设单位在财务、预算、投资控制等方面的义务"}, {"source": "建设单位", "target": "商业银行", "description": "在商业银行开立专用存款账户"}, {"source": "建设单位", "target": "总行", "description": "年度基本建设支出预算逐级上报至总行"}, {"source": "总行", "target": "财政部", "description": "总行在财政管理流程中承担数据汇总与预算统筹职能。在决算管理方面，总行负责汇总各分支机构的数据并上报财政部进行统一处理；同时，总行作为被监管主体，接受财政部以总行为单位进行的决算调整。在预算管理方面，总行依据财政部批复的年度预算，统筹确定具体的分配方案。上述职责明确了总行与财政部在数据上报、决算调整及预算分配环节中的业务关系与执行逻辑。"}, {"source": "《中国人民银行基本建设管理办法》", "target": "总行", "description": "规定总行批准立项的总投资1000万元以上、5000万元以下及5000万元以上的建设项目由总行委托审价机构进行审计"}, {"source": "中国人民银行总行", "target": "《中国人民银行基本建设管理办法》", "description": "负责解释和修改该办法"}, {"source": "中国人民银行", "target": "农村信用社", "description": "中国人民银行作为中央银行，对农村信用社履行监督管理职责，实施直接引导与监督。其监管工作涵盖加强行业管理、检查合规性以及监控高风险机构等具体方面。在监管手段上，中国人民银行要求并实施加大现场检查力度，以强化对农村信用社的金融监管。\n\n此外，中国人民银行对农村信用社的治理结构进行规范，具体包括对信用社理事长、副理事长进行任职资格审查。在政策层面，文中提及中国人民银行对信用社存在扶持政策，但原文信息截断，仅能确认二者间存在该关联，具体政策内容未详述。\n\n上述描述基于输入信息合并，未添加外部知识或法律结论。所有监管行为、检查要求及资格审查均依据提供的描述列表整理，保留了“中国人民银行”与“农村信用社”的主体名称及具体监管动作。对于扶持政策，严格遵循输入中“原文截断”的限定，仅陈述存在关联的事实，不推测具体细节。"}, {"source": "地方政府", "target": "农村信用社", "description": "在涉及农村信用社改革与风险化解的监管语境中，地方政府与农村信用社存在多重关联。根据相关监管要求，地方政府需加强对农村信用社改革工作的领导和支持。在风险治理层面，地方政府与人民银行共同治理地区性经营风险，采取综合治理措施以化解金融风险。\n\n针对困难农村信用社，地方政府通过资金扶持、土地置换等办法帮助其解决困难和问题。具体而言，对于达不到申请兑付条件的困难机构，亦通过上述资金扶持、土地置换等手段予以支持。此外，在经营决策方面，地方政府的支持力度被明确列为农村信用社合理确定分红比例和方式的考量因素之一。\n\n上述描述综合了关于地方政府在领导支持、风险共治、困难救助及分红决策考量等方面的职能与要求，未涉及具体文件文号、发文机关、确切时间范围、适用对象的具体界定、具体金额或比例数值及特定条件细节，仅基于输入信息对实体间关系进行整合。"}, {"source": "中国人民银行", "target": "地方政府", "description": "中国人民银行及其分支机构在涉及农村合作基金会清理整顿等工作中，需与地方政府保持紧密协作。具体而言，人民银行应积极配合地方政府开展相关清理整顿工作，以协助完成既定任务。同时，根据相关通知要求，人民银行分支机构需主动向地方政府领导进行汇报，旨在争取地方政府的理解与支持，从而保障工作的顺利推进。上述职责与要求明确了人民银行在特定历史时期或特定事项中，与地方政府在沟通协调及业务配合方面的具体行动准则，强调了主动汇报与争取支持的重要性，以确保农村合作基金会清理整顿等工作的有效落实。"}, {"source": "农村信用社", "target": "中小企业", "description": "农村信用社将中小企业视为最基本的客户及信贷服务的重点对象。根据相关文件要求，农村信用社需将辖区内愿意入社的中小企业尽可能吸收为社员。该描述明确了农村信用社在客户定位及社员吸收方面的具体职责与导向，强调了对中小企业群体的服务重心及吸纳意愿。"}, {"source": "农村信用社", "target": "贷款风险分类", "description": "农村信用社通过培训逐步推行贷款风险分类新方法"}, {"source": "人民银行", "target": "国家开发银行", "description": "人民银行与国家开发银行在专项再贷款业务中存在合作关系。根据输入信息，人民银行与国家开发银行签订了专项再贷款协议。此外，人民银行会同国家开发银行对专项借款进行考核。\n\n上述描述仅基于提供的输入内容，未包含其他外部事实、法律结论或额外细节。输入中未提供具体的文件文号、发文机关、确切的时间范围、适用对象、具体金额、比例或详细条件，因此合并后的描
