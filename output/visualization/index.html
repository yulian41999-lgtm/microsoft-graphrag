颜色表示实体类型。</aside><script>const data={"nodes": [{"id": "中国人民银行", "label": "中国人民银行", "group": "ORGANIZATION", "value": 1294, "title": "中国人民银行是中华人民共和国中央银行及货币当局，依据《中华人民共和国中国人民银行法》行使宏观审慎管理、金融统计、信贷政策制定及金融机构监管等职能。文中“人行”、“总行”、“央行”、“人民银行”均指代该机构或其总行；“太原中心支行”等为分支机构。适用主体包括总行机关、分支机构、直属企事业单位和驻外机构。国务院决定其不直接办理对企事业单位和居民的业务，专门行使中央银行职能。\n\n**一、 金融机构监管与审批**\n负责金融机构设立审批、业务监管及非法机构取缔。作为《关于审批金融机构若干问题的通知》、《商业银行授权授信管理暂行办法》、《外国银行撤销在华营业性分支机构操作指引》、《商业银行信息披露暂行办法》、《商业银行自营住房贷款管理暂行规定》、《商业银行资产负债比例管理考核暂行办法》及《个人住房担保贷款管理试行办法》的发文或印发机关，负责核准业务范围、监管清算、纠正违规及内部控制，有权委托外部审计。监管政策性银行、外资金融机构常驻代表机构及典当行，包括清查暂停批设新典当行、审批外资代表机构变更。代表国家持有交通银行十亿元股份，批准撤销成都、陕西融资中心及温州市商业银行加入同业市场，审批信托投资公司保留或撤销，对广东发展银行深圳分行进行现场检查。调整股份制商业银行新设分行审批制度，发布暂停审批设立各类金融机构的紧急通知，认定取缔非法金融业务。批准外商独资银行、中外合资银行及外国银行分行经营结汇、售汇业务，并规定存款准备金交存要求。批准远离开户行企业在当地金融机构开设专用存款账户及特定账户，并监管账户管理协议。作为特定办法的发布及解释机关，负责同城支行及自助银行的审批、备案及许可证发放。本指引中提及的上级审批机关，负责批准外资金融机构经营人民币业务。负责境外中资金融机构的审批、监管及处罚。负责审批在经济特区设立外资银行、中外合资银行的申请，并根据经济特区发展需要进行管理。负责审查同意政策性银行设立分支机构或办事机构，并按规定程序审批；会同财政部审批政策性金融债务发行及筹资。负责批准城市合作银行筹建中涉及农村信用社的问题，以及批准农村合作银行试点方案。\n\n**二、 农村信用社改革与专项支持**\n作为《农村信用社改革试点资金支持方案实施与考核指引》印发机关，负责专项借款审查、再贷款协议、专项票据发行兑付及增资扩股审核。通过发行专项票据和发放专项借款帮助信用社消化历史包袱。作为《关于进一步做好农村信用社规范工作的意见》等文件印发机关，负责规范工作组织领导及验收。参与1997年及1999年度农村信用社会计决算，负责清产核资结果审批、支农再贷款管理及统计系统维护。制定县(市)城市信用社更名政策，发布改善农村金融服务及解决政策性亏损问题的通知。在国办发[1997]20号文件中提出关于进一步做好农村信用社管理体制改革工作意见。在信用社规范工作中负责理事长、副理事长任职资格审查。负责农村信用社统计信息管理系统推广及数据报送。负责县(市)城市信用社归口管理工作的审批、检查监督及查处。负责审查县联社正、副主任任职资格。\n\n**三、 信贷政策与风险管理**\n作为《贷款通则》制定机关及《贷款风险分类指导原则》(试行)印发解释机关，负责贷款质量检查。联合发布《关于支持中小企业技术创新的若干政策》、《关于改进和完善小额担保贷款政策的通知》、《小额担保贷款财政贴息资金管理办法》、《关于落实环保政策法规防范信贷风险的意见》及房地产抵押估价管理相关文件。编制国家综合信贷计划，核定信贷计划，管理同业拆借市场。安排节能专项贷款，下达1994年度固定资产投资计划及贷款额度，制定信贷资金差额包干办法及上海市信贷计划。制定民族贸易县贸易贷款优惠利率政策。接收各有关部门报送的小额担保贷款运行经验及问题信息。提出《关于农贷豁免权应属中央的请示报告》，负责农贷管理及相关调查研究。提出《关于集中信贷资金保证当前经济发展重点需要的意见》，也是被国务院批转意见的提出方。\n\n**四、 支付结算、反洗钱与统计**\n作为《电子支付指引（征求意见稿）》发布解释主体，规范电子支付。作为《涉及恐怖活动资产冻结管理办法（征求意见稿）》发布解释机关之一，负责反洗钱调查及处罚。作为《境内大中小型企业贷款专项统计制度》联合发文机关，负责金融统计执法检查。建立金融监管统计报告制度，制定大额支付统计政策。发布1995年、2009年及2014年金融机构金融统计制度通知。提出统计报表编制口径调整要求。\n\n**五、 内部管理与其他职能**\n负责内部基建、培训、政务公开及提案办理。作为《中国人民银行日常涉外交往管理规定》、《中国人民银行基本建设管理办法》、《中国人民银行现场稽核规程（试行）》、《中国人民银行政务公开监督检查制度(试行)》、《中国人民银行政务公开评议制度(试行)》、《中国人民银行系统互联网管理办法(修订)》、《中国人民银行互联网网上评论工作管理办法(试行)》、《中国人民银行行员非领导职务设置意见》及《中国人民银行领导干部履行职责审计办法(试行)》等内部规章发文机关。负责现场稽核、电子档案管理及突发事件应急预案制定，修订印发《中国人民银行突发事件应急预案管理办法》。作为《离岸银行业务管理办法》、《经济金融术语汉英对照表》、《土地储备管理办法》等文件印发或联合发文机关。负责总行培训经费、清产核资、残币监销及岗位任职资格培训考核。制定《中央银行会计核算数据集中系统资金归集业务管理办法》。负责存单挂失复函、分行财务管理及粮棉油收购资金监管。\n\n**六、 利率管理与其他**\n负责法定利率公布与实施，拥有利率浮动幅度审批权。公布人民币贷款基准利率，决定实行再贷款浮息制度，制定2005年再贷款浮息政策。决定停止办理新的保值储蓄业务，公布1996年9月份人民币长期保值储蓄存款贴补率。作为《香港清算银行调运人民币现钞进出境通关业务管理办法》联合发文机关之一。作为《金融诈骗案件协查管理办法》发文解释机关，指导亿元以上特大金融诈骗案件协查。作为《金融机构编码规范》印发机关。作为《银行会计档案管理办法》、《银行计算机机房及柜面设备安全防护暂行规定》、《非现场稽核监督暂行规定》、《金融资产管理公司委托处置不良资产指导意见》、《金融资产管理公司统计制度》、《进一步加强银行会计内部控制和管理的若干规定》、《违反银行结算制度处罚规定》、《金融机构高级管理人员任职资格管理办法》等文件印发制定解释机关。涉及《中国人民银行分行货币信贷工作职责》、《固定资产贷款专项稽核实施方案》、《有效银行监管的核心原则》、《清理融资中心债权债务有关会计核算手续》、《下岗失业人员小额担保贷款操作规程》、《关于进一步加强棉花市场管理的紧急通知》、《中国人民银行关于做好家庭经济困难学生助学贷款工作的通知》、《财政部 中国人民银行关于加快推进公务卡制度改革的通知》、《财政部、人社部、中国人民银行关于加强小额担保贷款财政贴息资金管理的通知》、《关于规范农村信用社基本养老保险统筹基金管理工作的意见》、《关于陕西省辖内城市信用社发类处置方案的批复》等文件发布或联合发文。负责邮政储蓄业务监管、利息支付及清算，有权处罚违规邮政企业。负责联行汇差清算、发行库管理及现金管理授权。商请最高人民法院处理重复冻结问题。是银发〔1998，国办发〔2004〕51号文件的联合发文机关之一。\n\n**七、 其他关联职能**\n国发〔1995〕12号文件的联合发文部门之一。国发［１９８３］１００号文报告中的建议单位，以及负责统一管理国营企业流动资金的机构。国家中央银行，其行名、行徽及形象标识在制度中被规范使用，且其性质、职能是金融知识宣传内容之一。国家助学贷款管理规定的联合发文机关之一，负责监督经办银行、确定经办银行、审批办法及监督贷款执行情况。国家开发银行向其借款的金融机构。在办法第四条中提及，其有关收购资金管理规定是储备棉贷款发放需符合的依据之一。在合同文本中被引用，其有关规定用于执行利率调整。外国银行分行流动性资产中“在中国人民银行存款”的存放对象。实施方案中涉及接收存款准备金和转存款、发放特种再贷款、制定统计制度及开立清算账户的中央银行。实施方案中涉及资金转汇及现金发放/回笼业务的主体。对《国家开发银行稽核审计工作暂行规定》中提到的稽核审计工作业务上给予指导和监督的机构。对中国农业发展银行的组建方案及章程组织实施工作进行领导和监督，并在业务上对其进行指导和监督。对代理工作进行直接组织领导的机构。广东省中小企业信用担保机构示范单位管理办法的联合发文机关之一。提交关于中短期设备贷款工作经验交流天津现场会情况报告的机构。\n\n此外，文中提及的“人民银行”涉及同城往来及收账通知等会计处理环节，并负责增加对地方中小金融机构的再贷款和再贴现。文中提及的“同城人民银行往来”科目对应的机构，涉及资金划转。文中提及的专项票据发行及兑付相关机构，原文表述为“人民银行”。文中提及的中央层面决策机关，参与决定康复扶贫贷款管理体制改革。文中提及的中央银行机构，参与征信体系建设通知的联合下发及农村信用工作的指导。文中提及的中央银行，中国农业发展银行向其借款及编报借款计划的对象。文中提及的中央银行，涉及再贴现票据退回及专项央行票据利息收入核算。文中提及的中央银行，负责制定信贷资金管理办法、金融信托投资机构资金管理暂行办法，并行使解释、修改权及监管职责。文中提及的借款对象，农业发展银行向其借款或申请日拆性借款。文中提及的协调领导机构，负责协调省级分行与同级农业发展银行制订实施办法。文中提及的央行，涉及票据兑付期间的政府承诺。文中提及的总行营业部代理资金清算的对象之一，原文称“央行”。\n\n文中提及的批准借款人在其他银行开户的监管机构，以及统一规定储备棉贷款利率的机构。文中提及的机构，信用社向其缴存存款准备金和备付金。文中提及的核发开户许可证及制定现金管理规定的监管机构，文中简称为“人民银行”或“人行”。文中提及的监管机构，与农业发展银行共同制定粮棉油购销企业账户管理规定。文中提及的监管机构，其有关贷款账户管理及资金结算管理的规定是借款人必须遵守的。文中提及的监管机构，同意该通知中关于统一规范粮食收储企业存款账户管理的内容。文中提及的相关规定制定机关，乙方编制处置方案时需遵守其规定。文中提及的社团贷款计息依据的机构。文中提及的解决争议的可能机构，第二种意见认为此案应提交该行解决。文中简称“人民银行”，其基准利率调整影响政策性贷款利息。\n\n文中简称“人行”，作为领导小组成员单位，负责组织金融机构对欠债单位和个人纳入“黑名单”并实行联合制裁。本文件的发文机关，负责就行政监察机关查询、冻结存款问题作出答复。本文件的发文机关，负责答复广东省分行办公室的请示。本答复文件的发文机关，与最高人民法院曾联合签发相关通知。本规定的联合发文机关之一，负责解决垫款资金并接收划交的贷款本息。本通知的发文机关，也是政务公开制度的实施主体及评议对象。本通知的发文机关，也是清收和划转工作的主要责任主体之一。本通知的发文机关，同时是1981年规定发布时经商得同意的机构之一。本通知的发文机关，同时是《金融稽核检查处罚规定》的联合发文机关之一。本通知的发文机关，同时是金融资产管理公司存款账户的开户行及债券和再贷款利息的支付对象。本通知的发文机关，牵头成立协调小组，负责指定接收银行及接收汇总结果上报。本通知的发文机关，负责利率互换业务的监管及接收交易中心报告。本通知的发文机关，负责制定内地银行与港澳银行个人人民币业务的相关监管规定。本通知的发文机关，负责发布关于使用融资租赁登记公示系统的规定。本通知的发文机关，负责发布并实施《银行计算机信息系统安全技术规范》。本通知的发文机关，负责发布房地产信贷业务管理要求。本通知的发文机关，负责审核金融资产管理公司高级管理人员任职资格。本通知的发文机关，负责执行外交部关于安理会决议的通知，并对金融机构实施监督检查。本通知的发文机关，负责授权交易中心发布参考利率及授权交易商协会制定主协议。本通知的发文机关，负责监管农村信用社及城市信用社，并下达紧急通知。本通知的发文机关，负责监管商业银行办理邮政储蓄协议存款业务并要求按月备案。本通知的发文机关，负责编制和下达国家助学贷款指导性贷款计划，并对四家银行总行计划完成情况进行通报。本通知的发文机关，负责融资券的发行、回购、印制及监管。本通知的发文机关，负责规范电子汇划收费标准。本通知的发文机关，负责规范银行业金融机构发行磁条预付卡和电子现金业务，并拥有对违规商业银行的处罚权。本通知的发文机关，负责解释本通知，并对违反规定的内地银行和个人进行处罚。本通知的发文机关，负责转发国家计委、财政部文件并提出贷款证收费管理意见。本通知的发文机关，负责金融稳定再贷款的管理职责分工。本通知的发文机关，负责金融统计制度的制定与监管。本通知的联合发文机关之一，负责公布贷款基准利率及分支机构执行转发。本通知的联合发文机关之一，银行及其他金融业经济普查领导小组的组成单位，普查对象之一。\n\n李国宝致函的对象，非本函直接监管主体。标题中提及的六部门之一，参与加强粮棉油政策性收购资金管理意见的制定。核准中国农业发展银行业务经营范围的监管机构。联合下发《关于支持粮棉油收储企业附营业务合理信贷资金需求的通知》的六部门之一。联合印发《下岗失业人员小额担保贷款管理办法》的中央部委之一。联合发布银发[2004]51号通知的中央银行，也是小额担保贷款工作协调小组成员单位。联合发文机关之一，与银监会共同发布金融统计工作通知。联合发文机关之一，原文件《关于推进下岗失业人员小额贷款工作财政支持政策具体实施意见的通知》的制定者。联合通知的发文机关之一，负责将基建投资贷款纳入信贷资金规模并核增建行基建贷款计划。\n\n被复函对象，涉及总行机关、直属行政事业单位及各级分支机构的银行账户管理。被转发文件《关于做好企业的银行存款 借款及往来款项函证工作的通知》的发文机关。被转发文件《关于做好国有住房出售收入收缴工作的通知》的联合发文机关。被转发文件《关于印发１９９９年度农村信用社会计决算工作意见的通知》的联合发文机关之一。被转发的原始规定发布机关，负责规定存款准备金缴存比例、计收罚息及调整投资比例。被转发的通知的原始发文机关，以及附件中《中国人民银行对专业银行贷款管理暂行办法》的制定机关。西川善文致函的对象，也是《实施细则》的发文机关。规定同期同档次中长期贷款利率的机构，其利率规定被简易建仓贷款执行。规定外资银行营业性机构交存存款准备金要求的机构。规定涉农贷款统计口径的机构之一。该管理办法的发文机关，负责批准设立、延期、人员任命及变更事项，并行使监督检查权。该紧急通知的发文机关，负责制定应急业务处理方案、监测金融市场及货币信贷工作。该规定的联合发文机关之一，负责公布法定贷款利率及制定罚息规定。该通知的发文机关，负责制定工作方案要求并接收进展报告。该通知的发文机关，负责制定监管政策并领导各级分支行执行。该通知的发文机关，负责加强住房公积金信贷业务管理。该通知的发文机关，负责发布监管要求并对辖内商业银行进行监督管理。该通知的发文机关，负责在调查、取缔过程中向当地政府报告，并协调有关部门配合。该通知的发文机关，负责安排发放扶贫贷款及制定相关管理要求。该通知的发文机关，负责安排短期融通资金并规定管理要求。该通知的发文机关，负责对各分支机构及承办银行进行监管。该通知的联合发文机关之一，负责出口信贷政策及银行受理申请的监管。财金〔2005〕114号文件的联合发文机关之一。\n\n转发通知的上级机关，要求省内各市中心支行执行相关助学贷款工作。通知的发文机关之一，再贷款划转协议中的甲方，原贷款人。通知的联合发文机关之一，其分支机构参与对违规银行的监管谈话。通知的联合发文机关之一，负责组织实施银行及其他金融业法人单位填报F347表，并报送汇总数据。通知的联合发文机关之一，负责组织实施银行家问卷调查制度。通知的联合发文机关之一，负责给予农业银行利差补贴。通知的联合发文机关之一，负责金银饰品购销存月报表的汇总与监管。银传〔1998〕23号通知的发文机关，负责汇总各总行上报的划转数据。银函[2000]415号的发文机关，也是国税函[2001]87号中同意提取管理费的主体。银办发〔2000〕第156号通知的发文机关。银发[2003]134号补充通知的联合发文机关之一，负责制定贷款统计上报制度及接收商业银行总行备案。银发〔1987〕15号文件的联合发文机关之一，也是金融体制改革的指导机构。银发〔1990〕176号通知的发文机关，与中央纪律检查委员会商定相关事项。银发〔1990〕270号文件的发文机关，负责制定解决农村信用社政策性亏损问题的措施。银发〔1993〕113号文件的联合发文机关之一。银发〔1994〕276号通知的发文机关，负责督促解决金融机构担保的租赁项目租金拖欠问题。银发〔1995〕110号文件的发文机关，也是清产核资工作的主体，文中提及总行、各级行及各单位。银发〔1997〕518号文件的联合发文机关之一。银发〔1998〕446号文件的发文机关。银发〔2001〕246号文件的发文机关，负责在京银行总行的网络安全检查及接收安全事件报告。银发〔2001〕278号文件的联合发文机关之一。银发〔2003〕153号文件的发文机关，负责下达国家助学贷款指导性贷款计划。银发〔2007〕477号文件的联合发文机关之一。银发〔2008〕321号文件的联合发文机关之一，负责银行及其他金融业经济普查工作的共同组织。银发〔2008〕369号文件的发文机关。银发〔2010〕165号通知的发文机关，负责接收金融机构报告及核实确认申请。银发〔2014〕1号文件的发文机关。银发〔2014〕84"}, {"id": "农村信用社", "label": "农村信用社", "group": "ORGANIZATION", "value": 1195, "title": "农村信用社（Rural Credit Cooperatives, RCCs）是我国农村地区的合作金融组织，资金来源于农村、运用于农村，员工来自农民、服务农民。其法律地位为自主经营的独立法人，属于地方性金融机构，是我国金融系统的重要组成部分及支持“三农”、服务县域经济的主力军。机构体系包括基层农村信用社、县（市）联社、农村合作银行及农村商业银行等，部分由城市信用社更名而来，需保持独立核算或实行统一法人管理。\n\n在监管与改革方面，农村信用社历史上曾由人民公社、生产大队、农业银行管理，1994年后与农业银行逐步脱离行政隶属关系，旨在办成合作金融组织，现由中国人民银行及其分支机构监管。作为深化农村信用社改革的主要对象，涉及产权制度改革、法人治理结构完善及风险处置。改革模式包括实行县级统一法人体制和维持现行两级法人体制。改革措施涵盖增资扩股、专项票据认购及兑付、不良资产置换、风险基金支持、人员划转、财产界定及资金关系处理。在改革过渡期，涉及人事、财务、固定资产及信贷管理的严格监管，需建立健全各相关专业委员会、引入独立董事和外部监事。监管要求保持其县（市）法人地位的长期稳定，防止通过行政手段推动兼并重组。\n\n在业务与会计处理方面，农村信用社是会计核算主体，执行年度会计决算工作，涉及农户贷款、农业经济组织贷款、农村工商业贷款、资金调剂、拆借、代理业务等利息收支及表外科目核算。其业务涵盖发放贷款、开展小企业贷款、生源地国家助学贷款、惠农卡服务及民间借贷监测。在资金运用上，可获得支农再贷款支持，用于调整信贷结构、增加农业贷款及支持农村新民居建设。被要求75%以上新增贷款投入农业领域，并完善农户小额信用贷款管理机制；另有要求确保80%以上新增贷款投向“三农”。其贷款利率可在一年期法定贷款利率基础上最高上浮50%。\n\n在资产处置与权益保护方面，农村信用社是不良贷款清收、化解及呆账核销的主体，负责接收农村合作基金会遗留资产及归并城市信用社不良贷款，并享受相关税费减免政策。作为债权方，其权益需得到保护，享有派员监督企业改制、追收贷款等权利。此外，其职工养老保险纳入省级直接管理，上缴的管理费在符合标准下准予税前扣除。\n\n该实体广泛分布于全国各省市，如云南、山东、江苏、青海、安徽、山西、湖北、湖南、广西等地，具体包括丽江市、十堰市、晋城市、岳阳市、北海市、黄冈市、临汾市、临沧市、吐鲁番地区、成都市辖内、通化市、抚顺市、邢台市、鹰潭市等辖区内的机构。不同地区在改革试点、不良贷款清收攻坚及会计信息质量检查中，依据当地实施方案及监管要求执行具体规定。自2014年起调整其系统内往来统计口径，以法人机构作为区分系统内外的标志。"}, {"id": "《中华人民共和国银行业监督管理法》", "label": "《中华人民共和国银行业监督管理法》", "group": "REGULATION", "value": 610, "title": "《中华人民共和国银行业监督管理法》是银行业监管及行政处罚的核心法律依据，被广泛引用作为作出行政处罚决定及采取监管措施的法定依据。\n\n**主要引用条款：**\n各处罚决定主要引用该法第二十一条、第四十六条及第四十八条。具体引用情况如下：\n1. **第二十一条**：常与第四十六条、第四十八条并列引用，部分决定具体引用第二十一条第三款。\n2. **第四十六条**：常单独引用或与其他条款并列。具体项次包括第四十六条第二项、第三项、第五项等。\n3. **第四十八条**：常单独引用或与其他条款并列。具体项次包括第四十八条第二项、第三项等。\n4. **其他条款**：部分决定引用了第十六条、第三十三条、第四十五条第二项、第四十七条等条款。\n\n**具体处罚案例引用：**\n该法被众多行政处罚决定引用，涵盖2023年至2025年期间。\n- **2024年案例**：包括临金罚决字〔2024〕33号、丽金罚决字〔2024〕1号、京金罚决字〔2024〕1号、伊金监罚决字〔2024〕33号、佳金监罚决字〔2024〕3号、宜金监罚决字〔2024〕7号、巴金监罚决字〔2024〕14号、恩金监罚决字〔2024〕5号、新金监罚决字〔2024〕67号、洛金罚决字〔2024〕35号、漳金监罚决字〔2024〕7号、盘金罚决〔2024〕7号、绥金监罚决字〔2024〕17号、甬金罚决字〔2024〕30号、甬金罚决字〔2024〕88号、甬金罚决字〔2024〕93号、襄金监罚决字〔2024〕3号、青国金罚决字〔2024〕12号、黑金监罚决字〔2024〕102号、黑金监罚决字〔2024〕24号等。\n- **2023年案例**：包括丽金罚决字〔2023〕23号、余金监罚决字〔2023〕6号、内金罚决字〔2023〕14号、甬金罚决字〔2023〕13号、甬金罚决字〔2023〕24号、甬金罚决字〔2023〕25号、甬金罚决字〔2023〕62号、藏金监罚决字〔2023〕20号、赣金监罚决字〔2023〕81号、陕金罚决字〔2023〕81号、陕金罚决字〔2023〕85号等。\n- **2025年案例**：包括怀金罚决字〔2025〕16号、永金罚决字〔2025〕27号、湘金罚决字〔2025〕30号等。\n\n**特定人员及措施依据：**\n该法亦作为对特定人员采取监管措施的法律依据。例如，作为拟取消苗秋实高管人员任职资格3年、拟对李之洋进行处罚、以及拟对李彦维给予禁止终身从事银行业工作行政处罚的法律依据，具体引用了第四十八条第三项。\n\n**其他法律关联：**\n该法还是制定《中资商业银行行政许可事项实施办法》及本细则的法律依据之一。此外，监管机构对违反相关通知规定的商业银行采取监管措施时，也引用该法作为依据。在问责机制中，该法被列为第三十八条提及的问责依据法律之一。"}, {"id": "国家开发银行", "label": "国家开发银行", "group": "ORGANIZATION", "value": 524, "title": "国家开发银行（简称“国开行”、“开行”或“开发银行”）是直属国务院领导的政策性金融机构，在案防工作评估指标统计中归入政策性银行范畴，也是全金融机构及主要金融机构A、B的组成部分，明确列为适用评估对象之一。其内部设有总行、分行、信贷局、代表处、资产管理部、评审三局等层级与部门。\n\n作为发文机关，国家开发银行印发或联合发行了多项内部管理规定及业务办法，包括《国家开发银行信贷合同管理暂行办法》、《国家开发银行信贷资产质量质量分析评价办法》、《国家开发银行公路收费权质押贷款管理暂行办法》、《国家开发银行技术改造贷款暂行办法》、《国家开发银行稽核审计工作暂行规定》、《国家开发银行签订借款合同暂行规定》、《国家开发银行经营管理分析预测工作暂行办法》、《国家开发银行设备储备贷款管理暂行办法》、《国家开发银行财务管理暂行办法》、《国家开发银行贷款项目管理暂行规定》、《国家开发银行软贷款暂行办法》、《国家开发银行与国家开发投资公司若干工作暂行运作办法》、《国家开发银行专家委员会章程》、《国家开发银行信贷局与代表处关于项目贷款管理职责分工的暂行规定》、《国家开发银行分行资产管理部结算及借款业务操作办法(试行)》、《国家开发银行分行资产管理部结算及借款会计核算手续(试行)》、《国家开发银行实行贷款项目情况通报制度的实施办法》、《国家开发银行贷款委员会工作暂行办法》、《签订信贷合同指导意见(五)》、《签订信贷合同的指导意见(七)》以及《关于在部分地区开展生源地信用助学贷款试点的通知》等。在这些文件中，国家开发银行既是制定主体，也是被规范的管理对象。\n\n在职责与业务方面，国家开发银行负责贷款审批、监督、回收、解释办法、配置资金、发放政策性贷款、制定贷款利率及计息办法、建立统计报表制度、接收报表、办理1994年硬贷款贴息工作的审核汇总及上报、接收财政部直接拨付的贴息资金、编制1995年国家开发银行贷款项目投资计划、组织贷款利息收取、建立贷款质量定期通报制度、决定试点部署、核拨专家委员会活动经费、设立专家委员会、批准《国家开发投资公司章程》、对该公司进行监管并注入注册资本金、负责开发投资公司部分干部任免备案及外事审批、理顺关系前的归口管理、提出规范煤炭工业基本建设项目法人建议、负责城市基础设施项目贷款业务、负责设备储备贷款管理、负责软贷款业务经办、负责台资企业贷款的评审决策及发放、负责解释和修改《台资企业国家开发银行贷款暂行办法》、总行负责大额项目决策及接收分行季度报告、负责形式组织财务活动及处理经济关系、负责修订和解释《国家开发银行财务管理暂行办法》、负责解释和修改《国家开发银行贷款项目管理暂行规定》、负责解释、补充和修改《国家开发银行软贷款暂行办法》、负责制定、修改《国家开发银行贷款委员会工作暂行办法》、负责印发试行办法并决定试点部署、负责建立配置资金项目资金到位和投资完成情况统计报表制度并统一确定项目代号、负责提供城市基础设施项目贷款并制定相关管理规定、负责编制1995年国家开发银行贷款项目投资计划、负责贷款利息收取工作的组织、负责办理《国家开发银行贷款质量通报》有关问题、负责印发《国家开发银行技术改造贷款暂行办法》并管理技改贷款、负责印发《国家开发银行签订借款合同暂行规定》并规范其借款合同管理、负责印发通知及与开发投资公司进行业务运作、负责城市基础设施项目贷款业务的政策性银行、负责建立统计报表制度并接收报表、负责建立配置资金项目资金到位和投资完成情况统计报表制度、负责提供城市基础设施项目贷款并制定相关管理规定、负责编制1995年国家开发银行贷款项目投资计划、负责贷款利息收取工作的组织、负责办理1994年硬贷款贴息工作的审核、汇总及上报、负责接收财政部直接拨付的贴息资金、负责制定贷款利率及计息办法、负责建立贷款质量定期通报制度、负责决定试点部署、负责核拨专家委员会活动经费、负责设立专家委员会、负责批准《国家开发投资公司章程》、负责对该公司进行监管、负责注入注册资本金、负责提出规范煤炭工业基本建设项目法人建议、负责设备储备贷款的管理及发放、负责软贷款业务的发放及经办、负责台资企业贷款的评审、决策及发放、负责解释和修改《台资企业国家开发银行贷款暂行办法》、总行负责大额项目决策及接收分行季度报告、负责形式组织财务活动及处理经济关系、负责修订和解释《国家开发银行财务管理暂行办法》、负责解释和修改《国家开发银行贷款项目管理暂行规定》、负责解释、补充和修改《国家开发银行软贷款暂行办法》、负责制定、修改《国家开发银行贷款委员会工作暂行办法》、负责配置资金及发放政策性贷款、负责印发《国家开发银行信贷局与代表处关于项目贷款管理职责分工的暂行规定》、负责印发《国家开发银行分行资产管理部结算及借款业务操作办法(试行)》和《国家开发银行分行资产管理部结算及借款会计核算手续(试行)》、负责印发《国家开发银行实行贷款项目情况通报制度的实施办法》、负责印发《国家开发银行贷款委员会工作暂行办法》、负责印发《签订信贷合同指导意见(五)》、负责印发《签订信贷合同的指导意见(七)》、负责建立贷款质量定期通报制度、负责决定试点部署、负责批准《国家开发投资公司章程》、负责对该公司进行监管、负责注入注册资本金、负责提出规范煤炭工业基本建设项目法人建议、负责设备储备贷款的管理及发放、负责软贷款业务的发放及经办、负责台资企业贷款的评审、决策及发放、负责解释和修改《台资企业国家开发银行贷款暂行办法》、总行负责大额项目决策及接收分行季度报告、负责形式组织财务活动及处理经济关系、负责修订和解释《国家开发银行财务管理暂行办法》、负责解释和修改《国家开发银行贷款项目管理暂行规定》、负责解释、补充和修改《国家开发银行软贷款暂行办法》、负责制定、修改《国家开发银行贷款委员会工作暂行办法》、负责配置资金及发放政策性贷款。\n\n在业务合作方面，国家开发银行是2011年融资目标任务的资金提供方，与大连市政府、安徽省人民政府、河南省政府、海南省人民政府、澄迈县人民政府、玉林市人民政府、龙岩市人民政府及市城投公司、湖南省人民政府、自治区人民政府、贵阳市人民政府、安庆市人民政府、四川省政府、合肥市人民政府等签订开发性金融合作协议或相关协议，提供政策性贷款、政府信用贷款、信用合作贷款、信用贷款及贷款支持，并对贷款资金进行监督。其参与安徽省第四轮开发性金融合作，是安徽省与国家开发银行第四轮开发性金融合作中的贷款提供方。此外，国家开发银行与省教育厅合作承办国家助学贷款业务，是助学贷款业务的承办银行，负责系统功能完善、运行维护及操作规程制定，是助学贷款系统的运营主体及分行所属机构，也是助学贷款系统的运营方及评审三局的上级机构。国家开发银行参与专项借款审查、考核，并与人民银行签订专项再贷款协议；参与统计检查总结工作；参照本办法执行机构许可和任职资格许可条件；在人民银行信贷收支统计制度中涉及存款及贷款统计项目；是城市主次干道改、扩建工程项目的贷款提供方；委托中国银行代理贷款业务，提供贷款资金并规定利率及收息办法；与建设银行签订《委托代理协议书》，作为委托方负责委托项目的审定、合同签订及贷款条件确定，进行代理业务合作及费用结算，其委托业务由中国人民建设银行代理。国家开发银行陕西省分行是其下级机构，需向其汇报工作情况及遵循其政策投向。文中提及的“开发银行”、“开行”或“省开行”均指代该机构或其省级分行，作为贷款提供方及手续费支付方，其项目账户用于预留利息，接收验收结果和决算，负责灾后重建贷款资金提供，其营业部负责部分委托收取利息及划转，贷款项目受相关办法管理，协调小组负责与其关系协调及贷款管理，涉及“国家开发银行贷款”及“省开发银行”，原文提及“开行黑龙江省分行”作为贷款管理方，且作为银行业金融机构被要求增加农田水利建设的信贷资金。\n\n此外，国家开发银行（文中简称“国开行”或“开行”）也是棚户区住房改造项目专项贷款的提供方，作为政策性贷款提供方，与融资平台签订借款合同，负责贷款发放、监管及还本付息通知，并参与还本付息通知、贷款发放停止、提前还款协商及资金收回等监管与业务环节。文中简称“开行”，作为贷款提供方，与城投公司签订借款合同及质押合同。文中简称“开行”，提供打捆贷款的金融机构。文中简称“开行”，是提供中小企业贷款的金融机构，负责贷款审批及发放。文中简称“开行”，是提供中小企业贷款资金的金融机构，与汉中市建立合作机制。文中简称“开行”，是提供灾后重建贷款资金的金融机构。文中简称“开行”，是政策性贷款的提供方，与工业投资公司、城建投资公司签订借款合同。文中简称“开行”，是贷款资金的提供方及审核支付机构。文中简称“开行”，是贷款项目的发放方及信贷管理的配合对象。文中简称为“开行”，是提供贷款的金融机构，负责项目评审及签订借款合同。暂行办法中涉及的贷款银行，其有关规定是办法解释的依据。本文件的联合发文机关之一，负责发挥融资优势，加大对生物产业发展的信贷支持力度。本通知的联合发文机关之一，文中提及提供优惠贷款、投资补助、财务顾问、银团贷款等金融服务。本通知的适用主体之一，作为有关银行接收金融资产管理公司支付的利息。生源地信用助学贷款业务的提供机构，在文中以“国开行”简称出现。被代理发放贷款的银行，涉及贷款划转及资金拨入。被代理贷款业务的政策性银行，涉及手续费拨付及贷款划转。其贷款项目为审计对象。同时，国家开发银行也是接收审计报告、整改结果、项目进展汇报、验收结果及后评价报告的机构。此外，国家开发银行是贷款提供方，郴州市向其申请县域经济贷款。通知中列明的需报送市级及以上汇总数据及法人数据的政策性银行。通知主送单位之一，属于国家政策性银行，具体承办主权担保融资业务。通知主送对象之一，债权金融机构。通知的接收对象之一，政策性银行，涉及长期贷款利息核算规定。通知的联合发文机关之一，负责解释本意见，提供技术援助贷款及一揽子融资解决方案。银发[2010]195号通知中列明的检查对象之一。银发〔2010〕165号通知的受文单位之一，属于金融机构。银发〔2014〕84号通知的受文单位之一。"}, {"id": "金融机构", "label": "金融机构", "group": "ORGANIZATION", "value": 454, "title": "“金融机构”在各类监管文件及业务场景中泛指受中国人民银行、银监部门等监管机构管辖的银行、信用社、信托投资公司、财务公司、金融租赁公司、汽车金融公司、资产管理公司、贷款公司、证券期货业及保险业机构，以及外国银行在中国境内的分行。其具体范围涵盖境内依法设立的法人机构及其分支机构，包括政策性银行、国有商业银行、股份制商业银行、城市商业银行、农村商业银行、农村合作银行、农村信用社、村镇银行、中资及外资金融机构等。\n\n在业务职能方面，该类机构作为信贷发放主体，负责办理贷款发放、农户小额授信、中小企业贷款及应收账款质押融资等业务，需执行法定利率或经批准的浮动利率，并配合环保监管、粮食直补、棉花市场管理等特定政策要求。在资金运作上，它们参与同业拆借、商业票据贴现、债券转让、利率互换及衍生产品交易，需履行备案、订立合同、双边报价及报送金融统计数据（含表外业务）的义务。此外，金融机构还承担支付结算、信用评价、现金管理及存款准备金交存等职能，并作为抵押权人与借款者建立信贷关系。\n\n在合规与风险管理层面，金融机构是多项法规的适用主体或义务主体。依据《金融稳定法》及相关办法，它们需执行恐怖活动资产冻结措施，若因故意或重大过失导致错误冻结需承担民事责任；需制定内部操作规程，报告可疑交易并协助调查。在反洗钱及反诈骗工作中，它们负责配合公安机关及人民银行监督检查，执行交易限制措施，更新名单信息，并对恶意欠款户实施联合制裁。同时，金融机构需接受贷后监督管理，向清算组申报债权，并按规定报送报表、披露信息、保存记录及报告风险变动。\n\n特定文件明确了其地域或行业属性，如大连市银行业、证券期货业和保险业金融机构为重大事项报告义务主体；天津市设立的银行、证券、保险等法人及分行级机构为本指引管理对象；深圳法人金融机构及其他在深圳经营的机构受本办法监管。此外，部分描述涉及与协会、商会合作控制中小企业贷款风险，或作为社会服务对象参与意见箱反馈、监督员评议及问卷调查。对于非法设立的金融组织，相关机构被责令停止为其开立账户、办理结算或提供贷款。所有机构均需尊重其自主经营权，并在涉及商业秘密或信息时，依法保护其不予公开的权利。"}, {"id": "商业银行", "label": "商业银行", "group": "ORGANIZATION", "value": 448, "title": "“商业银行”指在中华人民共和国境内依法设立、吸收公众存款并从事商业银行业务的银行业金融机构。其涵盖国有独资、股份制、城市、农村商业银行及邮储银行等，适用对象包括总行、分行及具有法人或非法人资格的分支机构。作为被监管主体，商业银行需遵守银监会及中国人民银行的相关规定，建立内部控制、全面风险管理、战略风险管理体系及内部资本充足评估程序，执行贷款分类制度、审贷分离及准备金制度，并接受监管检查、非现场监管及数据报送要求。\n\n在业务运营方面，商业银行是贷款发放主体，涉及小额担保贷款、助学贷款（除国家开发银行外）、扶贫贴息贷款、房地产抵押及商业性个人住房贷款等。其中，办理政策性住房信贷委托业务需经中国人民银行批准。商业银行需简化手续、提供结算便利，参与中小企业信用体系建设，打破所有制界限支持个体私营企业技术升级，并对吸纳下岗失业人员的小企业及高新技术项目加大信贷支持。在资金与清算方面，商业银行需向分行交存存款准备金，与人民银行进行资金清算划拨，其备付金存款界定为自有资金。此外，商业银行还办理商业承兑贴现、国库定期存款、磁条预付卡及电子现金发行，需确保身份核验、资金限额及反洗钱合规；负责安排纺织压锭贴息贷款，接收划转粮食企业占用贷款，并参与移动金融安全可信公共服务平台建设。\n\n在合规与特定限制方面，商业银行需执行《上海商业银行客户投诉处理指导意见》等规定，建立健全投诉处理机制，接受上海银监局评估检查；需将企业环保守法情况作为授信审查条件，对已抵押房地产进行价格监测。在信贷政策上，商业银行被严格禁止对个体工商户和棉纺厂直接收购棉花提供贷款。在司法与行政事务中，涉及诉讼申诉、批量代理提交开户许可申请、运钞车安全检查及跨地区支取补助金免收手续费等义务。此外，商业银行是银行业协会的会员主体，涉及总行、分行、支行层层加入协会的问题，并需遵循PBOC标准推动金融IC卡在公共服务及小微企业应用。\n\n需注意，不同文件对“商业银行”的界定存在差异：部分文件特指在上海地区经营的机构，部分泛指受银监会或人民银行监管的机构，部分具体指向经办银行或采用内部模型法计量市场风险资本的银行机构。冲突信息如适用地域（上海 vs 全国）、具体机构类型（是否包含信用社、邮储银行）及具体业务职责（如核贷、清算、投诉处理）应依据具体文件文号及时间范围并列理解，不强行合并不同分支行或不同处罚案的责任主体。"}, {"id": "中国农业发展银行", "label": "中国农业发展银行", "group": "ORGANIZATION", "value": 387, "title": "中国农业发展银行（简称“农发行”）是由国务院通知组建、直属国务院领导的政策性金融机构，实行一级法人制及行长负责制，总行设在北京，为独立法人，注册资本200亿元人民币。该行实行总行、分行、支行制，机构只下设到省级分行，其业务曾全面委托中国农业银行代理。作为《国家政策性银行财务管理规定》适用的政策性银行之一，该行受财政部利差补贴核定机制约束，按保本经营原则核定利差补贴，并与财政部统一核算利差损失。\n\n在职能与业务方面，该行负责农业政策性贷款业务，涵盖粮棉油收购垫付、棉花储备、简易建仓、扶贫（含世行配套）、种子工程、粮油调销及固定资产贷款等。该行是信贷资金、资本金、利率及现金管理的主体，负责核定分行计划、借款额度、资金头寸及费用贷款限额，下达专项贷款计划，并审核展期及收回本息。在粮棉油收购资金管理中，该行是主要管理银行，负责制定封闭运行管理基础工作意见、专户存款核算手续及台账月报制度，接收各分行报表，加强企业贷款利息、台账及存款账户管理。该行还负责粮食风险基金专户管理及资金拨付，参与制定粮食风险基金使用管理办法，并牵头建立粮棉油收购资金管理台帐工作。\n\n在监管与稽核方面，该行是现场稽核工作的实施主体，负责制定并印发《中国农业发展银行现场稽核工作基本程序》、《中国农业发展银行分支行行长任期经济责任稽核暂行办法》（含修改版）及《中国农业发展银行粮棉油政策性收购资金稽核处罚实施办法（试行）》等文件。该行对省级分行正、副行长及副厅级省分行营业部总经理进行任期经济责任稽核，作出稽核结论和处理决定。此外，该行负责粮食企业附营业务占用贷款管理，开展贷款清理确认工作，并负责重点粮油产业化龙头企业的联合审查、审定及信用等级评定。\n\n在外部关系与特定事项中，该行与国家开发银行签订战略合作协议。在专项政策性再贷款方面，其粮棉油收购与储备再贷款以2003年12月31日余额为限执行原政策，超额部分按新规则计息。该行是划出开发性信贷资产、负债的主体，需进行清理核实并配合划转至中国农业银行，涉及银传〔1998〕23号通知中的资金清算、利息结算及资产负债划转。该行是国粮财〔2009〕192号文件的联合发文机关之一，也是冀粮行字〔2009〕70号通知中提及的上级行。作为原通知《关于支持粮食产业化经营促进社会主义新农村建设的通知》的联合发文机关之一，该行负责制定夏季粮油收购信贷政策，并向各省、自治区、直辖市分行印发通知，要求执行夏季收购资金供应与管理、棉花贷款月报表上报、计算机安全工作部署等事项。该行还负责转发中国人民银行关于棉花市场管理及计算机安全工作的紧急通知，并部署内部落实。"}, {"id": "中国银行业监督管理委员会", "label": "中国银行业监督管理委员会", "group": "ORGANIZATION", "value": 384, "title": "中国银行业监督管理委员会（简称“银监会”或“中国银监会”），在多数输入文档中被明确标注为“已撤销”状态，但在部分早期文件（如2003年批复、2006年规章）中作为现行有效发文机关出现，未标注撤销状态。该机构曾作为国务院银行业监督管理机构，负责中资商业银行、外资银行、农村信用社及股份制商业银行的行政许可、非现场监管及现场检查。\n\n在行政许可方面，银监会负责受理、审查并决定国有商业银行、股份制商业银行、城市商业银行的筹建、开业、解散、破产、分支机构终止营业等申请，以及董事和高级管理人员的任职资格审批。具体案例包括批准恒生银行(中国)有限公司北京中关村支行经营人民币业务、批准三菱东京日联银行(中国)有限公司开业及核准高管任职资格、批准摩根大通银行(中国)有限公司开业、批准法国兴业银行(中国)有限公司开业、批准韩亚银行(中国)有限公司北京分行开业、确认中信嘉华银行(中国)有限公司北京分行业务范围、批准分行升格及增加营运资金等。此外，银监会还负责批准设立村镇银行、农村资金互助社、金融租赁公司、汽车金融公司、贷款公司、货币经纪公司，以及批准贵阳农村商业银行股份有限公司设立方案、批复农发行扩大产业化龙头企业贷款范围和开办农业科技贷款业务。\n\n在规章制定与发布方面，银监会是《中国银监会中资商业银行行政许可事项实施办法（2006）》（含令〔2006〕第2号、第7号）、《中华人民共和国外资银行管理条例实施细则》（2015年第4次主席会议修订通过，主席为尚福林）、《农村信用社省(自治区、直辖市)联合社管理暂行规定》、《农村信用社小企业信用贷款和联保贷款指引》、《农村合作金融机构社团贷款指引》、《商业银行市场风险资本计量内部模型法监管指引》、《商业银行资本充足率监督检查指引》、《股份制商业银行董事会尽职指引(试行)》、《股份制商业银行非现场监管规程(试行)》、《金融机构衍生产品交易业务管理暂行办法》（2004年发布，2007年修正，2011年再次修改）及其修改决定、《银行业金融机构案防工作评估办法》、《商业银行公司治理指引》、《农村合作银行管理暂行规定》等文件的发文机关或解释机关。\n\n在联合发文与协作方面，银监会曾与中国人民银行联合发布《关于建立〈涉农贷款专项统计制度〉的通知》、《境内大中小型企业贷款专项统计制度》通知，并共同制定农村信用社会计制度、负责全国信用社统一会计科目代号、名称、核算内容的制定。与其他部门联合印发《关于支持中小企业技术创新的若干政策》、《关于加强和改进对奶业金融支持工作的通知》、《关于处置非法集资活动中加强广告审查和监管工作有关问题的通知》、《关于规范与银行信贷业务相关房地产抵押估价管理有关问题》等文件。银监会也是国办发〔2004〕51号文件、建住房[2006]8号通知的联合发文机关之一。此外，银监会曾于2003年10月31日批复国家邮政局邮政储汇局与中资商业银行、农村信用社办理协议存款业务，参与《电子支付指引（征求意见稿）》的解释与修改，并在闽政文[2005]93号文件中被提及，其关于福建省农村信用社改革试点实施方案的批复被福建省人民政府转发。\n\n在监管执行与数据管理方面，银监会负责统一组织外资银行现场检查、国有独资商业银行非信贷类资产检查、ROCA评价体系试点检查，制定相关监管政策，开通专网和披露系统并制定管理要求，负责农村信用社统计信息管理系统推广及数据接收，下发报表格式及接收汇总报表。其省级派出机构（银监局）和县级派出机构负责审查信用社增资扩股计划及专项票据申请，银监会负责县（市）级派出机构审查及省级局审查通过增资扩股计划，并会同人民银行批准部分计划。银监会还负责接收划转职能和人员，其省级派出机构正在组建中。在金融机构编码规范中，银监会列为监管当局（B）下的二级分类（1）。文中提及的“银监”作为领导小组成员单位，负责组织金融机构对欠债单位和个人纳入“黑名单”并实行联合制裁。\n\n关于机构状态，输入信息存在时间差异：部分2006年及2015年的文件显示其为历史发文机关，而多数近期或修订后的文档明确标注其已撤销。本描述仅针对“中国银行业监督管理委员会”这一中央监管机构，不涵盖其派出机构的具体独立行为，除非文中明确提及银监局或银监分局作为执行主体。"}, {"id": "城市商业银行", "label": "城市商业银行", "group": "ORGANIZATION", "value": 339, "title": "城市商业银行是中华人民共和国境内从事金融业务的中资商业银行类型，英文对应municipal commercial banks。其法人机构注册资本最低限额为1亿元人民币，平均资产规模约为161亿元，业务主要局限于城市市区，服务对象以市民和中小企业为主。该类机构由城市信用社组建而成，属于中小金融机构及地方金融机构范畴，在山东省银行组织体系中作为补充机构存在，具体包括济南市商业银行、青岛市商业银行等。\n\n在监管与行政许可方面，城市商业银行的法人机构设立、筹建、解散、破产、变更组织形式、分立、合并、变更股东、注册资本、住所等事项，通常由所在地银监局受理并初步审查，由银监会审查并决定；部分股权变更、修改章程及省内分行筹建由银监局决定。其境外机构设立由所在地银监局初审、银监会决定。高管任职资格方面，董事长、副董事长、行长、副行长、行长助理、董事会秘书及分行级专营机构高管需满足特定学历及工作年限要求，其任职资格由银监局或银监分局核准。\n\n在业务开展上，申请开办信用卡、离岸银行业务、外汇业务、衍生产品交易、电子银行、托管业务（含QFII及社保基金）、募集次级定期债务、发行次级债券及银行卡等，多由所在地银监局受理并初步审查，报银监会审批或决定；部分业务由银监局直接审批。此外，其涉及个人理财、企业年金基金受托业务、转贴现及外汇信贷资金管理。\n\n在财务与会计管理上，城市商业银行适用《城市商业银行、城市信用合作社财务管理实施办法》及《银行会计档案管理办法》，涉及资本筹集、股东权益折股、固定资产计价折旧处置、无形资产、商誉、递延资产、坏账准备金、业务管理费用及利润分配等规定。其受吉国税发〔2004〕360号、吉国税发〔2005〕305号文件约束，需进行纳税申报。\n\n在政策导向与监管要求上，该类机构被要求加强监督管理、完善法人治理结构、处置不良资产、加快重组整合及引进战略投资者。其处于信息披露过渡期，需规范年度报告披露。在信贷政策上，被鼓励扩大中小企业贷款规模、支持下岗再就业小额贷款，并作为再贷款重点支持对象。部分文件明确将其排除在特定清理范围之外，或作为咸阳市连续经营满一年的考核对象。人民银行各分支机构及银监分局需将相关通知转发至辖区内此类机构。\n\n此外，城市商业银行是文中规定的成本费用列支主体，包括一般城市商业银行及个别经济发达地区的城市商业银行。其作为法人机构类型，涉及开业申请、核准及延期等行政许可事项。文件中提及的特定类型银行业金融机构，作为成本核算和费用列支的适用主体。文件中提及需打破所有制界限，为个体私营企业技术升级提供信贷支持与服务的一类金融机构。文件中特指的城市商业银行机构，被要求制定债券募集资金管理专项制度。文件中规定的会计核算与成本费用的适用主体。文件主送对象之一，指在台州经营的城市商业银行。文件主送对象，作为经办银行之一需足额安排信贷资金。文件适用的被监管主体类型之一。文件鼓励以中小企业为主要服务对象开展金融业务的本地金融机构类型。文档中规定的财务报告、经营指标考核及清算义务的主体。本办法所称中资商业银行的一种类型。本办法明确列出的适用评估对象类别之一。本办法第二条定义的商业银行类型之一。本次银行及其他金融业普查对象之一，其省、地、县级分支机构视同法人单位。本通知的实施对象之一，由人民银行各分行、营业管理部和省会(首府)城市中心支行转发通知。本通知要求转发的辖区内金融机构类型之一。本通知要求转发至的辖区内银行机构类别。本通知要求转发至辖内的银行业金融机构类型之一。根据规程第三十八条，其非现场监管规程比照《股份制商业银行非现场监管规程(试行)》施行的银行类型。正文中涉及权益、资本、负债等监管规定的主体类型。正文中规定的成本核算、营业收入及投资收益确认规则的适用主体。特定类型的中资商业银行，其解散由银监局初审、银监会决定。由人民银行分行负责计算机系统安全工作的机构类型。申请开办企业年金基金受托业务和个人理财业务的主体之一，由所在地银监局受理并初步审查，银监会审查并决定。申请开办特定业务的一类商业银行主体，其申请需经所在地银监局初步审查。申请开办电子银行业务或发行银行卡时，由所在地银监局受理并初步审查，银监会审查并决定的银行类型。申请开办离岸银行、股票质押贷款、企业年金基金受托业务的主体之一，由所在地银监局初步审查，银监会决定。申请投资设立、参股、收购境内法人金融机构的主体之一，由所在地银监局初步审查，银监会决定。申请电子银行业务或发行银行卡时，由所在地银监局受理并初步审查，银监会审查并决定的银行类型。申请设立支行需满足特定条件的银行类型，要求在拟设地同一地级或地级以上城市设有分行及以上机构且正式营业1年以上。被清算的主体，涉及财产清算、债务清偿及剩余财产分配。被要求加快完善省内外网点布局，打造全国性小微企业金融服务专营银行的金融机构类别。被鼓励以中小企业为主要服务对象开展金融业务的本地金融机构类型。被鼓励探索提供生源地小额贷款支持的金融机构类型。规划中提出需规范发展，培养成为主要面向中小、民营和高科技企业服务的金融机构。规划中提及可能有境外合格战略投资者进入的银行群体。规划中提及的需打造为“精品银行”或“特色银行”的机构类型，并需引入战略投资者。该意见要求转发至的辖内金融机构类型。该文件中固定资产折旧管理规定的适用主体。该财务管理实施办法的适用主体之一，文中泛指该类银行机构。该财务管理实施办法适用的主体之一。该通知及决算意见适用的被监管主体类型之一。财务管理实施办法适用的银行类型。辖内需建立满足《资本办法》要求的内部资本充足评估程序的机构类型。通知中列明的报送机构之一，需报送地市级及以上人民币汇总数据。通知中列明的需报送市级及以上汇总数据及法人数据的银行类别，属于中小金融机构。通知中指定的需从2000年初开始至2000年底前完成贷款五级分类工作的88家银行类别。通知中提及的在每季后25日内报送上季末贷款分类结果时，除外的银行类型。通知中提及的被监管对象，指大连市范围内的城市商业银行群体。通知中提及的适用对象之一，包括通过电子汇划系统办理汇兑业务的银行。通知中明确列出的金融统计制度报送机构类别。通知中明确提及需密切关注其资本充足水平、盈利能力等指标变化的金融机构类型。通知要求人民银行分支机构转发至该类型机构，作为间接被监管对象。通知要求人民银行各分支机构将文件转发至的辖区内金融机构类型之一。通知要求人民银行各分行及省会城市中心支行联合银监局转发该通知的对象之一。通知要求接收并执行统计制度的金融机构类型。通知要求接收转发的法人机构类型之一。通知要求接收转发的辖区内金融机构类型之一。通知要求转发对象，属于辖区内需执行该政策的金融机构类型。通知要求转发的金融机构类型之一。通知要求转发至的辖区内金融机构类别。通知要求转发至的辖区内金融机构类型。通知要求转发至的辖区内金融机构类型之一。通知要求转发至的金融机构类型。通知要求转发至辖区内的金融机构之一。通知要求转发至辖区内的银行机构类型之一。通知要求转发辖内的金融机构类型，属于被监管对象。金融分支机构的来源之一，其在县域内的分支机构属于奖励对象。银发[200"}, {"id": "《辽宁老工业基地振兴规划》", "label": "《辽宁老工业基地振兴规划》", "group": "REGULATION", "value": 329, "title": "《辽宁老工业基地振兴规划》是由中共辽宁省委、辽宁省人民政府印发的规划文件，旨在指导辽宁老工业基地的调整改造与振兴。该文件内容广泛，涵盖多个领域的发展目标与具体措施。\n\n在产业结构方面，规划涉及钢铁、有色金属、建材及高新技术产业的发展目标，明确装备制造业的具体产业布局，并推进高新技术产业化。同时，规划关注现代农业发展，包括农业结构调整、农业产业带建设及农产品加工基地的布局。\n\n在服务业与基础设施方面，文件涵盖商贸、旅游、社区服务、金融、房地产等领域的发展目标与措施，具体包括现代物流、信息服务业、中介服务业、交通运输业及商贸流通业。此外，规划还涉及基础设施建设和县域经济发展。\n\n在体制改革与对外开放方面，规划内容涉及金融、财税、投资体制改革，以及对外开放战略。具体措施包括实施科技兴贸战略、利用外资以及实施“走出去”战略。\n\n该规划由中共辽宁省委、辽宁省人民政府联合印发，作为指导辽宁老工业基地全面振兴的政策依据，其适用范围涵盖辽宁省内的相关产业、区域及经济活动主体。"}, {"id": "山东省十一五金融业发展规划纲要", "label": "山东省十一五金融业发展规划纲要", "group": "REGULATION", "value": 307, "title": "《山东省十一五金融业发展规划纲要》是由山东省人民政府印发的规划文件，旨在指导山东省“十一五”期间金融业的发展。该文件涵盖了金融业发展的指导思想、目标、原则及工作重点，其中明确包含了保险业发展的相关内容，具体涉及保险业发展的指导思想、目标、原则及工作重点。"}, {"id": "财政部", "label": "财政部", "group": "ORGANIZATION", "value": 298, "title": "财政部是中华人民共和国中央国家行政机关，在银行监管及金融管理领域承担制度制定、资金监管、财务审批及政策指导等核心职能。\n\n**一、 制度制定与监管职责**\n财政部是《金融企业会计制度》、《金融保险企业财务制度》、《基本建设财务管理规定》、《国家政策性银行财务管理规定》、《金融资产管理公司财务制度》、《土地储备管理办法》及《会计档案管理办法》等文件的制定、印发或解释机关。在《国家政策性银行财务管理规定》中，负责全系统财务管理、会计核算、利差补贴拨补及决算编报的监督管理，具体包括审批坏账损失、核定利差补贴、接收报表备案、批准年度财务计划、审核分支机构设立及融资事项，并实施财务检查与处罚。此外，负责中央预算单位银行账户的审批、备案及监督，参与制定计收手续费统一规定及企业所得税相关政策（如财税字［1996］38号、［1997］38号）。\n\n**二、 资金管理与贴息政策**\n作为《下岗失业人员小额担保贷款管理办法》、《小额担保贷款财政贴息资金管理办法》、《关于改进和完善小额担保贷款政策的通知》、《关于推进下岗失业人员小额贷款工作财政支持政策具体实施意见的通知》及《关于加强小额担保贷款财政贴息资金管理的通知》的联合发文机关，财政部负责确定贷款担保基金年度代偿率最高限额、弥补损失、筹措并拨付贴息经费、审核财政贴息项目、核拨中央财政贴息资金，并承担贴息和呆账损失补偿的资金分担。在涉农贷款领域，发布《关于开展县域金融机构涉农贷款增量奖励试点工作的通知》及《财政县域金融机构涉农贷款增量奖励资金管理办法》，负责奖励资金的核拨与监督，接收省财政厅报送的申请材料及决算报告。在助学贷款领域，作为《中国人民银行、教育部、财政部关于助学贷款管理的若干意见》联合发文机关，负责筹措、拨付贴息经费并监督使用。\n\n**三、 特定业务监管与协作**\n在主权担保融资方面，作为《美国进出口银行主权担保融资管理暂行办法》联合发文机关，负责主权外债统一归口管理、提供主权担保、出具担保文件及审批资金申请。在历史职能及特定事项中，财政部是1961年联合通知、1972年复函、1981年规定、1986年管理办法的发文或相关机关；参与1995年清产核资工作；与中国人民银行联合发布［１９９７］３号通知；与劳动保障部联合发布劳社部发〔1998〕22号、劳社部发〔2001〕3号文件；与民政部共同规定会费收缴标准。财政部还负责批准农村信用社保值贴补息拨补申请、同意农村信用社接收农村合作基金会财产免交相关税费、商定损失贷款划分标准、处理有争议资产、审核深化农村信用社改革试点方案及批准冲减流动资金。\n\n**四、 其他监管与历史职能**\n财政部参与国有商业银行财税检查，负责决定将国有商业银行列入检查名单、处理需统一处理的问题及接收专题报告；发布财监[2008]23号文件指示会计监督检查重点。作为国办发〔2004〕51号文件的联合发文机关之一，负责向国家开发银行拨付预算资金，并作为上级主管部门接收省财政厅报送的汇总材料。此外，财政部是财税〔2007〕121号及120号、财税宇[1998]29号、财税[1998]60号、财金〔2005〕114号、财金〔2009〕72号、银发[2003]134号补充通知、银发[2004]51号通知、银发〔2004〕51号文件及《纺织压锭中央财政补贴资金使用管理暂行办法》的发文或联合发文机关，负责制定具体奖补政策、担保基金风险补偿政策，并在对商业银行进行绩效评价时予以适当扣分。财政部还选派人员组成中国农业发展银行监事会，接收其年度财务决算，其有关制度被中国农业发展银行财务会计制度引用。"}, {"id": "国务院", "label": "国务院", "group": "ORGANIZATION", "value": 295, "title": "国务院是中华人民共和国最高国家行政机关，在金融监管、经济政策制定及机构管理中发挥核心决策与审批职能。\n\n**一、法规发布与政策制定**\n国务院是多项重要金融及行政法规的发布或联合发文机关，包括《中华人民共和国外资金融机构管理条例》、《中华人民共和国外资银行管理条例（2006）》、《中华人民共和国经济特区外资银行、中外合资银行管理条例》、《中华人民共和国行政监察条例》、《企业国有资产监督管理暂行条例》、《粮食收购条例》、《行政机关公务员处分条例》及《国家行政机关工作人员贪污贿赂行政处分暂行规定》等。其联合发文机关包括中共中央（如《关于促进农民增加收入若干政策的意见》、《关于实行党风廉政建设责任制的规定》）。国务院还发布了《关于中国人民银行专门行使中央银行职能的决定》、《关于重新组建交通银行的通知》（决定交通银行三年内免交所得税）、《关于组建中国农业发展银行的通知》（批准其章程及组建方案）、《关于进一步深化粮食流通体制改革的决定》、《关于进一步推动横向经济联合若干问题的规定》、《关于在对外公务活动中赠送和接受礼品的规定》、《涉外人员守则》、《节能减排综合性工作方案》、《推进资本市场改革开放和稳定发展的若干意见》、《促进奶业持续健康发展的意见》、《切实做好1998年度棉花工作的通知》、《深化棉花流通体制改革的决定》、《做好促进就业工作的通知》及《推进普惠金融发展规划(2016—2020年)》等文件。具体文号包括国发[1983]第146号、国发[1985]17号、国发（1995）12号、国发(1998)28号、国发［1983］100号及国办发(1999)3号等。此外，国务院是《国务院关于取消和下放一批行政审批项目的决定》、《国务院关于鼓励支持和引导个体私营等非公有制经济发展的若干意见》的发文机关，并参与制定支持小微企业发展、企业流动资金定额调整、价格主管部门费用收取标准、政府特殊津贴及人才工程选拔等相关规定。\n\n**二、金融机构监管与人事任免**\n国务院是中国人民银行、中国农业发展银行、国家开发银行、交通银行、中国光大银行、中国国际信托投资公司、国家开发投资公司的上级领导或批准设立机关。其职能包括：批准中国人民银行实行再贷款浮息制度、制定各项利率、发行融资券及《关于1999年全面推行贷款五级分类法的请示》的批示；批准中国光大银行提高呆账准备金提取比例；批准中国银行业监督管理委员会批复协议存款业务；批准国家开发银行组建和运行方案；任命中国农业发展银行行长、副行长及监事会主席，批准监事会组成；任命国家开发投资公司总经理、副总经理，并审批其出访事项；批准《中国国际信托投资公司章程》。国务院还决定扶贫贷款由中国农业发展银行统一管理，设立扶贫基础工程贷款，并批准金融稳定再贷款发放。作为“国务院证券监督管理机构”的上级行政机构，其有关规定是中资商业银行境外公开募集股份和上市交易需符合的条件之一。国务院有权决定豁免借款人偿还储备棉贷款责任或决定停息、减息、免息，并是用于退市金融机构个人债务兑付等其他风险处置类再贷款的最终批准机关。\n\n**三、农村信用社改革与专项审批**\n国务院是深化农村信用社改革试点的决策主体，批准云南省、浙江省、河北省、广西等作为试点省（区），并批复同意相关实施方案。其决定试点地区农村信用社企业所得税优惠政策延长三年，批准解决农村信用社政策性亏损问题措施，批准河北省城市信用社风险处置方案及专项借款申请，批准核销逾期贷款。国务院提出将农村信用社办成合作金融组织的要求，原则同意《关于做好当前农村信用社工作的意见》并要求人民银行发文执行。国务院确定江苏省农信社改革试点及张家港、常熟、江阴农信社股份制改革试点，确定贫困县名单，其确定的贫困县信用社享受免征所得税两年或继续免征所得税的政策。国务院统一部署农村信用社体制改革，其关于深化农村信用社改革的精神是各地制定本方案及高校建立机制的依据之一。\n\n**四、其他行政决策**\n国务院批准《关中—天水经济区发展规划》，对武汉城市圈资源节约型和环境友好型社会建设综合配套改革试验总体方案进行批复，同意《国务院办公厅关于促进东北老工业基地进一步扩大对外开放的实施意见》及发改企业[2005]966号文。其作出向地震灾区困难群众发放补助金决定，批准成立中国社会福利有奖募捐委员会，批准有关海南岛特殊政策，批准兼并项目调整为破产项目，并批准完善粮食风险基金使用管理办法意见。国务院还实施粮食直补和农资综合直补政策，提出“保增长、扩内需、调结构”决策部署，并对重大金融诈骗案件进行批示和交办。国务院批准建设国家资源型经济转型综合配套改革实验区，制定“两型”社会建设总体战略部署，确定512家国有大型企业贷款利率不上浮规定，确定或调整政策性银行注册资本金总额，规定资金筹集和运用范围，规定地方资金配套比例为1:1.5，规定投资公司和控股公司权益性投资余额例外情况。国务院同意农发行扩大贷款范围，对秋粮收购工作作出总体部署，其关于粮棉油收购资金供应与管理的各项政策及“约法三章”规定是制定本办法的依据。国务院将代理任务交给农业银行，其领导批示被分行用于协调指定信贷项目的实施。国务院是决定设立金融资产管理公司的机构，确定金融资产管理公司支付债券和再贷款利息管理原则。国务院与国家工商行政管理总局共同涉及出资方式的界定，其最新文件作为本规定未涵盖事宜的执行依据。此外，国务院负责规定艰苦边远地区范围、重大疫情（甲、乙、丙3类传染病）分类，批准金融资产管理公司从国有独资商业银行购入不良贷款政策，同意并批转中国人民银行的请示报告、意见及情况报告（如银发〔１９９９〕４２６号文件中提及的指示来源），负责批准经省人民政府上报的消化方案，部署研究生教育收费制度及完善研究生国家助学贷款政策，部署防止金融诈骗工作，是金融稳定再贷款中地方政府向中央专项借款及紧急贷款请示的最终批准机关，领导和管理全国金融事业，批准建立企业信用信息基础数据库。"}, {"id": "外资银行营业性机构", "label": "外资银行营业性机构", "group": "BUSINESS", "value": 237, "title": "“外资银行营业性机构”是外商独资银行、中外合资银行及外国银行分行的统称，指外国银行在中国境内设立的从事金融业务的机构。该实体涵盖上述各类机构，主要涉及设立申请、筹建工作、开业申请及后续监管要求。在设立流程上，需经过筹建和开业审批环节，相关描述均指向其作为设立申请及筹建工作的对象身份。"}, {"id": "安顺市人民政府办公室关于督促检查2008年《政府工作报告》和全市经济工作会议重大工作部署贯彻落实情况的通知", "label": "安顺市人民政府办公室关于督促检查2008年《政府工作报告》和全市经济工作会议重大工作部署贯彻落实情况的通知", "group": "REGULATION", "value": 236, "title": "安顺市人民政府办公室于2008年5月20日发布了《关于督促检查2008年〈政府工作报告〉和全市经济工作会议重大工作部署贯彻落实情况的通知》。该文件旨在督促检查2008年《政府工作报告》及全市经济工作会议中重大工作部署的贯彻落实情况。\n\n根据输入信息，该通知涉及多项具体工作任务与部署，包括教育、就业等工作，以及旅游集团重组、人才基地建设、地质公园申报和万村千乡市场工程等任务。文件由安顺市人民政府办公室发文，适用对象为相关责任部门及单位，要求对上述重大部署的落实情况进行督促与检查。\n\n所有描述均基于安顺市人民政府办公室发布的同一份2008年5月20日的通知文件，未涉及不同机构、分支行或不同处罚案的合并。文件中提及的具体任务如旅游集团重组、人才基地建设等，均为该通知所涵盖的督促检查内容，体现了对全市经济工作会议及政府工作报告部署的具体落实要求。"}, {"id": "银监局", "label": "银监局", "group": "ORGANIZATION", "value": 230, "title": "“银监局”是中国银行业监督管理委员会（中国银监会）在省级行政区设立的派出机构，文中常指拟设机构、任职机构或所在地银监局，亦为晋城市金融生态环境建设领导小组成员单位。其核心职能涵盖行政许可的受理、初审、审查及决定，具体职责因监管对象不同而有所区分：\n\n1. **外资银行监管**：负责外国银行分行、代表处、外商独资银行及中外合资银行的设立、变更、终止及业务申请。包括受理并初审分行改制为外商独资银行、分行关闭、破产申请；受理、审查并决定代表处设立、变更名称、分行筹建及开业、支行筹建及开业申请；核准外资银行董事、高级管理人员及首席代表任职资格；接收开业申请资料并报送银监会；监督解散与清算过程。对于非银监会直接监管的外资银行营业性机构，负责受理、审查和决定其衍生产品交易业务申请及其他业务申请；负责受理、审查和决定其他外商独资银行分行、中外合资银行分行的关闭申请，以及外国银行分行的关闭初审；负责受理和初审其他外商独资银行、中外合资银行自行解散申请及外国银行分行筹建申请；负责受理和初审非银监会直接承担监管主体责任的外商独资银行、中外合资银行高管任职资格核准申请，并报送银监会。\n\n2. **中资商业银行及城市信用社监管**：负责城市商业银行、城市信用社股份有限公司及城市信用合作社的筹建、开业、变更（如名称、组织形式、分立、合并、注册资本/营运资金）、解散、破产及终止营业申请的受理、初审或决定。具体包括初审城市商业银行境外机构投资、法人机构变更、次级债务/债券及衍生产品交易业务、发行银行卡、开办外汇业务等申请；决定社区支行、小微支行终止营业或转为自助银行；接收分支机构降格、临时停业报告；将通知转发给辖内各城市商业银行。负责受理并初步审查城市商业银行、城市信用社股份有限公司申请，或审查并决定其他业务申请；负责受理并初步审查城市商业银行筹建申请，以及受理并决定开业申请；负责受理城市信用社开业延期申请、作出决定及办理注销手续；负责受理并初步审查城市信用社股份有限公司筹建申请、受理并决定开业申请、办理延期及注销手续。负责城市商业银行、城市信用社解散及境内分行终止营业申请的受理与初步审查，以及破产申请的受理与初步审查。负责审查并决定中资商业银行支行筹建及设立申请，也是分行未按时开业时办理注销手续的决定机关。负责受理筹建和开业申请、进行审批和核准，非试点省由银监局确定实施对象。\n\n3. **农村金融机构监管**：负责受理农村信用合作联社开业申请及审批统一法人工作；负责审查省联社申请材料并出具意见，以及审查决定地、市、县联社发卡申请。\n\n4. **高级管理人员任职资格**：负责国有商业银行一级分行、股份制商业银行分行、城市商业银行法人机构等高级管理人员及董事的任职资格申请受理、初审、审查及决定；负责异地任职监管评价意见征求及报告接收；组织任职资格考试。\n\n5. **其他监管职责**：负责受理并审核辖区内政策性银行、国有独资商业银行和股份制商业银行分行筹建申请；审批所在城市各银行支行筹建和开业申请；接收分支机构报告衍生产品交易业务授权情况；参与改革配合工作，与省政府、人民银行、保监局等部门协作防范系统性金融风险；负责个案审核、制定实施细则及报告新情况；负责审核清产核资结果、指导督促引进法人机构投资者；负责将开业申请资料及审核意见报送中国银监会；负责要求提供其他材料；负责属地监管的法人银行业金融机构的案防监管评价；牵头组织各商业银行、农信社研究制定银行业对社区进行信用评价的指标项目及打分标准。文中提及的“吉林监管局”为具体实例，指代接收分支机构降格、临时停业报告的监管机关。所有职责均依据相关法规及文件规定执行，涉及金额、比例及条件以具体申请文件为准。"}, {"id": "中国银行业监督管理委员会(已撤销)", "label": "中国银行业监督管理委员会(已撤销)", "group": "ORGANIZATION", "value": 219, "title": "中国银行业监督管理委员会（简称“中国银监会”或“银监会”）是已撤销的监管机构。该机构曾作为发文机关或联合发文机关，发布《中华人民共和国外资银行管理条例实施细则》及其2015修订版、《中资商业银行行政许可事项实施办法》、《外资银行行政许可事项实施办法》、《商业银行资本充足率监督检查指引》、《外资银行法人机构公司治理指引》、《股份制商业银行风险评级体系（暂行）》、《金融机构衍生产品交易业务管理暂行办法》（2004年及2007修正）等文件，以及中国银行业监督管理委员会令〔2006〕第2号、银监发〔2004〕8号、银监发〔2004〕21号、银监发〔2010〕13号、银监函〔2004〕158号、银监函〔2004〕175号、银监函〔2007〕73号等文号文件。此外，该机构还是财金〔2005〕114号文件的联合发文机关之一。\n\n在监管职能方面，该机构负责外资银行监管及清算监督，依法对外资银行法人机构实施监管；负责制定资本充足率监管要求，实施监督检查并成立相关委员会；负责中资商业银行行政许可事项的受理、审查和决定；负责受理、审查和决定特定层级商业银行及外资银行高管任职资格；负责受理、审查和决定外商独资银行、中外合资银行变更组织形式、合并、分立的申请；负责金融机构衍生产品交易业务的监管；负责商业银行存款波动的日常统计监测及监管纠正与处罚；并作为年度规划报送及审批结果的抄报对象。\n\n在具体行政许可与批准事项中，该机构曾批准星展银行（中国）有限公司筹建南宁分行、星展银行（香港）有限公司深圳分行业务申请、新联商业银行设立重庆分行、花旗银行设立天津分行、新韩银行（中国）有限公司开业及任职资格、日本三井住友银行股份有限公司上海分行增加营运资金、法国兴业银行有限公司上海分行经营非外商投资企业人民币业务、泰国盘谷银行（大众有限公司）上海分行经营人民币业务及增资、上海商业银行有限公司深圳分行经营人民币业务、东亚银行成都代表处升格为分行、东亚银行有限公司广州分行经营人民币业务、东亚银行有限公司珠海分行及西安分行增加营运资金、恒生银行有限公司上海分行经营非外商投资企业人民币业务、日本三菱东京日联银行股份有限公司在中国境内分行改制事宜等。此外，还批准了外资银行增加注册资本及营运资金、外资金融机构营运资金变更、业务范围变更，以及中国信托商业银行北京代表处、华南商业银行深圳代表处、葡萄牙商业银行在华机构、德国商业银行在华机构、永亨银行内地分支机构等名称变更，并核准相关行长任职资格。文中提及“中国银监会派出机构”作为报告接收方。所有描述均基于原文标注，该机构现已撤销。"}, {"id": "银行业金融机构", "label": "银行业金融机构", "group": "BUSINESS", "value": 213, "title": "苏州市金融业的主要组成部分，截至2007年12月末本外币存贷款余额分别达7470.75亿元和5820.40亿元"}, {"id": "中国人民银行关于2014年金融机构金融统计制度有关事项的通知", "label": "中国人民银行关于2014年金融机构金融统计制度有关事项的通知", "group": "REGULATION", "value": 195, "title": "《中国人民银行关于2014年金融机构金融统计制度有关事项的通知》（银发〔2014〕1号）由中国人民银行于2014年1月3日发布并生效，目前现行有效。该通知旨在规范2014年金融机构金融统计制度，明确了具体的统计指标、代码、名称变更、校验关系及报送要求。\n\n在统计指标与科目调整方面，该通知规定了多项具体事项：一是调整信贷收支表中“从广义政府买入”的归属，并对广义政府概念进行解释；二是规范租赁保证金统计方式，将其从“其他长期负债”调整至“保证金存款”并作为附报项目；三是修订涉农贷款统计内容，在月报中增设支农贷款相关统计指标，同时终止季报中相应统计指标，并调整涉农贷款校验关系；四是修订大中小微企业和涉农贷款统计制度；五是修订房地产贷款统计制度；六是修订本外币利润统计制度；七是新增大额可转让存单统计指标；八是新增表外业务专项统计制度；九是明确同业表内理财统计方式；十是调整农合机构系统内往来统计口径；十一是增设回购业务交易对手统计分类；十二是规定外汇储备委托贷款资金统计指标；十三是规范或有项目、承诺、表外项目等统计口径。\n\n此外，该通知对报表项目进行了更名、新增及归属调整，涉及卖出回购债券、贷款、票据等具体指标代码及名称的变更，并规定了相应的报表科目检验关系。在数据报送方面，通知明确了金融机构金融统计数据的报送范围、层级、频率、时限及修订规则，提出了数据集中系统报送要求，并规定了具体表单要求。该文件统一了2014年度金融机构金融统计工作的具体执行标准。"}, {"id": "外商独资银行", "label": "外商独资银行", "group": "ORGANIZATION", "value": 194, "title": "外商独资银行是指由外国银行总行单独出资，或经批准由外国银行分行改制而成，在中国境内设立的外资银行营业性机构。其注册资本最低限额为10亿元人民币或等值自由兑换货币。\n\n在监管与治理方面，该机构受中国银监会直接监管。其董事长、行长等高级管理人员的任职资格需由银监会核准，且高管需满足特定的金融工作年限和经历要求。机构需建立独立的风险管理、合规管理和内部审计部门，执行特定的资产负债比例计算方法，并遵守资本充足率、公司治理、关联交易及内部控制等规定。若与外国银行分行同时设立，需建立风险隔离机制，且董事长及高管不得与外国银行分行高管兼职。\n\n在业务经营上，外商独资银行可经批准经营结汇、售汇、信用卡、证券投资基金托管、代客境外理财托管、国债承销及衍生产品交易等业务。其分支机构在总行业务范围内经授权可开展业务，经营对中国境内公民的人民币业务需具备特定审慎性条件及符合业务特点的营业网点。其分支机构产生的民事责任由总行承担。\n\n在行政许可与变更事项中，涉及变更股东、调整持股比例、修改章程、变更组织形式、名称变更、住所变更、合并、分立等，均需向银监会或所在地银监局提交申请资料及中文译本。重要董事会决议、股东变更及重组事项需向监管局报告。\n\n在退出与清算机制中，涉及解散、撤销、破产、关闭境内分行或支行等情形时，需成立清算组，申请关闭分行或提取生息资产，并报送相关申请资料。由外国银行分行改制而来的机构，需申请开业并领取新金融许可证，承继原分行的债权、债务及税务。\n\n在报告与审计义务方面，需进行并表或合并审计，向总行所在地派出机构报送年度审计报告及股东年报。作为指定机构的一种类型，其需具备经营稳健且具有一定实力的非关联银行特征。上述描述综合了《外资银行行政许可事项实施办法》、相关细则及条例中关于设立、运营、变更及退出的监管要求。"}, {"id": "外国银行分行", "label": "外国银行分行", "group": "ORGANIZATION", "value": 189, "title": "外国银行分行是指外国银行在中华人民共和国境内设立的分支机构，属于非法人机构，其民事责任由总行承担。中文名称需标明外国银行国籍及责任形式。该机构是受《中华人民共和国外资银行管理条例实施细则》等法规监管的外资银行营业性机构类型之一，也是行政许可的主要对象。\n\n在设立与变更方面，外国银行分行需由总行无偿拨给不少于2亿元人民币或等值自由兑换货币的营运资金。其设立、变更营业场所、变更营运资金、增设分行等事项需经监管批准。若拟改制为外商独资银行或保留从事外汇批发业务，需符合特定条件。总行变更、重组及高管变更需向监管局报告。\n\n在业务经营与监管指标方面，外国银行分行可单独申请或依托总行其他分行资质申请经营人民币业务。经营外汇业务或人民币业务需满足特定的营运资金最低限额要求。需每日计算生息资产比例和流动性比例，并按月或按季向监管派出机构报告。需遵守境内本外币资产负债余额、授信余额、境外往来等监管指标，并按单家或合并方式考核流动性及资产负债。需指定专门部门或人员负责合规工作，并遵守生息资产管理规定。\n\n在任职资格与人员管理方面，其行长（总经理）任职资格由银监会核准，副行长、合规负责人等由所在地银监局核准。相关人员需满足特定的金融工作年限和经历要求。从事外汇批发业务时，其高管不得与外商独资银行高管兼职，与外商独资银行交易需符合商业原则并提供全额担保。\n\n在报告与审计义务方面，需向所在地银保监会派出机构报送总行年报及审计报告。在中国境内设立2家及2家以上分行的外国银行需进行年度审计。涉及个人理财产品电子化报告等方面参照执行相关规定。\n\n在衍生产品交易业务方面，申请开办该业务需获得总行（地区总部）正式授权，且母国具备监管框架。若不具备特定条件，需额外报送总行书面授权文件和承诺函。\n\n在退出与清算方面，涉及关闭、清算及设立限制等监管规定。关闭时需停止经营并交回许可证，完成清算后需报告。\n\n此外，文中提及上海辖内14家此类机构上半年发生亏损。该机构类型还涉及托管、咨询及业务协作等业务，并需接收并执行相关通知要求。"}, {"id": "中国农业银行", "label": "中国农业银行", "group": "ORGANIZATION", "value": 182, "title": "中国农业银行是国有商业银行，文中常简称为“农行”或“农业银行”。该银行具有多年服务“三农”经验，正在进行股份制改革，是“三农”金融服务试点工作的主体。\n\n在历史沿革与农村信用社关系方面，1980年至1996年间，该行负责管理农村信用社。1997年，该行与农村信用社脱钩，脱离行政隶属关系，正向商业银行转化。脱钩过程涉及人员划转、财产界定、资金关系处理及干部编制、档案和组织关系的接收。该行曾作为原农村信用社的行政隶属单位，提供业务服务、承担电报业务，并在脱钩过程中与领导小组办公室协商解决财产资金异议。此外，该行曾与北京市税务局协商确定农村信用社管理费提取比例，并联合印发《关于印发农村信用合作社管理费试行办法》的通知。\n\n在政策制定与文件发布方面，该行是《农村信用合作社财务管理实施办法》（农银发[1993]251号）和《农村信用社利息收支管理办法》的联合制定或印发机关之一，常与国家税务总局联合发文。该行也是《中国农业银行关于加强代理农业发展银行业务工作的意见》的发文机关。\n\n在业务代理与资金清算方面，该行是代理行，负责全面代理中国农业发展银行业务，包括办理原粮棉油优惠贷款业务（后划转至农业发展银行）、发放粮食预购定金贷款、加强代理业务工作及建立、汇总、上报粮棉油收购资金管理台帐。该行需与农业发展银行进行资金清算，并接受人民银行监督。在银传〔1998〕23号通知中，该行涉及资金清算、利息结算及接收划转资产负债。\n\n在信贷与监管方面，该行是2003年度国家助学贷款计划执行机构之一，被下达11亿元指导性计划额度。该行是承贷行，负责向人民银行借款、发放贷款及加强风险管理，也是受委托办理住房公积金信贷业务的承办银行之一。该行对288户移交企业有贷款余额18.97亿元，并负责接收划转的信贷资产及负债、开发性信贷资产及负债，以及划转后贷款的清收。该行是四家国有独资商业银行之一，总行设有驻行监管小组，由人民银行总行考核。该行行内电子汇兑系统已联调成功，部分分支机构代理农业发展银行业务。\n\n在其他业务与通知对象方面，该行是通知的主送或受文单位之一，涉及控制人民币业务范围并备案、贯彻执行《离岸银行业务管理办法》、发放和使用基础扶贫工程贷款、转知所属代理行、遵照执行《个人住房担保贷款管理试行办法》等事项。该行是债权金融机构，具体承办主权担保融资业务。该行同意扩大记账式国债柜台交易业务分行范围。该行是境内金融机构，其汇票和支票按行分色。该行是银发〔1987〕40号、银发〔1990〕176号、银发〔1990〕270号、银发〔1993〕113号、银发〔1994〕276号等文件的受文单位或联合发文机关之一，涉及落实信用社一般转存款利率调整、降低支持信用社贷款利率、系统内担保由总行负责落实解决等内容。该行与北海市人民政府签订银政合作协议，提供信用额度贷款资金及进行贷款调查认可。"}, {"id": "漯河市2010年经济体制改革工作意见", "label": "漯河市2010年经济体制改革工作意见", "group": "REGULATION", "value": 182, "title": "该实体为漯河市人民政府办公室于2010年5月18日印发的《漯河市2010年经济体制改革工作意见》。这是一份关于深化经济体制改革的指导性文件，旨在指导2010年度相关工作。\n\n文件内容涵盖多个领域的改革措施，具体包括：\n1. 土地预算与资源性价格改革；\n2. 城乡统筹发展；\n3. 职业教育改革；\n4. 财政、金融及医药卫生体制改革。\n\n所有描述均指向同一发文机关（漯河市人民政府办公室）及同一时间范围（2010年5月18日印发），未发现同名不同机构或不同分支行的情况，亦无冲突信息。该文件作为2010年漯河市经济体制改革的工作依据，明确了当年在土地、资源、教育、财政、金融及医疗等领域的改革方向与任务。"}, {"id": "湖北省国民经济和社会发展第十个五年计划纲要", "label": "湖北省国民经济和社会发展第十个五年计划纲要", "group": "REGULATION", "value": 181, "title": "《湖北省国民经济和社会发展第十个五年计划纲要》是由湖北省人民政府印发的规划文件。该文件经湖北省九届人大四次会议审议通过后，由湖北省人民政府印发并要求认真组织实施。\n\n文件内容主要涵盖湖北省“九五”期间的经济社会发展成就回顾，以及“十五”时期（第十个五年计划期间）国民经济和社会发展的规划与指导。具体规划领域包括农业、林业、新兴农业、产业化经营、乡镇企业、工业及高技术产业发展等。该文件旨在指导湖北省在“十五”期间的经济和社会发展工作。"}, {"id": "中外合资银行", "label": "中外合资银行", "group": "ORGANIZATION", "value": 179, "title": "中外合资银行是指由外国金融机构（含外国银行）与中国境内的公司、企业或金融机构共同出资，依照《中华人民共和国外资金融机构管理条例》等法规在中国境内注册设立的外资银行法人机构。该机构属于外资银行营业性机构的一种组织形式，也是《外资银行行政许可事项实施办法》及相关细则规定的受监管主体。\n\n在监管架构与高管任职方面，中外合资银行受中国银监会（现银保监会）直接监管。其董事长、行长等高级管理人员的任职资格由银监会核准，需具备特定的金融或经济工作年限及经历；同级职责平行调动时原有任职资格有效。重要董事会决议、股东变更及重组事项需向监管局报告。\n\n在业务经营与条件方面，该银行在获准业务范围内可授权分支机构开展业务。经营对中国境内公民的人民币业务需具备符合业务特点的营业网点及审慎性条件。其分行在总行业务范围内经授权可经营人民币业务，并需办理开业登记。涉及结汇、售汇、信用卡、证券投资基金托管、代客境外理财托管、国债承销及衍生产品交易等业务时，需满足特定条件并向银监会或所在地银监局提交申请资料。\n\n在资本与财务要求方面，条例规定其注册资本最低限额为10亿元人民币或等值自由兑换货币。需遵守资产负债比例、资本充足率、公司治理、关联交易及内部控制等规定。股东需满足特定审慎性条件及持股比例要求，主要股东需将其纳入并表范围。该银行需设置独立的风险管理、合规管理和内部审计部门，建立风险隔离机制（特别是与外国银行分行同时设立时），并执行特定的资产负债比例计算方法。\n\n在行政许可与日常监管方面，涉及变更名称、住所、注册资本、营运资金、股东、组织形式、修改章程及合并、分立等事项，需履行行政许可程序，由银监会受理、审查和决定。需进行并表或合并审计，并向总行所在地派出机构报送年报及审计报告。\n\n在退出机制方面，涉及解散、撤销、破产及关闭境内分行或支行时，需成立清算组，适用特定的清算及关闭程序，并报送相关申请资料。设在经济特区的机构还受特定的放款限额及登记时限约束。"}, {"id": "股份制商业银行", "label": "股份制商业银行", "group": "ORGANIZATION", "value": 172, "title": "股份制商业银行是指由多个股东出资设立的中资商业银行类型，属于全金融机构及主要金融机构A、B的组成部分。在特定监管语境下，该实体特指11家股份制商业银行，或泛指各类采用股份制形式的商业银行机构。\n\n该实体是多项监管法规与政策的适用对象或受文单位，包括《下岗失业人员小额担保贷款管理办法》、《股份制商业银行董事会尽职指引(试行)》、《股份制商业银行非现场监管规程(试行)》、《股份制商业银行风险评级体系（暂行）》、《银行会计档案管理办法》、环发〔2007〕108号文、银办发〔2000〕第156号、银发〔2002〕42号、银发〔2008〕321号、银发〔2010〕165号、银监发〔2004〕8号及银监发〔2009〕109号等文件。其中，《股份制商业银行风险评级体系（暂行）》明确将其列为符合评价标准的被监管主体类型。\n\n在监管架构上，股份制商业银行分为银监会直管和属地监管两类。其法人机构设立、解散、破产、变更注册资本、境外上市、修改章程、变更住所、组织形式、分立、合并、境外机构设立及投资等事项，由银监会直接受理、审查并决定。其分支机构（如分行、支行、二级分行）的筹建、开业、升格及高管任职资格申请，依据层级不同，由银监会、银监局或银监分局按特定程序受理与审批。例如，未跨银监局辖区设立的二级分行筹建由银监局决定，分行筹建由银监局或直属分局审核。\n\n在业务准入方面，股份制商业银行申请开办衍生产品交易、电子银行、信用卡、离岸银行、股票质押贷款、企业年金基金受托、个人理财、合格境外机构投资者境内证券投资托管、全国社会保障基金托管、发行银行卡、募集次级定期债务及发行次级债券等业务，均由银监会直接受理、审查并决定。此外，其作为经办金融机构，参与下岗失业人员小额担保贷款业务，各地市经办银行需向当地财政部门报告贴息额度。\n\n在人员管理方面，该类型银行的董事长、副董事长、行长、副行长、行长助理、董事会秘书及分行级专营机构高级管理人员的任职资格，需满足特定的学历、工作年限及专业背景要求，并按规定向监管机构申请许可。\n\n在统计与数据报送方面，股份制商业银行是金融统计制度报送机构类别之一。根据相关通知，其需报送地市级及以上人民币、外汇、本外币汇总数据，包括季度损益表、上市公司存贷款情况统计表等。部分通知明确其需从2004年起编制并披露上一年度年度报告，或通过电子汇划系统办理汇兑业务。在银行及其他金融业经济普查中，其省、地、县级分支机构视同法人单位。\n\n在区域发展与政策导向中，股份制商业银行被视为具有先进管理经验和经营手段的金融机构，被鼓励在山东、徐州等地增设分支机构，参与县域金融奖励，支持中小企业金融服务专营机构建设，并通过改制、兼并重组等方式进行改革。其也是统计检查、特种存款缴存及同业转贴现业务的参与主体，需向人民银行反映动态情况并报送周报数据。"}, {"id": "各金融机构", "label": "各金融机构", "group": "ORGANIZATION", "value": 170, "title": "“各金融机构”在相关监管文件中泛指参与特定金融活动、承担信贷义务或接受监管的银行、证券、保险、农村信用社及中小金融机构等群体。其具体职责与要求因文件来源、地域及时间背景不同而有所差异，主要涵盖以下方面：\n\n在政银企合作与信用建设方面，部分金融机构参与政银企信息平台建设，负责提供机构信息、金融新品种栏目、警示信息及企业信用资讯，并参与政银互动。另有机构被要求加强自身信用建设，建立健全内控制度，坚持依法合规经营，并需配合开展金融公证业务、解决信贷管理问题。\n\n在区域经济与信贷投放方面，不同辖区的金融机构承担特定义务。在台州地区，金融机构被要求盘活信贷存量、优化结构并支持经济转型升级；在上饶市辖区，泛指承担信贷投放义务的银行等机构；在山西辖区，包括农村信用社、中小金融机构在内的各类机构需开展业务。此外，部分机构需推广小额担保贷款模式以扩大覆盖面，或参与货币市场业务、开展信贷投入。\n\n在金融安全与风险处置方面，参与金融安全区创建工作的银行、证券、保险等机构需与政府签订责任书。同时，部分机构群体需配合降低不良贷款，进行资产保全和清收，并参与自查及被抽查工作。\n\n在跨境业务与政策执行方面，辖区内金融机构需加强跨境人民币政策宣传，开展境外投资人民币贷款及支付结算服务。作为被监管对象或执行主体，包括银行在内的金融机构需执行利率政策、开展跨境业务及报送数据。\n\n上述描述基于不同文件对“各金融机构”的泛指，具体适用对象、金额、比例及条件以各原始文件规定为准，不同地域（如台州、上饶、山西）及不同业务场景（如政银互动、跨境业务、风险处置）下的要求并列存在，未作统一裁决。"}, {"id": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "label": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "group": "REGULATION", "value": 168, "title": "该文件为《中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见》，由中国人民银行大连市中心支行于2012年2月27日发布。文件旨在加大金融对大连实体经济发展的支持力度，指导金融支持实体经济发展。根据输入信息，该文件目前处于现行有效状态。"}, {"id": "银行", "label": "银行", "group": "ORGANIZATION", "value": 156, "title": "“银行”在相关监管文件及业务场景中，泛指受监管的银行业金融机构，包括独立银行、附属于更大机构的银行、城市商业银行、农村信用联社、专业银行及其他银行。作为被监管主体，银行需遵守有关银行法规和条款，保持完备的会计记录，接受现场检查或外部审计，向监管人员提供信息并配合检查。在评估体系中，银行是注册类别为银行的金融机构之一。\n\n在业务操作层面，银行负责办理验资账户开立、资金审核、划转及撤销业务，提供收款凭证、对账单、回函及办理销户退款手续；负责企业开户行审批，涉及开户行为、基本账户结算及与企业的合作关系。银行提供存款证明、出具贷款承诺或授信协议，包括全国性银行、城市商业银行、农村信用联社等。在信贷业务中，银行是信贷投入主体及贷款债权方，负责发放流动资金贷款、扣收多余资金、批准计划，并负责投入农副产品收购资金且不得挪用。银行参与财税库银横向联网及支付结算服务，在集中代收付业务中接收业务信息、确保信息不被篡改并承担相应法律责任。\n\n在协作与监管执行方面，银行作为担保业务的合作方及推荐单位类型之一，与担保机构签订银保合作协议，并核查从业人员不良记录。银行协助执行查询、冻结、扣划存款义务，受理冻结、扣划申请，审查通知书，执行扣划及计付利息。银行参与归并民营企业信息、建立征信体系及指导规范民营业。此外，银行接收有奖募捐收入存款，代收执收、执罚部门以非公有制企业为对象的收费、罚款。\n\n在区域合作与融资支持方面，银行与各区市县合作搭建融资平台，为中小企业提供融资服务。银行需发挥专业优势，以银行业金融机构为龙头带动债券和票据融资。在特定指引中，银行指在天津市设立的银行。在社会保障事务中，街道(乡镇)社会保障事务所在借款人情况变化时通知银行停止贴息。上述描述涵盖了银行在财务管理规定适用、业务办理、监管配合及多方协作中的多重角色与职责。"}, {"id": "外资银行", "label": "外资银行", "group": "ORGANIZATION", "value": 155, "title": "外资银行是指在中国境内经营的外资银行业金融机构的统称，主要包括外商独资银行、中外合资银行、外国银行分行及外国银行代表处。该群体是金融监管体系中的重要组成部分，既属于全金融机构范畴，也被纳入中小金融机构统计体系，由人民银行分支机构负责报送日报数据。\n\n在监管与行政许可方面，外资银行受《外资银行行政许可事项实施办法》及相关细则监管。其董事、高级管理人员及首席代表的任职资格需经核准，变更事项需经批准。在苏州、上海等地，其分支机构变更营业场所需履行行政许可手续。文中提及，其新设分行审批方式及程序不变，部分业务备案被取消。此外，外资银行需履行重大突发事件报告义务，违反相关细则将受到处罚。\n\n在业务运营与政策适用上，外资银行享有特定的业务范围、收费及呆账核销待遇，文中曾讨论其是否享有“超国民待遇”。其业务范围涵盖货币信贷、衍生产品交易（需向当地银监局申请并报中国银监会审批）、中小企业融资贷款及个人人民币业务等。在货币信贷政策导向效果评估中，外资银行根据资产规模不同，需选择参加至少18个或25个指标的评估。\n\n在数据统计与报送方面，外资银行是金融统计制度的报送机构之一。根据银发〔2008〕321号等通知要求，其需报送地市级及以上人民币汇总数据，其中法人机构报送法人数据，主报告行报送全国汇总数据。在银行及其他金融业普查中，其省、地、县级分支机构视同法人单位。\n\n地域分布上，外资银行在上海、苏州等地设有机构。截至2007年12月底，苏州落户11家外资银行。在上海地区，外资银行是座谈会、现场检查及考察团的合作对象，文中提及其在业务规模、发展模式、管理状况和盈利能力上存在差异性，并涉及铜融资规模增长及异地贷款管理难度。规划中提及外资银行构成山东省较为完善的银行业机构体系，并设定了资产规模目标。同时，外资银行也是鼓励参股城市中小金融机构、在本地设立分支机构以增加贷款融资供给的境外银行机构类型。"}, {"id": "农村合作银行", "label": "农村合作银行", "group": "ORGANIZATION", "value": 149, "title": "农村合作银行（简称农合行）是由符合条件的农村信用社、信用合作联社或县级联社，通过增资扩股、提高资本充足率及产权制度改革组建的新型农村金融机构。其组建通常采取股份合作制形式，在条件具备地区积极推行，旨在实现自主经营、自担风险。该机构属于法人金融机构，是农村合作金融机构的具体类型之一，与农村信用社、农村商业银行共同构成农村信用社改革的主要组织形式及目标机构。\n\n在监管与管理体系上，农村合作银行受省联社的管理、指导、协调与服务，是省联社的组成成员之一，可自愿向省联社入股。其经营班子新提拔人员需面向全省公开竞聘，并需实行外部审计制度及机构扁平化改革。在财务与会计处理方面，其财务管理暂按信用社办法执行，涉及“拨入营运资金”等科目核算，并允许按新会计制度计提减值准备。\n\n在业务与合规层面，农村合作银行作为存款类金融机构，可开办借记卡业务，执行相对较低的存款准备金率，并需密切关注资本充足水平及盈利能力。其开办衍生产品交易业务需向当地银监局提交材料并报银监会审批。在统计与报送方面，该机构属于农村中小金融机构，在网点平均案件率等指标统计中未与其他同类机构区分，需按规定报送县级及以上人民币、外汇及本外币汇总数据。\n\n地域分布上，农村合作银行广泛存在于云南丽江、山东、河北、甘肃、安徽、十堰等地。例如，云南省将其作为深化农村信用社改革的另一类法人机构；山东省截至2004年末共有3家，属于地方金融机构；甘肃省有4家拟改制机构；安徽省内新设机构享受工商登记注册费用减免。\n\n在政策执行与通知转发方面，农村合作银行是人民银行各分支机构、银监局及省联社要求转发各类通知、指引及统计制度的辖区内金融机构类型之一。相关文件包括银发[2004]51号、银发[2008]321号、银发[2010]195号等，涉及信贷支持、检查对象、数据报送及费用分摊等内容。此外，该机构也是银行及其他金融业普查对象，省、地、县级作为法人单位参与统计。在行政许可方面，其筹建、开业、分理处设立及新设合并等事项需经银监部门审批，新设合并机构承继原机构债权债务。"}, {"id": "国有商业银行", "label": "国有商业银行", "group": "ORGANIZATION", "value": 147, "title": "国有商业银行是中资商业银行的一种类型，也是全金融机构及主要金融机构A、B的组成部分。在监管架构上，其法人机构、总行营业部、一级分行、二级分行及境外机构均受银监会或银监局/分局监管。\n\n在行政许可与审批方面，银监会直接受理、审查并决定其法人机构筹建、开业、解散、破产申请；变更注册资本、境外上市、修改章程、变更住所、组织形式、分立、合并等事项；以及境外机构设立、投资及法人机构变更名称。此外，银监会直接受理其开办衍生产品交易、电子银行、信用卡、离岸银行、股票质押贷款、企业年金基金受托、个人理财、合格境外机构投资者境内证券投资托管、全国社会保障基金托管等特定业务申请；发行银行卡、募集次级定期债务、发行次级债券及外汇业务、债务资本补充工具申请；以及投资设立、参股、收购境内法人金融机构和设立分行及分行级专营机构的申请。\n\n在人员任职资格方面，其法人机构和总行营业部高管任职资格由银监会直接决定；一级分行（含直属分行）高管由银监局核准；境外机构董事和高管任职资格由法人机构向银监会提交。拟任董事长、副董事长需满足特定学历及工作年限要求。\n\n在业务运营与统计方面，国有商业银行在县域内设有分支机构，属于奖励对象范围；在开户存款方面与农村信用社享有同等待遇；是开设养老保险基金专户、接收粮食企业附营业务贷款及债权债务划转、小额担保贷款经办、城投公司扩大合作范围及以经营性资产作抵押贷款的金融机构类型之一。其省、地、县级分支机构在银行及其他金融业普查中视同法人单位。作为统计检查总结工作的参与方，需报送地市级及以上人民币、外汇、本外币汇总数据、季度损益表、上市公司存贷款情况统计表及周报数据。\n\n在改革与风险管控方面，文中提及该类银行需推进股份制改造和商业化改革，被剥离不良资产作为来源方，并需加强监管、完善内控制度、防范信贷风险。部分机构因收缩县及以下网点和上收信贷管理权限，对市域经济信贷支持受到制约。同时，需发挥内设中小企业信贷部门作用，提高对非公有制企业贷款比重，打破所有制界限为个体私营企业技术升级提供信贷支持。\n\n在司法与特定事项中，国有商业银行（如中国建设银行股份有限公司济南历下支行等）曾作为不当得利返还请求的被告方。其保卫部（处）是所辖系统金融诈骗案件报告受理的最高部门。该类型银行也是银发〔2008〕321号、银发〔2010〕165号、银监发〔2009〕109号等通知的受文单位或接收对象，并参与机构设在沈阳的大会主会场。"}, {"id": "交通银行", "label": "交通银行", "group": "ORGANIZATION", "value": 138, "title": "交通银行是国有控股商业银行，亦被描述为公有制为主的股份制社会主义金融企业。其组织架构实行董事会领导下的总经理负责制，拥有总管理处、内地分行及香港分行，其中总管理处和内地分行具备企业法人资格。该银行不按行政区划设置分支机构，经批准可在试点城市设立分行，并需建立自我控制制度接受监督。\n\n在监管与业务规范方面，交通银行是多项监管通知的主送或受文单位，包括银发〔1990〕176号、银发〔1994〕276号及银发〔1995〕95号等文件。作为非现场稽核监督对象，其系统内发生的担保由总行负责落实解决。该银行被要求建立统计报告制度并上报统计报表，控制人民币业务范围并备案，贯彻执行《离岸银行业务管理办法》，转知所属代理行，并遵照执行《个人住房担保贷款管理试行办法》。在特定评估规则中，交通银行与浦东发展银行一同作为例外情况，不遵循“以最高一级机构为评估对象”的原则。此外，该银行被批准从事短期融资券主承销业务，受委托办理住房公积金信贷业务，并提供基建、技改贷款。\n\n在信贷与业务拓展方面，交通银行参与对288户移交企业贷款的清理核实工作，其省内分支机构涉及可疑类贷款检查和整改。在2010年增贷指导任务中，该银行作为被监管/指导对象之一，需确保增量13亿元，争取增量16亿元。业务要求包括推广“供应链”融资项目，试点沃德财富网点小企业业务，支持大型储运物流公司发展，以实现零售信贷与私人银行互相促进。根据国务院通知，该银行曾涉及重新组建，开展投资、租赁、证券等业务，并设立内地及海外分支机构。\n\n在机构关系与具体案例中，交通银行吉林分行船营支行长春路分理处是其下级机构，原文中提及该分理处时简称“交通银行”。2007年12月，交通银行通过定向增发入股常熟农村商业银行5756万股，成为其第一大股东。该银行还参与主权担保融资业务，其汇票与中国人民银行共用一色，并被要求适当集中资金优先支持国家重点资金需要。"}, {"id": "人民银行", "label": "人民银行", "group": "ORGANIZATION", "value": 138, "title": "人民银行（中国人民银行）是中国的中央银行，在输入文本中作为核心监管机构及政策执行主体出现。其职能涵盖宏观审慎管理、金融稳定维护及具体业务监管。\n\n**一、 机构性质与层级**\n人民银行指代中央银行及其在地方的分支机构（如人行合肥中心支行等）。文中提及各级行需向同级监管机构抄报现金收支计划，并配合省政府、银监局等部门做好改革工作。其系统内部涉及会计分录中的同城往来对手方，以及作为存放定期存款的金融机构进行利息收支核算。\n\n**二、 农村信用社改革与监管**\n人民银行是农村信用社改革试点的核心主导机构。\n1. **政策制定与发文**：作为《农村信用社改革试点专项中央银行票据操作办法》的发文机关，负责制定专项票据兑付标准、逾期贷款罚息规定及涉农贷款统计口径。\n2. **资金支持**：通过发行专项票据和发放专项借款，帮助农村信用社消化历史包袱、置换不良贷款及历年挂账亏损。文中提及农村信用社按规定向其申请临时支持。\n3. **监管职责**：依法加强对农村信用社的监督管理，负责农村信用合作管理部门人员任职资格审查，加强对贷款呆帐核销工作的检查与监督，并指导辖区内金融机构涉农贷款统计工作。\n4. **协作机制**：参与政、银、企沟通协调机制，与财政部、劳动保障部、商务部等共同下发文件或接受拜访。\n\n**三、 信贷政策与统计管理**\n1. **基准利率与利率政策**：公布同档同期基准利率，批准公布政策性贷款利率，确定扶贫贷款基准利率，并实施相关利率政策。\n2. **统计与数据**：提出统计报表报送要求及规定报送时间，发出关于报送金融统计数据及1997年金融统计制度补充通知。负责建立企业信用信息基础数据库，运用信贷征信咨询系统，牵头组织各商业银行、农信社研究制定银行业对社区进行信用评价的指标项目及打分标准，并动态调整评估项目、分值及权重。\n3. **贷款管理**：颁布《银行贷款损失准备计提指引》，下达垫付贷款规模，负责经理国库、外汇管理及金融改革监督。\n\n**四、 市场准入与违规处罚**\n1. **资格审批**：批准金融机构拆入/拆出资金资格，接收拆借业务情况报告；批准企业开户；批准企业债、公司债合法公开发行。\n2. **违规处理**：对多头开户企业进行处罚，处理金融机构违约行为，需从政策、结算、信贷等方面对逃废债务行为加大制裁力度，配合人民法院对恶意逃废债单位实行联合制裁。对企业重组、改制、破产不规范及逃废债务行为不得办理审批和登记手续。\n\n**五、 其他职能**\n参与企业改制工作领导机构组成，负责宏观调控，加强金融运行监测和窗口指导，引导督促商业银行落实政策。在丹东市投融资领导小组及信用促进会中作为成员单位或理事单位参与。负责会同有关部门提出解决老少边穷地区农村金融服务问题意见，并配合做好征信知识普及和助学贷款政策导向效果评估工作。"}, {"id": "山东省人民政府关于做强做大我省金融业的意见", "label": "山东省人民政府关于做强做大我省金融业的意见", "group": "REGULATION", "value": 137, "title": "《山东省人民政府关于做强做大我省金融业的意见》（鲁政发〔2006〕123号）是山东省人民政府于2006年11月23日发布的政策性文件。该文件旨在提出做强做大山东省金融业的指导意见，其制定依据为《山东省“十一五”金融业发展规划纲要》。\n\n该文件适用于全省金融业发展，涵盖信贷、保险、资本市场、证券、期货、信托及金融市场等多个领域。在具体内容上，文件涉及加强金融监管、完善风险防范机制、财政风险防范、政策扶持、保险创新、企业上市扶持、中小企业融资及吸引外资等方面。此外，文件还专门提及了农村信用社改革等相关内容。\n\n各描述来源在细节侧重上存在差异：部分描述强调其作为促进金融业发展的政策属性；部分描述具体列出了信贷、保险、资本市场等涉及领域；另有描述重点提及了金融监管、风险防范、财政风险、政策扶持、保险创新、企业上市、中小企业融资及吸引外资等具体举措；还有描述特别指出了农村信用社改革、证券、期货、信托及金融市场发展等内容。所有描述均确认发文机关为山东省人民政府，文件文号为鲁政发〔2006〕123号，发布时间为2006年11月23日，且均指向同一份关于做强做大全省金融业的政策性文件。"}, {"id": "借款人", "label": "借款人", "group": "PERSON", "value": 135, "title": "“借款人”在各类金融业务中作为核心债务主体，指代资金借入方或贷款申请人，具体涵盖以下角色与义务：\n\n1. **一般及委托贷款**：在代理贷款、委托贷款及城市商业银行贷款业务中，借款人接收贷款通知书、特种转存凭证及利息清单，负责归还本金及利息，填写还款凭证。在委托贷款中，由委托人指定并与金融机构订立合同。\n2. **个人住房及商业用房贷款**：包括申请个人住房担保贷款、组合贷款或个人商业用房贷款的自然人。需满足特定条件，如具有武汉市城镇常住户口、足额缴存住房公积金、满足首付比例及房屋状态要求。义务包括按月归还本息、保管抵押物、办理财产保险，并在变动时向经办银行和学校通报。\n3. **国家助学贷款**：主体为贫困学生及其父母或监护人，作为资金使用人需如实提供材料、按时还本付息、办理还款确认手续。可提前还贷或申请展期，其违约情况可能影响高校列入计划资格。\n4. **小额担保及扶贫贷款**：包括申请失业人员小额担保贷款、劳动密集型小企业贷款、扶贫贷款及农户联保贷款的自然人或企业。申请人需具备完全民事行为能力，经信用社区、妇联组织推荐或调查评估，参加创业培训并取得合格证书，完成创业计划书论证。需建立经济档案，接受信贷监督，配合银行联系，恶意逃废贷款将被纳入不良记录且不得再次申请。\n5. **出口卖方信贷**：向中国进出口银行申请，以票据正本作为权利凭证的自然人或法人。\n6. **储备棉贷款**：申请中央或地方储备棉贷款并需偿还本息的责任主体。\n7. **抵债与风险处置**：在以资抵债业务中作为抵债方之一，与担保人并列；在接收抵债资产过程中，若与内部人员串通使资产低值高估，则为责任主体。作为贷款合同债务人，其财务状况、还款记录及法律状态（如破产、死亡、失踪）影响贷款分类。到期不还款或未还清本息时，面临强制执行，参与抵债资产协商或作为资产退还对象。\n\n上述描述基于不同业务场景及文件规定，各主体在特定条件下承担相应的还款、配合及法律责任。"}, {"id": "中国人民银行兰州中心支行关于金融支持西部大开发促进甘肃经济发展的指导意见", "label": "中国人民银行兰州中心支行关于金融支持西部大开发促进甘肃经济发展的指导意见", "group": "REGULATION", "value": 134, "title": "该实体为《中国人民银行兰州中心支行关于金融支持西部大开发促进甘肃经济发展的指导意见》。这是一份由中国人民银行兰州中心支行制定，并经甘肃省人民政府办公厅印发的政策指导文件。文件内容主要涉及金融支持西部大开发战略及促进甘肃经济发展的相关指导原则与措施。"}, {"id": "中国人民银行、中国银行业监督管理委员会公告〔2004〕第20号", "label": "中国人民银行、中国银行业监督管理委员会公告〔2004〕第20号", "group": "REGULATION", "value": 131, "title": "中国人民银行与中国银行业监督管理委员会于2004年12月17日联合发布《公告〔2004〕第20号》。该公告旨在公布第一批共计110件规章和规范性文件的清理结果。根据输入信息，该文件目前状态为现行有效。公告明确列出了这110件文件的处理情况，作为监管体系内规范性文件清理工作的阶段性成果。"}, {"id": "银监会", "label": "银监会", "group": "ORGANIZATION", "value": 131, "title": "银监会是中国银行业监督管理委员会的简称，作为银行业监管机构，在多项文件中以联合发文机关或独立发文机关身份出现。其联合发文对象包括教育部、财政部、中国人民银行、商务部等，涉及文件如《国务院办公厅转发教育部财政部人民银行银监会关于进一步完善国家助学贷款工作若干意见的通知》及《财政部、教育部、中国人民银行、银监会关于调整完善国家助学贷款相关政策措施的通知》。2005年2月28日，该机构主办或参与了关于加快落实国家助学贷款新政策的电视电话会议。\n\n在监管职责方面，银监会负责制定行政许可规章、审批权限及材料要求，并解释相关指引及批准新资本协议实施。其具体监管事项涵盖：\n1. **机构设立与变更**：受理、审查并决定外商独资银行、中外合资银行、国有商业银行、股份制商业银行、城市商业银行、农村商业银行、村镇银行及一级分行的筹建、变更组织形式、合并、分立、解散及修改章程申请；负责支行升格为分行、社区支行及小微支行发展规划的审查；受理省联社筹建申请及领导班子拟任人选资格审查。\n2. **人员任职资格**：负责境外机构董事、高级管理人员及特定机构高管的任职资格申请受理、审查和决定，并接收任职报告。\n3. **政策制定与落实**：提出农村信用社产权制度改革规定、涉农贷款统计口径、支持小微企业发展规定（含“两个不低于”目标）、风险防范措施（如“十三条意见”、“4＋1”、“5W”、“十个联动”）；发布关于规范向合作金融机构入股、调整放宽农村地区银行业金融机构准入政策、加强客户投诉处理等规定；制定农村商业银行筹建标准及审慎性条件。\n4. **监督检查与数据管理**：依法加强对农村信用社、县域金融机构的监督管理，审查信用社增资扩股的真实性与合规性；接收人民银行总行共享的统计数据、年度支行发展规划及审批结果抄报；要求按特定统计口径报送“资产总计”等指标；接收辖区内农副食品生产和市场供应动态信息；参与专项借款审查与考核；会同有关部门研究邮储资金返还农村办法并试点。\n\n此外，银监会是上级监管机构，其派出机构（如广西银监局）需向其反映会计业务问题，其各级派出机构负责具体审查工作。该机构还曾召开村镇银行培育发展十周年新闻发布会，并接待中国银行业协会外资银行工作委员会及财政部、商务部等部门的拜访。文中提及的“资产总计”指标报送参照其统计口径，且其关于支持小微企业发展的规定被要求落实。"}, {"id": "甘肃省深化农村信用社改革试点实施方案", "label": "甘肃省深化农村信用社改革试点实施方案", "group": "REGULATION", "value": 131, "title": "《甘肃省深化农村信用社改革试点实施方案》是经国务院批准，由甘肃省人民政府办公厅于2005年4月5日印发的具体实施文件。该方案旨在深化甘肃省农村信用社改革试点，明确了分阶段改革计划及具体安排。\n\n在机构组建与法人治理方面，方案包含组建农村合作银行、统一法人改组等具体安排。在资产质量与资本充实方面，方案规定了不良贷款置换、增资扩股及降低不良贷款的措施安排。\n\n该文件作为甘肃省深化农村信用社改革试点的具体实施方案，由甘肃省人民政府办公厅负责印发，适用于甘肃省范围内的农村信用社改革试点工作。"}, {"id": "中国银行", "label": "中国银行", "group": "ORGANIZATION", "value": 129, "title": "中国银行是国有独资商业银行，也是专业银行及境内金融机构。在监管与业务关系中，其作为被监管对象，总行设有驻行监管小组，受人民银行各级机构业务活动稽核及总行考核。在2010年增贷指导任务中，其被下达确保增量60亿元、争取增量70亿元的任务。\n\n在文件发文与受文方面，中国银行是《中国银行不良资产联动清收处置办法》及《中国银行抵债资产处置管理办法(试行)》的发文机关及总行主体。同时，它是银发〔1987〕40号、银发〔1990〕176号、银发〔1994〕276号等文件的受文单位，以及银发〔1993〕113号文件的联合发文机关。在多项通知中，它既是主送单位、受文单位或接收单位，也是联合发文机关之一。\n\n在业务职能上，中国银行承担多项特定业务：\n1. **贷款与信贷**：作为2003年度国家助学贷款计划执行机构之一，被下达6亿元指导性计划额度；负责办理贷款及代偿结算。它是受委托办理住房公积金信贷业务的承办银行之一，提供基建、技改贷款，并负责安排外贸出口产品收购资金贷款。对288户移交企业有贷款余额60.27亿元。\n2. **代理与结算**：负责代理国家开发银行贷款业务及统计报表制度，作为委托代理经办行督促借款单位报送报表。发布“外汇中间牌价”，其汇率用于外币业务数据折算。经营国家外汇所需人民币资金由人民银行另立户头供应。\n3. **资产处置与核算**：负责修订会计核算手续及办理划转贷款。其省内分支机构涉及可疑类贷款检查和整改。\n4. **其他业务**：负责办理机电产品出口卖方信贷业务，设帐户核算及提交复写帐页。同意扩大其记账式国债柜台交易业务分行范围。行内电子汇兑系统已联调成功。其汇票和支票按行分色。\n\n在特定事项中，中国银行涉及以下情况：\n- 侨资外资金融机构获准设立的常驻代表机构及派出机构须持登记证在其开立帐户。\n- 信贷计划管理等规定自1984年4月1日起在其机构实行。\n- 被要求利用搭桥贷款、项目融资等方式支持高速公路、大秦铁路、中南部铁路项目建设，并推动淡马锡中小企业加工厂相关业务及推广供应链融资产品。\n- 作为债权金融机构，具体承办主权担保融资业务。\n- 涉及追回被骗贷款及在福建被起诉的案件，以及处理外贸企业破产核销呆账和解决政策性因素造成的贷款损失问题的请示与复函。\n- 其监察部曾呈报请示并收到复函。\n- 被要求控制人民币业务范围并备案，贯彻执行《离岸银行业务管理办法》，遵照执行《个人住房担保贷款管理试行办法》。\n- 在表格中列明为贷款经办银行之一，附件中列示了其各地区贷款额度。"}, {"id": "河南省教育厅、河南省财政厅、人行郑州中心支行等关于表彰全省国家助学贷款工作先进集体和先进个人的决定", "label": "河南省教育厅、河南省财政厅、人行郑州中心支行等关于表彰全省国家助学贷款工作先进集体和先进个人的决定", "group": "REGULATORY_ACTION", "value": 129, "title": "该实体为一份联合发布的表彰决定，全称为《河南省教育厅、河南省财政厅、人行郑州中心支行等关于表彰全省国家助学贷款工作先进集体和先进个人的决定》。\n\n发文机关包括：河南省教育厅、河南省财政厅、中国人民银行郑州中心支行（亦称人行郑州中心支行）、中国银行业监督管理委员会河南监管局。\n\n发布时间：2006年8月28日。\n\n文件性质与目的：旨在表彰全省国家助学贷款工作中的先进集体和先进个人。\n\n适用对象：全省国家助学贷款工作相关的先进集体和先进个人。\n\n注：输入描述中关于发文机关的表述存在细微差异，一处明确列出“中国银行业监督管理委员会河南监管局”，另一处使用“等”字概括，但核心发文主体一致，均指向上述四家机构联合发布。"}, {"id": "政策性银行", "label": "政策性银行", "group": "ORGANIZATION", "value": 128, "title": "政策性银行是依法设立的、执行国家特定经济政策且不以营利为主要目的的金融机构，属于银行业金融机构范畴。其组织体系包括总行本级、直属机构及分支机构（含分行、二级分行等）。\n\n在监管与合规方面，政策性银行受《国家政策性银行财务管理规定》约束，需执行财务计划、编制财务决算、提取呆帐准备金、执行利率政策、进行财务核算及报送报表，并接受财政部的监督与检查及利差补贴核定。在业务准入与风险管理上，开办衍生产品交易业务需由法人统一向银监会申请；可参照《商业银行内部控制指引(征求意见稿)》及贷款风险分类指导原则建立内部制度，标准不应低于相关规定。在监管报告义务中，需向中国人民银行报送地市级及以上人民币、外汇及本外币汇总数据、季度损益表、上市公司存贷款情况统计表及监管报表资料；需配合函证工作并在10个工作日内回函；需向人民银行反映动态情况并报送周报数据；参与银行及其他金融业经济普查。在贷款管理方面，需执行贷款五级分类，按规定频率（如1999年每半年，2000年起按季）报送分类结果。\n\n在行政许可与人事管理方面，其分行筹建申请由银监局或直属分局受理并审核；二级分行高管任职资格由银监分局核准；适用高级管理人员平级调岗转任备案制度；参照执行机构许可和任职资格许可条件。\n\n在地方经济与考核方面，在咸阳市连续经营满一年的政策性银行作为特殊考核对象，仅选取贷款增加额和增长率两个指标进行考核；在山东省银行业机构体系中作为补充机构类型，与商业银行服务互补；在鹰潭市辖内适用相关指导意见。此外，政策性银行是银办发〔2000〕156号、银发〔1995〕95号、银发〔2002〕42号、银发〔2008〕321号、银监发〔2009〕109号及财协字〔1999〕1号等多份监管通知的受文单位或适用主体，涉及非现场稽核监督、计算机机房及柜面设备安全防护、市场参与者身份确认等事项。部分通知中提及的“不上报资产负债比例管理执行情况报告书”或“机构设在沈阳的参会金融机构”等具体情形，均指代该类机构在特定语境下的角色。"}, {"id": "1997年度农村信用社会计决算工作意见", "label": "1997年度农村信用社会计决算工作意见", "group": "REGULATION", "value": 125, "title": "“1997年度农村信用社会计决算工作意见”是规定1997年度农村信用社会计决算工作的具体文件。根据输入信息，该文件存在两个不同来源的版本，分别由不同机关印发，具体描述如下：\n\n第一，由中国人民银行和国家税务总局于1997年12月2日印发，文号为银发〔1997〕518号。该文件作为银发〔1997〕518号通知所附的具体工作意见，规定了1997年度农村信用社会计决算的指导思想、准备工作要求、决算准备、清产核资、信贷资金清理、股金管理及财税政策等事项。内容涵盖会计科目的增设、取消、代号及名称变更等调整，相关会计科目的核算说明，损益类账户增减，以及报表种类、上报程序、利润分配及财务计划调整等要求。目前该文件状态为失效/废止。\n\n第二，由京银发〔1998〕13号通知印发，作为该通知的附件1。该文件具体规定了1997年度北京市农村信用社会计决算的工作要求。内容涉及农村信用社的会计科目调整及使用说明、各项费用提取标准、贷款科目的核算规则、表外科目的核算说明、年终决算要求，以及联社财务管理等具体业务操作规范。\n\n上述两个版本分别对应不同的发文机关（中国人民银行/国家税务总局 vs 京银发〔1998〕13号通知所属机关）和文号（银发〔1997〕518号 vs 京银发〔1998〕13号附件），适用对象均涉及农村信用社，但前者侧重全国性的科目调整与决算政策，后者侧重北京市内的具体业务操作与决算要求。两者在时间上存在差异，前者印发于1997年12月，后者通过1998年的通知印发。"}, {"id": "小额担保贷款", "label": "小额担保贷款", "group": "BUSINESS", "value": 125, "title": "“小额担保贷款”是一种旨在促进就业再就业、支持弱势群体发展的特定信贷业务，主要面向下岗失业人员、大中专毕业生、退役军人、农民工及吸纳上述人员的劳动密集型小企业等群体。该业务涵盖个人微利项目贷款和劳动密集型小企业贷款，借款人需经劳动保障部门审核确认，并通常需经社区推荐、担保机构承诺担保（部分情形下可降低反担保门槛或采用联保形式），由经办银行（含商业银行、农村信用社等）发放。\n\n在政策与监管要求方面，该业务享有财政贴息支持，涉及贴息资金的分担与管理。贷款额度方面，个人贷款原则上每人2万元，最高3万元；合伙经营最高8万元；针对“禁摩”失业人员从事出租车司机岗位的特定额度为每人7000元。贷款期限一般不超过两年，部分特定业务年限为1年。还款方式多为到期一次还本，贴息按季进行。利率方面，文中提及允许利率上浮。\n\n监管与管理机制包括：设立担保基金，建立呆账补偿及代偿机制；对经办银行实行单列科目、单独统计，并在质量考评中给予豁免或特定考核要求；规范审批流程，简化手续，同时加强贷后管理。文件要求扩大覆盖面，推广“创业培训+小额担保贷款”模式，增加试点信用社区数量，降低贷款门槛，并提高运作水平。\n\n历史数据与目标方面，2006年曾设定发放6000万元信贷业务的目标。不同文件对适用对象和具体操作细节有所侧重，如针对妇女、退耕还林失地农民等特定群体的专项规定，以及依据《关于进一步推动下岗失业人员小额担保贷款工作的通知》等文件对劳动密集型民营企业的支持。各文件在额度、贴息力度及反担保要求上存在差异，需依据具体发文时间和适用对象执行，不得将历史要求直接等同于当前标准。"}, {"id": "中资商业银行", "label": "中资商业银行", "group": "ORGANIZATION", "value": 121, "title": "“中资商业银行”指在中国境内设立的中资银行机构，是《中资商业银行行政许可事项实施办法》及其征求意见稿等法规的主要监管对象。该类别涵盖国有商业银行、股份制商业银行、邮政储蓄银行、城市商业银行、城市信用社股份有限公司等，适用主体包括其法人机构及境内外分支机构（如总行、分行、支行等层级）。\n\n在行政许可与业务管理方面，中资商业银行涉及机构设立、变更、终止、调整业务范围、收购其他金融机构或境外机构、参股境外机构等行政许可事项。部分业务审批和备案已被取消，需向银监会或所在地监管机构书面报告。其境内分支机构变更需符合相关行政许可规定，专营机构设立需参照相应层级分支机构设立条件和程序。\n\n在特定业务资格上，中资商业银行是实施设立自助银行、收购其他金融机构等业务的主体。对于开办衍生产品交易业务，需由法人统一向银监会申请，但城市商业银行、农村商业银行和农村合作银行除外。此外，中资商业银行涉及合格境外机构投资者（QFII）境内证券投资托管业务的开办，需适用相关报告制度。\n\n在资金存放与投资入股方面，中资商业银行可作为外国银行分行存放定期同业存款的指定机构。此类机构要求在中国境内设立、经营稳健且具有一定实力，且为外国银行分行的非关联银行，数量不超过3家。同时，中资商业银行也是接受境外金融机构投资入股或境内非金融机构发起设立的对象，其股份总额用于计算投资入股比例。经批复，部分中资商业银行可与国家邮政局邮政储汇局办理协议存款业务。\n\n上述描述基于不同文件版本及具体业务场景，涵盖了从一般监管主体到特定业务参与者的多重身份，保留了各来源中关于机构类型、业务范围及限制条件的具体规定。"}, {"id": "中国进出口银行", "label": "中国进出口银行", "group": "ORGANIZATION", "value": 121, "title": "中国进出口银行是国家政策性银行之一，也是国有政策性银行。作为受监管对象，其受财政部利差补贴核定机制约束，财政部根据其资金运用收入和来源综合成本，按保本经营原则核定利差补贴。\n\n该行是多项内部管理制度的印发机关及执行主体。在信贷业务管理方面，中国进出口银行印发并执行《中国进出口银行人民币信贷资金同业拆借管理办法实施细则》，负责实施同业拆借业务管理；印发《中国进出口银行关于出口卖方信贷贷款意向书的管理试行办法》，作为业务主体管理出口卖方信贷贷款意向书；印发《中国进出口银行出口卖方信贷项下票据质押贷款管理试行办法》，并负责该办法的解释和修订；印发《中国进出口银行对外承包工程项目贷款管理暂行办法》，作为贷款发放主体管理对外承包工程项目贷款。\n\n在会计核算与财务管理方面，中国进出口银行印发《中国进出口银行混合贷款会计核算暂行办法》，作为被监管/管理主体及文件所属机构执行相关核算；印发《中国进出口银行贷款业务项下的抵押品、质押品会计核算暂行办法》，作为执行主体和解释机关，负责贷款业务项下抵押品、质押品的会计核算。此外，该行还印发《关于修改我行业务统计制度的补充规定》通知，负责修订并印发业务统计制度，是相关制度的执行主体。\n\n在对外业务与合作方面，中国进出口银行提供信贷支持及服务贸易重点企业和项目，与商务部共同制定支持政策，提供独立审贷及接收推荐清单。该行参与出口信贷业务，具体承办主权担保融资业务，涉及利用出口信贷开展对外承包工程和成套设备出口业务。同时，该行作为债权金融机构，涉及外国政府转贷款业务核算原则及清理要求。其各经营单位在相关文件中列出了经营范围和联系方式。"}, {"id": "武汉城市圈资源节约型和环境友好型社会建设综合配套改革试验总体方案", "label": "武汉城市圈资源节约型和环境友好型社会建设综合配套改革试验总体方案", "group": "REGULATION", "value": 120, "title": "该实体为《武汉城市圈资源节约型和环境友好型社会建设综合配套改革试验总体方案》。该文件由湖北省人民政府印发，旨在推进武汉城市圈“两型”（资源节约型和环境友好型）社会建设的综合配套改革试验。\n\n根据输入信息，该方案经国务院批复原则同意，是湖北省人民政府实施具体改革试验的总体指导文件。其核心内容涉及体制机制创新，具体涵盖公用事业改革、基础设施共建、公共财政、公共服务及土地管理等领域。\n\n在名称表述上，不同来源存在细微差异，包括“武汉城市圈资源节约型和环境友好型社会建设综合配套改革试验总体方案”、“武汉城市圈‘两型’社会建设综合配套改革试验的总体方案”以及“武汉城市圈建设‘两型’社会综合配套改革的总体方案”等，均指向同一改革试验的总体规划。\n\n该方案明确了改革试验的适用范围为武汉城市圈，重点在于通过综合配套改革探索资源节约和环境友好的社会发展模式。作为省级政府印发的规范性文件，其效力基于国务院的批复同意，体现了中央对地方改革试验的支持与指导。\n\n需注意，输入描述中未提供具体的发文文号、确切发布时间、适用对象的具体界定（如特定企业或机构）、涉及的具体金额、比例或量化条件。因此，合并后的描述仅基于现有文本，保留其作为总体方案文件的性质、印发机关、改革领域及政策背景，不添加未提供的细节或外部法律结论。各描述在核心要素上保持一致，主要差异在于名称的简繁表述及是否强调“试验”二字，实质内容均指向武汉城市圈“两型”社会建设的综合配套改革总体部署。"}, {"id": "陕西省人民政府关于加快我省金融业发展的若干意见", "label": "陕西省人民政府关于加快我省金融业发展的若干意见", "group": "REGULATION", "value": 120, "title": "陕西省人民政府于2007年6月16日发布的《陕西省人民政府关于加快我省金融业发展的若干意见》。该文件旨在加快全省金融业发展，做强地方金融机构。\n\n文件内容涵盖多个方面：\n1. **政策扶持与激励**：包含财税优惠、人才激励、财政支持及领导体制等内容，旨在加大政策扶持力度。\n2. **金融市场发展**：涉及信托、证券、企业改制上市及金融机构引进；推动资本市场、产权市场、保险市场发展；优化信贷结构，加强信贷支持。\n3. **农村金融**：涉及农村金融发展相关内容。\n4. **监管与风险防控**：涉及金融生态建设及金融监管，强调加强金融监管、完善风险防范机制。\n\n该文件由陕西省人民政府发布，适用对象为全省金融业及相关机构。"}, {"id": "城市商业银行、城市信用合作社财务管理实施办法", "label": "城市商业银行、城市信用合作社财务管理实施办法", "group": "REGULATION", "value": 118, "title": "《城市商业银行、城市信用合作社财务管理实施办法》系由国家税务总局局长金人庆签署发布的财务管理办法，文号为国家税务总局令第3号。该办法自2002年7月1日起施行，由国家税务总局负责解释。其适用对象为境内依法成立的城市商业银行和城市信用合作社。\n\n在文件流转方面，该办法曾由河北省国家税务局转发，并作为相关通知的附件下发，属于被转发的具体财务管理法规文件。\n\n该办法内容涵盖银行及信用社财务管理的多个核心领域，具体规定如下：\n1. **基础财务原则与结构**：规定了财务原则、所有者权益及负债的管理要求，明确了成本、费用及收入的核算标准。\n2. **资产与费用管理**：详细规定了固定资产的计价、盘点、折旧方法及折旧年限，以及固定资产修理费的管理要求；明确了业务宣传费、广告费、业务招待费等各项费用的列支标准和条件；规定了现金资产、手续费、营业管理费等财务处理标准。\n3. **贷款与风险管理**：规定了贷款管理、不良贷款分类、呆账贷款的认定与核销标准，以及呆账准备的管理要求。\n4. **特殊业务处理**：规定了抵债资产的定义、取得方式、处置原则及价值确定；明确了投资及证券等业务的财务处理办法；规定了收入确认、利润计算、所得税及利润分配等财务处理规则。\n5. **财务报告与清算**：规定了财务报告、资产负债表、损益表及经营状况指标等内容；明确了清算财产的界定、清算程序、债务清偿顺序及财务报告要求。\n\n上述描述均基于输入信息整合，未添加外部知识或法律结论。"}, {"id": "市财政局", "label": "市财政局", "group": "ORGANIZATION", "value": 117, "title": "市财政局是地方政府职能部门，在多地（如北海、安顺、德阳、岳阳、大连、鹰潭、商洛、咸阳、合肥、丹东等）承担财政管理、资金监管及政策落实职责。\n\n**人员任职**\n该局有多位领导任职，包括局长刘绍卿、张建华、葛维琴，副局长常青、庞任平、张国平、李长祥、杨森、王晓琪、磨元荫，以及上官洪洋、石连忠、胡海燕、郭和平、陈会邦、王宏等工作人员。\n\n**主要职能与职责**\n1. **融资与债务管理**：作为2011年向国家开发银行融资工作的牵头单位，负责整体推动和落实。参与融资计划方案评估论证及年度融资计划编制。负责国家开发银行贷款资金投融资项目结算、竣工决算审查及批复。对政府投融资管理中心资产运营、政府债务借、用、还及偿债资金使用进行全过程监督。负责城投公司资金运行监管、单笔融资项目风险评估、督促资产增购计划实施及低风险状态整改执行。接收城投公司还款资金测算结果，将还款资金列入第二年度财政预算，并汇总报送国家开发银行贵州省分行。\n2. **贷款与担保支持**：与人民银行台州市中心支行联合开展小微企业贷款风险补偿工作。参与确定年度贷款计划、审查提款申请、出具补贴承诺或担保还款函，在借款法人违约时垫付资金。负责再就业小额贷款担保金市级匹配资金和贴息资金安排、监管、呆坏账处理牵头及与中央财政申报结算。接收区级担保机构月度报表及贴息申请，接收担保承诺函备案，必要时通过财政结算扣款代为扣回拖欠贷款。在区县不能按时足额还贷时，负责扣划资金用于归还到期本息。\n3. **农村信用社改革**：作为全市农村信用社深化改革工作领导小组成员单位，负责农村信用社保值储蓄贴补利息专项审核。负责全面落实农村信用社改革配套的财政扶持政策，帮助高风险县级联社争取省财政风险补偿金。参与制定支持农村信用社业务发展意见，帮助和支持农村信用社。\n4. **其他专项工作**：\n   - **粮食与农业**：作为《关于我市粮棉油收购资金封闭运行实施意见》联合发文单位之一。负责农民专业合作组织相关工作。\n   - **教育与基建**：参与安顺职业技术学院评估及安顺二中建设工作。负责普九化债及院校建设资金保障。负责按国库集中支付有关规定向市教委拨款。\n   - **城市与民生**：参与住房保障和房价稳定工作。负责南航路改造、友爱路段拆迁安置等工作。参与推进企业战略重组工作。参与职业教育园区建设及自主创新机制完善。\n   - **考核与监督**：作为咸阳市金融机构支持地方经济发展考核领导小组成员部门，负责安排考核奖励专项资金。参与重大工程项目备案报告接收及全过程监督。负责地质环境恢复治理保证金征收工作。\n   - **其他**：会同市人力资源社会保障局、市编办等部门负责事业单位岗位设置管理制度改革。参与集体林权制度改革。负责第74项完善公共财政体系工作。\n\n**文件与机构关系**\n该局是汉政办发〔2008〕98号通知的主送机关之一。作为多个领导小组（如丹东市投融资领导小组、市推进农村信用社改制组建农村商业银行领导小组、市贷款项目资金审批小组、郑州市商业银行重组工作领导小组、贷款项目资金审计小组等）的成员单位。在政策范围内对不良贷款处置等给予支持。"}, {"id": "中国人民银行天津分行对金融机构的日常管理指引", "label": "中国人民银行天津分行对金融机构的日常管理指引", "group": "REGULATION", "value": 115, "title": "该文件由中国人民银行天津分行于2011年12月22日印发、发布并生效，为现行有效的规范性文件。其旨在规范对天津市金融机构的日常管理，明确了相关职责、要求及主要内容。\n\n文件涵盖的管理领域包括：\n1. 基础业务与财务：存款准备金、会计核算、会计财务、现金业务及现金管理。\n2. 支付与清算：支付清算、代理国库及国债业务。\n3. 统计与征信：统计工作、征信管理、国际收支统计。\n4. 外汇与跨境业务：结售汇、外汇业务办理、外汇经营、跨境人民币业务。\n5. 合规与风险：反洗钱、金融稳定、金融科技。\n6. 其他：信贷管理、金融消费者权益保护。\n\n所有描述均指向同一发文机关、同一时间（2011年12月22日）及同一效力状态（现行有效），内容互为补充，无冲突信息。"}, {"id": "中国银行业监督管理委员会合作金融机构行政许可事项申请材料目录及格式要求", "label": "中国银行业监督管理委员会合作金融机构行政许可事项申请材料目录及格式要求", "group": "REGULATION", "value": 115, "title": "该实体为《中国银行业监督管理委员会合作金融机构行政许可事项申请材料目录及格式要求》，系由中国银行业监督管理委员会发布的规范性文件。该文件于2006年9月5日发布并生效，目前状态为失效或废止。\n\n该文件主要规定了合作金融机构各类行政许可事项的申请材料目录及格式要求。具体涵盖的行政许可事项包括：\n1. 机构设立与变更类：农村合作银行法人机构筹建审批；合作金融机构变更名称、住所、组织形式及股权等事项。\n2. 重大重组与经营类：合作金融机构分立、合并、收购、临时停业等事项。\n3. 人员任职资格类：合作金融机构理事（董事）和高级管理人员任职资格核准。\n\n所有描述均指向同一份2006年9月5日生效的监管文件，内容一致，无冲突信息。该文件现已失效，不再作为当前监管依据。"}, {"id": "境内大中小型企业贷款专项统计制度", "label": "境内大中小型企业贷款专项统计制度", "group": "REGULATION", "value": 114, "title": "由人民银行和银监会制定的专项统计制度，自2009年1月开始实施，为季度报表"}, {"id": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "label": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "group": "REGULATION", "value": 114, "title": "《中资商业银行行政许可事项实施办法》（征求意见稿）是中国银行业监督管理委员会（中国银监会）于2013年8月9日公开征求意见的部门规章草案，附件为修改稿。该文件旨在规范中资商业银行的行政许可行为，规定了中资商业银行法人机构及境内分支机构各类行政许可事项的具体条件、程序及实施办法。\n\n在机构设立方面，草案规定了中资商业银行法人机构及境内分支机构（包括分行、支行、专营机构等）的筹建、设立、开业等行政许可事项。其中，法人机构设立涉及发起人条件、资格及持股比例限制等具体要求。\n\n在机构变更与终止方面，草案规定了中资商业银行机构变更、终止以及业务范围调整等行政许可事项的具体程序和要求。\n\n在人员任职资格方面，草案规定了中资商业银行董事、高级管理人员的任职资格条件及许可程序，明确了相关行政许可的具体要求。\n\n此外，草案还涉及中资商业银行境外投资等行政许可事项的具体条件和程序。\n\n综上，该草案全面涵盖了中资商业银行在机构设立、变更、终止、业务范围调整、境外投资以及董事和高级管理人员任职资格等方面的行政许可条件与程序。"}, {"id": "鲁国税函〔2006〕166号", "label": "鲁国税函〔2006〕166号", "group": "REGULATION", "value": 113, "title": "鲁国税函〔2006〕166号是由山东省国家税务局发布的规范性文件，旨在明确农村信用社2005年度上缴管理费税前扣除的相关问题。该文件于2006年6月16日发布，同日生效。根据现有描述，该文件目前处于现行有效状态。其适用对象主要为农村信用社，核心内容涉及2005年度上缴管理费的税前扣除处理。两份描述在发文机关、文件名称、发布日期、生效日期及效力状态上保持一致，均确认该通知由山东省国家税务局于2006年6月16日发出并现行有效，未出现信息冲突或差异。"}, {"id": "农村商业银行", "label": "农村商业银行", "group": "BUSINESS", "value": 110, "title": "农村商业银行是由辖内农民、农村工商户、企业法人和其他经济组织共同发起成立的股份制地方性金融机构。该机构类型通常由农村信用合作联社或农村信用社改制组建，旨在建立具有现代管理体制的银行机构，并需坚持服务“三农”的宗旨。\n\n在组建形式上，农村商业银行是文件鼓励符合条件的设区城市组建的农村合作金融组织形式之一。以苏州市为例，自2001年起，当地开始由农村信用联社改制组建此类金融机构，全市已先后改制组建6家。作为农村信用社改制的目标形态，农村商业银行在规划中被确定为具有现代管理体制的银行机构。\n\n上述描述综合了不同来源对农村商业银行的定义、起源及功能定位：\n1. 关于机构性质，描述一致指向其为股份制地方性金融机构，发起人包括农民、农村工商户、企业法人及其他经济组织。\n2. 关于组建背景，部分描述强调其由农村信用合作联社改制而来，另一部分描述则指出其为设区城市鼓励组建的农村合作金融组织形式，两者在适用场景上存在差异，前者侧重改制路径，后者侧重政策鼓励方向。\n3. 关于具体案例，苏州市自2001年起实施改制，已组建6家，此为特定地域的历史事实，不改变该机构类型的通用定义。\n4. 关于功能定位，所有描述均确认其需坚持服务“三农”宗旨，并具备现代管理体制。\n\n各描述间无直接冲突，均为对同一实体不同侧面（定义、起源、案例、目标）的补充说明。"}, {"id": "金融资产管理公司统计制度", "label": "金融资产管理公司统计制度", "group": "REGULATION", "value": 109, "title": "该实体为《金融资产管理公司统计制度》，由中国人民银行于2001年4月17日印发，文件文号为银发〔2001〕100号。该制度自2001年1月1日起生效，目前状态为现行有效。作为银发〔2001〕100号通知的附件，该制度旨在规范金融资产管理公司的统计报送工作，明确了统计指标、报送范围、频度及格式。\n\n在具体内容上，该制度规定了金融资产管理公司的统计报表科目及项目，涵盖利息支出、证券发行成本、债权重组损失等资产负债统计科目。同时，制度详细定义了统计指标及其释义，包括资产回收率、处置资产变现率、债转股回收率、购入资产折现率、资产处置进度等，并规定了非现场监测指标的计算方法。\n\n此外，该制度对数据报送的技术规范进行了规定，包括数据文件格式、字段定义、编码规则、报表项目及指标编码、校验关系以及数据报送接口规则。通过上述规定，该制度统一了金融资产管理公司在资产处置、债转股、资产回收等方面的统计标准与数据报送要求。"}, {"id": "中国建设银行", "label": "中国建设银行", "group": "ORGANIZATION", "value": 106, "title": "中国建设银行是国有独资商业银行，在多项监管文件中作为发文机关、主送对象或业务主体出现。\n\n在资产委托管理处置方面，该行是相关办法的制定方及委托方（甲方），负责提供转股债权确认书及基础资料，接收受托方报送的信息及资金，并支付相关费用。其归口管理部门为资产保全部。在部分文件中，该行亦作为受托方或资金接收方，负责不良债权资产的代理管理与处置，受托人需将资金划付至其在建设银行开立的专用账户。文中提及建行各一级分行、二级分行参与具体业务。\n\n在信贷与贷款业务方面，该行是2003年度国家助学贷款计划执行机构之一，被下达指导性计划额度10亿元，附件列示了各地区贷款额度。该行是受委托办理住房公积金信贷业务的承办银行之一，需遵照执行《个人住房担保贷款管理试行办法》。作为国有商业银行，其对288户移交企业有贷款余额31.04亿元。其省内分支机构涉及可疑类贷款检查和整改。该行是办理特种拨改贷业务的主体，文中指代其总行及经办行。\n\n在监管与合规方面，该行是被监管对象之一，总行设有驻行监管小组。其新疆分行营业部为某违规行为的主体机构，该行作为上级银行被建议处理责任人。该行被要求控制人民币业务范围并备案，贯彻执行《离岸银行业务管理办法》。在票据业务中，其汇票和支票按行分色。该行具体承办主权担保融资业务，并被同意扩大记账式国债柜台交易业务分行范围。\n\n上述描述基于不同文件，涉及不同时间范围和业务场景，包括委托代理、贷款管理、监管整改及业务拓展等，各文件中的角色（如委托方、受托方、主送对象）依据具体文件语境而定。"}, {"id": "国家税务总局", "label": "国家税务总局", "group": "ORGANIZATION", "value": 104, "title": "国家税务总局是涉及农村信用社、城市商业银行及中小企业等多领域监管与政策制定的核心税务机关。在文件发布方面，该局是《1997年度农村信用社会计决算工作意见》、《1999年度农村信用合作社会计决算工作意见》及《关于农村信用社2005年度会计决算工作指导意见》的联合发文机关之一；同时作为《农村信用合作社财务管理实施办法》、《利息收支管理办法》、《农村信用合作社行政管理费管理办法》及《城市商业银行、城市信用合作社财务管理实施办法》的联合制定或解释机关。此外，该局还联合发布了《关于加强中小企业信用管理工作的若干意见》、《关于支持中小企业技术创新的若干政策》、《关于落实振兴东北老工业基地企业所得税优惠政策的通知》以及银发〔1997〕518号、银发〔1998〕265号、银发〔2000〕21号、银发〔2001〕278号等文件。\n\n在具体文号与专项政策上，国家税务总局发布了国税发[1994]161号、国税发〔1997〕112号、国税发［１９９８］２２０号、国税函［１９９９］９４ｌ号、国税函［２００１］７７０号文件，以及财税[2004]153号、财税〔2007〕120号、121号、财税宇[1998]29号、财税[1998]60号等文件。该局负责制定《储蓄存款利息所得个人所得税征收管理办法》，并参与制定《农村信用合作社贷款呆帐核销暂行规定》，在每笔金额100,000元以上（含）的贷款呆帐核销审批中作为备案接收方。\n\n在职能与权限方面，国家税务总局负责农村信用社的财务归口管理及税收政策制定，明确主管部门提取管理费形成的资产产权界定问题，并负责审批中国人民银行所需管理费。该局参与审核深化农村信用社改革试点实施方案，负责处理有争议资产（需商财政部），并同意农村信用社接收农村合作基金会财产产权过户时免交相关税费。此外，该局负责公布国家开发银行二级分支机构名单，接收营业税免征申报，监督执行金银饰品购销存月报表制度，并正在研究金融机构往来拆借利差等营业税计征政策。文中提及该局为各级国家税务局的上级主管，拥有对信用社应收、应付利息提取办法及税前扣除标准的规定权，并负责审批个别经济发达地区城市商业银行提高奖金列支比例。"}, {"id": "总行", "label": "总行", "group": "ORGANIZATION", "value": 103, "title": "“总行”在输入文本中指代多家不同银行机构的最高管理层，需严格区分主体，不可混同。\n\n**1. 中国人民银行总行**\n作为最高管理机构，负责接收省级分行上报的贷款监测、资金拆借及统计调查数据，并制定货币信贷业务会计核算办法。在稽核方面，设立稽核司，配备司局级、处级稽核员，统一印制稽核证，负责下拨贷款证专项经费及全额承担分支行人员培训经费，并批准对被稽核单位勒令停业的最终决定。在信贷与项目审批上，负责审批辖内建设项目重要事项，转报大型项目至国家计委，审批或备案特定规模新开工项目，并负责批准冲减流动资金的最高银行机构。此外，与财政部共同制定贷款呆账准备金提取规定，下达费用指标，批准立项及特殊固定资产购置，统筹确定系统基本建设支出预算分配方案，负责审查处理属中央管企业遗留问题资金损失，并批准清产核资中特定资产损失处理意见。其重点库属于管辖行以上机构的发行库范畴，并负责聘请审价机构。\n\n**2. 中国农业发展银行总部**\n负责审查核准费用贷款额度，统筹统还借款、发债及境外筹资，接收超限额上划资金。作为最高管理机构，接收各分行上报的报表及以资抵债资产统计报表，制定账户管理、信贷管理台账登记等规定。负责审批每笔金额在1000万元（含）以上的以资抵债业务，并组织省级分行正、副行长及副厅级省分行营业部总经理的任期经济责任稽核。\n\n**3. 其他国有及政策性银行**\n**中国农业银行总行**下达收贷任务并接收分行专题报告。**中国银行总行**负责逐步推行对各类中介机构的集中统一管理，接收代理经办行上划利息并办理转账。**国家开发银行总部**接收分行报告并指导全行分析预测工作。**贵阳农村商业银行股份有限公司总部**负责日常财务核算、协助年度决算及资产负债管理委员会日常工作。\n\n**4. 外资及境外银行机构**\n**外国银行总行**或**外商独资银行、中外合资银行总行**涉及章程、注册资本、注册地址变更及重组事项的报告对象，其所在地决定报送机构。外国银行总部可单独出资设立外商独资银行，或在分行改制时进行此类操作，并接收分行营运资金转回。外资银行营业性机构的总行可向分行转入信贷资产。境外银行在中国境内设立的全资子银行的上级机构，其内设审计部门可负责子银行审计工作。\n\n**5. 监管与通用职能**\n国有独资商业银行、股份制商业银行的总部需向银监会书面报告新业务开办情况。政策性银行总部负责汇总分支机构上报的呆坏账损失、非常损失及业务招待费清算数据，并作为单位接受财政部决算调整。部分文件中，“总行”指代负责审批征地项目、审核确认未经审核确认的损失贷款、接收分支行报送分类结果并向中国人民银行总行报送上季末贷款分类结果的最高层级机构。另有文件提及总行负责在筹建期限届满前提交延期申请，或对情况特殊、停减利息数额较大的案件行使审批权。浙银发[1998]678号文件转发的《关于当前信用社财务管理有关问题的通知》原始发文机关亦被指代为总行。统计制度中地区编码010000对应机构层级为省，但文中亦提及总行作为最高层级机构。"}, {"id": "分行", "label": "分行", "group": "ORGANIZATION", "value": 102, "title": "“分行”在输入文本中主要指代不同银行体系下的分支机构，具体描述如下：\n\n**1. 中国人民银行体系**\n指中国人民银行下属分支机构。在电子档案方面，享有特定查阅授权；在财务管理上为实施主体。涉外活动管理比照总行规定执行，可制订细则并备案，负责当地涉外交往联系办理及外资金融机构在京外设立机构开业出席。执行总行下达的外事接待任务，其人员一般不受理外国新闻媒介采访，文中提及分行领导及外事管理部门。此外，负责建立货币信贷情况通报会议制度、贯彻实施信贷政策、进行窗口指导及协调信贷业务；负责查实农村信用社联社拆借资金给城市信用社解决支付问题的基本情况并专题报告总行；负责清收电子公章软盘并寄送至总行，负责封存和销毁金融监管办事处各内设处室的印章。\n\n**2. 中国农业发展银行体系**\n指中国农业发展银行分支机构。作为资金头寸限额的核定对象及资金请调的申请主体。负责执行总行计划、自定省以下系统内资金往来利率、组织利率检查及辖区现金管理。负责确定与其所辖行的划付清算方式，进行汇差清算及利息划付。参与系统内资金逐级对转。\n\n**3. 国家开发银行体系**\n指国家开发银行下属分支机构。负责按季填报报表、撰写分析预测报告并报送总行。在文中被明确包含在“信贷局”定义范围内，负责本单位信贷资产质量分析评价工作。负责信贷合同的具体谈判、签订、履行及授权范围内审批，包括提款协议审批及报送。负责定期检查本单位信贷合同管理情况，制定实施细则，并报送年度管理情况。需执行相关办法，其年度经营目标和分析预测指标有专门规定。在省级层面，负责发起扣款指令、确认扣款及维护贴息信息。各试点分行负责集中核算会计账务，统一管理信贷资金，拨付备付周转金，并拥有借款审批权限。负责资金调度、接收管理部上缴资金及发送信息。文中提及经总行授权可批准城市信用社更名的下级管理机构。\n\n**4. 中资商业银行体系**\n指中资商业银行下设的分支机构，涉及开业条件及登记要求，是临时停业的申请人主体，也是支行筹建和开业申请的提交主体，或作为未按时开业被注销许可的对象。其行长、副行长等高级管理人员需经任职资格许可或核准。文中涉及其筹建、开业申请及条件，需经筹建和开业两个阶段。原文第十八条提及的商业银行分支机构，可在总行官方网站下开辟子网页。设立支行需在拟设城市同一行政区划内设有分行或分行以上机构。作为中资商业银行或收购方在地级以上城市设立的分支机构，或授权执行收购任务的机构。\n\n**5. 其他银行体系**\n指中国农业银行下属的分行机构，负责向总行报告代理业务工作落实情况。指外商独资银行、中外合资银行、外国银行下设的分支机构，涉及关闭申请。指外资银行的分支机构，支行升格为分行时需符合分行设立的有关规定。指拟临时停业分支机构的上级管理机构，作为临时停业报告的报告人。指省一级银行机构，负责省一级票样的分发。"}, {"id": "台银发〔2013〕60号", "label": "台银发〔2013〕60号", "group": "REGULATION", "value": 102, "title": "“台银发〔2013〕60号”是《中国人民银行台州市中心支行关于2013年台州市货币信贷工作的指导意见》的文件文号。该文件由中国人民银行台州市中心支行发布，发布日期为2013年4月16日。根据输入信息，该文件目前处于现行有效状态。"}, {"id": "城市信用社", "label": "城市信用社", "group": "ORGANIZATION", "value": 101, "title": "城市信用社（Urban Credit Cooperatives, UCCs）是独立核算、自负盈亏的股份制集体所有制金融组织，属于地方金融机构及中小金融机构范畴。在监管与业务层面，其市场准入管理的现有方式和程序保持不变；作为同业机构，参与转贴现业务，符合规定可申请再贷款及办理再贴现业务；流动资金贷款利率上浮幅度最高为30%。\n\n在机构改制与处置方面，部分城市信用社经中国人民银行总行或其授权分行批准更名为农村信用社，需按农村信用社要求办理年度决算；另有部分机构规划在2007年前组建为城市商业银行，或已组建为城市商业银行。对于需撤销的城市信用合作社，相关政府承诺需兑现。因改制导致政策性因素形成不良贷款，其不良贷款被农村信用社归并、收购，需进行清收盘活。截至2004年末，山东省共有5家此类机构。河北省辖内部分被整顿的金融机构已更名为农村信用社。滨州市分类处置的对象中，其贷款被农村信用社归并、收购。\n\n在监管要求上，城市信用社需完善法人治理结构，发挥理事会和监事会作用。部分机构需加强监督管理、处置不良资产、弥补资不抵债缺口，部分已批复市场退出并需按条例清算。文中提及需重点做好下岗再就业小额贷款发放工作，并泛指参与小额担保贷款业务的银行机构。\n\n在文件适用与数据报送方面，城市信用社是吉国税发〔2004〕360号、吉国税发〔2005〕305号文件适用的被监管/纳税主体类型之一。它是人民银行各分支机构需转发通知的辖区内金融机构类型之一，也是银发[2010]195号通知中列明的检查对象类别。作为需报送县级及以上人民币、外汇、本外币汇总数据的季度损益表报送主体之一，需上报统计表。此外，原文指出其存在滥用会计科目设立帐外帐的行为，其公共积累被界定为城镇集体资本金。文中提及农村信用社通过接收该机构的工作留下了遗留问题，需落实清理整顿承诺。"}, {"id": "中国银监会派出机构", "label": "中国银监会派出机构", "group": "ORGANIZATION", "value": 99, "title": "中国银监会派出机构是指中国银监会在各地设立的下属监管机构，包括所在地银监局等。其核心职责涵盖外资银行营业性机构及外国银行代表处的属地监管、监督检查与指导。\n\n在机构设立与变更方面，该机构负责受理筹建、开业、延期开业、变更营业场所及办公地址等申请，审查筹建工作，进行开业前验收及复验，出具验收合格意见书或经营人民币业务确认函，并指定地方性报纸进行公告。同时，负责接收验资证明、变更申请抄送资料、凭证样张及公证认证材料。\n\n在持续监管与报告接收方面，该机构负责接收外资银行报送的年度报告、审计报告、工作报告、季度跨境资金报送、信贷资产转入报告、业务外包报告、生息资产存在及变更报告、新产品报告、内部控制制度、内审报告、贷款风险分类标准、关联交易认定材料、重大事项报告及临时停业报告等。此外，还负责接收代表处关闭公告内容及注销登记确认材料。\n\n在特定监管措施与清算方面，该机构负责批准信贷资产转入、审批提取生息资产申请、实施特别监管措施，并监督解散与清算过程，确认清算报告，逐级上报重大事项。\n\n文中提及的具体适用对象包括东亚银行有限公司中国内地分行、日本三菱东京日联银行股份有限公司在中国境内分行等外资银行机构。该机构作为监管主体，负责接收上述机构所在地的监管报告及抄送资料，执行地方性监管事务。所有职责均基于中国银监会的相关规定，针对外资银行在境内的经营活动进行合规性监督与管理。"}, {"id": "《个人住房担保贷款管理试行办法》", "label": "《个人住房担保贷款管理试行办法》", "group": "REGULATION", "value": 98, "title": "《个人住房担保贷款管理试行办法》由中国人民银行于1997年4月28日颁布，文件文号为银发〔1997〕171号。该办法自1997年4月28日起施行，即颁布当日生效。其适用对象明确限定为国家安居工程试点城市。目前，该办法的效力状态为已被修订。"}, {"id": "银发〔1987〕15号", "label": "银发〔1987〕15号", "group": "REGULATION", "value": 97, "title": "中国人民银行、国家经济体制改革委员会于1987年1月26日发布的关于转发《第三次金融体制改革试点城市工作座谈会纪要》的通知，现行有效"}, {"id": "各商业银行", "label": "各商业银行", "group": "ORGANIZATION", "value": 96, "title": "“各商业银行”在相关监管文件中作为被监管或被指导主体，承担多项具体义务与角色。在信贷政策执行方面，该群体需为中小企业服务，降低信贷准入门槛，安排贷款规模，并成立专门信贷部门以优化金融服务、防范信贷风险；同时需执行信贷政策、完善评级体系并创新金融产品。针对特定行业，如纺织业，需负责安排压锭贴息贷款；在环保领域，需根据环保信息调整信贷管理，严格限制污染企业贷款。\n\n在业务操作与合规方面，各商业银行需参与研究制定银行业对社区进行信用评价的指标项目及打分标准，并对参评社区进行打分评价。在支付结算领域，需对支付结算系统安全运行作出周密安排；作为票据凭证的订货方和使用方，需与印制厂签订合同，并负责票据的保管和运送。此外，需明确专人负责中小企业信息征集、协助宣传并报送信息；对主要客户存款进行统计、分析并上报。\n\n在机构管理与行政配合方面，各商业银行被要求设立科目、报送报表、清理业务及撤销分支机构。在函证工作中，依据财协字〔1999〕1号通知，需配合函证工作并在10个工作日内回函。在出口信贷业务中，指除中国进出口银行外的其他商业银行，需遵守资格审定要求及关于出口信贷申请受理的规定，参与商业性出口信贷业务。\n\n在区域与职能定位上，该群体泛指在大连市内、武汉等地开展业务的商业银行，作为通知的接收对象及潜在经办银行。同时，作为受文对象，需加强金融法律宣传工作。上述描述涵盖了其在不同文件、不同时间背景下作为责任主体、执行主体或受文对象的具体职责，包括参与社区信用评价、执行特定行业信贷政策、保障支付结算安全、配合行政监管要求等，体现了其在银行业监管体系中的多重角色与义务。"}, {"id": "中国人民银行关于2009年中资金融机构金融统计制度有关事项的通知", "label": "中国人民银行关于2009年中资金融机构金融统计制度有关事项的通知", "group": "REGULATION", "value": 92, "title": "该文件为《中国人民银行关于2009年中资金融机构金融统计制度有关事项的通知》，文号为银发〔2008〕369号，由中国人民银行于2008年12月22日发布并生效，目前现行有效。该通知旨在规范2009年中资金融机构金融统计制度，明确了统计指标、编码、表单要求及具体启用日期。\n\n在统计内容方面，该通知规定了存款分类及周报与月报指标对照关系，涵盖个人存款、财政存款、保证金存款、结构性存款、临时存款、境外筹资转贷款资金等科目的统计要求，并涉及本外币利润统计。同时，文件对A3301/A3101报表中营业收入、利息净收入、利息收入等科目提出了具体统计要求，并新增了资产和负债统计项目，包括手续费及佣金支出、租赁收益、投资收益、债券投资收益等科目的新增规定。此外，通知还明确了统计科目、校验关系、科目映射关系及指标解释。\n\n在报送要求方面，该通知规定了金融统计的报送时间、范围及具体制度，特别明确了村镇银行的报送要求及报送时间。所有描述均基于同一文号及发布机关，信息一致，无冲突。"}, {"id": "中国工商银行", "label": "中国工商银行", "group": "ORGANIZATION", "value": 90, "title": "中国工商银行是国有商业银行，亦被称为专业银行或债权金融机构。在监管与考核方面，它是人民银行的被监管对象之一，总行设有驻行监管小组，并受人民银行总行考核。在业务执行上，该行是2003年度国家助学贷款计划执行机构之一，被下达23亿元指导性计划额度，负责制定具体管理办法及贷款的审批、发放与回收，并需探索多种担保形式。此外，该行是受委托办理住房公积金信贷业务的承办银行之一，也是政策性住房信贷业务指定银行。在国债业务方面，其记账式国债柜台交易业务分行范围获准扩大。\n\n在历史业务调整中，该行曾是原粮棉油优惠贷款业务办理机构之一，相关业务已划转至中国农业发展银行。在资金清收工作中，该行参与清收和划转企业拖欠人民银行系统资金的工作，对288户移交企业有贷款余额29.1亿元。在代理与结算业务中，该行在代理工作中给予大力支持配合，其行内电子汇兑系统已联调成功，汇票和支票按行分色。\n\n作为发文机关，中国工商银行曾联合或单独转发中国人民银行通知，提出执行要求，涉及贷款停减利息审批及执行、保证业务正常开展等内容。具体文件包括：银发〔1993〕113号文件的联合发文机关之一；银发〔1987〕40号文、银发〔1990〕176号通知、银发〔1994〕276号通知的受文单位之一，其中在1994年通知中，其系统内发生的担保由总行负责落实解决。\n\n作为受文单位或接收对象，该行需遵照执行多项规定：被要求控制人民币业务范围并备案；贯彻执行《离岸银行业务管理办法》；转知所属代理行；遵照执行《个人住房担保贷款管理试行办法》。此外，该行是通知主送单位之一，属于国有控股商业银行，具体承办主权担保融资业务；也是被复函对象，曾提出关于查询储蓄存款有关问题的请示。在部分通知中，该行被明确提及为监管对象或境内金融机构。"}, {"id": "国家助学贷款", "label": "国家助学贷款", "group": "BUSINESS", "value": 90, "title": "国家助学贷款是国家利用财政、金融手段完善普通高等学校学生资助政策体系的核心业务，旨在解决家庭经济困难学生就学问题。该业务属于商业性贷款，纳入正常贷款管理，实行学生每年申请、经办银行每年审批。\n\n**适用对象与范围**\n主要面向中国境内（不含港澳台）高校中经济确实困难的全日制本、专科学生（含高职生）、研究生及第二学位学生。部分地区如河南省、江西省、广西等将其作为资助主要渠道或特定业务类型。该业务与生源地信用助学贷款并行，文件要求避免学生重复获得；未申请到生源地贷款的学生入学后可申请。\n\n**资金用途与标准**\n贷款用于支付学费、住宿费及基本生活费。文中提及涉及资助标准、资助比例、额度上限及信贷资金安排。部分规定明确财政贴息50%，并涉及免征营业税、呆坏账核销及减免税收等政策。\n\n**管理机制与流程**\n业务涉及国家、高校、学生、银行的权利义务关系及风险分摊。具体流程包括贷款计划、申请、审批、发放、使用、回收、计息、展期、变更、中止、期限、利率及核呆等。文中要求金融机构简化程序，执行指导性贷款计划，满足学生信贷需求。管理上涉及银校合作、招标议标、旬报制度、信息管理、征信管理及不良贷款处置。\n\n**监管与考核**\n各金融机构需按新政策要求全面推进，确保及时发放并加强监测管理。考核内容涉及贷款管理规模、提前还款、还本付息、违约率及风险控制制度。对于连续拖欠贷款者，实行通报机制。文中提及需按照国务院及省人民政府有关通知精神实施，涉及协调小组统筹及政策执行督查。\n\n**特殊情形**\n针对高校毕业生，其在校期间获得的贷款，在符合条件时本金及利息可由国家代为偿还，作为代偿资助的前提条件。业务分为新机制发放和旧机制延续发放两种情况。文中还提及该业务涉及财政贴息、风险补偿金安排及具体监管操作规定，旨在确保贫困家庭学生入学并帮助其支付相关费用。"}, {"id": "有效银行监管的核心原则", "label": "有效银行监管的核心原则", "group": "REGULATION", "value": 90, "title": "“有效银行监管的核心原则”是由巴塞尔银行监管委员会于1997年9月制定的文件，后由中国人民银行通过银发〔1998〕121号通知印发给各金融机构，作为附件内容执行。该文件旨在确立有效银行监管的基本框架，对监管体系、发照程序、机构变动审批及持续监管手段提出明确要求。\n\n在监管基础与独立性方面，文件强调监管机构的独立性，要求建立审慎法规体系，并涵盖宏观经济政策协调、公共金融基础设施完善、市场秩序维护及问题银行解决机制。在准入与股权管理上，规定了银行发照程序、股权审查标准及资本充足率要求。\n\n在风险管理领域，文件详细阐述了多项核心原则：\n1. **信用与资产质量**：包含信贷管理、资产质量评估、风险集中控制及关联贷款监管要求。\n2. **市场与利率风险**：涉及利率风险管理、市场风险管理及国家风险原则。\n3. **流动性与操作风险**：提出流动性管理、操作风险控制及内部控制的具体监管要求。\n4. **合规与反洗钱**：包含合规性监管、反洗钱措施及欺诈行为监管等内容（对应原则16-20）。\n\n此外，文件明确了持续监管手段，包括现场检查、非现场检查及外部审计的要求，并规定了并表监管原则。在信息透明度方面，提出了对银行机构信息要求的具体原则，确保监管机构能及时获取必要信息以评估银行风险状况。\n\n该文件由中国人民银行印发，适用对象为各金融机构，旨在通过规范化的监管程序、风险定义及审慎法规的实施，提升银行监管的有效性。所有描述均基于银发〔1998〕121号通知及其附件内容，未包含后续修订或外部法律结论。"}, {"id": "项目单位", "label": "项目单位", "group": "ORGANIZATION", "value": 89, "title": "“项目单位”是具体实施建设项目、使用政策性贷款资金或申请项目资金的主体，涵盖市政府设立的实施单位、旅游项目实施主体及简易建仓贷款借款主体等。该实体与天地城市投资公司、融资平台、采购公司或省开发投资公司等存在协作或协议关系，共同负责项目组织、资金流转及后续工作。\n\n在资金获取与账户管理方面，项目单位需与开户行（如开行四川省分行或其委托行）签订借款合同、办理借贷手续并开立结算账户，以支取贷款资金。其需与融资平台签订转借协议、资金使用协议或投资协议，接收融资平台拨付的贷款资金，并接收借款凭证第一、四联盖章。对于旅游项目，需建立承贷承还机制并与省开发投资公司签订质押担保手续。\n\n在项目实施与建设过程中，项目单位负责申办项目手续、组织建设、编制可行性研究报告并向开户行提出借款申请。其负责编制工程决算，参与现场经济签证会签及竣工验收，与采购公司配合选择供货商并申请出具项目确认书。项目单位需落实还贷资金，提供还款承诺函，申请拆迁补偿支出，并报送采购清单。\n\n在资金使用与监管方面，项目单位需按约定使用资金，实行项目资金单独核算、专款专用，不得擅自改变用途。其需编制预算优先安排还贷，按时足额划转还贷资金，并负责偿还贷款本息。项目单位需配合监管，接受招投标、财务、审计、监察等监督，报送财务会计报表、工程进度报告及验收结果。在发生重大变故时，需及时报告。\n\n此外，项目单位需向相关方提供营业执照等申报材料，提出用款申请并提供管理材料。作为使用政策性贷款的对象，其可能面临资金追回的风险。上述职责与义务依据不同文件及具体项目情况，由项目单位作为具体执行主体予以落实。"}, {"id": "中国银监会", "label": "中国银监会", "group": "ORGANIZATION", "value": 88, "title": "中国银监会，即中国银行业监督管理委员会，是银行业金融机构的主要监管机构。在文件发布方面，该机构是《关于农村信用社2005年度会计决算工作指导意见》的联合发文机关之一，也是《关于落实环保政策法规防范信贷风险的意见》的联合发文机关之一。此外，其发布的《关于规范向农村合作金融机构入股的若干意见》及《农村信用社以县（市）为单位统一法人工作的指导意见》构成了相关监管工作的依据。\n\n在监管职责与审批权限上，中国银监会负责银行业金融机构重要信息系统投产及变更事项，是该领域管理办法的解释和修订负责机构，并实施现场检查及责任追究。在机构设立与变更审批方面，该机构负责受理开业申请、作出批准或不批准决定，包括批准筹建遵义农商银行、审批苏州信托公司申领新金融许可证，以及审批外资银行设立、变更名称、合并分立、修改章程等事项。同时，其负责核准外资银行董事、高级管理人员和首席代表的任职资格，接收相关申请资料，并规定审慎性条件、要求报送资料及进行认证公证。对于外资银行及其派出机构，该机构行使监管职责。\n\n在业务监管方面，中国银监会负责审批银行业金融机构开办衍生产品交易业务的申请，并负责作出批准或不批准关闭的决定，接收清算报告及重大事项汇报。文中提及的“直接监管机构”简称指代该机构，负责审批及接收申请材料。\n\n在政策协调与改革支持方面，中国银监会参与召开推进小额担保贷款政策落实工作电视电话会议。该机构与国务院共同安排深化农村信用社改革试点工作进度。其关于加快推进农村合作金融机构股权改造的意见是制定相关方案的依据之一，其规定的涉农贷款统计口径是计算奖励资金的依据之一。此外，文中提及该机构为支持恒丰银行发展的监管主体。\n\n上述描述基于输入信息合并，涵盖其作为发文机关、审批机关、监管主体及政策协调方的多重角色，未对同名不同机构或不同处罚案进行强行合并，冲突信息已依据来源并列说明。"}, {"id": "外资金融机构", "label": "外资金融机构", "group": "ORGANIZATION", "value": 88, "title": "“外资金融机构”是指依据《中华人民共和国外资金融机构管理条例实施细则》(试行)及相关监管规定，受中国人民银行、银监会等监管机构监管的机构主体。其具体类型涵盖外国银行分行、合资银行、独资银行、合资及独资财务公司，以及外国资本的证券公司、投资公司、保险公司、信用卡公司、金融性租赁公司等。\n\n在监管义务方面，该主体需缴存存款准备金，其中总行不设在境内的分支机构由所在地分行管理和考核；需建立控制系统，接受审计并委托审计，履行报送报表、市级及以上汇总数据及统计制度的义务；需接受债券市场债券回购等流动性指标监测。涉及在京设立常驻代表机构、涉外活动（如开业、捐赠、庆典）或申请设立机构时，需向当地银监局提交申请并报银监会审批，或涉及中、高级管理人员任职资格管理。\n\n在区域政策与业务开展上，外资金融机构在山东设立法人机构或分支机构时，享受山东省对外商投资企业优惠措施；在深圳经济特区试办人民币业务；经营离岸银行业务的主体之一，其业务另行规定。此外，该主体也是规划中提及需继续大力引进的具有先进管理经验和技术的金融机构群体，包括国外知名银行、投资银行、外资保险公司在我省设立的分支机构。\n\n相关监管文件包括《中华人民共和国外资金融机构管理条例实施细则》(试行)、《外资金融机构中、高级管理人员任职资格暂行规定》等。需注意，不同文件对适用对象的具体界定存在差异，如部分文件特指申请设立常驻代表机构的外国金融机构，或特指需报送特定数据的主体，应依据具体文件文号及时间范围执行。"}, {"id": "经办银行", "label": "经办银行", "group": "ORGANIZATION", "value": 88, "title": "“经办银行”指在各类政策性贷款及商业贷款业务中，与借款人、担保机构或高校等主体签订协议，具体负责贷款受理、审核、发放、回收、催收及贷后管理的金融机构。其涵盖国有独资商业银行、股份制商业银行、城市商业银行及城乡信用社等。\n\n在**国家助学贷款**业务中，经办银行与高校签订协议，负责贷款发放、划转、核销、回收及催收，办理还贷确认及展期手续，确定还本付息方式，单列科目核算并支付贴息。其承担风险分摊责任，具体比例由高校与银行商定。银行需接受中国人民银行监督，制定管理办法，并负责复审材料、办理手续、加盖专用章及申报贴息资金。\n\n在**小额担保贷款**（含下岗失业人员、劳动密集型小企业）业务中，经办银行与受托担保机构签订《贷款担保业务合作协议》，负责核贷、执行实际利率、审核项目、监督资金用途、设置台账、录入征信及报告逾期情况。银行需按类型分类统计贴息，管理担保基金专户，并享受手续费补助。其贷款质量考评在特定条件下可不纳入不良贷款考核体系。若违规，将面临追回资金、警告、处罚或取消经办权。部分业务需与市劳动和社会保障局共同制定实施细则。\n\n在**小企业贷款**（含联保贷款）业务中，经办银行负责办理具体业务，签订借款合同，报送征信数据，进行贷后检查及清贷。对于符合规定条件的小企业贷款，银行可享受手续费补助。\n\n此外，经办银行在流程中负责留存表格联次，签署相关审查意见（如《1994年开发银行基建硬贷款贴息情况表》），并计算应贴息金额、填报申报表。文中提及的工商银行、农业银行等均为具体受文或执行机构。不同业务场景下，其职责侧重略有差异，但均作为业务执行主体或监管对象出现。"}, {"id": "郑州市“十一五”国有经济布局和结构调整专项规划纲要", "label": "郑州市“十一五”国有经济布局和结构调整专项规划纲要", "group": "REGULATION", "value": 88, "title": "该文件为《郑州市“十一五”国有经济布局和结构调整专项规划纲要》，由郑州市人民政府印发。该规划是郑州市国民经济和社会发展第十一个五年规划纲要的专项规划之一，也是郑州市“十一五”期间关于国有经济布局和结构调整的专项规划文件。\n\n在制定程序上，该文件经郑州市人民政府常务会议研究通过。其核心定位是作为全市企业国有资产调整和发展工作的行动纲领，旨在指导全市企业国有资产调整和发展工作。该文件明确了郑州市在“十一五”期间国有经济布局优化的方向与结构调整的具体要求，是相关时期内指导国有资产管理工作的重要依据。"}, {"id": "村镇银行", "label": "村镇银行", "group": "ORGANIZATION", "value": 87, "title": "村镇银行是新型农村金融机构的具体类型之一，属于中小金融机构及法人金融机构范畴，机构类代码为7020。其定位为农村地区实现普惠金融战略的重要金融载体，具有点多面广、支农支小的特点，是村银委的监管与服务对象。截至2016年6月末，全国共组建1412家。\n\n在监管与统计方面，村镇银行自2009年1月1日起正式向人民银行报送统计数据，需报送县级及以上人民币、外汇、本外币汇总数据及季度损益表。它是银发[2010]195号通知中列明的检查对象类别，也是银监部门批准设立的机构。在特定政策中，如粤银监发〔2013〕126号通知，其作为受文对象，指在广东省（不含深圳市）设立的村镇银行；在鹰潭市辖内，其适用相关指导意见。此外，它是本通知要求转发至辖区内银行业金融机构类型之一，也是本次银行及其他金融业普查对象之一，省、地、县级作为法人单位。\n\n在业务发展与市场准入方面，村镇银行是文中提及推进组建、支持银行业金融机构到农村领办、被鼓励发展及需大力发展的新型农村金融机构类型。它是市场准入对象及监管激励对象，涉及开业后5年内存贷比达标政策；作为特定类型的县域金融机构，文中规定了其存贷比达标及放宽限制的具体条件。在2010年增贷指导任务中，其作为被监管/指导对象类别，需确保增量1亿元，争取增量1亿元。\n\n在网点覆盖与战略执行上，村镇银行被要求力争3-5年内实现对辖内重要乡镇的网点覆盖。它是文中提及的拟纳入全覆盖工程的银行机构类型，特指在毕节市发起组建的村镇银行；也是文件主送对象之一，特指在台州设立的村镇银行。作为全金融机构及中小金融机构的组成部分，它是参照执行本通知规定及广东省内（不含深圳市）参照执行该指导意见的新型农村金融机构类型之一。\n\n当前，村镇银行处于冷静发展期，需深耕差异化服务。它是本办法明确列出的适用评估对象类别之一，也是文件鼓励和支持发展的多种所有制金融组织之一。"}, {"id": "董事会", "label": "董事会", "group": "ORGANIZATION", "value": 83, "title": "董事会是商业银行及银行业金融机构公司治理架构中的核心决策机构，对银行合规经营、风险管理及资本管理承担最终或首要责任。其成员包括董事长、副董事长、独立董事等，需经任职资格许可；外资银行法人机构董事会成员不少于3人，设董事长1人。\n\n在职责方面，董事会负责审批总体经营战略、重大政策、重大交易及新业务（含衍生产品业务），确定风险水平、设定风险偏好，并批准内部资本充足评估程序。其需监督内部控制有效性、合规政策实施及案防工作，下设合规委员会等专门委员会。董事会负责审议并表决通过年度报告，保证报告真实准确完整；接收内部审计部门、合规管理部门及高级管理层关于经营、风险、合规状况的独立报告或汇报，并听取内审负责人独立沟通。此外，董事会负责内审部门负责人任免、聘请外部审计师、审议薪酬方案及绩效评价，并积极参与市场风险管理过程。\n\n在治理关系上，董事会与股东会、监事会、管理层相互制衡，需对管理层进行独立检查，评估其结构合理性及战略制定能力。对于中资商业银行，董事会需对开办新业务出具书面意见；对于外商独资、中外合资及外国银行，董事会负责通过解散、破产及分行关闭决议，并授权高级管理层开展经营管理。\n\n在特定事项中，董事会是公司变更验资时出具变更事项决议的机构，也是申请单位总管理机构的决策机构，其名单需作为申请材料提交。在压力测试中，董事会接收测试结果及补救措施报告。针对股份制商业银行，董事会是《股份制商业银行董事会尽职指引(试行)》规范的核心主体，负责决策、监督及信息披露。在长安银行等具体机构中，董事会作为决策机构，需强化职能并完善治理机制。\n\n注：上述描述综合了不同监管文件对董事会职能的规定，涵盖中资、外资及股份制银行，具体职责依据各机构类型及适用文件（如《股份制商业银行董事会尽职指引(试行)》等）有所侧重。"}, {"id": "资本充足率", "label": "资本充足率", "group": "BUSINESS", "value": 82, "title": "资本充足率是衡量银行资本总额与加权风险资产总额之比的审慎监管指标，通常每半年考核一次，需在半年结束后二十天内报送。该指标是评估银行抵御风险能力、满足监管要求及进行非现场监测的核心依据。\n\n在一般监管标准中，境内商业银行及中资商业银行申请设立、参股或收购境外机构，通常要求资本充足率不低于8%；境外商业银行需达到注册地平均水平且不低于8%。拟设外商独资银行、中外合资银行的主要股东需符合所在国家或地区金融监管当局及银监会规定，一般要求不低于8%。外国银行分行申请人须符合所在国家或地区及中国监管机构的规定。对于风险较高、风险管理能力较弱的外商独资银行、中外合资银行，国务院银行业监督管理机构可要求其提高该指标。申请开办外汇业务需满足不低于8%的要求。\n\n在农村信用社及农村合作银行改革中，该指标具有特定的阶段性目标与计算规则。依据《农村信用社改革试点专项中央银行票据操作办法》等规定，统一法人体制农信社申请置换需达2%，兑付需达4%；农村合作银行需达8%。丽江市深化农村信用社改革总体目标规定，农村合作银行需达8%以上，县级统一法人社需达4%以上，两级法人社需达2%以上。部分规划要求城市商业银行到2010年达到8%以上，恒丰银行保持在8%以上，总体目标约为8%左右。文中提及城市商业银行2004年末仅为2.06%，安徽省农村信用社联合社亳州办事处2009年该指标明显提高，长安银行当前资本充足率较高。\n\n在计算与披露方面，监管考核需考虑专项票据置换不良贷款和弥补历年挂账亏损因素。文中规定，对符合条件的小微企业贷款允许视同零售贷款或适用特定风险权重。当指标低于法定标准或银行出现流动性困难时，股东应支持董事会提出的提高措施或履行特定义务。该指标需在经营方针、发展计划、可行性研究报告及开业核准申请书中说明或预测，并定期向股东及有关人员披露。地方政府对达不到票据兑付条件的困难机构采取措施帮助提高该指标，作为专项中央银行票据兑付条件之一。连续4个季度达标是提前赎回专项票据的条件之一。"}, {"id": "下岗失业人员小额担保贷款", "label": "下岗失业人员小额担保贷款", "group": "BUSINESS", "value": 82, "title": "“下岗失业人员小额担保贷款”是国家为支持下岗失业人员再就业、自谋职业及自主创业而推出的特定信贷业务。该业务自2002年10月开办，旨在促进扩大再就业，涉及财政贴息、经办银行、担保机构及劳动保障部门的协作机制。\n\n**适用对象与范围**\n主要面向下岗失业人员，包括在城镇从事二、三产业并办理相关登记的返乡农民工，以及吸纳其就业的小型企业。部分文件提及特定大中专毕业生亦在规范范围内。业务涵盖个人贷款和小企业贷款，具体形式包括小额信用贷款和联保贷款。\n\n**额度、期限与利率**\n贷款金额一般控制在两万元左右，针对返乡农民工的贷款额度在5万元以内。贷款期限一般不超过两年，展期不超过一年，且展期期间不享受贴息政策。利率按中国人民银行公布的水平确定，不得上浮。\n\n**政策支持与风险分担**\n该业务享受财政贴息政策，并涉及呆账补偿、手续费补助及担保基金补偿机制。风险分担方面，涉及担保基金代位清偿、损失分担及不良率控制。对于符合特定条件的借款人，可取消反担保要求。\n\n**操作流程与监管要求**\n业务涉及贷款发放、审批流程简化、回收、逾期处理及违约处理机制。经办金融机构包括城市商业银行、城乡信用社等。监管重点包括担保机构与经办银行的协作、代偿流程、风险管理及考核补助。截至2004年6月末，全省农村信用社该项业务余额达7836.1万元。\n\n**来源与时间差异说明**\n不同文件对具体细节规定存在差异：部分文件强调“反担保取消条件”及“审批流程简化”，另一些文件则侧重“担保基金代位清偿”及“不良率控制”。关于适用对象，多数文件聚焦下岗失业人员，个别文件扩展至吸纳其就业的小型企业或特定毕业生。关于金额，一般描述为“两万元左右”，而针对返乡农民工的特定文件明确为“5万元以内”。上述差异源于不同时期、不同发文机关发布的规范性文件，应依据具体文件文号及发布时间适用相应条款，不将历史要求视为当前统一标准。"}, {"id": "河北银监局关于县域银行业金融机构全力支持当地经济发展的指导意见", "label": "河北银监局关于县域银行业金融机构全力支持当地经济发展的指导意见", "group": "REGULATION", "value": 82, "title": "该文件为河北银监局发布的《河北银监局关于县域银行业金融机构全力支持当地经济发展的指导意见》。文件于2012年12月5日发布并生效，目前状态为现行有效。\n\n该指导意见旨在引导和支持县域银行业金融机构助力当地经济发展。文件内容涵盖市场准入、监管考核及具体措施落实等方面，对县域银行业金融机构在支持当地经济过程中的职责与要求进行了规范。\n\n来源信息一致显示，该文件由河北银监局制定，发布时间与生效时间均为2012年12月5日，且各描述均确认其当前处于有效状态，无冲突信息。"}, {"id": "外国银行", "label": "外国银行", "group": "ORGANIZATION", "value": 81, "title": "“外国银行”指在境外注册，并在中华人民共和国境内设立分行、代表处，或拟将其境内分行改制为外商独资银行的外国金融机构主体。该实体是相关监管办法及细则的核心适用对象，其境内分支机构（包括分行、支行、代表处）受中国监管当局管辖。\n\n在设立与准入方面，外国银行需满足特定审慎性条件，如总资产、资本充足率等指标，且需无重大违法违规记录。在发照程序中，部分情形需首先获得母国监管当局批准。其境内分行或代表处的名称需标明国籍及责任形式。外国银行作为母行，对其境内分行实行合并监管，其高管人员受兼职限制。\n\n在业务运营与变更方面，外国银行可申请其境内分行经营人民币业务，未在中国境内设立法人机构的分行办理资金归集管理业务适用特定办法。外国银行涉及变更名称、办公场所、合并、分立等监管事项时，需履行相应申请程序。其总行所在国的监管措施及重大事项需向中方报告，总行年报需由分行或代表处报送。外国银行承担其境内分行或代表处的民事责任，分行需满足营运资金要求，代表处需履行公告义务。\n\n在退出与改制方面，外国银行可申请关闭、撤销其在中国境内的分行、支行或代表处，并遵循相应的清算程序。外国银行可申请将其在中国境内的分行改制为由其总行单独出资的外商独资银行。文中提及的特定审慎性条件适用于此类外资银行类型，涉及分行关闭、清算及设立限制等情形。\n\n注：上述描述基于输入列表合并，涵盖不同文件文号及时间背景下对外国银行作为监管对象、申请主体及责任承担者的定义与要求。对于同名不同机构或不同处罚案，未进行强行合并；冲突信息（如不同时期的具体条件）依据原文并列呈现，不擅自裁决历史要求与当前要求的差异。"}, {"id": "山东省", "label": "山东省", "group": "GEO", "value": 79, "title": "山东省是多项银行监管文件、规划及政策适用的行政区域及金融监管辖区。在统计制度中，其地区编码为160000。\n\n作为金融业务开展地及发展主体所在地，山东省涉及全省经济、金融数据及机构分布。文中提及该省生产总值跃居全国第二，农业总产值居全国第一，并涉及存贷款总量、金融产业增加值等数据的地域范围。该省是恒丰银行的立足地，也是拟组建金融控股集团、保险公司的注册地。文中多次以“我省”、“全省”、“山东分网”、“山东区域金融中心”、“诚信山东”等指代该行政区域，涵盖山东保险市场建设、外资引进、涉农保险、地域特色产品、对外开放及资本市场建设等内容。\n\n在监管与机构关系方面，山东省是人民银行山东省分行的监管辖区，也是中国进出口银行青岛分行的经营服务区。该省涉及全省信用社改革工作，以及全省统一部署及各地银行类金融机构的具体实施。相关管理办法适用于山东省内银行业金融机构的管理与服务范围。此外，该省是全省统一政府采购制度及省内各级机构适用的行政区域，也是金融工作联席会议的管辖范围。\n\n在历史数据与特定事项方面，2000年度中国人民银行管理费摊提地区涉及山东省，金额为60万元。文中提及1980年贷款项目90%以上为挖革改项目，山东省为这些贷款项目的所在地。在“十一五”期间，山东省是全省淘汰落后工艺和装备、产品的行政区域范围。同时，山东省被提及为仿效经验来源地之一。\n\n上述描述涵盖了山东省作为被转发文件发文机关所属省级行政区域、规划适
