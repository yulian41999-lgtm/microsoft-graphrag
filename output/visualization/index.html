人行与商业银行之间的资金清算划拨业务"}, {"source": "农村信用社", "target": "中国人民银行", "description": "农村信用社与中国人民银行存在多项业务及监管关联，主要涉及资金划转、票据处置及转汇业务。\n\n在资金划转方面，农村信用社原缴存于中国农业银行的存款准备金全部划转至中国人民银行；其转存款（含备付金）亦全额或部分划转至中国人民银行。此外，农村信用社按规定向中国人民银行缴存财政性存款。\n\n在票据与不良贷款处置方面，农村信用社与中国人民银行签订委托处置不良贷款协议。该协议涉及再贴现票据的退回，以及专项央行票据的持有。农村信用社还涉及认购和兑付人民银行的专项票据。\n\n在支付结算方面，农村信用社可直接通过中国人民银行进行转汇。\n\n上述描述基于输入信息合并，未添加外部事实或法律结论。"}, {"source": "台银发〔2013〕60号", "target": "各金融机构", "description": "要求该机构盘活信贷存量，优化信贷结构，支持经济转型升级"}, {"source": "台银发〔2013〕60号", "target": "城市商业银行", "description": "文件要求城市商业银行完善网点布局，打造小微企业金融服务专营银行"}, {"source": "台银发〔2013〕60号", "target": "小额担保贷款", "description": "台银发〔2013〕60号文件要求积极开展小额担保贷款业务，具体指向积极开办针对特定群体的此类贷款。"}, {"source": "台银发〔2013〕60号", "target": "地方政府", "description": "文件要求积极配合地方政府妥善化解企业风险"}, {"source": "台银发〔2013〕60号", "target": "资本充足率", "description": "文件要求将资本充足率指标保持在合理水平"}, {"source": "国家税务总局", "target": "农村信用社", "description": "国家税务总局作为发文机关，在涉及农村信用社的相关监管与税务事项中，主要承担以下职能与规定：\n\n第一，在税款退库或抵减方面，国家税务总局与财政部共同规定，对于多征收的税款，需按照特定要求进行退库或抵减。该规定明确了税务机关在处理超额征税时的操作规范，确保纳税人（包括农村信用社等主体）的合法权益得到保障，具体执行需依据两部门共同发布的文件要求。\n\n第二，在期限管理方面，国家税务总局作为原始发文机关，规定在特殊情况下，若需延长相关税务或监管事项的办理期限，必须报经其批准。这一要求强调了审批权限的集中性，旨在防止随意延长办理时限，确保行政效率与合规性。农村信用社在遇到此类特殊情况时，需严格遵循该审批流程，不得擅自延期。\n\n第三，在资产接收与税费优惠方面，国家税务总局同意农村信用社在接收农村合作基金会财产时，免交相关税费。此项政策针对农村信用社接收农村合作基金会资产这一特定历史或业务场景，给予了明确的税收减免支持。该规定明确了适用对象为农村信用社，适用条件为接收农村合作基金会财产，优惠内容为免交相关税费。\n\n上述描述均基于输入提供的信息，未添加外部法律结论或未提供的事实。各项规定分别对应不同的业务场景（税款退库、期限审批、资产接收税费），彼此独立，不存在冲突。其中，“与财政部共同规定”体现了联合发文性质，“作为原始发文机关”体现了单独发文性质，“同意……免交”体现了具体事项批复性质。所有描述均保留原文中的关键要素，包括发文机关、适用对象、具体条件及结果，未对同名不同机构或不同处罚案进行强行合并，亦未将历史要求误作当前普遍要求，仅依据输入内容如实呈现。"}, {"source": "金融机构", "target": "地方政府", "description": "金融机构向地方政府报告重大事项，且在该报告过程中应当同时抄报人民银行。"}, {"source": "金融机构", "target": "银行业金融机构", "description": "金融机构包括银行业金融机构。银行业金融机构属于本制度定义的金融机构范畴。具体而言，金融机构包括大连市银行业金融机构。"}, {"source": "金融机构", "target": "人民银行", "description": "金融机构与人民银行之间存在明确的监管与被监管关系，主要涉及重大事项报告及金融消费者投诉处理两个方面的职责与义务。\n\n在重大事项报告方面，金融机构负有向人民银行报告重大事项的义务。这一要求确立了金融机构在特定情形下需主动向监管机构披露关键信息的合规责任，确保人民银行能够及时掌握金融运行中的重大动态。\n\n在金融消费者投诉处理方面，金融机构应积极配合人民银行对金融消费者投诉进行的调查与调解。这表明当涉及金融消费者投诉时，人民银行拥有开展调查与调解的职权，而金融机构则承担配合义务，需协助监管机构完成相关事实核查与纠纷调解工作。\n\n上述两项描述分别界定了金融机构在信息报送和投诉应对中的具体行为准则。前者侧重于主动的信息披露机制，后者侧重于被动但必要的行政配合义务。两者共同构成了金融机构在人民银行监管框架下的基本合规要求，旨在维护金融秩序稳定及保护金融消费者合法权益。描述中未涉及具体的报告频率、投诉处理时限、罚款金额或特定比例等量化指标，亦未提及具体的文件文号、发文机关全称或明确的时间适用范围，仅基于输入内容概括了双方的核心互动关系。"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "国务院", "description": "引用国务院关于支持小微企业发展的一系列政策要求"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "各金融机构", "description": "《中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见》由中国人民银行大连市中心支行发布，适用对象为各金融机构。该文件旨在向各金融机构提出落实金融支持实体经济的具体要求。根据描述，指导意见明确要求各金融机构加强跨境人民币政策宣传，并开展境外投资人民币贷款及支付结算服务。输入信息中未提供具体的发文时间、文件文号、涉及金额、比例或特定条件，亦未提及不同分支行或处罚案件，故仅依据现有文本进行合并陈述，不添加外部事实或法律结论。"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "小额担保贷款", "description": "要求积极开办并扩大此类贷款覆盖面"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "银行", "description": "指导意见要求加强银行等部门在财税库银横向联网工作中的沟通协调"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "商业银行", "description": "要求简化支付系统汇划业务受理程序，并选择业务基础扎实的商业银行推进电子商业汇票业务发展"}, {"source": "中国人民银行大连市中心支行关于金融支持实体经济发展的指导意见", "target": "贷后管理", "description": "要求加强贷后管理"}, {"source": "金融机构", "target": "银行", "description": "金融机构包括银行。在天津市设立的银行属于金融机构范畴。"}, {"source": "中国人民银行天津分行对金融机构的日常管理指引", "target": "金融机构", "description": "中国人民银行天津分行发布的《对金融机构的日常管理指引》旨在规范金融机构的日常管理行为。该指引明确了金融机构在日常管理中的义务、要求及主要内容，作为相关机构开展日常运营与合规管理的依据。"}, {"source": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "target": "商业银行", "description": "指导意见要求商业银行及早介入物流业规划、追踪汾河治理项目、履行社会责任"}, {"source": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "target": "金融机构", "description": "指导意见要求各金融机构支持生态建设和环境保护"}, {"source": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "target": "中小企业", "description": "指导意见要求引导商业银行加大对中小企业的融资支持"}, {"source": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "target": "中国银行", "description": "中国人民银行太原中心支行发布的《关于深化山西\"138金融工程\"的指导意见》中，针对中国银行提出了具体的业务推动要求。该指导意见要求中国银行推动淡马锡模式，并推广供应链融资产品。同时，文件要求中国银行利用特定融资方式支持铁路项目建设。上述要求均出自该指导意见，旨在深化山西\"138金融工程”的实施。"}, {"source": "中国人民银行太原中心支行关于深化山西\"138金融工程\"的指导意见", "target": "交通银行", "description": "中国人民银行太原中心支行发布的《关于深化山西\"138金融工程\"的指导意见》对交通银行提出了具体业务要求。该指导意见要求交通银行试点沃德财富网点小企业业务，旨在通过特定网点模式深化小企业业务服务。同时，指导意见要求交通银行推广供应链融资，以支持物流公司发展。上述要求均出自该指导意见，适用于交通银行在山西地区的业务开展，涉及沃德财富网点、小企业业务、供应链融资及物流公司支持等具体领域。"}, {"source": "中国人民银行上海总部", "target": "城市信用社", "description": "将通知转发至辖区内该机构"}, {"source": "中国人民银行上海总部", "target": "农村信用社", "description": "将通知转发至辖区内该机构"}, {"source": "中国人民银行上海总部", "target": "金融资产管理公司", "description": "将通知转发至辖区内该机构"}, {"source": "各分行", "target": "城市信用社", "description": "将通知转发至辖区内该机构"}, {"source": "各分行", "target": "农村信用社", "description": "将通知转发至辖区内该机构"}, {"source": "各分行", "target": "金融资产管理公司", "description": "将通知转发至辖区内该机构"}, {"source": "中国人民银行上海总部", "target": "上海", "description": "位于该地理区域"}, {"source": "中国人民银行", "target": "中国人民银行日常涉外交往管理规定", "description": "中国人民银行作为发文机关，制定并发布了《中国人民银行日常涉外交往管理规定》。该规定的文件文号为银发〔1997〕91号。根据规定内容，该文件自下发之日起执行。"}, {"source": "中国人民银行日常涉外交往管理规定", "target": "国务院", "description": "《中国人民银行日常涉外交往管理规定》依据国务院有关外事工作的文件精神制订。该规定明确了国务院在涉外事务管理中的指导地位及文件效力层级。具体而言，当国务院发布最新文件，或本规定未涵盖相关涉外事宜时，应遵循国务院及涉外主管部门的最新规定执行。此条款确立了在出现政策更新或规定空白时，以国务院及其主管部门最新要求为准的适用原则，确保了日常涉外交往工作与上级机关最新外事工作精神保持一致。"}, {"source": "中国人民银行日常涉外交往管理规定", "target": "外资金融机构", "description": "规定对涉及外资金融机构的开业、庆典等活动的出席人员及审批流程作出限制"}, {"source": "分行", "target": "中国人民银行", "description": "分行是中国人民银行的分支机构"}, {"source": "中国人民银行日常涉外交往管理规定", "target": "分行", "description": "规定明确分行执行外事接待任务的费用列支方式及接受境外采访的限制"}, {"source": "分行", "target": "中国人民银行日常涉外交往管理规定", "description": "分行及其以下各级机构的涉外活动管理比照总行规定执行，必要时制订细则并报总行国际司备案"}, {"source": "经办银行", "target": "下岗失业人员小额担保贷款", "description": "经办银行负责下岗失业人员小额担保贷款的发放、回收及逾期处理。在业务管理上，经办银行需对贷款发放金额、笔数等指标进行单独统计。"}, {"source": "担保机构", "target": "下岗失业人员小额担保贷款", "description": "担保机构在下岗失业人员小额担保贷款业务中，主要承担向银行出具贷款担保承诺书及承诺担保发放该贷款的职能。在业务流程中，担保机构参与审核环节，并在借款人不能按期足额偿还贷款时，于三个月内履行清偿责任。此外，担保机构还参与逾期处理工作。\n\n注：输入描述中提及“在小企业贷款程序中执行审核职能”，鉴于实体明确为“下岗失业人员小额担保贷款”，且未提供该机构同时处理小企业贷款的具体关联证据，此处依据实体限定，仅保留与下岗失业人员小额担保贷款直接相关的审核及担保职责描述，避免将不同业务场景强行合并。所有描述均基于输入列表，未添加外部法律结论或事实。"}, {"source": "商业银行", "target": "下岗失业人员小额担保贷款", "description": "商业银行在下岗失业人员小额担保贷款业务中，主要承担经办银行职责。在贷款申请程序中，商业银行负责核贷环节。作为经办银行，商业银行需简化贷款手续，并为借款人提供结算便利。\n\n在贷后管理与风险控制方面，商业银行需对下岗失业人员小额担保贷款单独设立台账，并接受相关部门的监督。商业银行负责贷款的发放、展期审批以及不良贷款率的监控。根据规定，当该专项贷款的不良率达到20%时，商业银行应停止发放新的下岗失业人员小额担保贷款。\n\n此外，商业银行在信贷政策执行上，对吸纳下岗失业人员达到一定比例的小企业，应加大信贷支持力度。上述职责与要求均基于商业银行作为该专项贷款经办机构的身份，旨在规范贷款流程、强化风险监测并促进特定群体的就业与融资支持。"}, {"source": "担保机构", "target": "小额担保贷款", "description": "受理申请、办理反担保手续、出具担保承诺书并向经办银行推荐，审核时间为5个工作日"}, {"source": "经办银行", "target": "小额担保贷款", "description": "经办银行是小额担保贷款业务的办理主体，负责该业务的全流程管理。在业务办理环节，经办银行负责审核、复审书面材料并办理贷款手续，其中复审时间为2个工作日；其负责核贷并实行联保发放，最终完成贷款的审核与发放。作为业务办理机构，经办银行在发放贷款后，可能获得手续费补助。\n\n在贷后管理及风险防控方面，经办银行需对小额担保贷款业务建立专门的考核制度。其职责包括进行借款人回访、实施风险防控措施，以及负责贷款的回收工作。针对逾期贷款，经办银行负责清理，并履行告知借款人的义务，同时开展债务追索。\n\n综上，经办银行在小额担保贷款业务中承担从前期材料复审、贷款发放，到后期回收、逾期清理及风险防控的全链条责任，并依据相关规定享受相应的手续费补助政策。"}, {"source": "担保机构", "target": "经办银行", "description": "担保机构与经办银行在业务中建立合作关系。担保机构负责向经办银行推荐贷款申请。双方应签订合同，约定担保机构将担保基金存入经办银行，该资金专项用于下岗失业人员小额担保贷款。"}, {"source": "经办银行", "target": "财政贴息", "description": "经办银行负责计算应贴息金额并填报申报表，按季向市财政部门申报贴息资金金额。"}, {"source": "经办银行", "target": "借款人", "description": "经办银行与借款人建立借贷关系，双方签订借款合同，由经办银行负责贷款发放及清贷工作。在业务开展过程中，经办银行负责审查借款人资格，该审查过程通过劳动保障部门建议进行。经办银行需向借款人告知还款事宜，并对到期贷款采取催收措施。若贷款逾期满3个月，经办银行将办理代偿手续，并继续追索债务。"}, {"source": "商业银行", "target": "借款人", "description": "商业银行审核借款人申请，承诺可贷额度，并与其签订住房组合贷款合同"}, {"source": "借款人", "target": "商业银行", "description": "借款人向商业银行申请组合贷款，并按约定支付贷款本息"}, {"source": "外资金融机构", "target": "人民币业务", "description": "申请并经营该业务"}, {"source": "中国人民银行", "target": "人民币业务", "description": "批准外资金融机构经营该业务"}, {"source": "商业银行", "target": "中国人民银行", "description": "经办政策性住房信贷委托业务必须经其批准"}, {"source": "小额担保贷款", "target": "财政贴息", "description": "小额担保贷款业务涉及财政贴息管理。从事微利项目的借款人可享受财政贴息政策。具体贴息比例根据借款人身份及项目类型确定：依据申请人是否持有再就业优惠证、失业证明等证件，以及是否从事微利项目，享受不同比例的财政贴息。其中，从事微利项目的借款人，其财政贴息比例为50%。"}, {"source": "贵银发〔2011〕50号", "target": "国有商业银行", "description": "要求该类银行完善中小企业金融服务专营机构建设并向下延伸服务网点"}, {"source": "贵银发〔2011〕50号", "target": "股份制商业银行", "description": "要求该类银行完善中小企业金融服务专营机构建设并向下延伸服务网点"}, {"source": "贵银发〔2011〕50号", "target": "村镇银行", "description": "文件鼓励设立该类型机构"}, {"source": "贵银发〔2011〕50号", "target": "商业银行", "description": "文件鼓励商业银行投资设立村镇银行，并鼓励大中型商业银行向小额贷款公司提供批发资金融资"}, {"source": "各分行", "target": "中国人民银行总行", "description": "各分行制定的实施细则需报总行备案"}, {"source": "总行", "target": "中小企业", "description": "反馈辖区中小企业清单"}, {"source": "中国农业发展银行", "target": "总行", "description": "中国农业发展银行总行是该银行的最高管理层级与最高管理机构，亦被称为总部机构或上级管理机构。作为全行的核心管理主体，总行负责统一管理和制定政策，统筹全行事务。在资金与业务管理方面，总行负责统筹统还工作，并接收上划资金。在信息报送与沟通机制上，总行接收分行上报的分析材料和报告，文中提及的“向总行报送”即指代向中国农业发展银行总部进行报送。"}, {"source": "借款人", "target": "中国人民银行", "description": "借款人必须严格遵守中国人民银行有关贷款账户管理及资金结算管理的规定"}, {"source": "借款人", "target": "中国农业发展银行", "description": "借款人只能在农业发展银行开设基本存款账户和相应的专用账户，并接受其信贷监督"}, {"source": "中国农业发展银行", "target": "中国人民银行", "description": "中国农业发展银行与中国人民银行之间存在明确的业务往来及监管关系。在资金借贷方面，中国农业发展银行可向中国人民银行借款或申请日拆性借款，并履行清偿债务义务。具体执行上，中国农业发展银行总行负责统一向中国人民银行总行借款，并编报借款计划。\n\n在监管层面，中国农业发展银行的业务经营范围受中国人民银行核准。上述描述基于输入信息整合，未涉及具体文件文号、发文机关、时间范围、适用对象、金额、比例及特定条件等细节，因输入中未提供相关数据。所有信息均严格依据给定描述列表，未添加外部知识或法律结论。"}, {"source": "中国农业发展银行", "target": "人民银行", "description": "中国农业发展银行与人民银行之间存在多项监管与业务协作关系，主要涉及计划编报、现金管理、沟通机制及资金操作限制。\n\n在信贷计划管理方面，中国农业发展银行各级行在编报信贷计划时，需将相关计划抄报同级人民银行。在现金管理方面，各级行需向同级人民银行抄报现金收支计划，并报告现金管理情况。\n\n在业务沟通与协调方面，文中要求在收购旺季前，中国农业发展银行应加强与人民银行的沟通，以确保业务顺利开展。\n\n在资金操作限制方面，文中规定中国农业发展银行各级行原则上不得向当地人民银行进行特定资金操作。\n\n上述描述均基于输入信息，未添加外部知识或法律结论。各要求分别对应信贷计划、现金收支计划、旺季沟通及特定资金操作等不同场景，不存在冲突信息，故直接并列陈述。所有描述均保留原文中的主体（中国农业发展银行各级行、同级/当地人民银行）、动作（抄报、报告、加强沟通、不得进行）及条件（收购旺季前、原则上）。"}, {"source": "总行", "target": "分行", "description": "总行与分行之间存在明确的行政隶属与层级关系。分行隶属于总行，其子网页开辟于总行官方网站之下，直观体现了这种上下级架构。在管理职责上，分行需向总行报送管理情况及进行备案。\n\n在业务执行层面，总行负责制定系统内资金往来利率并下达年度现金计划；分行则负责执行上述计划，并拥有自定省以下利率的权限。总行对各分行的计划执行情况进行考核，并将考核结果通报各行。\n\n在监管程序方面，若涉及分行筹建事项，需在筹建期限届满前1个月向筹建申请受理机关提交延期申请。\n\n上述描述综合了总行对分行的管理、考核机制及分行的执行权限，同时明确了分行在筹建延期方面的具体时限要求。所有信息均基于输入内容，未添加外部事实或法律结论。"}, {"source": "中国农业发展银行", "target": "各分行", "description": "中国农业发展银行各分行是该行下设的分支机构。在管理体系中，各分行负责执行总行制定的资金及信贷管理要求。总行对各分行实施监管与考核，具体包括对计划执行情况、借款额度以及资金头寸限额执行情况进行核定与通报。"}, {"source": "各分行", "target": "总行", "description": "各分行与总行之间在资金管理及信息报送方面存在明确的职责与流程要求。\n\n在资金管理方面，各分行需严格执行资金头寸限额管理。若各分行出现超资金头寸限额占用的情况，相关资金应及时自动上划至总行。该机制旨在确保总行对全行资金头寸的集中监控与调配，防止分行层面资金占用超出规定限额。\n\n在信息报送方面，各分行需定期向总行报送月报及附表。这一要求确立了分行向总行进行定期数据汇报的义务，确保总行能够及时获取各分行的经营数据及相关统计信息。\n\n上述两项要求分别针对资金流动控制和信息传递两个维度，构成了总行对各分行日常监管与管理的核心环节。描述中未涉及具体的文件文号、发文机关、确切的时间范围、适用对象的具体界定、涉及的具体金额数值、比例细节或额外的触发条件。所有信息均基于输入的描述列表，未添加外部知识或法律结论。各分行作为执行主体，需同时履行资金自动上划和月报报送两项义务；总行作为接收主体，负责接收上划资金及审阅月报及附表。"}, {"source": "各分行", "target": "中国人民银行", "description": "各分行在资金临时不足时可向当地人民银行申请日拆性借款"}, {"source": "国务院", "target": "扶贫贷款", "description": "决定扶贫贷款由中国农业发展银行统一管理"}, {"source": "中国农业发展银行", "target": "扶贫贷款", "description": "中国农业发展银行是扶贫贷款业务的发放和管理主体，负责经营及统一管理扶贫贷款业务。"}, {"source": "中国农业发展银行", "target": "财政部", "description": "中国农业发展银行与财政部之间存在明确的财务报送及资金结算关系。\n\n在财务决算方面，中国农业发展银行每年向财政部报送年度财务决算。该义务在描述中重复出现，内容一致，均指代总行层面的年度财务数据上报行为。\n\n在资金结算方面，中国农业发展银行总行与财政部进行统一结算，具体涉及中央财政贴息贷款。该结算机制由总行直接对接财政部，体现了中央级政策性银行与财政部门在特定贷款业务上的直接财务往来。\n\n上述两项关系（年度财务决算报送、中央财政贴息贷款统一结算）均基于输入信息确认，未涉及其他分支行或不同处罚案件。所有描述均保留原始名称、发文机关（隐含于关系主体中）及业务性质，未添加外部法律结论或未提供的事实。"}, {"source": "借款人", "target": "扶贫贷款", "description": "借款人是扶贫贷款的业务对象"}, {"source": "中国农业发展银行", "target": "借款人", "description": "中国农业发展银行向符合条件的借款人发放储备棉贷款"}, {"source": "财政部门", "target": "财政贴息", "description": "财政部门负责提供财政贴息资金，并负责给予贷款贴息及落实贴息资金。"}, {"source": "中国农业发展银行", "target": "国务院", "description": "就联营业务试点事宜向国务院请示并获得同意"}, {"source": "中国农业发展银行", "target": "财政部门", "description": "配合财政部门按规定及时足额拨补费用和利息补贴，并通报补贴资金到位情况"}, {"source": "中国农业银行", "target": "农业发展银行", "description": "中国农业银行与农业发展银行之间存在代理业务关系。中国农业银行作为代理行，代理农业发展银行的业务，双方通过签署代理业务协议确立该合作关系。\n\n在业务执行与监管层面，中国农业银行及其基层行接受农业发展银行对代理业务工作的监督、检查与指导，并配合农业发展银行做好相关代理工作。中国农业银行作为代理行，需履行相应的配合义务，确保代理业务在农业发展银行的监管框架下运行。\n\n上述描述基于提供的输入信息，明确了双方“代理”与“被代理”的角色定位，以及“监督、检查、指导”与“配合”的互动机制。未涉及具体文件文号、发文机关、时间范围、适用对象、金额、比例或特定条件等细节，因输入中未 入描述，国有商业银行属于中资商业银行的一种类型，即国有商业银行是中资商业银行的子类。具体而言，中资商业银行的范围涵盖国有商业银行，国有商业银行作为中资商业银行体系内的组成部分，其性质被界定为中资商业银行的一个特定类别。\n\n在监管实体分类中，这种层级关系表明中资商业银行是上位概念，而国有商业银行是下位概念。所有关于国有商业银行的描述均指向其作为中资商业银行子集的属性，未出现将二者视为并列或独立无关实体的情况。输入信息一致确认了“国有商业银行是中资商业银行的一种”这一核心逻辑，强调了两者在银行监管实体分类中的从属地位。\n\n该描述仅基于提供的文本信息，未引入外部法律定义或额外事实。文中未涉及具体的文件文号、发文机关、时间范围、适用对象、金额、比例或特定处罚案件细节，因此合并后的描述聚焦于实体间的逻辑归属关系。对于同名不同机构、不同分支行或不同处罚案的情况，输入中未提供相关区分信息，故不涉及此类冲突处理。所有来源信息在“国有商业银行属于中资商业银行”这一结论上保持一致，无时间差异或信息冲突需要并列说明。\n\n综上所述，中资商业银行包括国有商业银行，国有商业银行是中资商业银行的子类。这一关系在监管语境下明确了国有商业银行在中资商业银行整体框架内的定位。描述严格遵循输入内容，以第三人称客观陈述实体间的包含与从属关系，确保信息的准确性与简洁性，未添加任何未提供的事实或法律结论。"}, {"source": "中资商业银行", "target": "股份制商业银行", "description": "股份制商业银行是中资商业银行的一种类型，二者存在包含关系，即股份制商业银行属于中资商业银行的子类。中资商业银行的范围涵盖股份制商业银行。在监管适用上，股份制商业银行作为中资商业银行的一种，适用相关办法中关于法人机构设立的规定。"}, {"source": "中资商业银行", "target": "城市商业银行", "description": "城市商业银行是中资商业银行的一种具体类型，二者存在包含关系，即城市商业银行属于中资商业银行的子类。根据相关描述，城市商业银行作为中资商业银行的一种，适用该办法关于法人机构设立的规定。"}, {"source": "中资商业银行", "target": "城市信用社股份有限公司", "description": "城市信用社股份有限公司是中资商业银行的一种具体类型，二者存在包含关系。中资商业银行这一范畴涵盖了城市信用社股份有限公司。在监管适用上，城市信用社股份有限公司作为中资商业银行的组成部分，适用相关办法中关于设立的规定。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "国务院", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》依据国务院的有关决定制定。该办法对涉及中资商业银行的特定行政许可事项作出了规定，其中明确中资商业银行境外上市需符合其规定的条件。此外，该办法对企业权益性投资比例进行了限制，规定除国务院规定的投资公司和控股公司外，其他企业权益性投资余额原则上不超过净资产的50%。上述规定均出自该2006年发布的实施办法，旨在规范中资商业银行及相关企业的行政许可与投资管理行为。"}, {"source": "中国银行业监督管理委员会", "target": "中国银监会中资商业银行行政许可事项实施办法（2006）", "description": "中国银行业监督管理委员会发布《中国银监会中资商业银行行政许可事项实施办法（2006）》。该文件由该委员会制定并施行，旨在规范中资商业银行的行政许可事项。作为银行业监管机构，中国银行业监督管理委员会通过该实施办法确立了对中资商业银行相关行政许可的管理规则。该办法属于部门规章性质，明确了行政许可的具体实施要求。输入信息中多次提及该委员会“发布该实施办法”、“发布该法规”、“发布该行政许可事项实施办法”、“发布该行政许可实施办法”及“发布该规章”，均指向同一发布行为及同一文件主体。该文件名称中包含年份“2006”，表明其发布或生效时间背景。适用对象为中资商业银行。描述中未提供具体的文件文号、发文机关全称以外的其他机构名称、具体的金额、比例或更细致的条件限制。所有输入描述均一致确认发布主体为中国银行业监督管理委员会，未出现同名不同机构或不同分支行的冲突情况，亦无不同处罚案的信息。因此，合并后的描述聚焦于发布主体、文件名称、文件性质及适用对象，保留原始输入中的关键要素，未添加外部知识或法律结论。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "股份制商业银行", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》针对股份制商业银行的行政许可事项作出规定。该办法明确了设立股份制商业银行的发起人条件及股权比例限制，并对该类型银行的设立条件、筹建及开业程序作出具体规定。同时，该办法规定了股份制商业银行的行政许可受理与决定程序。此外，该办法还规定了股份制商业银行解散和破产的审批程序，具体包括破产申请的受理、审查及决定程序。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "城市商业银行", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》针对城市商业银行法人机构，规定了多项行政许可事项的条件与程序。在设立与开业方面，该办法对城市商业银行的设立地点、注册资本、资本充足率等准入条件作出具体规定，并明确了开业申请、核准及延期程序。在业务经营方面，规定了开办外汇业务等行政许可的条件与程序。在退出机制方面，规定了城市商业银行解散和破产的审批程序，以及破产申请、终止营业申请的处理流程。此外，该办法还统一规定了该类型银行行政许可的受理与决定程序。上述规定共同构成了对城市商业银行从设立、业务开展到退出全生命周期的行政许可监管框架。"}, {"source": "城市商业银行", "target": "中华人民共和国商业银行法", "description": "城市商业银行的章程需符合《中华人民共和国商业银行法》的规定"}, {"source": "银监局", "target": "银监会", "description": "银监局与银监会在监管流程中呈现层级隶属关系，具体职责分工如下：\n\n1. **审批与报送机制**：银监局负责初审工作。在审查合格并出具意见后，需将申请资料连同审核意见一并报送银监会，由银监会进行最终审批。\n2. **备案管理**：银监局制定的实施细则需报银监会备案，以确保地方监管规则与上级监管要求保持一致。\n3. **信息抄送**：银监局作出开业决定后，需将该决定抄报银监会，实现监管信息的上下互通。\n\n上述流程明确了银监局作为初审与执行机构，银监会作为最终审批与备案监督机构的职能定位。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "城市信用社股份有限公司", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》针对城市信用社股份有限公司等中资商业银行，规定了多项行政许可事项的条件与程序。\n\n在机构设立与变更方面，该办法规定了城市信用社股份有限公司的设立条件及程序，涵盖设立、筹建、开业以及分支机构设立等行政许可事项。同时，明确了该类公司解散的审批程序。\n\n在业务准入方面，规定了城市信用社股份有限公司开办外汇业务等行政许可的条件与程序。\n\n在机构退出方面，规定了城市信用社股份有限公司破产申请的行政许可条件与程序。\n\n此外，该办法统一规定了上述各类行政许可事项的受理与决定程序，确保审批流程的规范性。所有规定均依据2006年发布的该实施办法执行，适用于城市信用社股份有限公司这一特定类型的中资商业银行主体。"}, {"source": "城市信用社股份有限公司", "target": "城市信用合作社", "description": "由同一城市内多家或一家城市信用合作社合并设立"}, {"source": "城市信用社股份有限公司", "target": "中华人民共和国商业银行法", "description": "设立需符合商业银行法规定的章程"}, {"source": "城市商业银行", "target": "银监局", "description": "向所在地银监局提交开业申请，由银监局受理并决定"}, {"source": "银监局", "target": "中国银行业监督管理委员会", "description": "银监局（中国银行业监督管理委员会派出机构）在监管工作中需履行向银监会（中国银行业监督管理委员会）报送及备案的职责。具体包括：制定的实施细则需报银监会备案；自受理之日起20日内，将申请资料连同审核意见报送银监会；在作出开业核准或不予核准决定后，需将决定抄报银监会。上述流程明确了银监局与银监会在行政审批及监管备案环节中的层级关系与操作时限。"}, {"source": "城市信用合作社", "target": "城市信用社股份有限公司", "description": "城市信用合作社与城市信用社股份有限公司在设立过程中存在关联。根据输入信息，城市信用合作社作为股东或发起人，参与设立了城市信用社股份有限公司。该描述明确了城市信用合作社在股份有限公司设立中的角色，即作为发起主体之一参与组建。输入中未提供具体的文件文号、发文机关、确切的时间范围、适用对象的具体界定、涉及的金额、比例或特定条件，因此合并后的描述仅基于现有文本，保留“城市信用合作社”作为股东或发起人参与设立“城市信用社股份有限公司”这一核心事实。由于输入未包含不同分支行、不同处罚案或同名不同机构的冲突信息，故无需进行并列说明或裁决。描述严格依据输入内容，未添加任何外部知识、法律结论或未提供的事实。"}, {"source": "银监局", "target": "城市信用社股份有限公司", "description": "银监局作为监管主体，对城市信用社股份有限公司及其相关事项履行受理、审查及决定职责。具体职能涵盖机构设立、变更、业务开展及退出全流程。\n\n在机构设立与筹建方面，银监局受理并初步审查城市信用社股份有限公司的筹建申请；受理其开业申请并作出批准或不予批准决定。若机构未按时开业，银监局将办理注销手续。此外，银监局审查并决定城市信用社股份有限公司分社的设立。\n\n在法人机构变更方面，银监局受理并初步审查城市信用社股份有限公司法人机构变更名称的申请，以及部分股权变更申请。对于变更股东、注册资本、住所、组织形式等事项，银监局受理、审查并决定，或进行初步审查。同时，银监局受理并初步审查城市信用社股份有限公司修改章程的申请。\n\n在业务管理方面，银监局受理并初步审查城市信用社股份有限公司的业务申请。对于现行法规明确规定的其他业务和品种，银监局负责审查并决定其开办申请。\n\n在机构退出方面，银监局受理并初步审查城市信用社股份有限公司的解散申请。\n\n上述职责依据输入描述整理，银监局在不同事项中分别承担“受理并初步审查”或“审查并决定”的职能，具体权限视申请事项类型而定。所有描述均基于提供的输入信息，未添加外部法律结论或事实。"}, {"source": "银监局", "target": "银监分局", "description": "银监局与银监分局在监管工作中存在明确的层级分工与协作关系。银监局作为上级监管机构，负责最终审查与决定，并履行特定的行政程序义务；银监分局作为下级监管机构，负责受理、初审及提供属地监管意见。\n\n具体职责与流程如下：\n\n1. **城市商业银行相关申请处理**：银监分局负责受理并初审城市商业银行的相关申请。在银监分局完成初审后，由银监局进行最终审查并作出决定。\n\n2. **拟设城市信用社股份有限公司监管意见征求**：在涉及拟设城市信用社股份有限公司的事项中，银监局需向该机构所在地的银监分局征求监管意见。\n\n3. **开业核准决定抄送**：银监局在作出开业核准决定后，需将该决定抄送相关银监分局。\n\n4. **一般性监管意见征求**：银监局在特定监管事项中，会向银监分局征求监管意见，以获取属地监管视角或补充信息。\n\n上述描述基于输入信息，明确了银监局在决策、核准及抄送方面的职责，以及银监分局在初审、属地意见提供方面的职责。两者在银行设立及监管流程中形成上下级联动机制，银监局依据银监分局的初审结果或监管意见进行后续处理，并将关键决定反馈至银监分局。"}, {"source": "国有商业银行", "target": "分行", "description": "申请设立分行需符合公司治理、风险管理、资本充足率及营运资金等特定条件"}, {"source": "股份制商业银行", "target": "分行", "description": "申请设立分行需符合公司治理、风险管理、资本充足率及营运资金等特定条件"}, {"source": "国有商业银行", "target": "资本充足率", "description": "申请设立分行时需符合该监管指标"}, {"source": "股份制商业银行", "target": "资本充足率", "description": "申请设立分行时需符合该监管指标"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "分行", "description": "规定分行的开业条件及登记要求"}, {"source": "中国银行业监督管理委员会", "target": "分行", "description": "受理、审查并决定分行的开业申请"}, {"source": "中国银行业监督管理委员会", "target": "银监局", "description": "中国银行业监督管理委员会（简称“银监会”）为银行业监管机构。银监局是银监会的派出机构，负责具体监管事务。在任职资格核准工作中，银监局承担相应职责，包括负责部分事项的受理和初步审查。此外，银监局需执行银监会的要求，转发相关通知。"}, {"source": "中国银行业监督管理委员会", "target": "银监分局", "description": "中国银行业监督管理委员会（简称银监会）为银行业监管机构。银监分局是银监会的派出机构，负责具体监管事务。在任职资格核准工作中，银监分局承担相应职责。"}, {"source": "中资商业银行", "target": "城市信用合作社", "description": "收购城市信用合作社需满足特定协议及承诺条件"}, {"source": "中资商业银行", "target": "资本充足率", "description": "申请设立境外机构时资本充足率需不低于8%"}, {"source": "银监分局", "target": "城市信用社股份有限公司", "description": "银监分局负责受理城市信用社股份有限公司的相关业务申请。具体职责包括：受理该机构申请开办现行法规明确规定的其他业务和品种；同时，受理并初步审查城市信用社股份有限公司分社的筹建申请。上述描述基于输入信息合并，未添加外部事实或法律结论，保留了原文中关于受理范围及审查环节的关键要素。"}, {"source": "中资商业银行", "target": "分行", "description": "中资商业银行在境内设立分支机构时，分行属于其法定组织形式之一。当涉及收购任务时，若由中资商业银行授权其分行执行收购任务，该分行需满足特定条件：经营状况良好且内控健全。上述要求明确了分行作为执行主体在特定业务场景下的资质标准，以及分行在银行组织架构中的定位。"}, {"source": "中国银行业监督管理委员会", "target": "国有商业银行", "description": "中国银行业监督管理委员会（银监会）作为监管主体，负责受理、审查并决定国有商业银行的多项重大变更及退出事项。具体职权范围包括：\n\n1. **机构设立与变更**：受理、审查并决定国有商业银行设立境外机构的申请；决定法人机构变更名称的申请。\n2. **资本与股权事项**：受理、审查并决定该银行变更注册资本、股权变更的申请。\n3. **公司治理与运营调整**：受理、审查并决定修改章程、变更住所、变更组织形式以及境外上市等事项。\n4. **业务托管**：对国有商业银行申请的相关托管业务进行受理、审查并决定。\n5. **解散与破产**：受理、审查并决定国有商业银行的解散和破产申请。\n\n上述描述综合了银监会在国有商业银行监管中的核心审批职能，涵盖了从机构设立、名称变更、资本结构调整、股权变动、公司治理文件修改、住所及组织形式变更，到境外上市、业务托管以及最终的解散和破产处理等全流程监管环节。所有事项均由银监会依法进行受理、审查并作出最终决定。"}, {"source": "中国银行业监督管理委员会", "target": "股份制商业银行", "description": "中国银行业监督管理委员会（银监会）作为监管机构，负责受理、审查并决定股份制商业银行的多项重大变更及业务申请。具体职权范围包括：\n\n1. **机构设立与变更**：受理、审查并决定股份制商业银行设立境外机构的申请；决定法人机构变更名称的申请。\n2. **重大事项变更**：受理、审查并决定该银行变更注册资本、境外上市、修改章程、变更住所、组织形式等事项。其中，股权变更、注册资本变更、境外上市、修改章程、变更住所等事项亦明确由银监会受理、审查并决定。\n3. **解散与破产**：受理、审查并决定股份制商业银行的解散和破产申请。\n4. **业务审批**：对股份制商业银行申请的相关托管业务进行受理、审查并决定。\n\n上述描述均基于输入信息，未添加外部事实或法律结论。各描述中涉及的“受理、审查并决定”为统一监管程序，适用对象均为股份制商业银行。不同描述间关于变更事项（如注册资本、章程、住所等）存在重叠，已合并表述，未强行区分不同分支行或不同处罚案。所有信息均保留原始名称、发文机关（银监会/中国银行业监督管理委员会）及适用对象，未涉及具体文件文号、时间范围、金额或比例，因输入中未提供此类细节。"}, {"source": "银监局", "target": "城市商业银行", "description": "银监局作为监管机构，对城市商业银行实施多项监管职责，主要涵盖机构变更、业务审批、人员任职资格及风险处置等方面。\n\n在机构变更与设立方面，银监局受理并初步审查城市商业银行变更组织形式、分立、解散、变更股东、注册资本、住所、修改章程等申请。同时，银监局受理并初步审查城市商业银行投资设立、参股、收购境外机构，以及设立境外机构的申请。对于部分法人机构变更名称、部分股权变更等事项，银监局亦负责受理并初步审查。此外，银监局受理并决定城市商业银行的部分股权变更、注册资本变更、修改章程、变更住所等事项，或进行初步审查。\n\n在业务审批方面，银监局受理并初步审查城市商业银行的业务申请。针对城市商业银行申请开办现行法规明确规定的其他业务和品种，银监局负责审查并作出决定。\n\n在人员管理方面，银监局作为监管机构，审查并决定城市商业银行法人机构、分行及分行级专营机构董事和高级管理人员的任职资格。\n\n在风险处置与信息传达方面，银监局等监管部门对高风险城市商业银行进行增资扩股及资产置换。此外，银监局负责将相关通知转发给辖内各城市商业银行。\n\n上述职责依据输入描述整理，银监局在不同事项中分别承担“受理并初步审查”或“审查并决定”的职能，具体适用对象为城市商业银行及其相关机构。"}, {"source": "中国银行业监督管理委员会", "target": "城市商业银行", "description": "中国银行业监督管理委员会对城市商业银行实施监管，主要职责涵盖机构变更、股权变动、业务准入及退出机制的审查与决定。\n\n在股权与股东管理方面，该委员会负责审查并决定城市商业银行变更持有10%以上股东的申请。针对涉及境外金融机构入股、境外发行股份和上市等特定事项，亦由其进行审查并作出决定。此外，对于部分股权变更申请，该委员会同样行使审查与决定权。\n\n在机构设立与布局方面，中国银行业监督管理委员会审查并决定城市商业银行设立境外机构的申请。\n\n在业务准入方面，该委员会对城市商业银行申请的相关托管业务进行最终审查并决定。\n\n在机构退出方面，中国银行业监督管理委员会负责审查并决定城市商业银行的解散申请。\n\n上述监管职权均依据相关监管规定执行，适用于城市商业银行这一特定适用对象。所有审查决定均基于申请事项的具体内容，包括涉及的金额、比例及特定条件（如10%以上股东比例、境外机构设立等）。该委员会作为发文及监管机关，其决定具有最终效力。描述中未提及具体文件文号及确切时间范围，仅依据输入信息明确其职能范围。对于不同分支行或不同处罚案件，本描述不作合并处理，仅聚焦于上述列举的监管实体与关系描述。所有信息均严格依据输入列表，未添加外部法律结论或未提供的事实。"}, {"source": "中国银行业监督管理委员会", "target": "城市信用社股份有限公司", "description": "中国银行业监督管理委员会负责审查并决定城市信用社股份有限公司的相关重大事项申请。具体职权范围包括：\n\n1. **股东与股权变更**：审查并决定变更持有10%以上股东的申请；审查并决定涉及境外金融机构入股的申请；审查并决定部分股权变更申请。\n2. **组织形式与名称变更**：审查并决定变更组织形式的申请；审查并决定法人机构变更名称的申请。\n3. **解散申请**：审查并决定该机构的解散申请。\n\n上述描述基于输入信息合并，未添加外部事实或法律结论。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "国有商业银行", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》针对国有商业银行等中资商业银行，规定了相关行政许可事项的受理、审查及决定程序。具体而言，该办法明确了国有商业银行在解散和破产情形下的审批流程，包括破产申请的受理、审查及最终决定的程序性要求。作为2006年发布的监管规范性文件，其适用对象涵盖国有商业银行，旨在规范此类银行在重大变更事项（如解散、破产）中的行政许可行为，确保审批过程符合监管规定。该描述仅基于输入信息，未涉及其他类型银行或不同分支行的具体差异，亦未对历史要求与当前要求作对比裁决。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "城市信用合作社", "description": "《中国银监会中资商业银行行政许可事项实施办法（2006）》针对城市信用合作社等中资商业银行，规定了多项行政许可事项的具体程序。在机构变更方面，该办法明确了城市信用合作社变更住所及改制的行政许可程序。在机构退出方面，该办法规定了城市信用合作社解散和破产的审批程序，具体包括破产申请的受理、审查及决定程序。上述规定旨在规范城市信用合作社在经营过程中的重大变更及退出行为，确保行政许可流程的合规性与严谨性。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "银监局", "description": "规定其作为受理和初步审查机关的职责"}, {"source": "银监局", "target": "城市信用合作社", "description": "银监局作为监管主体，依据相关法规对城市信用合作社及银行机构实施监管。在业务办理方面，银监局负责受理并初步审查城市信用合作社的解散申请。同时，银监局受理该银行变更住所及改制申请，并具体受理、审查并决定城市信用合作社的变更住所事项。上述描述涵盖了银监局在城市信用合作社解散、变更住所及改制等关键监管环节中的职责，包括受理、初步审查、审查及决定等程序性动作。所有信息均基于输入描述，未添加外部事实或法律结论。"}, {"source": "中国银行业监督管理委员会", "target": "城市信用合作社", "description": "中国银行业监督管理委员会作为监管机构，依据相关法规对城市信用合作社实施监管。在机构变更与退出机制方面，该委员会负责受理、审查并决定城市信用合作社的破产申请；同时，负责审查并决定其变更为城市信用社股份有限公司的申请，以及审查并决定城市信用合作社的解散申请。上述职权涵盖了对城市信用合作社在破产、改制及解散等重大事项上的审批与决定权。"}, {"source": "中国银监会中资商业银行行政许可事项实施办法（2006）", "target": "资本充足率", "description": "规定开办外汇业务及募集次级债务、发行次级债券时的资本充足率最低要求"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "国有商业银行", "description": "中国银行业监督管理委员会（已撤销）作为监管机关，对国有商业银行实施多项行政许可与监管职责。在人员管理方面，该委员会直接受理、审查并决定国有商业银行法人机构及总行营业部董事及高级管理人员的任职资格。在机构设立与变更方面，其受理、审查并决定国有商业银行投资设立、参股或收购境外机构的申请，以及法人机构变更名称的申请。在业务与资本管理方面，该委员会受理、审查并决定国有商业银行申请募集次级定期债务、发行次级债券，以及开办衍生产品交易业务。上述描述均基于输入信息，未涉及具体文件文号、发文时间、适用金额比例或特定处罚案例，且未对同名不同机构或不同分支行进行合并。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "股份制商业银行", "description": "中国银行业监督管理委员会（已撤销）作为监管机关，主要履行对股份制商业银行及相关法人机构的行政许可与监管职责。在高管任职资格管理方面，该机构负责受理、审查并决定银监会直管法人机构及属地监管法人机构董事长、行长、董事会秘书的任职资格。\n\n在机构设立与变更方面，该机构受理、审查并决定股份制商业银行投资设立、参股、收购境外机构的申请，以及法人机构变更名称的申请。\n\n在业务准入与资本补充方面，该机构受理、审查并决定股份制商业银行申请募集次级定期债务、发行次级债券，以及开办衍生产品交易业务。\n\n上述描述基于输入信息合并，未添加外部事实或法律结论。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "城市商业银行", "description": "中国银行业监督管理委员会（已撤销）作为监管机构，对城市商业银行的相关重大事项行使审查与决定权。其职权范围主要涵盖境外业务拓展、资本补充及特定业务开办三个方面。\n\n在境外机构管理方面，该委员会负责审查并决定城市商业银行投资设立、参股或收购境外机构的申请。同时，对于部分法人机构变更名称的申请，亦由该委员会进行审查并作出决定。\n\n在资本工具发行方面，该委员会审查并决定城市商业银行申请募集次级定期债务及发行次级债券的事项。\n\n在业务准入方面，该委员会负责审查并决定城市商业银行开办衍生产品交易业务的申请。\n\n上述描述基于提供的输入信息，明确了监管机构（中国银行业监督管理委员会，已撤销）与适用对象（城市商业银行）之间的监管关系。描述中保留了关键业务类型，包括境外机构投资设立、参股、收购，法人机构名称变更，次级定期债务募集，次级债券发行，以及衍生产品交易业务开办。未涉及具体文件文号、发文机关全称（除实体名外）、具体时间范围、金额、比例或特定条件，因输入中未提供此类细节。不同业务事项并列说明，未进行强行合并或裁决。"}, {"source": "银监分局", "target": "中资商业银行", "description": "受理城市商业银行、城市信用社股份有限公司申请开办现行法规明确规定的其他业务"}, {"source": "金融资产管理公司", "target": "国有商业银行", "description": "金融资产管理公司在机构变更及高级管理人员任职资格许可方面，参照国有商业银行执行。具体而言，其变更事项及高管任职资格许可的条件与程序，均依据国有商业银行的相关规定办理。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "《中华人民共和国银行业监督管理法》", "description": "依据该法律制定"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "《中华人民共和国商业银行法》", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）依据《中华人民共和国商业银行法》制定。该办法规定，中资商业银行变更组织形式、分立、合并应符合《中华人民共和国商业银行法》的规定。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "中资商业银行", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）是规范中资商业银行行政许可行为及监管要求的规范性文件。该办法明确中资商业银行作为其适用主体，涵盖法人机构及分支机构。\n\n在机构设立方面，该办法规定中资商业银行作为申请设立分行、专营机构及办理相关行政许可的主体，对其法人机构及分支机构的设立进行规范。在人员管理方面，该办法规定了中资商业银行机构及高管任职资格的行政许可条件与程序。\n\n综上，该办法旨在通过规定中资商业银行行政许可事项的实施办法，统一规范该类型银行的行政许可行为，确保其机构设立与高管任职符合监管要求。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "国务院", "description": "落实国务院行政审批制度改革精神"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "description": "中国银行业监督管理委员会（已撤销）作为监管机构，发布了《中资商业银行行政许可事项实施办法》（征求意见稿）。该机构负责发布该文件并公开征求意见，同时承担对该征求意见稿的解释职责。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "股份制商业银行", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）针对股份制商业银行及其分支机构，规定了多项行政许可事项的具体监管要求与程序。\n\n在机构设立与变更方面，该草案规定股份制商业银行法人机构的筹建延期及开业申请需符合特定监管要求。对于未跨银监局辖区设立的股份制商业银行二级分行，其筹建事项由银监局决定。涉及股份制商业银行变更组织形式、分立、合并，以及变更注册资本、修改章程等重大事项，均由银监会负责受理、审查并作出决定。此外，草案还明确了股份制商业银行特定业务的受理和审查程序。\n\n在人员任职资格方面，该法规草案详细规定了股份制商业银行高级管理人员的任职资格条件及申请适用规则。具体包括董事长、副董事长及董事会秘书的任职资格条件，以及分支机构高级管理人员任职资格的具体条件。这些规定旨在规范股份制商业银行关键岗位人员的准入标准，确保其具备相应的专业能力与合规意识。\n\n上述内容均基于该征求意见稿文本，明确了银监会与银监局在不同层级、不同事项上的监管职责划分，以及股份制商业银行在机构变动和高管任命方面需遵循的法定程序与条件。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "国有商业银行", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）针对国有商业银行的行政许可事项作出了具体规定。在机构设立与变更方面，该草案明确了国有商业银行法人机构开业申请的监管要求；对于变更组织形式、分立、合并等重大事项，规定由银监会负责受理、审查并作出决定；同时，变更注册资本、修改章程等事项亦由银监会决定。此外，草案还规定了国有商业银行特定业务的受理和审查程序。\n\n在人员管理方面，该草案详细规定了国有商业银行高级管理人员的任职资格条件及申请适用规则。具体包括：规定了董事长、副董事长及董事会秘书的任职资格条件；规定了分支机构高级管理人员任职资格的具体条件。上述规定旨在规范国有商业银行的行政许可流程，明确银监会在相关事项中的监管职责与审批权限。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "城市商业银行", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）针对城市商业银行的行政许可事项作出了具体规定。在机构设立与变更方面，该草案规定城市商业银行法人机构开业申请由所在地银监局受理并决定；省内分行筹建由银监局决定。对于变更组织形式、分立等重大事项，由所在地银监局受理并初步审查，银监会审查并决定。此外，草案还规定了城市商业银行变更股东、注册资本、住所等事项的行政许可程序，以及特定业务的受理和审查程序。\n\n在人员管理方面，该法规草案规定了城市商业银行高级管理人员任职资格申请的适用规则。具体而言，它明确了董事长、副董事长及董事会秘书的任职资格条件，并规定了分支机构高级管理人员任职资格的具体条件。上述规定旨在规范城市商业银行的行政许可流程及高管任职标准。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "银监局", "description": "《中资商业银行行政许可事项实施办法》（征求意见稿）规定银监局作为受理、审查或决定机关的职责。具体而言，该办法明确银监局是受理、审查并决定特定分行及专营机构筹建与开业申请的监管机关。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "国务院", "description": "规定公开募集股份和上市交易股份需符合国务院有关规定"}, {"source": "国有商业银行", "target": "中国银行业监督管理委员会(已撤销)", "description": "国有商业银行申请开办衍生产品交易业务时，由银监会受理、审查并决定"}, {"source": "股份制商业银行", "target": "中国银行业监督管理委员会(已撤销)", "description": "股份制商业银行申请开办衍生产品交易业务时，由银监会受理、审查并决定"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "中资商业银行", "description": "对中资商业银行的行政许可申请进行审查并作出决定"}, {"source": "银监分局", "target": "城市商业银行", "description": "银监分局作为监管机构，主要履行对城市商业银行的监管职责。在人员管理方面，银监分局负责受理并初审城市商业银行法人机构、分行及分行级专营机构董事和高级管理人员的任职资格申请。在业务准入方面，银监分局受理城市商业银行申请开办现行法规明确规定的其他业务和品种。上述描述基于输入信息整合，明确了银监分局在城市商业银行高管任职资格初审及特定业务品种开办申请受理方面的职能。"}, {"source": "国有商业银行", "target": "中资商业银行", "description": "国有商业银行属于中资商业银行的一种类型。"}, {"source": "股份制商业银行", "target": "中资商业银行", "description": "股份制商业银行属于中资商业银行的一种类型。"}, {"source": "城市商业银行", "target": "中资商业银行", "description": "城市商业银行属于中资商业银行的一种类型。"}, {"source": "分行", "target": "中资商业银行", "description": "中资商业银行的分支机构"}, {"source": "董事会", "target": "中资商业银行", "description": "中资商业银行的决策机构"}, {"source": "银监局", "target": "股份制商业银行", "description": "银监局作为属地监管机构，主要承担对股份制商业银行相关高级管理人员任职资格的监管职责。其具体职能依据监管对象及机构层级不同，分为以下两类情形：\n\n第一，针对属地监管法人机构，银监局负责受理、审查并决定其他董事和高级管理人员的任职资格，或在特定程序中进行初审。\n\n第二，针对股份制商业银行的分行（含异地直属支行）及分行级专营机构，银监局作为监管机构，负责受理、审查并决定其高级管理人员的任职资格。\n\n上述描述基于输入信息合并，保留了监管机构名称、适用对象（法人机构、分行、分行级专营机构）及具体职权（受理、审查、决定、初审）。输入中未提供具体的文件文号、发文机关全称、明确的时间范围、涉及金额、比例或特定处罚案例，故未包含此类信息。银监局对法人机构与分行级机构高管的任职资格管理职责并列存在，分别适用于不同的机构层级，不存在冲突或需裁决的历史与当前要求差异。"}, {"source": "银监局", "target": "国有商业银行", "description": "作为监管机构，受理、审查并决定其一级分行（直属分行）高级管理人员的任职资格"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "银监局", "description": "银监局是中国银行业监督管理委员会（已撤销）的派出机构，主要职责为协助执行监管工作。在业务运作与决策流程上，银监局与银监会之间存在明确的层级汇报与审批机制。\n\n具体而言，涉及机构筹建和开业的决定，银监局需将相关决定抄送银监会。此外，银监局作出的部分书面决定需抄报银监会；对于特定事项，由银监局进行初审后，最终由银监会作出决定。上述流程体现了银监局作为派出机构在监管执行中对上级机关的从属关系及信息报送义务。\n\n注：输入描述中未提供具体的文件文号、发文机关全称（除银监会/银监局外）、具体适用对象范围、涉及金额、比例或特定时间范围。所有描述均基于输入列表合并，未添加外部事实或法律结论。"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "银监分局", "description": "规定其作为受理、审查并决定机关的职责"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "政策性银行", "description": "规定政策性银行参照本办法执行相关许可条件"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "国家开发银行", "description": "规定国家开发银行参照本办法执行相关许可条件"}, {"source": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "target": "金融资产管理公司", "description": "规定金融资产管理公司参照本办法执行相关许可条件"}, {"source": "银监会", "target": "《中资商业银行行政许可事项实施办法》（征求意见稿）", "description": "负责解释该办法"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "《外资银行行政许可事项实施办法（征求意见稿）》", "description": "中国银行业监督管理委员会（已撤销）是《外资银行行政许可事项实施办法（征求意见稿）》的制定与发布机关。该委员会负责起草该法规草案，并正式发布该征求意见稿。在发布过程中，该委员会公开征求社会意见，旨在完善相关行政许可事项的规定。作为发文机关，其核心行为包括制定该办法、发布征求意见稿以及就其中涉及的行政许可事项进行公开征求意见。所有描述均指向同一主体对同一文件草案的起草、发布及征求意见行为，未涉及不同分支行或不同处罚案件，亦无冲突信息需并列说明。该描述严格基于输入信息，未添加外部知识或法律结论，仅保留实体名称、文件名称及核心动作（制定、发布、公开征求意见、规定行政许可事项）。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "《中华人民共和国商业银行法》", "description": "《外资银行行政许可事项实施办法（征求意见稿）》与《中华人民共和国商业银行法》在银行机构设立及变更事项上存在关联。依据输入信息，《外资银行行政许可事项实施办法（征求意见稿）》第九条规定，拟设立机构的章程应符合《中华人民共和国商业银行法》的规定。此外，该办法还规定，银行机构变更组织形式、合并、分立需符合《中华人民共和国商业银行法》。上述描述仅基于提供的文本，未包含其他外部事实或法律结论。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "外商独资银行", "description": "《外资银行行政许可事项实施办法（征求意见稿）》针对外商独资银行，规定了其设立、变更、合并、分立及业务开办等行政许可事项的具体监管要求。\n\n在设立与基础管理方面，该草案明确了外商独资银行的设立条件、股东条件及名称规范。对于筹建、验收及开业申请，规定了具体的监管要求。\n\n在高管任职资格方面，规定外商独资银行的董事长需具有8年以上金融工作或者12年以上相关经济工作经历。\n\n在变更与组织调整方面，规定了外商独资银行变更股东、组织形式等行政许可事项的条件与程序，并适用于其变更、合并、分立等行政许可管理。\n\n在业务准入方面，规定了该类银行申请开办信用卡业务的条件和监管程序。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "中外合资银行", "description": "《外资银行行政许可事项实施办法（征求意见稿）》针对中外合资银行，规定了其设立、变更、合并、分立及业务开办等行政许可事项的条件与程序。\n\n在设立与基本规范方面，该草案明确了中外合资银行的设立条件、股东条件及名称规范，并规定了其筹建、验收及开业申请的具体监管要求。\n\n在高管任职资格方面，草案规定中外合资银行董事长需具有8年以上金融工作或者12年以上相关经济工作经历。\n\n在业务许可方面，该法规草案规定了中外合资银行申请开办信用卡业务的条件和监管程序。\n\n此外，该草案适用于中外合资银行变更股东、组织形式等行政许可事项的管理，涵盖变更、合并、分立等具体监管要求。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "外国银行分行", "description": "规定其中文名称应标明外国银行国籍及责任形式"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "外国银行代表处", "description": "《外资银行行政许可事项实施办法（征求意见稿）》对外国银行代表处作出如下规定：\n\n一、名称规范\n该办法规定，外国银行代表处的中文名称应当标明其所属外国银行的国籍及责任形式。\n\n二、首席代表变更管理\n在外国银行代表处更换首席代表期间，若拟任首席代表尚未获得监管核准，该代表处需指定符合规定条件的人员代为履行首席代表职责，并按规定向监管机构报告。\n\n上述规定明确了外国银行代表处在名称标识及人员交接过渡期的具体合规要求，旨在确保机构身份清晰及业务管理连续性。"}, {"source": "银监局", "target": "中国银行业监督管理委员会(已撤销)", "description": "银监局作为中国银行业监督管理委员会（已撤销）的派出机构，在相关审批流程中承担初审职责。根据描述，银监局负责将开业申请资料连同审核意见报送至中国银行业监督管理委员会（银监会）。在此过程中，银监局将申请资料及审核意见报送银监会，由银监会作出批准或不批准开业的决定。\n\n上述描述均指向同一监管层级关系：银监局作为下级派出机构，执行初审并将材料上报；银监会作为上级监管机构，负责最终审批决定。各描述在核心流程上保持一致，即“银监局初审并报送”与“银监会审批决定”。\n\n需注意，中国银行业监督管理委员会（银监会）已撤销，其职能由后续设立的监管机构承接，但本描述仅依据输入信息，保留原机构名称及历史职能描述，不引入外部关于机构改组后的具体职能转移细节。所有描述均基于银监局向银监会报送资料这一既定程序，未涉及不同分支行或不同处罚案的混淆。\n\n在适用对象和条件方面，描述明确指向“开业申请”这一特定事项。银监局需将“开业申请资料”与“审核意见”一并报送。报送的对象明确为“银监会”或“中国银行业监督管理委员会”。最终的决定权归属于银监会，其决定内容为“批准”或“不批准”开业。\n\n各描述在表述上略有差异，如“报送该机构”、“报送银监会”、“报送银监会审批决定”等，但实质内容均为银监局向银监会提交初审后的材料，由银监会进行最终裁定。无冲突信息，无需并列说明来源或时间差异，因为所有描述均指向同一监管逻辑和流程。\n\n综上，合并后的描述为：银监局作为中国银行业监督管理委员会（已撤销）的派出机构，负责将开业申请资料连同审核意见报送银监会，由银监会作出批准或不批准开业的决定。该流程体现了银监局初审、银监会终审的监管架构。描述中未包含具体的文件文号、发文机关全称（除银监会外）、具体时间范围、适用对象细节（除开业申请外）、金额、比例或额外条件，故不予添加。所有信息均严格依据输入列表，未引入外部知识或法律结论。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "银监局", "description": "规定该机构负责受理、审查和决定外商独资银行、中外合资银行的开业申请，并作出批准或不批准决定"}, {"source": "银监局", "target": "外国银行分行", "description": "银监局在外国银行分行相关监管事务中承担以下职责：\n\n1. **任职资格管理**：银监局负责受理、审查和决定外国银行分行行长、副行长、合规负责人及管理型支行行长的任职资格。\n2. **改制申请初审**：银监局受理并初审外国银行分行改制为外商独资银行的申请。\n\n上述职责均针对外国银行分行这一特定适用对象，由银监局作为发文及执行机关实施。描述中未提供具体的文件文号、时间范围、金额、比例或额外条件，故仅依据输入内容保留核心职能描述。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "外国银行分行", "description": "银监会审查和决定外国银行分行改制为外商独资银行的申请"}, {"source": "外商独资银行", "target": "银监局", "description": "外商独资银行在与银监局的监管关系中，主要涉及业务申请、开业审批及事后报告等合规义务。\n\n首先，在开办代客境外理财业务方面，外商独资银行作为管理行，需向所在地银监局提交相关申请资料。其次，在机构设立环节，外商独资银行需向拟设机构所在地银监局提交开业申请资料。此外，对于已获准开办证券投资基金托管业务的外商独资银行，若其进一步开办代客境外理财托管业务，须在业务开办后5日内向所在地银监局履行报告义务。\n\n上述描述均基于输入信息，明确了外商独资银行作为适用对象，在特定业务场景下向银监局（发文机关/监管机构）履行提交申请或报告的程序性要求。其中，“所在地”与“拟设机构所在地”为区分不同监管管辖范围的关键条件；“5日内”为法定的报告时限条件。输入信息未提供具体的文件文号、金额、比例或更详细的时间范围，故不予补充。各描述项分别对应不同的业务类型（代客境外理财业务、机构开业、代客境外理财托管业务），不存在同名不同机构或冲突信息，故直接合并陈述其监管互动关系。"}, {"source": "中国银行业监督管理委员会", "target": "外商独资银行", "description": "自收到完整申请资料之日起2个月内作出批准或者不批准开业的决定"}, {"source": "银监会", "target": "银监局", "description": "银监局是银监会的派出机构"}, {"source": "外商独资银行", "target": "分行", "description": "外商独资银行可设立分行。具体而言，香港、澳门地区银行在内地设立的外商独资银行，可在广东省内设立分行。"}, {"source": "中外合资银行", "target": "分行", "description": "中外合资银行可设立分行"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "外商独资银行", "description": "中国银行业监督管理委员会（已撤销）作为原监管机构，对外商独资银行实施监管。在人事管理方面，该委员会负责审查和决定其他外商独资银行董事长、行长的任职资格。在机构变更方面，对于承担监管主体责任的外商独资银行，若其在同城内变更住所，由该委员会负责受理、审查和决定。上述职责均基于其作为原监管主体的身份，具体执行需依据当时有效的监管规定及文件要求。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "中外合资银行", "description": "中国银行业监督管理委员会（已撤销）作为原监管机构，对中外合资银行实施监管。在人事管理方面，该委员会负责审查和决定其他中外合资银行董事长、行长的任职资格。在机构变更方面，对于承担监管主体责任的中外合资银行，若其在同城内变更住所，由该委员会负责受理、审查和决定。上述职责均基于该委员会存续期间的监管职能，具体适用对象为中外合资银行，涉及事项包括高管任职资格审批及同城住所变更审批。"}, {"source": "中国银行业监督管理委员会", "target": "《外资银行行政许可事项实施办法（征求意见稿）》", "description": "发布该征求意见稿并公开征求意见"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "外资银行营业性机构", "description": "《外资银行行政许可事项实施办法（征求意见稿）》针对外资银行营业性机构，规定了多项业务的行政许可条件、程序及资料要求。具体涵盖以下方面：\n\n1. **债务与资本工具**：规定该机构发行债务、资本补充工具的行政许可条件与程序。\n2. **衍生产品交易**：规定该机构开办衍生产品交易业务的行政许可条件、程序及资料要求。\n3. **人民币业务**：规定该机构申请经营人民币业务的行政许可条件与程序。\n4. **代客境外理财业务**：规定该机构开办代客境外理财业务的准入条件、申请程序及监管要求。\n5. **托管业务**：规定该机构开办托管业务的准入条件、申请程序及监管要求，并规范其开办代客境外理财托管业务及其他业务的行政许可程序。\n\n上述规定明确了外资银行营业性机构在涉及上述业务时，需满足的准入标准、申请流程及所需提交的资料，旨在规范其行政许可管理。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "银监会", "description": "“银监会”是“中国银行业监督管理委员会”的简称，二者指代同一监管主体。该机构已撤销。"}, {"source": "外资银行营业性机构", "target": "衍生产品交易业务", "description": "外资银行营业性机构是申请开办衍生产品交易业务的主体。作为申请主体，该机构需满足特定条件方可开办该业务。在程序上，申请开办该业务需向当地银监局提交规定材料，并报银监会审批。只有在提交规定材料后，方可正式开办该业务。"}, {"source": "银监局", "target": "衍生产品交易业务", "description": "银监局作为派出机构，在衍生产品交易业务监管中承担特定职责。针对城市商业银行，银监局负责受理并初步审查其衍生产品交易业务申请。针对非银监会直接监管的外资银行营业性机构，银监局负责受理、审查和决定其开办衍生产品交易业务的申请。上述职责依据输入描述并列存在，分别适用于不同的适用对象：前者为城市商业银行，后者为非银监会直接监管的外资银行营业性机构。输入未提供具体的文件文号、发文机关、时间范围、金额、比例及具体条件，亦未提及同名不同机构或不同分支行的区分细节，故仅依据现有文本进行合并，不添加外部知识或法律结论。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "衍生产品交易业务", "description": "负责受理、审查和决定其承担监管主体责任的外资银行营业性机构开办该业务的申请"}, {"source": "外商独资银行", "target": "衍生产品交易业务", "description": "作为申请主体，需向银监会或所在地银监局提交申请资料"}, {"source": "中外合资银行", "target": "衍生产品交易业务", "description": "作为申请主体，需向银监会或所在地银监局提交申请资料"}, {"source": "外资银行营业性机构", "target": "银监局", "description": "向所在地银监局报送衍生产品交易业务申请资料"}, {"source": "外资银行营业性机构", "target": "中国银行业监督管理委员会(已撤销)", "description": "向银监会抄送提交给国务院证券监督管理机构的申请资料"}, {"source": "中外合资银行", "target": "银监局", "description": "中外合资银行在涉及代客境外理财业务时，需履行向所在地银监局提交申请或报告的义务。具体情形如下：\n\n1. 作为管理行，中外合资银行需向所在地银监局提交开办代客境外理财业务的申请资料。\n2. 对于已获准开办证券投资基金托管业务的中外合资银行，若其开办代客境外理财托管业务，须在业务开办后5日内向所在地银监局进行报告。\n\n上述描述基于输入信息，明确了中外合资银行作为主体，银监局作为监管对象，分别对应“申请”与“事后报告”两种不同的监管流程及时间要求。"}, {"source": "外国银行分行", "target": "银监局", "description": "外国银行分行作为管理行，在涉及特定业务开办时，需向所在地银监局履行申请或报送义务。具体包括：向所在地银监局提交开办代客境外理财业务的申请资料；向其报送申请开办衍生产品交易业务的文件。上述描述均基于输入信息，未涉及具体文件文号、发文机关、时间范围、适用对象、金额、比例与条件等细节，亦未对同名不同机构或不同处罚案进行合并。"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "银监会", "description": "明确银监会在行政许可中的受理、审查和决定职责"}, {"source": "《外资银行行政许可事项实施办法（征求意见稿）》", "target": "外资银行", "description": "规定外资银行董事、高级管理人员和首席代表的任职资格条件及监管要求"}, {"source": "银监局", "target": "外商独资银行", "description": "受理和初审其他外商独资银行董事长、行长任职资格申请，并决定其他特定高管任职资格"}, {"source": "银监局", "target": "中外合资银行", "description": "受理和初审其他中外合资银行董事长、行长任职资格申请，并决定其他特定高管任职资格"}, {"source": "银监局", "target": "外国银行代表处", "description": "受理、审查和决定外国银行代表处首席代表任职资格"}, {"source": "各银监局", "target": "城市商业银行", "description": "各银监局作为监管机构，负责将相关指引及通知转发至辖内城市商业银行。其核心职责包括督促和指导辖内试点城市商业银行做好年度报告披露工作。具体执行层面，各银监局需按要求将通知转发至辖内城市商业银行，确保监管要求传达至相关机构。描述中涉及的“各银监局”指代负责辖内监管职责的银行业监督管理机构，“城市商业银行”指代位于各银监局管辖范围内的城市商业银行机构，其中特别提及“试点城市商业银行”作为年度报告披露工作的重点督促对象。所有描述均基于输入信息，未添加外部事实或法律结论，保留了原文中关于转发、督促、指导等动作及适用对象（辖内城市商业银行、试点城市商业银行）的表述。"}, {"source": "各银监局", "target": "农村商业银行", "description": "各银监局负责将相关指引及通知转发至辖内农村商业银行。"}, {"source": "各银监局", "target": "农村合作银行", "description": "各银监局负责将相关指引及通知转发至辖内农村合作银行。"}, {"source": "中国银行业监督管理委员会(已撤销)", "target": "商业银行", "description": "中国银行业监督管理委员会（已撤销）作为监管机构，对商业银行实施监管。其职责包括对商业银行实施资本充足率监督检查，并确定监管资本要求。当商业银行的资本不能充分覆盖风险时，该委员会有权对其采取干预或纠正措施。"}, {"source": "商业银行", "target": "董事会", "description": "商业银行设立董事会作为其内部治理结构的核心组成部分及决策机构。董事会在商业银行治理体系中承担最终责任，负责日常重大决策，并作为负责审批战略、确定风险水平以及监督内部控制的机构。\n\n在资本管理方面，董事会履行资本充足评估的监督与审批职责。在风险管理领域，董事会需积极参与市场风险管理过程，并负责制定符合全面风险管理需要的薪酬政策。作为商业银行的治理机构，董事会通过上述职能确保银行战略执行、风险控制及内部监督的有效运行。"}, {"source": "中国银监会", "target": "中国银行业监督管理委员会(已撤销)", "description": "指代同一监管机构，前者为简称，后者为全称"}, {"source": "各银监局", "target": "外资银行", "description": "各银监局负责将相关通知转发至辖内外资银行。该描述基于输入信息，明确了监管主体为各银监局，适用对象为辖内外资银行，核心行为为转发通知。输入中提供的三条描述（“将通知转发至辖内外资银行”、“要求将通知转发至辖内外资银行”、“要求转发通知至辖内外资银行”）在语义上高度一致，均指向同一监管动作，即上级或监管机构要求下级银监局执行通知转发任务，确保辖内外资银行知悉相关内容。由于输入未提供具体的文件文号、发文机关全称、确切时间范围、涉及金额、比例或特定条件，合并后的描述仅保留已确认的实体关系与行为。各银监局作为执行主体，需确保通知准确传达至其管辖范围内的外资银行机构。此过程体现了银行监管体系中的层级传导机制，旨在统一监管要求或传达政策信息。输入中未提及不同分支行之间的差异或不同处罚案件，因此不存在需并列说明的冲突信息或需区分的具体案例。所有描述均指向同一类常规监管操作，未涉及历史要求与当前要求的冲突，亦无外部知识或法律结论的添加。合并后的表述简洁概括了各银监局对外资银行的通知转发职责，符合中文第三人称叙述规范，且严格依据输入内容，未超出600字限制。"}, {"source": "各银监局", "target": "城市信用社", "description": "各银监局负责将相关通知转发至辖内城市信用社。根据描述列表，各银监局需执行转发任务，确保通知传达至辖内各城市信用社。该操作旨在落实监管要求，具体涉及将上级或相关机构发布的文件传达至基层金融机构。描述中未提及具体的文件文号、发文机关、时间范围、适用对象细节、金额、比例或特定条件，仅明确了“各银监局”作为执行主体，“城市信用社”作为接收对象，以及“转发通知”这一核心动作。两条描述内容一致，均强调将通知转发至辖内城市信用社，无冲突信息，故合并为统一表述。"}, {"source": "各银监局", "target": "农村信用社", "description": "各银监局负责将相关通知转发至辖内农村信用社。根据描述列表，各银监局被要求执行该转发任务，确保通知传达至辖内各农村信用社。"}, {"source": "各银监局", "target": "外国银行分行", "description": "将通知转发至辖内外国银行分行"}, {"source": "财政部", "target": "商业银行", "description": "在对相关商业银行进行绩效评价时，根据监管处理处罚情况予以适当扣分"}, {"source": "各银监局", "target": "银监会", "description": "将审批结果抄报银监会"}, {"source": "外资银行", "target": "银监会", "description": "外资银行需将年度支行发展规划连同初审意见报银监会"}, {"source": "各银监局", "target": "村镇银行", "description": "要求转发通知至辖内村镇银行"}, {"source": "上海", "target": "村镇银行", "description": "上海已实现村镇银行县域全覆盖"}, {"source": "农村信用社", "target": "外汇业务", "description": "部分农村信用社县(市、区)联合社已开办外汇业务。对于有该业务的地区，须按规定上报外汇业务相关报表。此外，开办外汇业务的农村信用社需按规定提供相应的批复文件。"}, {"source": "农村信用社", "target": "农村商业银行", "description": "农村信用社与农村商业银行在监管文件中存在特定的定义关联与改制关系。根据原文定义，“农村信用社”这一统称范畴包含农村商业银行，即农村商业银行属于文中定义的农村信用社范畴。\n\n在改制路径与条件方面，文件要求符合条件的农村信用社加快改制为农村商业银行。具体而言，有条件地区的农村信用社可通过股份制改造、增资扩股等措施，改制组建为农村商业银行。区县农村信用社联社亦可通过改革改制为农村商业银行。\n\n上述描述基于输入信息合并，未添加外部事实。各描述均指向农村信用社向农村商业银行转型的合规路径及定义归属，无冲突信息需并列说明。"}, {"source": "农村信用社", "target": "农村合作银行", "description": "农村信用社与农村合作银行在监管语境中存在特定的包含与改制关系。根据原文定义及文中统称，“农村信用社”这一概念涵盖农村合作银行，即农村合作银行属于农村信用社的范畴。\n\n在机构演变路径上，农村信用社是组建农村合作银行的基础主体。规划提出，在条件具备的地区，农村信用社可争取发展成为农村合作银行；具体而言，有条件地区的农村信用社可通过改制方式组建农村合作银行。部分农村信用社已拟按此路径改制为农村合作银行。\n\n在资本与合规层面，农村信用社通过增资扩股等方式提高资本充足率，旨在为后续组建农村合作银行创造必要的条件。上述描述均基于输入文本，未涉及具体文件文号、发文机关、确切时间范围、适用对象的具体名单、具体金额、比例数值或额外处罚案例。文中未提供关于不同分支行或同名不同机构的区分信息，亦无冲突信息需并列说明。所有关于改制条件（如“有条件地区”、“条件具备”）的表述均保留原文限定，未将其扩展为普遍性要求或当前强制规定。"}, {"source": "中国银行业监督管理委员会上海监管局", "target": "商业银行", "description": "中国银行业监督管理委员会上海监管局（简称上海银监局）作为监管机构，对商业银行实施监管职责。在监管手段方面，上海银监局对商业银行进行定期及不定期的评估检查。在投诉处理机制上，上海银监局可将相关投诉转至商业银行进行处理，商业银行在接收转办投诉后，需向上海银监局反馈调查报告。上述描述基于输入信息，明确了上海银监局与商业银行在监管检查及投诉转办反馈方面的具体互动关系与职责要求。"}, {"source": "商业银行", "target": "总行", "description": "商业银行可通过总行官方网站建立分行子网页以开通网络投诉功能"}, {"source": "中国银行业监督管理委员会上海监管局", "target": "上海", "description": "监管辖区为上海"}, {"source": "银行业金融机构", "target": "中国银监会", "description": "银行业金融机构在涉及重要信息系统投产及变更、开办衍生产品交易业务等特定事项时，需履行向监管机构报告或报送申请文件的义务。其监管对象为中国银监会或其派出机构。\n\n具体而言，银行业金融机构就重要信息系统投产及变更事项，需向监管机构进行报告。在开办衍生产品交易业务方面，银行业金融机构需向中国银监会或其派出机构报送申请文件。此外，针对其他需审批或备案的事项，银行业金融机构亦需向中国银监会或其派出机构报送相应的申请文件和资料。\n\n上述描述基于输入信息整合，明确了银行业金融机构作为义务主体，中国银监会及其派出机构作为监管接收方的关系。输入中未提供具体的文件文号、发文机关全称（除中国银监会外）、确切的时间范围、适用对象细分、涉及金额、比例及具体条件细节，故未予添加。不同事项（如系统变更报告与衍生业务申请）虽均涉及向监管机构报送，但性质与内容不同，此处并列说明其各自对应的报送要求，未强行合并为单一行为。所有信息均严格依据输入列表，未引入外部知识或法律结论。"}, {"source": "中国银监会", "target": "银行业金融机构", "description": "中国银监会作为银行业金融机构的监管机构，负责对银行业金融机构实施监督与检查。在衍生产品交易业务监管方面，中国银监会拥有检查权，有权检查银行业金融机构有关衍生产品交易的情况，具体包括查阅有关衍生产品交易业务的资料和报表、风险管理制度、内部控制制度以及业务处理系统。\n\n在行政许可方面，中国银监会负责审批银行业金融机构提交的衍生产品交易业务申请。其审批期限为自收到完整申请资料之日起三个月内予以批复。\n\n在违规处理方面，对于违反规定的银行业金融机构，中国银监会将追究相关责任。上述监管措施、审批流程及责任追究机制均适用于银行业金融机构，旨在规范其衍生产品交易业务行为，确保其符合相关监管要求。"}, {"source": "中国银监会派出机构", "target": "银行业金融机构", "description": "对违反规定的银行业金融机构追究相关责任"}, {"source": "银监会", "target": "中国银行业监督管理委员会", "description": "“银监会”是“中国银行业监督管理委员会”的简称。在相关监管文件中，该机构作为审批和备案机关出现，负责履行相应的监管职责。"}, {"source": "城市信用合作社", "target": "资本充足率", "description": "参与设立的全部城市信用合作社按合并财务报表测算，资本充足率需不低于6%"}, {"source": "银监会", "target": "城市信用社股份有限公司", "description": "规定其他审慎性条件"}, {"source": "银监局", "target": "分行", "description": "受理、审查并决定分行的开业申请，自受理之日起2个月内作出书面决定"}, {"source": "中国银行业监督管理委员会", "target": "银监会", "description": "“银监会”是“中国银行业监督管理委员会”的简称，二者指代同一机构。"}, {"source": "国有商业银行", "target": "国务院", "description": "国有商业银行境外公开募集股份和上市交易股份需符合国务院有关规定条件"}, {"source": "股份制商业银行", "target": "国务院", "description": "股份制商业银行境外公开募集股份和上市交易股份需符合国务院有关规定条件"}, {"source": "城市商业银行", "target": "国务院", "description": "城市商业银行境外发行股份和上市需符合国务院有关规定条件"}, {"source": "中国银行业监督管理委员会", "target": "衍生产品交易业务", "description": "中国银行业监督管理委员会（简称“中国银监会”）是银行业金融机构开办衍生产品交易业务的最终审批机关及监管机构。其主要职责包括受理、审查并决定相关申请，对银行业金融机构开办该业务实施批准，并负责后续的监督与检查工作。\n\n在适用对象方面，该机构负责国有商业银行和股份制商业银行等银行业金融机构的衍生产品交易业务申请审批。在程序与时限要求上，监管机构需在收到完整资料后60日内作出批复。\n\n上述描述综合了多项监管职能说明，均指向中国银监会在衍生产品交易业务领域的审批与监管角色，包括作为最终审批机关、负责受理审查决定以及实施监督检查等具体职责，各描述在核心职能上保持一致，无冲突信息。"}, {"source": "国有商业银行", "target": "衍生产品交易业务", "description": "申请开办该业务，由银监会直接决定"}, {"source": "股份制商业银行", "target": "衍生产品交易业务", "description": "申请开办该业务，由银监会直接决定"}, {"source": "城市商业银行", "target": "衍生产品交易业务", "description": "城市商业银行作为申请主体，若拟开办衍生产品交易业务，需遵循特定的监管审批程序。根据现有描述，该业务的申请流程主要涉及当地银监局与银监会两个层级的监管环节。\n\n具体而言，城市商业银行需向所在地（当地）银监局提交申请材料。当地银监局负责对申请进行初步审查或审查。在通过当地银监局的审查并同意后，该申请需上报至银监会。最终，由银监会对该业务开办申请进行审批或作出决定。\n\n上述描述中，“向当地银监局提交申请”、“经审查同意后报银监会审批”、“由所在地银监局初步审查，银监会决定”等表述在核心流程上保持一致，均强调了“先地方初审、后总行审批”的两级监管模式。不同描述在措辞上略有差异（如“审查同意”与“初步审查”），但均指向同一监管逻辑：城市商业银行不能直接由银监会单独审批，必须经过当地银监局的把关环节。\n\n目前输入信息未提供具体的文件文号、发文机关全称（仅提及银监局、银监会）、明确的时间范围、具体的适用对象细分（如特定规模或类型的城市商业银行）、涉及的金额、比例或额外的前置条件。因此，合并后的描述仅基于提供的流程性文字进行整合，不添加任何外部法律结论或未提供的事实。对于“当地银监局”与“所在地银监局”的表述差异，视为同一概念的不同表达，予以统一；对于“审查同意”与“初步审查”的细微差别，保留其作为流程中地方监管环节的描述，不强行裁决其具体行政行为的法律性质，仅陈述其作为上报银监会前的必要步骤。"}, {"source": "城市信用社股份有限公司", "target": "中资商业银行", "description": "在个人理财业务及其他业务申请中作为中资商业银行类别的主体"}, {"source": "外资银行", "target": "中国银监会", "description": "外资银行在相关事项上需遵循特定的审批流程。根据描述，该流程涉及两个层面的审批主体：一是中国银监会，二是“该机构”。具体而言，外资银行在内部或前置程序“经审查同意”后，需报请相应监管机构进行最终审批。\n\n关于审批主体的具体指向，输入信息中存在表述差异，需并列说明：\n1. 一种描述明确指出，经审查同意后，需报“中国银监会”审批。\n2. 另一种描述则表述为，经审查同意后，需报“该机构”审批。\n\n由于输入未提供“该机构”的具体定义或上下文以确认其是否等同于中国银监会，或指代其他特定监管实体（如当地派出机构或特定外资银行母行监管机构），因此无法将两者强行合并为同一主体。在缺乏进一步界定“该机构”具体身份的信息前，应保留两种表述的并列状态，以反映不同来源或语境下对审批主体的不同指代。\n\n中国银监会作为明确的发文机关或监管实体，在第一种描述中直接承担审批职能。外资银行作为适用对象，其合规义务包括完成前置审查程序，并依据具体规定向指定的审批主体（即中国银监会或文中所述的“该机构”）提交审批申请。\n\n本描述仅基于提供的输入信息，未添加外部法律结论或事实。对于“该机构”的具体身份，因输入信息未予明确，故不作推测或裁决，仅如实记录其作为审批主体的表述存在。时间范围、文件文号、具体金额、比例及特定条件在输入中未提供，故不予涉及。\n\n综上所述，外资银行的审批流程为：先经审查同意，随后报中国银监会或“该机构”审批。鉴于“该机构”指代不明，上述两种审批路径在描述中并列存在，以准确反映输入信息的差异，避免对监管主体进行不当合并或错误认定。"}, {"source": "外国银行分行", "target": "中国银监会", "description": "分行申请最终需报中国银监会审批"}, {"source": "银行业金融机构", "target": "衍生产品交易业务", "description": "银行业金融机构是从事衍生产品交易业务的主体。该机构需具备相应资格，并作为业务主体开展该业务。在业务开展过程中，银行业金融机构需遵守相关监管规定，包括从事该业务需遵守的风险管理、授权及报告规定，以及需遵守该决定规定的风险管理制度。\n\n在制度建设方面，银行业金融机构需建立相应的风险管理体系，并制定涵盖成本分析、激励约束、轮岗、内审、法律风险、信用风险及市场风险管理等内容的制度。此外，该机构还需制定会计制度。\n\n在准入与报告程序上，银行业金融机构申请开办衍生产品交易业务时，需报送包括风险管理制度、会计制度等在内的文件。上述要求明确了银行业金融机构在从事衍生产品交易业务时的主体资格、合规义务及内部管理制度要求。"}, {"source": "中国银行业监督管理委员会", "target": "银行业金融机构", "description": "中国银行业监督管理委员会（简称银监会）作为监管机构，对银行业金融机构的衍生产品交易业务实施监管、检查及审批，并提供咨询。其监管职权包括有权检查银行业金融机构的衍生产品交易业务资料、相关制度及系统。此外，银监会将派人不定期赴有关金融机构了解专网信息服务情况。"}, {"source": "银行业金融机构", "target": "董事会", "description": "银行业金融机构开展重大交易或新的衍生产品业务，应当经由董事会或其授权的专业委员会进行审批。"}, {"source": "银行业金融机构", "target": "商业银行", "description": "商业银行是银行业金融机构的一种具体类型"}, {"source": "银行业金融机构", "target": "城市信用合作社", "description": "城市信用合作社是银行业金融机构的一种具体类型"}, {"source": "银行业金融机构", "target": "政策性银行", "description": "政策性银行是银行业金融机构的一种具体类型"}, {"source": "中国银行业监督管理委员会", "target": "金融资产管理公司", "description": "批准设立该机构"}, {"source": "银行业金融机构", "target": "金融资产管理公司", "description": "金融资产管理公司属于银行业金融机构范畴"}, {"source": "金融资产管理公司", "target": "衍生产品交易业务", "description": "依法设立的金融资产管理公司从事衍生产品业务适用本办法"}, {"source": "商业银行", "target": "银行业金融机构", "description": "商业银行是依法设立的吸收公众存款的金融机构，属于银行业金融机构"}, {"source": "城市信用合作社", "target": "银行业金融机构", "description": "城市信用合作社是依法设立的吸收公众存款的金融机构，属于银行业金融机构"}, {"source": "政策性银行", "target": "银行业金融机构", "description": "政策性银行是依法设立的吸收公众存款的金融机构，属于银行业金融机构"}, {"source": "外资银行", "target": "衍生产品交易业务", "description": "申请开办该业务需向当地监管机构提交材料并报中国银监会审批"}, {"source": "董事会", "target": "银行业金融机构", "description": "作为该机构的治理机构，负责定期评价衍生产品业务及风险管理"}, {"source": "银行业金融机构", "target": "中国银行业监督管理委员会", "description": "出现重大风险或变动时应向其报告"}, {"source": "中国银行业监督管理委员会", "target": "中国银行业监督管理委员会", "description": "银监发〔2003〕14号中国银行业监督管理委员会印发《农村信用社省(自治区、直辖市)联合社管理暂行规定》"}, {"source": "农村合作银行", "target": "省联社", "description": "作为发起人可向省联社入股"}, {"source": "农村商业银行", "target": "省联社", "description": "作为发起人可向省联社入股"}, {"source": "省联社", "target": "农村信用社", "description": "省联社作为行业管理部门，对全省农村信用社（含县级统一法人社）履行管理、指导、协调和服务职责。其具体职能涵盖对全省信用社实施行业管理，承担农村信用社行业管理和深化改革的具体组织实施工作，并负责督导各县(市)联社及全省农村信用社的改革与发展。\n\n在业务运营层面，省联社指导、协调农村信用社业务，组织资金调剂，办理清算结算，并对其进行审计。同时，省联社加强审计稽核、IT系统等能力建设，对全省农村信用社进行协调与服务。此外，省联社接受地、市、县联社的外包委托，负责辖内业务管理、协调和服务。\n\n上述描述综合了省联社对农村信用社进行统一法人管理或协调的职能定位，以及其在行业管理、深化改革、业务指导、资金清算、审计稽核及系统建设等方面的具体职责。所有信息均基于输入描述，未添加外部知识或法律结论。"}, {"source": "省联社", "target": "中国银行业监督管理委员会", "description": "省联社向银监会报送汇总会计报表、统计报表及其他资料，并对真实  "县域金融机构", "target": "国有商业银行", "description": "县域金融机构包含国有商业银行在县域内的分支机构。"}, {"source": "县域金融机构", "target": "股份制商业银行", "description": "县域金融机构包含股份制商业银行在县域内的分支机构。"}, {"source": "县域金融机构", "target": "城市商业银行", "description": "县域金融机构包含城市商业银行在县域内的分支机构。"}, {"source": "县域金融机构", "target": "农业发展银行", "description": "县域金融机构的奖励对象明确不含农业发展银行。根据相关规定，在界定县域金融机构范围时，其包含的“其他金融机构”类别中明确排除了农业发展银行。因此，农业发展银行不属于本办法所定义的县域金融机构范畴，亦不在相关奖励措施的适用对象之列。"}, {"source": "国家助学贷款", "target": "经办银行", "description": "经办银行是办理国家助学贷款业务的金融机构"}, {"source": "国务院", "target": "农村信用社改革试点", "description": "国务院批准山东省开展农村信用社改革试点工作，并批准开展该改革试点工作。国务院提出深化农村信用社改革试点工作的有关精神。"}, {"source": "借款人", "target": "国家开发银行", "description": "借款人需配合国家开发银行（简称“开行”）进行项目评审，落实相关贷款条件，并签订项目借款合同。依据该借款合同，借款人需向国家开发银行偿还贷款本息。"}, {"source": "下岗失业人员小额担保贷款", "target": "城市商业银行", "description": "城市商业银行被明确列为下岗失业人员小额担保贷款的经办银行"}, {"source": "下岗失业人员小额担保贷款", "target": "股份制商业银行", "description": "股份制商业银行是《下岗失业人员小额担保贷款管理办法》规定的经办银行"}, {"source": "股份制商业银行", "target": "经办银行", "description": "股份制商业银行属于开办下岗失业人员小额担保贷款的经办银行范围"}, {"source": "城市商业银行", "target": "经办银行", "description": "城市商业银行属于开办下岗失业人员小额担保贷款的经办银行范围"}, {"source": "股份制商业银行", "target": "中国人民银行", "description": "各股份制商业银行总行应制定《办法》实施细则并报中国人民银行总行备案"}, {"source": "中国人民银行", "target": "下岗失业人员小额担保贷款", "description": "中国人民银行及其分支机构在下岗失业人员小额担保贷款业务中承担监管与制度制定职责。具体而言，中国人民银行负责另行发文确定该业务的具体统计上报制度，并公布贷款利率水平，作为该业务利率确定的依据。在监管执行层面，人民银行各分支机构负责对该业务进行监督管理。此外，中国人民银行及各分支机构对商业银行贯彻落实情况加强督促检查，履行相应的监管职责。上述职责涵盖了从统计制度确立、利率基准公布到日常业务监督及合规检查的全过程，旨在确保下岗失业人员小额担保贷款业务的规范运行。"}, {"source": "内府办发〔2007〕7号", "target": "农村信用社", "description": "要求深化其体制改革并落实扶持政策"}, {"source": "农业银行", "target": "商业银行", "description": "属于文中特别提及的商业银行"}, {"source": "内府办发〔2007〕7号", "target": "农业银行", "description": "要求农业银行巩固和稳定县域分支机构，支持新农村建设"}, {"source": "内府办发〔2007〕7号", "target": "村镇银行", "description": "支持银行业金融机构到农村领办村镇银行"}, {"source": "内府办发〔2007〕7号", "target": "商业银行", "description": "要求商业银行发挥金融支持作用，创新金融产品"}, {"source": "内府办发〔2007〕7号", "target": "财政贴息", "description": "要求按照办法进行财政贴息支持"}, {"source": "财政部", "target": "中国人民银行上海总部", "description": "财政部作为发文机关向中国人民银行上海总部发布财库〔2012〕132号通知"}, {"source": "商业银行", "target": "经办银行", "description": "经办银行是商业银行的小额担保贷款经办机构"}, {"source": "商业银行", "target": "小额担保贷款", "description": "商业银行作为小额担保贷款的发放主体及机构，负责办理贷款手续、核贷及发放该贷款。在业务执行中，商业银行需按规定向市财政局报送相关数据，具体包括项目数量、数额及应贴息额。"}, {"source": "市财政局", "target": "商业银行", "description": "商业银行需按月向市财政局报送符合财政贴息的小额担保贷款项目数量、数额及应贴息额"}, {"source": "市财政局", "target": "农村信用社", "description": "市财政局与农村信用社在监管及改革配套工作中存在以下关联描述：\n\n1. **财政扶持与风险补偿**：市财政局负责落实农村信用社改革配套的财政扶持政策。具体包括帮助高风险县级联社争取省财政风险补偿金。\n2. **资金账户引导**：各级财政部门（含市财政局）需支持和帮助农村信用社，引导涉农资金开设账户。\n\n上述描述基于输入信息，未涉及具体文件文号、发文机关全称、确切时间范围、适用对象细分、具体金额、比例或额外条件。不同层级或具体职能的描述已并列呈现，未进行强行合并或裁决。"}, {"source": "农村信用社", "target": "不良贷款清收", "description": "农村信用社是不良贷款清收业务的实施、执行及攻坚主体，负责清收和盘活不良贷款以化解信用风险。其具体职责包括核实贷款、签订协议、实施具体清收措施、依法诉讼以及制定鼓励政策。在清收范围上，明确2006年12月31日前形成的不良贷款为清收对象。\n\n在业务目标与要求方面，农村信用社需加大不良贷款清收力度，并被要求确保全年盘活清收不良贷款4亿元。该业务活动需各级党政部门及公检法部门配合支持。\n\n上述描述综合了农村信用社作为清收主体的多重角色定位，涵盖了从具体执行措施（如核实、诉讼）到宏观目标（如4亿元清收额）及外部协作要求（如党政公检法配合）的内容。其中，“2006年12月31日前形成的不良贷款”为特定时间范围下的清收界定，“4亿元”为具体的年度盘活清收金额指标。所有信息均基于输入描述合并，未添加外部事实或法律结论。"}, {"source": "农村信用社", "target": "商业银行", "description": "农村信用社与商业银行在金融业务中主要涉及资金调剂与结算联网两个方面的关系。\n\n在资金业务层面，商业银行是农村信用社进行信贷资金调剂、存放或拆借的对象。农村信用社通过与商业银行开展此类业务，实现资金的横向流动与配置。\n\n在支付结算层面，农村信用社需与商业银行实现横向联网，以保证结算渠道畅通。这一要求旨在确保不同金融机构之间的资金划转能够高效、安全地进行，维护支付体系的稳定运行。\n\n上述描述基于输入信息，未涉及具体文件文号、发文机关、时间范围、适用对象、金额、比例或特定条件。输入中未提供关于同名不同机构、不同分支行或不同处罚案的区分信息，亦无冲突信息需要并列说明。所有表述均严格依据提供的描述列表，未添加外部知识、法律结论或未提供的事实。"}, {"source": "国家开发银行", "target": "项目单位", "description": "在发现重大问题时停止办理有关贷款业务"}, {"source": "城市商业银行", "target": "中小企业", "description": "文中规定城市商业银行要以中小企业为主要服务对象"}, {"source": "担保机构", "target": "财政贴息", "description": "担保机构在财政贴息业务中承担资金支付与审核职责。根据付息情况，担保机构每季度向借款人支付贴息款项。同时，担保机构负责核对贴息项目、金额、期限及利率，并出具相应意见。"}, {"source": "国务院", "target": "中国农业发展银行", "description": "中国农业发展银行是直属国务院领导的政策性银行。国务院负责任命该行的行长及副行长。"}, {"source": "中国人民银行总行", "target": "农村合作银行", "description": "负责批准试点方案"}, {"source": "县联社", "target": "农村信用社", "description": "县联社是负责县（市）以下农村信用社领导和管理职能的机构。在股权构成上，县联社股权仅由农村信用社入股。其核心职能涵盖对基层信用社的管理与服务，具体包括负责统一调配下属信用社的资金余缺，以及负责农村信用社的现金供应和回收。\n\n在财务关系方面，县联社向其辖区内的农村信用社提取管理费。\n\n在安全保卫方面，县联社需独立承担其安全保卫工作。"}, {"source": "国家税务总局", "target": "财政部", "description": "国家税务总局与财政部在资产争议处理方面存在协作关系。根据输入描述，当涉及有争议的资产时，由国家税务总局商请财政部进行处理。该机制明确了在特定资产争议情形下，国家税务总局作为发起方，财政部作为处理方的职责分工。描述中未提供具体的文件文号、发文机关全称（除实体名称外）、具体适用对象范围、涉及金额、比例或详细条件，亦未提及时间范围。两条描述内容一致，均指向“有争议的资产”这一适用对象，且处理方式均为“商请/商财政部处理”，无冲突信息。"}, {"source": "县联社", "target": "中国人民银行", "description": "县联社通过中国人民银行进行转汇"}, {"source": "中国人民银行总行", "target": "农村信用社", "description": "中国人民银行总行制定农村信用社金融统计制度"}, {"source": "中国农业银行", "target": "县联社", "description": "在县联社内部保卫管理机构建立前，中国农业银行继续协助县联社搞好农村信用社的“三防一保”工作"}, {"source": "农村信用社改革试点", "target": "农村信用社", "description": "以农村信用社为改革对象"}, {"source": "银监会", "target": "农村信用社", "description": "银监会依法对农村信用社实施监督管理。其监管职责涵盖对农村信用社风险的监控与考核，并依据相关规定采取风险预警、停业整顿、依法接管及重组等监管措施。上述描述基于输入信息整合，未涉及具体文件文号、发文机关、时间范围、适用对象细节、金额、比例或特定条件，亦未包含外部知识或法律结论。"}, {"source": "中国银行业监督管理委员会", "target": "中国人民银行", "description": "银监会会同人民银行、财政部、税务总局审核改革试点实施方案"}, {"source": "中国银行业监督管理委员会", "target": "财政部", "description": "银监会会同人民银行、财政部、税务总局审核改革试点实施方案"}, {"source": "中国银行业监督管理委员会", "target": "国家税务总局", "description": "银监会会同人民银行、财政部、税务总局审核改革试点实施方案"}, {"source": "中国人民银行", "target": "国家税务总局", "description": "共同作为审核改革试点实施方案的部门"}, {"source": "财政部", "target": "国家税务总局", "description": "共同作为审核改革试点实施方案的部门"}, {"source": "建设单位", "target": "经办银行", "description": "将填写的贴息情况表送经办银行签署审查意见"}, {"source": "建设单位", "target": "国家开发银行", "description": "在经办银行签署意见后，于1995年12月20日前报送贴息申请"}, {"source": "建设单位", "target": "财政部", "description": "在经办银行签署意见后，于1995年12月20日前报送贴息申请"}, {"source": "国家开发银行", "target": "国务院", "description": "国家开发银行直属国务院领导。在人事管理方面，该银行负责提名开发投资公司总经理、副总经理人选，并报送国务院进行任命。此外，在审批副部级总经理、副总经理出访事项时，需先征得外交部同意，随后报国务院审批。"}, {"source": "分行", "target": "国家开发银行", "description": "分行作为国家开发银行的分支机构，隶属于国家开发银行。"}, {"source": "国家开发银行", "target": "分行", "description": "分 布。该文件适用于山东省行政区域及全省范围，旨在做强做大山东省金融业。其内容涉及地方金融监管、财政补贴范围、全省金融生态建设及市场布局。"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "农村合作银行", "description": "文件鼓励符合条件的设区城市组建农村合作银行"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "农村商业银行", "description": "文件鼓励符合条件的设区城市组建农村商业银行"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "下岗失业人员小额担保贷款", "description": "该意见要求搞好下岗失业人员小额担保贷款业务"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "金融机构", "description": "该意见鼓励银行等金融机构开展业务创新及银企合作"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "外资金融机构", "description": "《山东省人民政府关于做强做大我省金融业的意见》针对外资金融机构提出相关监管与引导措施。该文件明确主张积极引进外资金融机构，并主动接洽其在我省设立分支机构。在政策待遇方面，意见规定外资金融机构在山东设立机构时，可享受外商投资优惠措施。上述内容旨在通过提供优惠条件，促进外资金融机构在山东省内的布局与发展。"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "人民银行", "description": "意见要求各级政府支持人民银行履行职责、加强监管"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "中小企业", "description": "提出解决中小企业融资难问题，要求金融机构提供多种担保及融资服务"}, {"source": "山东省人民政府关于做强做大我省金融业的意见", "target": "担保机构", "description": "规定对担保机构进行信用评级、合作推荐及财政政策支持"}, {"source": "人民银行", "target": "担保机构", "description": "人民银行牵头组织对担保机构开展信用评级"}, {"source": "担保机构", "target": "中小企业", "description": "担保机构主要面向不具备银行抵（质）押贷款条件的高成长性中小企业，提供企业综合信用担保服务。在相关评价体系中，担保机构对中小企业的扶持情况是评分标准的重要依据。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "山东省", "description": "《山东省十一五金融业发展规划纲要》适用于山东省行政区域，旨在指导全省金融业发展，提升山东金融影响力，并构建山东区域金融中心。该规划针对山东省总体经济规划及东、中、西部经济特点进行金融产业布局，涵盖金融业（含保险业）的发展现状与环境分析。"}, {"source": "银监局", "target": "山东省", "description": "银监局是山东省金融监管体系的组成部分"}, {"source": "山东省", "target": "城市商业银行", "description": "截至2004年末，山东省共有9家城市商业银行。文中指出，在山东省地方法人银行机构中，城市商业银行的平均资产规模仅为161亿元。"}, {"source": "山东省", "target": "城市信用社", "description": "截至2004年末山东省共有5家城市信用社"}, {"source": "山东省", "target": "农村合作银行", "description": "截至2004年末山东省共有3家农村合作银行"}, {"source": "山东省", "target": "农村信用社", "description": "山东省是农村信用社首批改革试点省份。截至2004年末，山东省共有5671家农村信用社。"}, {"source": "山东省", "target": "信托投资公司", "description": "山东省开展清理整顿乱办金融机构、信托投资公司等工作"}, {"source": "城市商业银行", "target": "山东省", "description": "文中指出的山东省内城市商业银行群体，其资本充足率较低"}, {"source": "国有商业银行", "target": "银行业金融机构", "description": "文中指出以国有商业银行为主体的银行业金融机构"}, {"source": "不良贷款", "target": "山东省", "description": "文中指出山东省主要银行业机构不良贷款余额排名情况"}, {"source": "资本充足率", "target": "城市商业银行", "description": "文中指出山东省城市商业银行的资本充足率水平"}, {"source": "山东省十一五金融业发展规划纲要", "target": "政策性银行", "description": "《山东省十一五金融业发展规划纲要》对银行业机构体系及政策性银行的服务目标作出了具体规划。\n\n在机构体系建设方面，该规划提出建成由政策性银行等构成的较为完善的银行业机构体系。这一表述明确了政策性银行在山东省银行业整体架构中的组成部分地位，旨在通过完善包括政策性银行在内的各类机构布局，构建结构合理的金融组织体系。\n\n在服务目标方面，规划提出实现政策性银行与商业银行服务良好的目标。该目标将政策性银行与商业银行并列，强调两者均需在服务层面达到良好水平。这表明规划不仅关注机构体系的完整性，也重视各类银行机构在业务开展和服务质量上的表现，要求政策性银行在履行其职能的同时，保持较高的服务水准。\n\n上述两项内容均源自《山东省十一五金融业发展规划纲要》，属于该规划文件内的既定要求。规划未对政策性银行的具体业务范围、资金规模或特定监管指标作出额外限定，仅从体系构成和服务质量两个维度进行了宏观层面的规定。描述中未涉及具体的文件文号、发文机关详细名称、精确的时间节点或具体的金额比例数据，仅依据输入提供的规划文本进行整合。\n\n需要注意的是，该描述严格基于提供的规划内容，未引入外部法律解释或后续政策变化。规划中提到的“较为完善的银行业机构体系”和“服务良好”均为定性描述，未包含可量化的考核标准或具体的执行细则。政策性银行在此语境下作为体系构建和服务提升的关键主体之一，其角色定位与商业银行共同服务于整体金融环境的优化。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "国有商业银行", "description": "《山东省十一五金融业发展规划纲要》针对国有商业银行提出了明确的体系建设与改革要求。规划旨在建成由国有商业银行等构成的较为完善的银行业机构体系，并引导国有商业银行进一步优化机构布局。同时，规划要求国有商业银行完成股份制改造和商业化改革，以发挥其在银行业中的主体和骨干作用。上述内容均源自该规划纲要，体现了对国有商业银行在机构布局优化、体制改革及市场地位巩固方面的具体指导方向。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "股份制商业银行", "description": "《山东省十一五金融业发展规划纲要》针对股份制商业银行提出了多项发展要求与改革方向。在机构体系建设方面，规划提出建成由股份制商业银行等构成的较为完善的银行业机构体系。在区域布局上，规划明确支持股份制商业银行在山东增设机构。此外，规划纲要指出股份制商业银行将通过改制、兼并重组等方式进行改革。上述内容均源自该规划纲要，旨在指导山东省“十一五”期间金融业的发展与结构调整。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "农村信用社", "description": "《山东省十一五金融业发展规划纲要》针对农村信用社提出了多项发展与管理要求。规划旨在建成由农村信用社等机构构成的较为完善的银行业机构体系。为实现这一目标，规划提出应整合农村信用社资源，并扶持其发展。同时，规划强调要加强管理指导，帮助农村信用社消化历史包袱。上述内容均出自该规划纲要，体现了对农村信用社在体系构建、资源整合、发展扶持及历史问题处理方面的整体部署。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "外资银行", "description": "《山东省十一五金融业发展规划纲要》针对山东省银行业发展提出相关规划与目标。该规划指出，山东银行业面临外资银行竞争的外部挑战。为应对这一局面并完善市场结构，规划提出建成由外资银行等构成的较为完善的银行业机构体系。\n\n在具体量化目标方面，规划设定了至2010年的两项指标：一是争取新引进外资银行10家；二是使外资银行资产规模达到400亿元人民币以上。上述目标旨在通过引入外资银行力量，优化山东省银行业机构体系，提升整体竞争力。"}, {"source": "山东省十一五金融业发展规划纲要", "target": "城市商业银行", "description": "《山东省十一五金融业发展规划纲要》针对城市商业银行的发展提出了多项规划目标与要求。在机构数量方面，规划设定了到2010年城市商业银行达到10家的具体目标。在业务定位上，规划提出规范发展城市商业银行，明确其主要服务对象为中小企业、民营企业及高新技术企业。\n\n在资本结构与投资者引入方面，规划提出打造精品或特色银行，通过引入战略投资者来提高资本充足率和拨备覆盖率。具体而言，规划提出或有30家左右城市商业银行有境外合格战略投资者进入。上述内容均源自该规划纲要，旨在通过引入外部资本和优化股权结构，提升城市商业银行的整体竞争力与风险抵御能力，同时引导其聚焦于特定细分市场的金融服务。"}, {"source": "城市信用社", "target": "城市商业银行", "description": "根据输入信息，城市信用社与城市商业银行之间存在机构组建与转型关系。数据显示，已有三分之二（2/3）的城市信用社顺利组建为城市商业银行。相关规划提出，力争在2007年前将所有城市信用社都组建为城市商业银行。该描述仅基于提供的文本，未包含其他外部事实或法律结论。"}, {"source": "山东省", "target": "不良贷款", "description": "文中指出2004年山东省主要银行业机构不良贷款余额减少513亿元，政策性剥离占比高达95.11%"}, {"source": "山东省十一五金融业发展规划纲要", "target": "商业银行", "description": "规划提出政策性银行与商业银行服务良好的目标"}, {"source": "山东省十一五金融业发展规划纲要", "target": "农村商业银行", "description": "规划提出已商业化的城区农信社改建为农村商业银行"}, {"source": "山东省十一五金融业发展规划纲要", "target": "农村合作银行", "description": "规划提出形成包括农村合作银行在内的农村金融组织体系"}, {"source": "山东省十一五金融业发展规划纲要", "target": "外资金融机构", "description": "规划要求2010年前新引进20—30家外资银行机构"}, {"source": "山东省十一五金融业发展规划纲要", "target": "城市信用社", "description": "规划提出2007年前组建为城市商业银行，加快不良资产处置"}, {"source": "山东省十一五金融业发展规划纲要", "target": "信托投资公司", "description": "规划提出促进快速发展，设定2010年业务规模目标"}, {"source": "山东省十一五金融业发展规划纲要", "target": "农业发展银行", "description": "规划提出调整职能，加大政策性支农力度"}, {"source": "山东省十一五金融业发展规划纲要", "target": "不良贷款清收", "description": "规划纲要要求继续抓好不良贷款比例和余额双下降工作，并清收故意拖欠贷款企业的债务"}, {"source": "山东省", "target": "山东省十一五金融业发展规划纲要", "description": "该规划纲要适用的行政区域"}, {"source": "山东省十一五金融业发展规划纲要", "target": "金融机构", "description": "规划提出通过驻地金融机构提取缴存方式建立金融稳定发展基金"}, {"source": "山东省十一五金融业发展规划纲要", "target": "银监局", "description": "规划要求加强保监局同银监局、证件局等金融监管部门的协作"}, {"source": "山东省十一五金融业发展规划纲要", "target": "上海", "description": "规划纲要提出与上海等金融中心实现优势互补、合作共赢"}, {"source": "财政部门", "target": "农村信用社", "description": "财政部门在农村信用社改革中各司其职，加强协调配合。其主要职责包括指导农村信用社建立和完善内部财务管理制度及会计核算办法，加强财务管理。同时，财政部门负责落实相关优惠政策，具体涵盖不良资产清收过程中的各项优惠政策以及保值储蓄贴补等政策。"}, {"source": "鲁国税函〔2006〕166号", "target": "农村信用社", "description": "该通知规范的对象为山东省内农村 t": "市财政局", "description": "广安农村商业银行筹备工作领导小组包含市财政局作为成员单位。"}, {"source": "上海", "target": "外资银行", "description": "上海辖内的外资银行机构"}, {"source": "市财政局", "target": "财政部", "description": "市财政局是财政部在德阳市的对应层级机构（注：此处为行政层级对应，非直接隶属，但业务上受指导，根据原文仅体现为地方财政参与，故关系较弱或仅体现为地方机构，此处不建立直接隶属关系，仅保留地方机构实体）"}, {"source": "财政部门", "target": "小额担保贷款", "description": "财政部门在小额担保贷款业务中承担多项监管与协调职责。首先，财政部门参与对申请人的会审工作，并参与确定申请人的具体条件。其次，财政部门负责督促经办担保机构和金融机构简化相关程序，以提高业务办理效率。在资金保障方面，财政部门在同级财政就业再就业资金中列支奖励资金和手续费补贴资金。上述职责涵盖了从申请人资格审核、流程优化到资金列支的全流程管理，旨在规范小额担保贷款的运行机制。"}, {"source": "不良贷款清收", "target": "人民银行", "description": "清收目标需达到人民银行专项票据兑付标准"}, {"source": "不良贷款清收", "target": "国家税务总局", "description": "确定损失的贷款需按国家税务总局规定进行申报处置"}, {"source": "不良贷款清收", "target": "不良贷款", "description": "清收工作的对象是2006年12月31日前形成的不良贷款"}, {"source": "商业银行", "target": "担保机构", "description": "文中要求商业银行加强与担保机构的合作"}, {"source": "金融机构", "target": "股份制商业银行", "description": "文中提及需引进股份制商业银行以激活市场，属于金融机构范畴"}, {"source": "国务院", "target": "国家助学贷款", "description": "国务院负责制定国家助学贷款相关政策规定。高校依据国务院有关通知精神，建立国家助学贷款工作机制。"}, {"source": "农村信用社", "target": "小额担保贷款", "description": "农村信用社在小额担保贷款业务中主要承担发放主体及主要承贷机构的角色。作为业务执行方，农村信用社需严格遵循相关监管规定，具体职责包括执行贷后管理以及进行数据统计等工作。此外，监管层面要求农村信用社积极拓展小额担保贷款业务的覆盖面，以扩大该业务的服务范围。上述描述基于输入信息整合，明确了农村信用社在小额担保贷款业务中的核心地位及其在贷后管理、数据统计和业务拓展方面的具体义务。"}, {"source": "农村信用社", "target": "财政贴息", "description": "农村信用社发放的小额担保贷款可享受财政贴息优惠"}, {"source": "财政部", "target": "农村信用社", "description": "财政部针对农村信用社涉及的两项具体监管事项作出如下规定：\n\n第一，关于农村信用社接收农村合作基金会财产的税务处理。财政部同意农村信用社在接收农村合作基金会财产时，免交相关税费。该决定明确了特定资产转移过程中的税收优惠政策，适用对象为农村信用社，涉及的具体行为为接收农村合作基金会财产。\n\n第二，关于1994年至1997年期间保值贴补息的财政拨补。财政部批准并拨补农村信用社在1994-1997年期间，因执行国家宏观政策而多支付的保值贴补息。该事项明确了时间范围为1994年至1997年，适用对象为农村信用社，核心内容为对因执行国家宏观政策导致的多支付款项进行财政拨补。\n\n上述两项描述均源自财政部对农村信用社的监管行为，分别涉及税费减免与历史政策性资金拨补，两者在性质、时间背景及具体执行内容上相互独立，不存在冲突或重叠，故分别予以保留和说明。"}, {"source": "农村信用社", "target": "专业银行", "description": "规定允许农村信用社与专业银行进行资金横向融通和拆借，并可代理专业银行发放和收回贷款"}, {"source": "农村信用社", "target": "银行", "description": "信用社组织的存款需按规定比例向银行缴存准备金"}, {"source": "国家税务总局 ument.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in a)x.setAttribute(k,a[k]);g.append(x);return x}let map={};data.nodes.forEach((n,i)=>{let a=i*2.39996,rad=40+Math.sqrt(i/150)*360;n.x=Math.cos(a)*rad;n.y=Math.sin(a)*rad;map[n.id]=n});data.edges.forEach(e=>{let a=map[e.source],b=map[e.target];let l=el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y});l.onclick=()=>detail.textContent=e.source+' → '+e.target+'\n\n'+e.description});data.nodes.forEach(n=>{n.c=el('circle',{cx:n.x,cy:n.y,r:4+Math.sqrt(n.value)/4,fill:colors[types.indexOf(n.group)]});n.c.onclick=()=>detail.textContent=n.label+'\n类型：'+n.group+'\n度数：'+n.value+'\n\n'+n.title;let t=el('text',{x:n.x+8,y:n.y});t.textContent=n.label.length>16?n.label.slice(0,16)+'…':n.label});document.querySelector('#search').oninput=e=>data.nodes.forEach(n=>n.c.setAttribute('opacity',n.label.toLowerCase().includes(e.target.value.toLowerCase())?1:.12));function update(){g.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}svg.onwheel=e=>{e.preventDefault();scale*=e.deltaY<0?1.12:.89;update()};let drag;svg.onpointerdown=e=>{drag=[e.clientX,e.clientY,tx,ty];svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag[2]+(e.clientX-drag[0])*1200/svg.clientWidth;ty=drag[3]+(e.clientY-drag[1])*900/svg.clientHeight;update()}};svg.onpointerup=()=>drag=null;detail.textContent+='\n\n'+types.map((t,i)=>t+' '+colors[i]).join('\n');</script>
